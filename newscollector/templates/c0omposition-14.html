<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ news_name }}</title>
  <link rel="icon" href="{{ logo_path if logo_path is defined else '../static/assets/logo.png' }}">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .progress-ring {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring::after {
      content: "";
      width: 17px;
      height: 17px;
      border-radius: 9999px;
      background: var(--ring-inner, #fff);
    }
  </style>
</head>
<body class="bg-gray-50 p-4 text-gray-900 antialiased dark:bg-gray-950 dark:text-gray-100 sm:p-8">
  <main class="mx-auto max-w-6xl rounded-xl border border-gray-200 bg-gray-100 shadow-sm dark:border-gray-800 dark:bg-gray-900">
    <header class="border-b border-gray-200 p-6 dark:border-gray-700">
      <div class="flex items-center justify-between gap-3">
        <p class="text-xs font-semibold uppercase tracking-[0.15em] text-gray-500 dark:text-gray-400">Resumen diario</p>
        <span class="inline-flex items-center rounded-full border border-gray-300 bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.12em] text-gray-700 dark:border-gray-700 dark:bg-gray-950 dark:text-gray-300">Fecha: {{ news_date }}</span>
      </div>
      <h1 class="mt-2 text-2xl font-semibold">{{ news_name }}</h1>
    </header>

    <section>
      <div id="tab-list" class="flex flex-wrap gap-2 bg-gray-100 px-6 py-3 dark:bg-gray-900"></div>
      <div id="panel" class="space-y-4 bg-white px-6 pb-6 pt-4 dark:bg-gray-950"></div>
    </section>
  </main>

  <script>
    const rawClusters = {{ clusters|tojson }};
    const riskCategories = [
      {
        status: "Bajo",
        icon: "B",
        iconColor: "text-blue-500",
        badge: "bg-blue-50 text-blue-700 ring-blue-600/20 dark:bg-blue-400/10 dark:text-blue-400 dark:ring-blue-400/20",
        progressColor: "rgb(59 130 246)",
        orders: []
      },
      {
        status: "Medio",
        icon: "M",
        iconColor: "text-emerald-500",
        badge: "bg-emerald-50 text-emerald-700 ring-emerald-600/20 dark:bg-emerald-400/10 dark:text-emerald-400 dark:ring-emerald-400/20",
        progressColor: "rgb(16 185 129)",
        orders: []
      },
      {
        status: "Alta",
        icon: "A",
        iconColor: "text-red-500",
        badge: "bg-red-50 text-red-700 ring-red-600/20 dark:bg-red-400/10 dark:text-red-400 dark:ring-red-400/20",
        progressColor: "rgb(239 68 68)",
        orders: []
      }
    ];

    const categories = [
      {
        status: "Todos",
        icon: "T",
        iconColor: "text-gray-600",
        badge: "bg-gray-100 text-gray-700 ring-gray-500/20 dark:bg-gray-700/30 dark:text-gray-200 dark:ring-gray-500/30",
        progressColor: "rgb(107 114 128)",
        orders: []
      },
      ...riskCategories
    ];

    function buildOrderFromCluster(cluster) {
      const similar = Array.isArray(cluster.similar) ? cluster.similar : [];
      const rawActors = Array.isArray(cluster.actor)
        ? cluster.actor
        : Array.isArray(cluster.actors)
          ? cluster.actors
          : (cluster.actor || cluster.actors ? [cluster.actor || cluster.actors] : []);
      const actors = rawActors
        .map((item) => String(item || "").trim())
        .filter((item) => item.length > 0);
      const rawAuthor = Array.isArray(cluster.authors)
        ? (cluster.authors.find((item) => String(item || "").trim()) || "")
        : (cluster.author || cluster.authors || "");
      const author = String(rawAuthor || "").trim();
      const actual = Math.min(similar.length + 1, 9);
      const total = Math.min(actual + 2, 10);
      return {
        item: cluster.title || "Noticia sin titulo",
        company: cluster.source || "Fuente desconocida",
        author: author,
        location: cluster.date || "Fecha desconocida",
        contact: (similar[0] && similar[0].source) || "Mesa de noticias",
        fulfillmentActual: actual,
        fulfillmentTotal: total,
        newsTime: formatHourMinute(cluster.time),
        url: cluster.url || "#",
        body: cluster.body || "",
        actors: actors,
        similar: similar
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function safeUrl(value) {
      const url = String(value || "").trim();
      if (url.startsWith("http://") || url.startsWith("https://")) {
        return url;
      }
      return "#";
    }

    function formatHourMinute(value) {
      const raw = String(value || "").trim();
      if (!raw) {
        return "Sin hora";
      }

      const match = raw.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
      if (!match) {
        return "Sin hora";
      }

      const hours = match[1].padStart(2, "0");
      const minutes = match[2];
      return `${hours}:${minutes}`;
    }

    rawClusters.forEach((cluster, index) => {
      const order = buildOrderFromCluster(cluster);
      const lane = riskCategories[index % riskCategories.length];

      order.riskStatus = lane.status;
      order.riskBadge = lane.badge;
      order.riskColor = lane.progressColor;

      categories[0].orders.push(order);
      lane.orders.push(order);
    });

    let activeTab = 0;

    function tabButton(category, index) {
      const selected = index === activeTab;
      return `
        <button
          type="button"
          data-index="${index}"
          class="inline-flex items-center gap-2 rounded-md border px-3 py-2 text-sm font-medium transition ${selected ? "border-gray-300 bg-white text-gray-900 dark:border-gray-600 dark:bg-gray-950 dark:text-gray-100" : "border-transparent text-gray-600 hover:border-gray-300 dark:text-gray-400 dark:hover:border-gray-700"}"
        >
          <span class="${category.iconColor} hidden sm:inline">${category.icon}</span>
          <span>${category.status}</span>
          <span class="rounded bg-gray-100 px-2 py-0.5 text-xs font-semibold tabular-nums ring-1 ring-inset ring-gray-200 dark:bg-gray-800 dark:ring-gray-700">${category.orders.length}</span>
        </button>
      `;
    }

    function renderActorsList(actors) {
      if (!Array.isArray(actors) || actors.length === 0) {
        return "";
      }

      const actorTags = actors
        .filter((item) => String(item || "").trim())
        .map((item) => `
          <span class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 dark:border-gray-700 dark:text-gray-300">${escapeHtml(item)}</span>
        `)
        .join("");

      if (!actorTags) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Actores</p>
          ${actorTags}
        </div>
      `;
    }

    function renderSimilarCoverage(similar) {
      if (!Array.isArray(similar) || similar.length === 0) {
        return "";
      }

      const links = similar
        .filter((item) => item && item.source && item.url)
        .map((item) => `
          <a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer" class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 hover:border-blue-400 hover:text-blue-700 dark:border-gray-700 dark:text-gray-300 dark:hover:border-blue-500 dark:hover:text-blue-400">${escapeHtml(item.source)}</a>
        `)
        .join("");

      if (!links) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Cobertura similar</p>
          ${links}
        </div>
      `;
    }

    function orderCard(order, statusClass, statusText, progressColor) {
      const progress = Math.round((order.fulfillmentActual / order.fulfillmentTotal) * 100);
      const safeBodyText = order.body ? `${order.body.slice(0, 220)}${order.body.length > 220 ? "..." : ""}` : "No hay resumen disponible.";
      const safeTitle = escapeHtml(order.item);
      const safeSource = escapeHtml(order.company);
      const safeAuthor = escapeHtml(order.author || "");
      const subtitle = safeAuthor ? `${safeSource} | ${safeAuthor}` : safeSource;
      const safeBody = escapeHtml(safeBodyText);
      const articleUrl = safeUrl(order.url);

      return `
        <article class="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900 sm:p-5">
          <div class="flex flex-wrap items-center gap-2">
            <h4 class="min-w-0 flex-1 truncate text-sm font-medium text-gray-900 dark:text-gray-100">
              <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-700 dark:hover:text-blue-400">${safeTitle}</a>
            </h4>
            <span class="inline-flex items-center whitespace-nowrap rounded px-1.5 py-0.5 text-xs font-medium ring-1 ring-inset ${statusClass}">${statusText}</span>
          </div>

          <div class="mt-2 text-sm text-gray-600 dark:text-gray-400">
            <p>${subtitle}</p>
          </div>

          <p class="mt-3 text-sm leading-6 text-gray-700 dark:text-gray-300">${safeBody}</p>

          ${renderActorsList(order.actors)}

          ${renderSimilarCoverage(order.similar)}

          <hr class="my-4 border-gray-200 dark:border-gray-700">

          <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-2">
              <span class="progress-ring" style="background: conic-gradient(${progressColor} ${progress}%, rgb(209 213 219) ${progress}% 100%); --ring-inner: rgb(255 255 255);"></span>
              <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Riesgo</p>
            </div>
            <p class="text-sm text-gray-600 dark:text-gray-400">Hora ${order.newsTime}</p>
          </div>
        </article>
      `;
    }

    function emptyPanel() {
      return `
        <article class="rounded-lg border border-dashed border-gray-300 bg-gray-50 p-6 text-sm text-gray-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-400">
          No hay noticias disponibles en esta seccion.
        </article>
      `;
    }

    function render() {
      const list = document.getElementById("tab-list");
      const panel = document.getElementById("panel");
      const current = categories[activeTab];
      const showAll = activeTab === 0;

      list.innerHTML = categories.map(tabButton).join("");
      panel.innerHTML = current.orders.length
        ? current.orders
            .map((order) => {
              const badge = showAll ? order.riskBadge : current.badge;
              const status = showAll ? order.riskStatus : current.status;
              const color = showAll ? order.riskColor : current.progressColor;
              return orderCard(order, badge, status, color);
            })
            .join("")
        : emptyPanel();

      list.querySelectorAll("button[data-index]").forEach((button) => {
        button.addEventListener("click", () => {
          activeTab = Number(button.getAttribute("data-index"));
          render();
        });
      });
    }

    render();
  </script>
</body>
</html>
