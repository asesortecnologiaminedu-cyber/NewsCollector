  <script>
    const rawClusters = [{"actor": [], "authors": ["Rodolfo Aliaga"], "body": "en Econom\u00eda y Empresa\n\nLa Empresa Nacional de Telecomunicaciones (Entel) present\u00f3 durante el encuentro tecnol\u00f3gico Conecta CEO Summit a tres nuevas marcas orientadas a fortalecer el desarrollo digital en Bolivia y atender de manera especializada a los sectores empresarial, emprendedor e institucional.\n\nSe trata de Entel Empresas, Entel PyME y Entel Gobierno.\n\nEl evento reuni\u00f3 a l\u00edderes empresariales, expertos internacionales y representantes de compa\u00f1\u00edas tecnol\u00f3gicas globales para analizar las tendencias en innovaci\u00f3n, inteligencia artificial, ciberseguridad e infraestructura digital aplicadas al crecimiento econ\u00f3mico y la competitividad.\n\nEl ministro de Obras P\u00fablicas, Mauricio Zamora, destac\u00f3 que esta nueva estrategia cuenta con el respaldo de alianzas estrat\u00e9gicas internacionales, que permitir\u00e1n fortalecer las capacidades tecnol\u00f3gicas de la empresa estatal y ampliar su alcance en el ecosistema digital.\n\nPor su parte, el gerente de Entel, Jorge del Solar, explic\u00f3 que la renovaci\u00f3n de la estrategia comercial responde a una nueva forma de relacionamiento con las organizaciones, basada en la especializaci\u00f3n de servicios digitales y el fortalecimiento del v\u00ednculo con los distintos sectores productivos del pa\u00eds.\n\n\u201cCuando empezamos a redise\u00f1ar nuestra estrategia comercial, ten\u00edamos claro que era necesario ajustar la forma de proyectarnos y de ver las cosas, deb\u00edamos crear especialistas y expertos en servicios digitales para acercarnos de manera m\u00e1s efectiva a las diferentes empresas\u201d, se\u00f1al\u00f3 Del Solar.\n\nLea: ENTEL y Sparkle firman acuerdo para fortalecer la conectividad digital de Bolivia\n\nDigital\n\nAsimismo, precis\u00f3 que en una primera etapa se definieron tres divisiones principales, sobre las cuales se trabajar\u00e1 inicialmente, sin descartar el desarrollo de nuevas l\u00edneas de servicios en el futuro, orientadas a distintos \u00e1mbitos del sector empresarial boliviano.\n\nLa nueva propuesta de Entel busca ofrecer soluciones diferenciadas por sector, mediante equipos especializados y una oferta centrada en servicios en la nube, automatizaci\u00f3n, conectividad avanzada, protecci\u00f3n de datos e infraestructura tecnol\u00f3gica.\n\nLa estrategia est\u00e1 respaldada por una infraestructura tecnol\u00f3gica consolidada, que incluye centros de datos con certificaciones internacionales, plataformas de nube, redes de alta capacidad y alianzas con empresas l\u00edderes del ecosistema digital, lo que permitir\u00e1 acercar tecnolog\u00eda de nivel global a instituciones p\u00fablicas y privadas.\n\nDurante el encuentro, el presidente del Directorio de Entel, \u00c1lvaro Baz\u00e1n, destac\u00f3 que la compa\u00f1\u00eda ampl\u00eda su enfoque m\u00e1s all\u00e1 de la conectividad tradicional.\n\n\u201cHoy la conversaci\u00f3n en Entel ya no es solamente de conectividad. Hablamos de ciberseguridad, inteligencia artificial, automatizaci\u00f3n, servicios en la nube y edge computing, toda una infraestructura digital que permite operar mejor, tomar decisiones m\u00e1s r\u00e1pidas y proteger la informaci\u00f3n de las organizaciones\u201d, afirm\u00f3.\n\nDato\n\nBaz\u00e1n a\u00f1adi\u00f3 que uno de los principales desaf\u00edos es acercar estas capacidades a empresas, emprendedores e instituciones mediante soluciones accesibles y adaptadas a la realidad boliviana, con el objetivo de contribuir a una mayor productividad y competitividad.\n\nEl evento cont\u00f3 adem\u00e1s con la participaci\u00f3n de especialistas internacionales como Eduardo La Rosa (Google), Gonzalo Garc\u00eda (Fortinet), Dan Miller (Armada), el experto en ciberseguridad Luis Berger y el conferencista Oscar Mart\u00e1n, quienes compartieron experiencias sobre inteligencia artificial, innovaci\u00f3n, liderazgo y seguridad digital.\n\nLas exposiciones destacaron la importancia de fortalecer las capacidades digitales del pa\u00eds, impulsar la soberan\u00eda tecnol\u00f3gica y aprovechar las nuevas herramientas digitales como motores de desarrollo econ\u00f3mico, modernizaci\u00f3n institucional y generaci\u00f3n de nuevas oportunidades de crecimiento.", "dateTimeNews": "2026-05-29T17:14:08+00:00", "dateTimeReceived": "2026-05-29T17:28:58+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/entel_conect.webp", "position": 1, "similar": [{"source": "Asuntos Centrales", "url": "https://asuntoscentrales.com/tres-nuevas-marcas-de-entel-apuntan-al-crecimiento-digital-en-bolivia/"}, {"source": "El Mundo", "url": "https://elmundo.com.bo/entel-lanza-tres-nuevas-marcas-para-el-desarrollo-digital-de-bolivia/"}, {"source": "RTP Bolivia", "url": "https://rtpbolivia.com.bo/economia/tres-nuevas-marcas-de-entel-abren-una-nueva-etapa-para-el-desarrollo-digital-de-bolivia/"}], "source": "La Raz\u00f3n", "title": "Entel lanza tres nuevas marcas para impulsar la transformaci\u00f3n digital", "url": "https://larazon.bo/economia-y-empresa/2026/05/29/entel-lanza-tres-nuevas-marcas-para-impulsar-la-transformacion-digital/"}, {"actor": [], "authors": ["Rafael Sempertegui"], "body": "El Flamengo, vigente campe\u00f3n, se enfrentar\u00e1 al Cruzeiro en los octavos de final de la Copa Libertadores 2026, mientras que el Corinthians tendr\u00e1 un duro escollo en el Rosario Central de \u00c1ngel Di Mar\u00eda, seg\u00fan el sorteo realizado el viernes en Luque, Paraguay.\n\nEl gigante carioca, cuatro veces campe\u00f3n del torneo y que gan\u00f3 invicto el Grupo A con cinco victorias y un empate, no la tendr\u00e1 f\u00e1cil ante un Cruzeiro que fue segundo en un Grupo D en el que fue eliminado Boca Juniors.\n\nEl ganador de esta serie, la \u00fanica entre dos equipos de un mismo pa\u00eds en octavos de final, se enfrentar\u00e1 en cuartos con el vencedor del cruce entre los Deportes Tolima e Independiente del Valle, que ser\u00e1 local en la revancha tras haber ganado el Grupo H.\n\nEl Corinthians, que sue\u00f1a con ganar su segunda Libertadores, tras la obtenida en 2012, se cruza con un Rosario Central que se ilusiona con levantar por primera vez en su historia el torneo continental.\n\nEn caso de que el Canalla lo logre, ser\u00eda un broche de oro para la exitosa carrera del Fideo Di Mar\u00eda.\n\nAngelito volvi\u00f3 al club que lo vio nacer en 2025 tras m\u00e1s de una d\u00e9cada en Europa y es el \u00fanico t\u00edtulo importante que no tiene, luego de ganar entre otros la Liga de Campeones de Europa con el Real Madrid, y el Mundial y la Copa Am\u00e9rica con la selecci\u00f3n argentina.\n\nPalmeiras, por la venganza\n\nEl otro candidato al t\u00edtulo junto al Fla, el Palmeiras de Abel Ferreira, finalista el a\u00f1o pasado, volver\u00e1 a ver las caras en octavos con Cerro Porte\u00f1o.\n\nEl Cicl\u00f3n paraguayo le gan\u00f3 la semana pasada en Sao Paulo y le cort\u00f3 una racha invicta de cinco a\u00f1os en el Allianz Parque por la Libertadores y lo releg\u00f3 contra todo pron\u00f3stico al segundo lugar del Grupo F.\n\nPero el sorteo en la sede de la Conmebol le dio la posibilidad al Verd\u00e3o de tomarse una r\u00e1pida venganza y seguir so\u00f1ando con ganar su cuarta Libertadores.\n\nEn cuartos, el Palmeiras se enfrentar\u00eda al ganador de la llave entre el debutante brasile\u00f1o Mirassol y Liga de Quito, dos conjuntos que ya se enfrentaron en el Grupo G.\n\nEn las otras dos llaves de octavos, se enfrentar\u00e1n al Fluminense y al debutante Independiente Rivadavia de Mendoza, de sensacional campa\u00f1a y al \u00fanico equipo argentino que logr\u00f3 terminar en el primer lugar de su grupo.\n\nLa Lepra mendocina ya se enfrent\u00f3 al Flu en la fase de grupos de la Copa y supo ganarle (2-1) en abril en el mism\u00edsimo Maracan\u00e1, en una de las grandes sorpresas de la edici\u00f3n 2026 del torneo.\n\nPor otro lado, el copero Estudiantes de La Plata se cruza con la Universidad Cat\u00f3lica de Chile, que dio el golpe el jueves al eliminar a Boca Juniors en La Bombonera.\n\nLas llaves de octavos de final se disputar\u00e1n en agosto y la final se jugar\u00e1 el s\u00e1bado 28 de noviembre en el m\u00edtico Estadio Centenario de Montevideo.\n\nEl recinto de la primera final de un Mundial, en 1930, recibe la definici\u00f3n de la Libertadores por 22a ocasi\u00f3n y segunda desde que se disputa a final \u00fanica, tras la disputada en 2021.\n\n\u2014 Cruces de octavos de final de la Copa Libertadores 2026 (el nombrado en primer lugar es local en el partido de ida):\n\nEstudiantes de La Plata (ARG) \u2013 Universidad Cat\u00f3lica (CHI)\n\nMirassol (BRA) \u2013 Liga de Quito (ECU)\n\nFluminense (BRA) \u2013 Independiente Rivadavia (ARG)\n\nDeportes Tolima (COL) \u2013 Independiente del Valle (ECU)\n\nCruzeiro (BRA) \u2013 Flamengo (BRA)\n\nPlatense (ARG) \u2013 Coquimbo Unido (CHI)\n\nPalmeiras (BRA) \u2013 Cerro Porte\u00f1o (PAR)\n\nRosario Central (ARG) \u2013 Corinthians (BRA)\n\n\u2014 Cuartos de final (el orden de las localidades se define seg\u00fan la posici\u00f3n de los equipos en la fase de grupos):\n\nGanador A \u2013 Ganador H (S1)\n\nGanador B \u2013 Ganador G (S2)\n\nGanador C \u2013 Ganador F (S3)\n\nGanador D \u2013 Ganador E (S4)\n\n\u2014 Semifinales (el orden de las localidades se define seg\u00fan la posici\u00f3n de los equipos en la fase de grupos):\n\nGanador S1 \u2013 Ganador S4 (F1)\n\nGanador S2 \u2013 Ganador S3 (F2)\n\n\u2014 Final (28 de noviembre en Montevideo):\n\nGanador F1 \u2013 Ganador F2\n\n(29/05/2026)", "dateTimeNews": "2026-05-29T16:44:16+00:00", "dateTimeReceived": "2026-05-29T17:28:59+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/Fla-sorteo.webp", "position": 2, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/deportes/octavos-final-libertadores-duelos-exigentes-camino-gloria_1780072821"}], "source": "La Raz\u00f3n", "title": "\u2018Fla-Flu\u2019 potencial final de la Libertadores 2026", "url": "https://larazon.bo/marcas/2026/05/29/fla-flu-potencial-final-de-la-libertadores-2026/"}, {"actor": [], "authors": ["Rafael Sempertegui"], "body": "Boca Juniors vs River Plate a la vista? El sorteo de los octavos de final de la Copa Sudamericana 2026 dej\u00f3 en el aire este viernes un posible choque entre los colosos argentinos en las semifinales.\n\nTras fracasar en su intento de pasar a la ronda de los 16 mejores de la Copa Libertadores, el Xeneize se tuvo que consolar con disputar como tercero la repesca hacia los octavos de la Sudamericana.\n\nEl equipo que dirige Claudio \u00dabeda, campe\u00f3n del torneo en 2004 y 2005, buscar\u00e1 el pase a octavos ante el O\u2019Higgins en las llaves de playoffs a partidos de ida y vuelta que se disputar\u00e1n en las \u00faltimas dos semanas de julio, justo despu\u00e9s de la final del Mundial de Norteam\u00e9rica 2026.\n\nDe vencer a los chilenos, que pasaron como segundos del Grupo C de la Sudamericana, el popular club azul y oro se enfrentar\u00e1 al debutante Recoleta de Paraguay en octavos, con la posibilidad de avanzar en un camino que podr\u00eda cruzarlo con River, su eterno rival.\n\nLos Millonarios, otro de los favoritos al t\u00edtulo, lideraron invictos el Grupo H y est\u00e1n sembrados en la ronda de los 16 mejores junto a los otros siete l\u00edderes zonales de la fase de grupos de la Sudamericana.\n\nSu rival en esa instancia saldr\u00e1 del vencedor entre el Caracas FC e Independiente Santa Fe de Colombia, seg\u00fan el sorteo realizado este viernes en Luque, Paraguay, donde est\u00e1 ubicada la sede de la Conmebol.\n\nDuelos brasile\u00f1os\n\nPero m\u00e1s all\u00e1 de un posible choque entre los gigantes de Buenos Aires hay otros duelos que pueden sacar chispas en el segundo torneo de clubes m\u00e1s importante de la Sudamericana.\n\nBol\u00edvar de La Paz y el Gremio de Porto Alegre se medir\u00e1n en la repesca, que disputar\u00e1n los segundos de la fase de grupos de la Sudamericana y los terceros de la misma fase de la Libertadores.\n\nEl vencedor se citar\u00e1 en la siguiente instancia con Sao Paulo, un coloso que ya vivi\u00f3 tiempos mejores pero que apunta a ganar su segunda corona en el torneo, tras la conquistada en 2012.\n\nPara seguir con vida, el Santos de Neymar deber\u00e1 imponerse a la Universidad Central de Venezuela, que viene de la Libertadores, y luego al Macar\u00e1 de Ecuador, que gan\u00f3 el Grupo A por encima de equipos experimentados como Am\u00e9rica de Cali.\n\nEl campe\u00f3n defensor de la Sudamericana, Lan\u00fas, que pinch\u00f3 en la fase de grupos de la Libertadores, est\u00e1 emparejado en la repesca con Cienciano de Cusco. En los octavos, que se jugar\u00e1n en agosto, le espera el Botafogo.\n\nLa final de la Otra Mitad de la Gloria se jugar\u00e1 el 21 de noviembre en el estadio Metropolitano de Barranquilla, en el Caribe de Colombia.\n\n\u2013 Emparejamientos de octavos de final de la Copa Sudamericana 2026:\n\nBoca Juniors (ARG)/O\u2019Higgins (CHI) \u2013 Recoleta (PAR)\n\nBol\u00edvar (BOL)/Gremio (BRA) \u2013 S\u00e3o Paulo (BRA)\n\nCaracas (VEN)/Independiente Santa Fe (COL) \u2013 River Plate (ARG)\n\nIndependiente Medell\u00edn (COL)/Vasco da Gama (BRA) \u2013 Olimpia (PAR)\n\nSporting Cristal (PER)/Red Bull Bragantino (BRA) \u2013 Atl\u00e9tico Mineiro (BRA)\n\nUniversidad Central (VEN)/Santos (BRA) \u2013 Macar\u00e1 (ECU)\n\nNacional (URU)/Tigre (ARG) \u2013 Montevideo City Torque (URU)\n\nLan\u00fas (ARG)/Cenciano (PER) \u2013 Botafogo (BRA)", "dateTimeNews": "2026-05-29T16:37:02+00:00", "dateTimeReceived": "2026-05-29T17:28:59+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/Boca-Juniors.webp", "position": 3, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/deportes/sudamericana-lujo-gigantes-continente-conocen-camino-final_1780071906"}], "source": "La Raz\u00f3n", "title": "Sorteo de la Sudamericana deja un Boca vs River a la vista", "url": "https://larazon.bo/marcas/2026/05/29/sorteo-de-la-sudamericana-deja-un-boca-vs-river-a-la-vista/"}, {"actor": [], "authors": ["rorellana"], "body": "Este viernes por la ma\u00f1ana arrib\u00f3 al aeropuerto internacional de Viru Viru, en Santa Cruz, un avi\u00f3n de la Fuerza A\u00e9rea Paraguaya para sumarse a las labores de transporte de alimentos e insumos hacia la ciudad de La Paz, para las familias afectadas por los bloqueos en el pa\u00eds.\n\nAsimismo, se inform\u00f3 desde el consulado de Paraguay, que en este primer env\u00edo se transport\u00f3 cerca de siete toneladas de productos no perecederos de consumo b\u00e1sicos para las familias.\n\nSe prev\u00e9 se realice un nuevo envi\u00f3 desde Paraguay este s\u00e1bado 30 de mayo, situaci\u00f3n que depender\u00e1 de la log\u00edstica que se realice.\n\nEl traslado\n\nLa log\u00edstica contempla el traslado terrestre de la ayuda desde Asunci\u00f3n hasta la base militar Mariscal Estigarribia, en Paraguay, hasta Santa Cruz Bolivia, en un avi\u00f3n Casa 212 de la Fuerza A\u00e9rea paraguaya.", "dateTimeNews": "2026-05-29T15:51:37+00:00", "dateTimeReceived": "2026-05-29T17:28:55+00:00", "pic": "https://www.lostiempos.com/sites/default/files/media_imagen/2026/5/29/avios.jpg", "position": 4, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/29/paraguay-envia-toneladas-de-ayuda-humanitaria-para-afectados-por-bloqueos/"}], "source": "Los Tiempos", "title": "Avi\u00f3n de la FFAA de Paraguay llega a Santa Cruz con ayuda humanitaria para afectados por los bloqueos en La Paz", "url": "https://www.lostiempos.com/actualidad/pais/20260529/avion-ffaa-paraguay-llega-santa-cruz-ayuda-humanitaria-afectados-bloqueos"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nEl empresario y pol\u00edtico Samuel Doria Medina afirm\u00f3 este viernes que los bloqueos y medidas de presi\u00f3n que afectan principalmente a La Paz y El Alto comienzan a mostrar se\u00f1ales de debilitamiento.\n\nEn su cuenta de X, se\u00f1al\u00f3 que el di\u00e1logo convocado para intentar resolver el conflicto \u201cse ha estancado porque los dirigentes no quisieron asistir\u201d, aunque consider\u00f3 que las autoridades judiciales deber\u00edan \u201cquitarles el pretexto de las \u00f3rdenes de aprehensi\u00f3n\u201d.\n\nEl l\u00edder opositor indic\u00f3 que el bloqueo en El Alto y el paro del transporte en La Paz \u201cse est\u00e1n relajando de manera notoria\u201d, ya que, en su criterio, existe la necesidad de la poblaci\u00f3n de retomar sus actividades cotidianas.\n\n\u201cTodos los alte\u00f1os y los pace\u00f1os, de cualquier bando, necesitan trabajar, ir a clases, hacer funcionar sus negocios\u201d, escribi\u00f3.\n\nNo obstante, la crisis cada vez es m\u00e1s aguda y las medidas de protesta no cesan. Esta \u00faltima semana de mayo, fue cr\u00edtica, debido a que se duplicaron los puntos de bloqueo en el pa\u00eds.\n\nLea tambi\u00e9n: Casi un mes de bloqueos: Hay unos 80 cortes de v\u00eda en seis departamentos\n\nPor su parte, la Iglesia Cat\u00f3lica, junto a la Defensor\u00eda del Pueblo y organizaciones de derechos humanos, impuls\u00f3 distintos intentos de mediaci\u00f3n para instalar mesas de di\u00e1logo entre las partes en conflicto.\n\nPese a los insistentes llamados, la Central Obrera Boliviana (COB) y la Federaci\u00f3n de Trabajadores Campesinos \u201cT\u00fapac Katari\u201d no dan tregua y mantienen su pedido de la renuncia del presidente Rodrigo Paz.\n\nDoria Medina respald\u00f3 esos esfuerzos y asegur\u00f3 que \u201cla fuerza de la econom\u00eda y la necesidad de normalidad har\u00e1n que esta crisis se supere\u201d.\n\nEl empresario pidi\u00f3 que la Iglesia Cat\u00f3lica y otros organismos mediadores \u201cno se rindan\u201d y contin\u00faen buscando consensos para \u201creunir y concertar a los bolivianos\u201d.", "dateTimeNews": "2026-05-29T15:32:22+00:00", "dateTimeReceived": "2026-05-29T17:29:02+00:00", "pic": "https://larazon.bo/wp-content/uploads/2025/11/WhatsApp-Image-2025-11-20-at-12.27.28-PM.webp", "position": 5, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/samuel-cree-que-la-fiscalia-debe-levantar-las-ordenes-de-aprehension-contra-dirigentes-y-ve-que-bloqueos-se-relajan/"}], "source": "La Raz\u00f3n", "title": "Doria Medina dice que los bloqueos \u2018se debilitan\u2019 y pide mantener el di\u00e1logo", "url": "https://larazon.bo/nacional/2026/05/29/doria-medina-dice-que-los-bloqueos-se-debilitan-y-pide-mantener-el-dialogo/"}, {"actor": [], "authors": ["rorellana"], "body": "El Ministerio de Defensa, a trav\u00e9s de un comunicado emitido por el Regimiento de Caballer\u00eda Blindado 1 \"Calama\" desminti\u00f3 versiones difundidas en redes sociales sobre un supuesto desplazamiento de tanques y veh\u00edculos militares hacia la ciudad de La Paz, y asegur\u00f3 que la unidad militar desarrolla sus actividades con absoluta normalidad.\n\nLa aclaraci\u00f3n fue realizada por el comandante del regimiento, teniente coronel DIM Rider Jos\u00e9 Coss\u00edo Vega, luego de la circulaci\u00f3n de im\u00e1genes y videos en plataformas digitales que alertaban sobre una presunta movilizaci\u00f3n de veh\u00edculos blindados desde Patacamaya hacia la sede de gobierno.\n\n\"La unidad se encuentra realizando sus actividades normales y programadas\", afirm\u00f3 la autoridad militar en un pronunciamiento p\u00fablico, al descartar cualquier situaci\u00f3n extraordinaria o movimiento inusual de tropas en la regi\u00f3n.\n\nCoss\u00edo Vega precis\u00f3 adem\u00e1s que el Regimiento \"Calama\" no recibi\u00f3 ninguna instrucci\u00f3n de instancias superiores para el desplazamiento de material b\u00e9lico, particularmente de los veh\u00edculos blindados SK-105.\n\n\"No se ha recibido ninguna orden del escal\u00f3n superior para realizar alg\u00fan desplazamiento con los veh\u00edculos blindados SK-105\", sostuvo el jefe militar.\n\nLas versiones difundidas en redes sociales generaron preocupaci\u00f3n y especulaci\u00f3n entre algunos sectores de la poblaci\u00f3n, en un contexto marcado por la r\u00e1pida viralizaci\u00f3n de contenidos no verificados.\n\nAnte esta situaci\u00f3n, el Regimiento de Caballer\u00eda Blindado 1 \"Calama\" exhort\u00f3 a la ciudadan\u00eda y a los medios de comunicaci\u00f3n a contrastar la informaci\u00f3n antes de replicarla, con el fin de evitar la propagaci\u00f3n de rumores y mensajes que puedan generar incertidumbre o desinformaci\u00f3n.\n\nLa unidad militar reiter\u00f3 que mantiene sus operaciones rutinarias en Patacamaya y que no existe ninguna disposici\u00f3n relacionada con movimientos extraordinarios de equipos militares hacia la ciudad de La Paz.", "dateTimeNews": "2026-05-29T15:29:50+00:00", "dateTimeReceived": "2026-05-29T17:29:02+00:00", "pic": "https://www.lostiempos.com/sites/default/files/media_imagen/2026/5/29/tanques_0.jpg", "position": 6, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/defensa-desmiente-falsos-rumores-sobre-el-movimiento-de-tanques-hacia-la-paz/"}], "source": "Los Tiempos", "title": "Defensa desmiente \"rumores\" sobre el movimiento de tanques hacia La Paz", "url": "https://www.lostiempos.com/actualidad/seguridad/20260529/defensa-desmiente-rumores-movimiento-tanques-paz"}, {"actor": [], "authors": ["La Patria"], "body": "La operaci\u00f3n contempla tres vuelos con alimentos no perecederos enviados desde Paraguay para abastecer a familias afectadas en Bolivia\n\nFicha informativa El 29 de mayo de 2026, Paraguay envi\u00f3 ayuda humanitaria a Bolivia, convirti\u00e9ndose en el cuarto pa\u00eds en hacerlo debido a bloqueos y protestas sociales que afectan principalmente a La Paz y El Alto. Toca para ver el contexto completo Contexto: Argentina, Chile y Per\u00fa enviaron asistencia previa. Argentina traslad\u00f3 12 toneladas de carne de pollo, Chile envi\u00f3 5 toneladas y Per\u00fa despach\u00f3 4 toneladas. El viceministro Gustavo Serrano mencion\u00f3 el refuerzo de puentes a\u00e9reos desde Santa Cruz para abastecer las ciudades afectadas. El embajador paraguayo, Enrique Guerrero, expres\u00f3 la voluntad del gobierno paraguayo para colaborar con Bolivia. La aeronave no puede llegar a La Paz por limitaciones t\u00e9cnicas; la carga ser\u00e1 trasladada posteriormente por autoridades bolivianas. Por qu\u00e9 importa: La crisis ha llevado a Bolivia a utilizar un puente a\u00e9reo militar internacional para garantizar el suministro alimentario. Las tensiones pol\u00edticas y econ\u00f3micas han paralizado al pa\u00eds, generando un rechazo masivo a la Ley Agraria y una grave escasez de d\u00f3lares. Datos clave: Carga total: 7 toneladas de alimentos no perecederos.\n\n7 toneladas de alimentos no perecederos. Primer env\u00edo: Cerca de 7.000 kilos organizados en kits familiares.\n\nCerca de 7.000 kilos organizados en kits familiares. Transporte: Avi\u00f3n Casa 212 de la Fuerza A\u00e9rea paraguaya.\n\nAvi\u00f3n Casa 212 de la Fuerza A\u00e9rea paraguaya. Fecha del env\u00edo: 29 de mayo de 2026.\n\n29 de mayo de 2026. Pr\u00f3ximo env\u00edo: S\u00e1bado 30 de mayo de 2026.\n\nS\u00e1bado 30 de mayo de 2026. D\u00edas de bloqueos: 28 d\u00edas.\n\n28 d\u00edas. N\u00famero total de cortes de ruta: 59 puntos activos.\n\n59 puntos activos. Aumento en precios de gasolina y di\u00e9sel: 90% tras eliminaci\u00f3n de subsidios.\n\n90% tras eliminaci\u00f3n de subsidios. Tasa de inflaci\u00f3n al inicio del conflicto: 20,40%.\n\n20,40%. N\u00famero de protestas registradas: 180 eventos en menos de tres semanas. IngresarDesbloquear acceso completo\n\nParaguay env\u00eda ayuda humanitaria a Bolivia \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nParaguay env\u00eda ayuda humanitaria a Bolivia\n\nParaguay se convirti\u00f3 en el cuarto pa\u00eds en brindar ayuda humanitaria a Bolivia, que enfrenta una crisis Bolivia 2026 generada por bloqueos y protestas sociales. Las ciudades m\u00e1s afectadas son La Paz y El Alto, donde la situaci\u00f3n se ha vuelto cr\u00edtica.\n\nDetalles del env\u00edo de alimentos\n\nEl embajador paraguayo en Bolivia, Enrique Guerrero, inform\u00f3 a El Deber que el presidente de Paraguay, Santiago Pe\u00f1a, dispuso el env\u00edo de aproximadamente 7 toneladas de comida no perecedera organizadas en kits familiares. Esta ayuda est\u00e1 destinada a familias afectadas por los bloqueos.\n\nCarga total: 7 toneladas de alimentos no perecederos.\n\n7 toneladas de alimentos no perecederos. Primer env\u00edo: Cerca de 7.000 kilos organizados en kits familiares.\n\nCerca de 7.000 kilos organizados en kits familiares. Transporte: Se utiliza un avi\u00f3n Casa 212 de la Fuerza A\u00e9rea paraguaya para realizar un puente a\u00e9reo entre la base militar Mariscal Estigarribia, en Paraguay, y Santa Cruz.\n\nSe utiliza un avi\u00f3n Casa 212 de la Fuerza A\u00e9rea paraguaya para realizar un puente a\u00e9reo entre la base militar Mariscal Estigarribia, en Paraguay, y Santa Cruz. Limitaciones t\u00e9cnicas: La aeronave no puede llegar a La Paz debido a su altura; la carga ser\u00e1 trasladada posteriormente por autoridades bolivianas.\n\nLa aeronave no puede llegar a La Paz debido a su altura; la carga ser\u00e1 trasladada posteriormente por autoridades bolivianas. Log\u00edstica: Se prev\u00e9 realizar dos viajes este viernes y otro el s\u00e1bado 30 de mayo, dependiendo de la log\u00edstica.\n\nCompromiso de Paraguay con Bolivia\n\nGuerrero expres\u00f3 que Paraguay sigue de cerca la situaci\u00f3n en Bolivia y manifest\u00f3 su voluntad de colaborar con el gobierno boliviano. La finalidad de esta ayuda es apoyar a las familias afectadas por los conflictos y dificultades de abastecimiento generadas por los bloqueos.\n\nAumenta la crisis alimentaria en Bolivia\n\nEl viceministro de Comercio y Log\u00edstica Interna, Gustavo Serrano, inform\u00f3 que el Gobierno ha reforzado los puentes a\u00e9reos desde Santa Cruz para abastecer alimentos a las ciudades afectadas. Hasta ahora, Argentina y Chile han enviado aeronaves para ayudar con el transporte. Esto incluye:\n\n12 toneladas: Cantidad de carne de pollo ingresada previamente por Argentina.\n\nCantidad de carne de pollo ingresada previamente por Argentina. 5 toneladas: Peso del cargamento trasladado por Chile.\n\nPeso del cargamento trasladado por Chile. 4 toneladas: Insumos despachados por Per\u00fa.\n\nCifras alarmantes sobre la crisis\n\nLa crisis ha llevado a Bolivia a recurrir a un puente a\u00e9reo militar internacional para garantizar el suministro alimentario. Este hecho refleja la gravedad extrema de la situaci\u00f3n actual:\n\n28 d\u00edas: Tiempo que llevan vigentes los bloqueos.\n\nTiempo que llevan vigentes los bloqueos. 59 puntos: N\u00famero total de cortes de ruta activos en seis regiones del pa\u00eds.\n\nN\u00famero total de cortes de ruta activos en seis regiones del pa\u00eds. 90%: Incremento aproximado en el precio de gasolina y di\u00e9sel tras la eliminaci\u00f3n de subsidios.\n\nIncremento aproximado en el precio de gasolina y di\u00e9sel tras la eliminaci\u00f3n de subsidios. 20,40%: Tasa de inflaci\u00f3n registrada al inicio del conflicto, marcando el \u00edndice m\u00e1s alto reportado en cuatro d\u00e9cadas.\n\nTasa de inflaci\u00f3n registrada al inicio del conflicto, marcando el \u00edndice m\u00e1s alto reportado en cuatro d\u00e9cadas. 180 protestas: Eventos registrados durante menos de tres semanas de movilizaci\u00f3n social.\n\nTensiones pol\u00edticas y econ\u00f3micas en Bolivia\n\nGuerrero explic\u00f3 sobre la ayuda enviada: \u201cAnte la dif\u00edcil situaci\u00f3n que todos estamos viviendo\u2026 poder enviar este primer grupo de carga\u201d. Adem\u00e1s a\u00f1adi\u00f3 que \u201cEst\u00e1 previsto hacer tres viajes\u201d para completar el env\u00edo total.\n\nLa llegada del avi\u00f3n paraguayo es resultado de tensiones pol\u00edticas y econ\u00f3micas acumuladas que han paralizado al pa\u00eds. Entre los detonantes se encuentran:\n\nEliminaci\u00f3n de subsidios: A hidrocarburos mediante Decreto Supremo 5503.\n\nA hidrocarburos mediante Decreto Supremo 5503. Importaci\u00f3n de combustible adulterado: Por YPFB que da\u00f1\u00f3 veh\u00edculos p\u00fablicos.\n\nPor YPFB que da\u00f1\u00f3 veh\u00edculos p\u00fablicos. Rechazo masivo: A la Ley Agraria (Ley 1720).\n\nA la Ley Agraria (Ley 1720). Grave escasez: De d\u00f3lares e inflaci\u00f3n descontrolada.", "dateTimeNews": "2026-05-29T15:12:58+00:00", "dateTimeReceived": "2026-05-29T17:28:43+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a19a7005bca2.jpg", "position": 7, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/bloqueos-paraguay-envia-7-toneladas-ayuda-humanitaria-bolivia_1780062604"}], "source": "La Patria", "title": "Paraguay env\u00eda ayuda humanitaria a Bolivia - La Patria 3.0", "url": "https://lapatria.bo/global/paraguay-envia-ayuda-humanitaria-a-bolivia/"}, {"actor": [], "authors": ["Israel Munguia"], "body": "Las promociones empresariales en Bolivia ya no requerir\u00e1n autorizaci\u00f3n de la Autoridad de Fiscalizaci\u00f3n del Juego (AJ) ni estar\u00e1n sujetas al pago de impuestos o sanciones vinculadas a este tipo de actividades, tras la promulgaci\u00f3n de la Ley 1733 de Alivio Tributario, inform\u00f3 este viernes la entidad reguladora.\n\n\u201cLa Autoridad de Fiscalizaci\u00f3n del Juego comunica a la poblaci\u00f3n en general y a las empresas que realizan promociones empresariales que, tras la promulgaci\u00f3n de la Ley 1733 de Alivio Tributario, las promociones empresariales ya no requieren autorizaci\u00f3n de la AJ\u201d, se\u00f1ala el comunicado difundido por la instituci\u00f3n.\n\nLa medida entr\u00f3 en vigencia el 27 de mayo de 2026 y elimina procedimientos que anteriormente obligaban a empresas y emprendimientos a tramitar permisos ante la entidad reguladora para ejecutar campa\u00f1as promocionales.\n\nEl ministro de Econom\u00eda y Finanzas P\u00fablicas, Jos\u00e9 Gabriel Espinoza, afirm\u00f3 que la decisi\u00f3n busca aliviar cargas econ\u00f3micas y administrativas que durante a\u00f1os afectaron principalmente a peque\u00f1as y medianas empresas.\n\n\u201cLas promociones empresariales ya no est\u00e1n sujetas a autorizaciones, impuestos y, m\u00e1s importante, a sanciones en muchos casos abusivas\u201d, sostuvo la autoridad.\n\nEspinoza se\u00f1al\u00f3 adem\u00e1s que las anteriores disposiciones perjudicaban especialmente a emprendimientos y peque\u00f1os negocios. \u201cAvanzamos en ordenar y facilitar la vida a quienes construyen la econom\u00eda de Bolivia\u201d, afirm\u00f3.\n\nLa AJ aclar\u00f3 adem\u00e1s que las promociones empresariales autorizadas antes de la vigencia de la nueva ley mantienen su eficacia y validez, por lo que deber\u00e1n continuar bajo las condiciones establecidas al momento de su aprobaci\u00f3n.", "dateTimeNews": "2026-05-29T15:00:45+00:00", "dateTimeReceived": "2026-05-29T17:28:43+00:00", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/05/IMG_7344.webp", "position": 8, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/economia/15-anos-control-promociones-sorteos-empresas-no-necesitan-autorizacion-aj_1780065915"}], "source": "El Mundo", "title": "Ley 1733: Promociones de empresas no necesitar\u00e1n autorizaci\u00f3n de la AJ", "url": "https://elmundo.com.bo/ley-1733-promociones-de-empresas-no-necesitaran-autorizacion-de-la-aj/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "La Autoridad de Fiscalizaci\u00f3n del Juego (AJ) inform\u00f3 que tras la promulgaci\u00f3n de la Ley de Alivio Tributario las promociones empresariales ya no necesitan la autoridad de esa instituci\u00f3n.\n\nAsimismo, la AJ aclar\u00f3 que las promociones autorizadas anteriormente a la vigencia de la ley a\u00fan mantienen su validez, debiendo desarrollarse conforme normativa vigente al momento de su tr\u00e1mite.\n\nAl respecto, el ministro de Econom\u00eda, Gabriel Espinoza, destac\u00f3 que a partir de la mencionada Ley \u201clas promociones empresariales ya no est\u00e1n sujetas a autorizaciones, impuestos y, m\u00e1s importante, a sanciones, en muchos casos abusivas\u201d.\n\n\u201cEn el pasado esto afectaba a las peque\u00f1as y medianas empresas y emprendimientos sobre todo. Avanzamos en ordenar y facilitar la vida a quienes construyen la econom\u00eda de Bolivia\u201d, destac\u00f3. Advertisement:\n\nAyer, el presidente del Estado, Rodrigo Paz, promulg\u00f3 la Ley del Perdonazo Tributario, misma que permitir\u00e1 la condonaci\u00f3n de deudas de hasta Bs 10 millones generadas hasta 2017 y durante 2020 y beneficiar\u00e1 a m\u00e1s de 100 mil ciudadanos bolivianos.\n\n\u201cCumplimos nuestra palabra con la vigencia de la ley del perdonazo tributario. Esta medida hist\u00f3rica beneficiar\u00e1 a m\u00e1s de 100.000 hombres y mujeres que apostaron por Bolivia, transformando multas acumuladas en verdaderas oportunidades de reinversi\u00f3n\u201d, inform\u00f3 el Presidente del Estado a trav\u00e9s de sus cuentas en las redes sociales.\n\nEl Jefe de Estado explic\u00f3 que se trata de \u201cun alivio directo para peque\u00f1os empresarios, gremiales, cuentapropistas, transportistas y artesanos que hoy ven nacer una nueva realidad econ\u00f3mica\u201d.\n\nEl \u201cperdonazo tributario\u201d, establecido en la Ley de Alivio Tributario, condonar\u00e1 deudas de hasta Bs 10 millones que fueron generadas hasta diciembre de 2017 o durante la gesti\u00f3n 2020, a ra\u00edz de la pandemia de la Covid-19.", "dateTimeNews": "2026-05-29T14:58:35+00:00", "dateTimeReceived": "2026-05-29T17:29:03+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/aj.jpg", "position": 9, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-promulga-el-perdonazo-tributario-se-condonara-deudas-de-hasta-bs-10-millones-generadas-hasta-2017-y-durante-2020/"}, {"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260529/promociones-empresariales-ya-no-requieren-autorizacion-aj"}], "source": "Ox\u00edgeno", "title": "Promociones empresariales ya no requieren autorizaci\u00f3n de la AJ", "url": "https://oxigeno.bo/promociones-empresariales-ya-no-requieren-autorizacion-de-la-aj/"}, {"actor": [], "authors": ["Shirley Iba\u00f1ez"], "body": "en Nacional\n\nLa Sala Plena del Tribunal Supremo de Justicia (TSJ) instruy\u00f3 a jueces y tribunales penales de todo el pa\u00eds aplicar la detenci\u00f3n preventiva solo de manera excepcional y revisar de inmediato los casos cuyo plazo ya haya vencido o en los que esta medida ya no est\u00e9 justificada.\n\nLa determinaci\u00f3n est\u00e1 en la Circular N\u00b0 01/2026 emitida el jueves y apunta a aliviar el hacinamiento carcelario en el pa\u00eds y el uso excesivo y arbitrario de la detenci\u00f3n preventiva.\n\nEl TSJ se\u00f1al\u00f3 que esta decisi\u00f3n responde a la necesidad de garantizar el debido proceso, evitar prolongaciones indebidas de la privaci\u00f3n de libertad y contribuir institucionalmente a disminuir la sobrepoblaci\u00f3n penitenciaria.\n\nLa Circular resalta que el juez ser\u00e1 responsable de controlar de oficio la excepcionalidad, legalidad, necesidad, proporcionalidad y razonabilidad de los requerimientos.\n\nSeg\u00fan el documento, la libertad debe ser la regla y la privaci\u00f3n cautelar de libertad constituye una excepci\u00f3n, conforme a la Constituci\u00f3n Pol\u00edtica del Estado, la Convenci\u00f3n Americana sobre Derechos Humanos y el C\u00f3digo de Procedimiento Penal.\n\nLea m\u00e1s: TSJ y jueces de Santa Cruz defienden independencia judicial\n\nResoluciones\n\nAsimismo, la circular establece que, al momento de resolver medidas cautelares personales, los jueces deber\u00e1n realizar un an\u00e1lisis estricto de legalidad, necesidad, proporcionalidad, racionalidad y excepcionalidad. Adem\u00e1s, deber\u00e1n fundamentar sus resoluciones con argumentos concretos, evitando criterios gen\u00e9ricos o valoraciones abstractas sobre riesgos de fuga u obstaculizaci\u00f3n.\n\nAdem\u00e1s, dispone priorizar medidas cautelares menos gravosas y el uso del sistema tecnol\u00f3gico ROMA\u2013ARGO, una herramienta biom\u00e9trica, geolocalizada y telem\u00e1tica de supervisi\u00f3n judicial que permite controlar medidas alternativas sin necesidad de encarcelamiento preventivo.\n\nLa Sala Plena instruy\u00f3 a las autoridades judiciales ejercer control permanente de oficio sobre las causas que dieron origen a la detenci\u00f3n preventiva y revisar inmediatamente aquellos casos cuyo plazo haya concluido. En estos casos, se deber\u00e1 disponer sin demora la cesaci\u00f3n de la medida y aplicar alternativas menos restrictivas.\n\nEl documento est\u00e1 firmado por el presidente del TSJ, Romer Saucedo.", "dateTimeNews": "2026-05-29T14:52:07+00:00", "dateTimeReceived": "2026-05-29T17:29:02+00:00", "pic": "https://larazon.bo/wp-content/uploads/2025/07/e7eaf15fd45b56d35dc5ecdfb3bd1205.webp", "position": 10, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/tsj-instruye-la-aplicacion-excepcional-de-la-detencion-preventiva-y-la-revision-de-casos-en-los-que-su-plazo-haya-fenecido/"}], "source": "La Raz\u00f3n", "title": "TSJ instruye revisar detenciones preventivas vencidas y limitar su aplicaci\u00f3n", "url": "https://larazon.bo/nacional/2026/05/29/tsj-instruye-revisar-detenciones-preventivas-vencidas-y-limitar-su-aplicacion/"}, {"actor": [], "authors": ["Sumando Voces"], "body": "BR\u00daJULA DIGITAL\n\nLa Administradora Boliviana de Carreteras (ABC) report\u00f3 hasta las 7:47 de este viernes 76 puntos de bloqueo en seis departamentos del pa\u00eds, 10 m\u00e1s que los registrados la ma\u00f1ana del jueves.\n\nLa Paz contin\u00faa como el departamento m\u00e1s afectado, con 21 puntos de bloqueo. Le siguen Cochabamba, con 16; Potos\u00ed, con 15; Oruro, con 13; Chuquisaca, con nueve; y Santa Cruz, con dos.\n\nLas medidas de presi\u00f3n impulsadas por sectores que exigen la renuncia del presidente Rodrigo Paz cumplen este viernes 29 d\u00edas. Las movilizaciones comenzaron a inicios de mayo con acciones asumidas por la Central Obrera Boliviana (COB), que inicialmente demandaba la atenci\u00f3n de su pliego petitorio. Posteriormente se sumaron la Federaci\u00f3n Departamental \u00danica de Trabajadores Campesinos T\u00fapac Katari y otros sectores.\n\nAyer, la vicepresidencia, en coordinaci\u00f3n con la Iglesia cat\u00f3lica y la Defensor\u00eda del Pueblo, convoc\u00f3 a una segunda reuni\u00f3n de la Comisi\u00f3n de Di\u00e1logo. El encuentro se realiz\u00f3 en el seminario San Jer\u00f3nimo de La Paz y cont\u00f3 con la participaci\u00f3n de autoridades, representantes de las instituciones convocantes y sectores sociales. Sin embargo, la COB y la federaci\u00f3n campesina no asistieron.\n\nLos sectores movilizados exigieron la anulaci\u00f3n de las \u00f3rdenes de aprehensi\u00f3n contra dirigentes campesinos y de la COB. Ante esa situaci\u00f3n, la reuni\u00f3n ingres\u00f3 en cuarto intermedio.\n\nAdem\u00e1s, este jueves por la tarde, la Justicia rechaz\u00f3 dejar sin efecto el mandamiento de apremio contra el secretario ejecutivo de la COB Mario Argollo.\n\nPuntos de bloqueo:\n\nLa Paz\n\n1. Santa B\u00e1rbara \u2013 Choro Bajo\n\n2. Patacamaya \u2013 Huarina\n\n3. R\u00edo Seco \u2013 Laja\n\n4. Inicio Autopista\n\n5. Guaqui \u2013 Desaguadero\n\n6. Tiahuanaco \u2013 Guaqui\n\n7. Laja \u2013 Tambillo\n\n8. Salida Caquiaviri \u2013 Salida Vichaya\n\n9. Salida Vochaya \u2013 Salida de Achiri\n\n10. Botijlaca \u2013 Colegio Laura Lloko Lloko\n\n11. Salida Achiri \u2013 Salida Bereguela\n\n12. R\u00edo Mauri \u2013 Chara\u00f1a\n\n13. Achica Arriba \u2013 Calamarca\n\n14. Calamarca \u2013 Ayo Ayo\n\n15. Ayo Ayo \u2013 Patacamaya\n\n16. Patacamaya \u2013 Lacka\n\n17. Puente r\u00edo Desaguadero \u2013 L\u00edmite departamento Oruro-La Paz\n\n18. Sica Sica \u2013 Luribay\n\n19. Patacamaya \u2013 S ochabamba-Chuquisaca\n\n69. Motojoro \u2013 Surima\n\n70. Sucre \u2013 Yotala\n\n71. Yotala \u2013 L\u00edmite departamento Chuquisaca-Potos\u00ed\n\n72. Yamparaes \u2013 Tarabuco\n\n73. Calambuco -Zuda\u00f1ez\n\n74. Zuda\u00f1ez \u2013 Quepupampa\n\nSanta Cruz\n\n75. San Germ\u00e1n \u2013 L\u00edmite departamento Cochabamba-Santa Cruz\n\n76. Okinawa \u2013 Puerto Benegas", "dateTimeNews": "2026-05-29T14:35:09+00:00", "dateTimeReceived": "2026-05-29T14:47:53+00:00", "pic": "https://sumandovoces.com.bo/wp-content/uploads/2026/05/image-7.jpg", "position": 11, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/29/casi-un-mes-de-bloqueos-hay-al-menos-80-cortes-de-via-en-seis-departamentos/"}], "source": "Sumando Voces", "title": "Aumentan los puntos de bloqueo, se registran 76 en seis departamentos -", "url": "https://sumandovoces.com.bo/aumentan-los-puntos-de-bloqueo-se-registran-76-en-seis-departamentos/"}, {"actor": [], "authors": ["Shirley Iba\u00f1ez"], "body": "en Ciudades\n\nEl viceministro de Defensa Social y Sustancias Controladas, Ernesto Justiniano, afirm\u00f3 que la decisi\u00f3n de Estados Unidos de declarar organizaciones terroristas al Primer Comando de la Capital (PCC) y al Comando Vermelho (CV) confirma que el crimen organizado transnacional representa una amenaza que va m\u00e1s all\u00e1 del narcotr\u00e1fico y las incautaciones de droga.\n\n\u201cEsta decisi\u00f3n confirma una realidad que Bolivia no puede ignorar: el crimen organizado transnacional ya no puede ser visto solo como un problema policial o de incautaci\u00f3n de droga\u201d, se\u00f1al\u00f3 Justiniano en una publicaci\u00f3n en sus redes sociales.\n\nAsimismo, sostuvo que estas estructuras criminales poseen capacidad financiera, log\u00edstica, territorial y armada, lo que les permite operar a nivel regional mediante redes de tr\u00e1fico, lavado de dinero, corrupci\u00f3n institucional y generaci\u00f3n de violencia.\n\nPara Justiniano el impacto es directo y obliga a fortalecer una estrategia integral en la lucha antidroga, la cual no solamente debe estar enfocada en los cargamentos il\u00edcitos, sino tambi\u00e9n en toda la cadena criminal vinculada al narcotr\u00e1fico.\n\nLea m\u00e1s: EEUU declara como terroristas a grupos criminales PCC y CV\n\n\u201cNo se trata solamente de Brasil ni de Estados Unidos. Se trata de organizaciones con capacidad financiera, log\u00edstica, territorial y armada, que cruzan fronteras, articulan rutas, lavan dinero, corrompen instituciones y generan violencia\u201d, remarc\u00f3.\n\nLucha antidroga\n\nAdem\u00e1s, dijo que en Bolivia la lucha antidroga \u201cdebe mirar toda la cadena criminal, no solamente el cargamento final. Eso exige investigaci\u00f3n, inteligencia, control territorial, cooperaci\u00f3n internacional y persecuci\u00f3n del financiamiento il\u00edcito\u201d.\n\n\u201cEsta es la l\u00ednea que Bolivia debe consolidar: m\u00e1s capacidad real para golpear dinero, log\u00edstica, rutas, protecci\u00f3n y articulaci\u00f3n criminal\u201d.\n\nLa autoridad urgi\u00f3 tareas para profundizar tareas de investigaci\u00f3n, inteligencia, control territorial, cooperaci\u00f3n internacional y persecuci\u00f3n del financiamiento il\u00edcito.\n\nLa determinaci\u00f3n internacional tambi\u00e9n alcanza a las redes de apoyo que facilitan las operaciones de estas organizaciones, entre ellas operadores log\u00edsticos, financistas, lavadores de dinero, enlaces territoriales y estructuras de protecci\u00f3n.\n\nEl jueves, Estados Unidos anunci\u00f3 la designaci\u00f3n de las organizaciones criminales brasile\u00f1as Comando Vermelho y PCC en la lista de Organizaciones Terroristas Extranjeras.\n\nEsta semana, Bolivia expuls\u00f3 al ciudadano brasile\u00f1o Gerson Palermo, l\u00edder del PCC capturado en Santa Cruz.", "dateTimeNews": "2026-05-29T14:31:07+00:00", "dateTimeReceived": "2026-05-29T14:47:46+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/Captura-de-pantalla-1177.webp", "position": 12, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/28/gobierno-ratifica-lucha-anticrimen-tras-declaracion-terrorista-de-eeuu-al-pcc-y-comando-vermelho/"}], "source": "La Raz\u00f3n", "title": "Bolivia alerta amenaza regional tras declaraci\u00f3n de grupos terroristas a PCC y CV", "url": "https://larazon.bo/ciudades/2026/05/29/bolivia-alerta-amenaza-regional-tras-declaracion-de-grupos-terroristas-a-pcc-y-cv/"}, {"actor": [], "authors": ["La Patria"], "body": "Tras la balacera en Yapacan\u00ed, la Polic\u00eda intensific\u00f3 los rastrillajes para dar con los delincuentes que intentaron robar un veh\u00edculo\n\nFicha informativa La noche del 28 de mayo, en Yapacan\u00ed, dos delincuentes dispararon durante un intento de robo de un veh\u00edculo. La Polic\u00eda intensific\u00f3 los rastrillajes tras el incidente, que no dej\u00f3 v\u00edctimas fatales pero caus\u00f3 da\u00f1os materiales. Toca para ver el contexto completo Contexto: Los delincuentes llegaron en una motocicleta con la intenci\u00f3n de robar un veh\u00edculo tipo Noah. La v\u00edctima se resisti\u00f3 al atraco, lo que provoc\u00f3 la reacci\u00f3n violenta de los asaltantes. Testigos describieron a los sospechosos como hombres de contextura regular sin cascos. Los asaltantes abrieron fuego tanto contra el veh\u00edculo como al aire para amedrentar a los presentes antes de huir del lugar. Por qu\u00e9 importa: La Polic\u00eda Boliviana activ\u00f3 un plan de contingencia y moviliz\u00f3 unidades para realizar rastrillajes y operativos cerrojo en la regi\u00f3n con el objetivo de localizar a los delincuentes. Datos clave: Fecha: 28 de mayo\n\n28 de mayo Hora: 22:00 horas\n\n22:00 horas Lugar: Barrio Santa Rosa, Yapacan\u00ed, Santa Cruz\n\nBarrio Santa Rosa, Yapacan\u00ed, Santa Cruz N\u00famero de disparos: Al menos tres IngresarDesbloquear acceso completo\n\nYapacan\u00ed: 2 delincuentes disparan en intento de robo de un coche \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nYapacan\u00ed: Balacera en intento de robo causa alarma\n\nLa noche del pasado jueves 28 de mayo, un violento incidente se registr\u00f3 en el barrio Santa Rosa, perteneciente al municipio de Yapacan\u00ed, en la ciudad de Santa Cruz. Aproximadamente a las 22:00 horas, una balacera deriv\u00f3 en un intento de robo que, afortunadamente, no dej\u00f3 v\u00edctimas fatales pero caus\u00f3 serios da\u00f1os materiales en un veh\u00edculo.\n\nDetalles del incidente\n\nDe acuerdo con los reportes preliminares de las autoridades, dos antisociales arribaron sorpresivamente al lugar a bordo de una motocicleta con el objetivo directo de apoderarse de un veh\u00edculo tipo Noah. Una vez en el sitio, los asaltantes enca\u00f1onaron y exigieron de manera agresiva al propietario que les entregara las llaves del autom\u00f3vil.\n\nResistencia del propietario\n\nSin embargo, la v\u00edctima se resisti\u00f3 valientemente al atraco y se neg\u00f3 a ceder ante las amenazas. Esta acci\u00f3n provoc\u00f3 la violenta reacci\u00f3n de los criminales. Al ver frustradas sus intenciones por la negativa del due\u00f1o, los sujetos abrieron fuego indiscriminadamente, efectuando al menos tres disparos directos contra la carrocer\u00eda del veh\u00edculo Noah y realizando otros tiros al aire para amedrentar a los presentes.\n\nFuga de los delincuentes\n\nInmediatamente despu\u00e9s de detonar sus armas, los delincuentes aceleraron la motocicleta y se dieron a la fuga con rumbo desconocido, perdi\u00e9ndose en la oscuridad de la zona. Testigos presenciales del hecho detallaron a los investigadores que los sospechosos eran dos hombres de contextura regular que circulaban sin cascos de seguridad.\n\nRespuesta policial\n\nTras recibir la alerta del tiroteo, la Polic\u00eda Boliviana activ\u00f3 un plan de contingencia. Moviliz\u00f3 todas las unidades policiales del municipio de Yapacan\u00ed para ejecutar intensos rastrillajes y operativos cerrojo en diferentes puntos estrat\u00e9gicos de la regi\u00f3n con el fin de dar con el paradero e identidad de los peligrosos pr\u00f3fugos.", "dateTimeNews": "2026-05-29T14:19:54+00:00", "dateTimeReceived": "2026-05-29T14:47:36+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a199bf1684fa.jpg", "position": 13, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/santa-cruz/punta-disparos-dos-sujetos-armados-intentan-robar-vehiculo-yapacani_1780058140"}], "source": "La Patria", "title": "Yapacan\u00ed: 2 delincuentes disparan en intento de robo de un coche - La Patria 3.0", "url": "https://lapatria.bo/actualidad/yapacani-2-delincuentes-disparan-en-intento-de-robo-de-un-coche/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "El expresidente del Estado y actual dirigente cocalero, Evo Morales, asegur\u00f3 este viernes que tiene gente dentro del Gobierno, as\u00ed como \u201ccompa\u00f1eros\u201d polic\u00edas y militares, que lo mantienen \u201cinformado\u201d y, en ese sentido, asever\u00f3 que el apag\u00f3n que se vivi\u00f3 en la regi\u00f3n del Tr\u00f3pico la noche del mi\u00e9rcoles fue un \u201censayo\u201d para intervenir Lauca \u00d1, donde se mantiene atrincherado para evitar su aprehensi\u00f3n.\n\nSeg\u00fan Morales, cuando ocurri\u00f3 el apag\u00f3n, se contact\u00f3 con gente que le confirm\u00f3 que lo ocurrido pas\u00f3 por \u201cinstrucci\u00f3n desde Cochabamba\u201d. Afirm\u00f3 que el plan es dejar a la regi\u00f3n del Tr\u00f3pico sin luz ni conexi\u00f3n a internet para poder intervenir la zona.\n\n\u201cEl plan que tiene es intervenir a Lauca \u00d1, callar la radio, apagar la energ\u00eda, apagar los celulares de todas las empresas (\u2026) ya sabemos, gracias a compa\u00f1eros que trabajan dentro del Gobierno\u201d, asever\u00f3 en su programa en radio Kawsachun Coca.\n\nEl dirigente cocalero, en ese sentido, enfatiz\u00f3 que lo ocurrido \u201ces como un globo de ensayo\u201d y reafirm\u00f3 que tambi\u00e9n se mantiene informado por polic\u00edas y militares.\n\nLa Empresa de Luz y Fuerza Cochabamba S.A. (ELFEC) inform\u00f3 que el corte de energ\u00eda el\u00e9ctrica en sectores del Tr\u00f3pico de Cochabamba, registrado la noche del mi\u00e9rcoles, fue por la ca\u00edda de postes de alta tensi\u00f3n.\n\nEl hecho ocurri\u00f3 cerca de las 19:52, afectando el sistema el\u00e9ctrico y ocasionando ausencia de tensi\u00f3n y p\u00e9rdida de carga en las subestaciones Villa Tunari y Chimor\u00e9, se\u00f1ala un comunicado oficial de la entidad estatal.\n\n\u201cDe acuerdo con la informaci\u00f3n preliminar, el evento fue provocado por la ca\u00edda de una estructura (postes de alta tensi\u00f3n); sin embargo, las causas y circunstancias de este hecho se mantienen en investigaci\u00f3n y an\u00e1lisis t\u00e9cnico\u201d, se lee en parte del documento.\n\nLuego de conocerse el corte, seg\u00fan el texto, de manera inmediata, personal t\u00e9cnico y operativo de ELFEC realiz\u00f3 los trabajos correspondientes para la reposici\u00f3n del servicio, logrando el retorno gradual de la energ\u00eda a partir de las 22:00.", "dateTimeNews": "2026-05-29T14:16:38+00:00", "dateTimeReceived": "2026-05-29T14:47:46+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/evo_captura2.png", "position": 14, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/elfec-afirma-que-caida-de-postes-dejo-sin-luz-a-sectores-del-tropico-de-cochabamba/"}], "source": "Ox\u00edgeno", "title": "Evo dice tener \u201ccompa\u00f1eros\u201d dentro del Gobierno y que apag\u00f3n en el Tr\u00f3pico fue un \u201censayo\u201d para intervenir Lauca \u00d1", "url": "https://oxigeno.bo/evo-dice-tener-companeros-dentro-del-gobierno-y-que-apagon-en-el-tropico-fue-un-ensayo-para-intervenir-lauca-n/"}, {"actor": [], "authors": ["Pedro Rivero De Ugarte"], "body": "La selecci\u00f3n boliviana inici\u00f3 este viernes su etapa de preparaci\u00f3n en Santa Cruz de la Sierra de cara a los amistosos internacionales que disputar\u00e1 en Estados Unidos durante la primera semana de junio. El equipo dirigido por \u00d3scar Villegas trabajar\u00e1 aproximadamente seis d\u00edas en territorio nacional antes de emprender viaje.\n\nAunque el grupo todav\u00eda no est\u00e1 completo, poco a poco fueron llegando los futbolistas convocados. A los jugadores que militan en clubes del f\u00fatbol boliviano se sumaron varios legionarios que arribaron al pa\u00eds en las \u00faltimas horas.\n\nLa concentraci\u00f3n de la Verde comenz\u00f3 oficialmente el jueves con una sesi\u00f3n regenerativa realizada en el hotel de concentraci\u00f3n. Sin embargo, este viernes el cuerpo t\u00e9cnico ya program\u00f3 el primer entrenamiento en campo abierto, que se desarrollar\u00e1 en la sede de Blooming.\n\n\u00d3scar Villegas aprovechar\u00e1 estos d\u00edas para fortalecer aspectos t\u00e1cticos y f\u00edsicos del equipo antes de los compromisos amistosos. La selecci\u00f3n boliviana tiene previsto viajar a Estados Unidos el pr\u00f3ximo 3 de junio.\n\nEl plantel nacional se completar\u00e1 reci\u00e9n en territorio estadounidense debido a que algunos futbolistas llegar\u00e1n directamente desde el exterior. En total, fueron convocados 28 jugadores para afrontar los dos encuentros internacionales.\n\nBolivia enfrentar\u00e1 a Escocia el 6 de junio en Nueva Jersey, en un duelo que servir\u00e1 como una importante prueba para medir el rendimiento del equipo ante un rival europeo de jerarqu\u00eda.\n\nPosteriormente, la Verde jugar\u00e1 frente a Argelia el 10 de junio en Kansas. Ambos compromisos forman parte del proceso de preparaci\u00f3n y evaluaci\u00f3n de la nueva generaci\u00f3n de futbolistas que busca consolidar \u00d3scar Villegas al mando del combinado nacional.", "dateTimeNews": "2026-05-29T13:11:25+00:00", "dateTimeReceived": "2026-05-29T14:47:34+00:00", "pic": "https://cdn.diez.bo/diez/052026/1780060156056.jpg?cw=1200\u0026ch=630", "position": 15, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/deportes/jugadores-blooming-oriente-uniran-verde-clasico_1780065748"}], "source": "El Deber", "title": "La Verde tendr\u00e1 seis d\u00edas de preparaci\u00f3n antes de viajar a EEUU", "url": "https://eldeber.com.bo/deportes/verde-tendra-seis-dias-preparacion-antes-viajar-eeuu_1780060285"}, {"actor": [], "authors": ["Shirley Iba\u00f1ez"], "body": "en Nacional\n\nLos bloqueos en el pa\u00eds se masifican y a casi un mes de la medida de presi\u00f3n, los cortes de v\u00eda suman unos 80 en seis departamentos del pa\u00eds, seg\u00fan el mapa de transitabilidad de la Administradora Boliviana de Carreteras (ABC).\n\nLa Paz se mantiene como el m\u00e1s golpeado, con al menos 20 bloqueos que mantienen cercado al departamento sin permitir el ingreso de alimentos, combustibles y medicamentos.\n\nTambi\u00e9n hay bloqueos en Cochabamba, Oruro, Chuquisaca, Potos\u00ed y Santa Cruz.\n\nLos bloqueos impactan directamente en el abastecimiento de alimentos, medicamentos, combustible, ox\u00edgeno medicinal, insumos m\u00e9dicos y mercader\u00eda, generando preocupaci\u00f3n entre transportistas, comerciantes, productores, hospitales y familias que necesitan movilizarse entre regiones.\n\nLas movilizaciones y bloqueos se iniciaron los primeros d\u00edas de este mes, impulsadas inicialmente por la Central Obrera Boliviana (COB) y la Federaci\u00f3n Departamental de Trabajadores Campesinos T\u00fapac Katari, y posteriormente sumaron a otros sectores movilizados.\n\nLea m\u00e1s: Bolivia amanece con 64 puntos de bloqueo en medio de nuevos intentos de di\u00e1logo\n\nSeg\u00fan la ABC estas son las principales rutas bloqueadas:\n\nLa Paz\n\nPumazani\n\nPatacamaya \u2013 Huarina\n\nRuta al Desaguadero \u2013 Patamanta\n\nAlto Lima \u2013 R\u00edo Seco\n\nInicio Autopista \u2013 Juan Pablo II\n\nGuaqui \u2013 Desaguadero\n\nTihuanacu \u2013 Guaqui\n\nNazacara \u2013 San Andr\u00e9s\n\nAchica Arriba \u2013 Calamarca\n\nSalida Santiago de Machaca
