n\u00f3micas en todo el pa\u00eds y pese a los llamados al di\u00e1logo del Gobierno, la COB y los campesinos se mantienen firmes en su medida y no quieren ceder.", "dateTimeNews": "2026-05-29T13:05:05+00:00", "dateTimeReceived": "2026-05-29T17:29:04+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/WhatsApp-Image-2026-04-30-at-09.41.07-4.webp", "position": 16, "similar": [{"source": "Sumando Voces", "url": "https://sumandovoces.com.bo/aumentan-los-puntos-de-bloqueo-se-registran-76-en-seis-departamentos/"}], "source": "La Raz\u00f3n", "title": "Casi un mes de bloqueos: Hay unos 80 cortes de v\u00eda en seis departamentos", "url": "https://larazon.bo/nacional/2026/05/29/casi-un-mes-de-bloqueos-hay-al-menos-80-cortes-de-via-en-seis-departamentos/"}, {"actor": [], "authors": ["Rafael Sempertegui"], "body": "El delantero \u00abGunner\u00bb Gabriel Jesus y el central del PSG Lucas Beraldo, completan el elenco de brasile\u00f1os que se ver\u00e1n sobre el c\u00e9sped del Puskas Arena de la capital h\u00fangara el s\u00e1bado.\n\nEl DT de Brasil Carlo Ancelotti estar\u00e1 muy pendiente de las evoluciones del previsible eje central titular de la \u00abAuriverde\u00bb en la ciudad de Estados Unidos, M\u00e9xico y Canad\u00e1.\n\nPorque si la retaguardia de otro combinado sudamericano como Ecuador estar\u00e1 representada en la final por el \u00abparisino\u00bb Willian Pacho y por el londinense Piero Hincapi\u00e9, la tetratampeona del mundo Brasil contar\u00e1 con los dos jugadores que presumiblemente conformar\u00e1n el centro titular de su l\u00ednea defensiva; Marquinhos y Gabriel Magalh\u00e3es.\n\nEl central Gunner se ha erigido en uno de los grandes art\u00edfices del primer t\u00edtulo en la Premier del Arsenal desde 2004 y de su primera final en Champions League desde 2006.\n\nCerrojo defensivo\n\nEl conjunto dirigido por Mikel Arteta se sustenta en una estructura s\u00f3lida a prueba de huracanes y en la disciplina t\u00e1ctica, adem\u00e1s de un sistema defensivo basado en impedir sobre todo los remates a puertas de los rivales. El jugador paulista de 28 a\u00f1os se adapta a la perfecci\u00f3n a las necesidades de su entrenador vasco.\n\nAdem\u00e1s, es una baza para el Arsenal en las jugadas a pelota parada, la especialidad del equipo, con cuatro goles esta temporada entre todas las competiciones.\n\nGabriel, formado en el Ava\u00ed de Florian\u00f3polis antes de foguearse en Francia, en el Lille y el Troyes, y de dar el salto al Arsenal en 2020, suma una vez partidos en esta Champions, en la que su equipo s\u00f3lo ha encajado seis goles en 14 partidos.\n\nY en la liga inglesa, el Arsenal dej\u00f3 su arco a cero en 19 partidos, siendo el equipo menos goleado de la competici\u00f3n.\n\nEsa Premier fue el primer gran t\u00edtulo en la carrera de Gabriel en clubes, m\u00e1s all\u00e1 de la liga y la Copa de Croacia con el Dinamo de Zagreb.\n\nMucho m\u00e1s extenso es el palmar\u00e9s de Marquinhos (32 a\u00f1os); 11 Liga 1, 8 Copas de Francia y 10 Supercopas de Francia.\n\nMarquinhos, nacido en Sao Paulo como Gabriel, es una leyenda del PSG. Ning\u00fan otro futbolista ha jugado m\u00e1s partidos con la camiseta parisina (522) y est\u00e1 a un partido de levantar como capit\u00e1n su segunda Orejona consecutiva.\n\n\u2018La segunda a\u00fan m\u00e1s dura\u2019\n\n\u00abUna vez ya es dif\u00edcil, una segunda seguida es a\u00fan m\u00e1s duro\u00bb, estima el jugador que lleva 13 cursos en el PSG y que ha visto pasar a varios entrenadores por el banquillo del Parque de los Pr\u00edncipes sin alcanzar el gran objetivo europeo.\n\nPara poder estar en Budapest, Marquinhos exhibi\u00f3 pundonor y resistencia contra el Liverpool en Anfield (2-0) y en la vuelta ante el Bayern M\u00fanich en el Allianz Arena (1-1), luego de haber sufrido en la ida frente a Luis D\u00edaz y Michael Olise (5-4).\n\nPresionado por la llegada el pasado verano boreal de un rival por el puesto, Ilya Zabarnyi, el brasile\u00f1o no baj\u00f3 los brazos y ha conservado su rol de l\u00edder.\n\n\u00abEs un capit\u00e1n, el l\u00edder del vestuario. Cuando no est\u00e1 en el equipo no s\u00e9 qui\u00e9n va a hablar, qui\u00e9n va a motivar al equipo\u00bb, dec\u00eda su entrenador Luis Enrique en febrero.\n\nEn Budapest tendr\u00e1 enfrente a su compa\u00f1ero en la Sele\u00e7ao Gabriel Martinelli, brillante en Champions, a menudo como revulsivo, con seis goles (todos ellos en primera fase) y dos asistencias en 13 partidos, siendo junto al arquero David Raya el jugador del Arsenal con m\u00e1s presencias en Champions este curso.\n\nSea el t\u00edtulo para PSG o Arsenal, Brasil contar\u00e1 con al menos un campe\u00f3n de Europa en el Mundial.\n\n(29/05/2026)", "dateTimeNews": "2026-05-29T12:42:37+00:00", "dateTimeReceived": "2026-05-29T14:47:51+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/Budapest-PSG.webp", "position": 17, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/marcas/2026/05/29/duelos-de-la-final-de-champions-psg-arsenal/"}, {"source": "La Raz\u00f3n", "url": "https://larazon.bo/marcas/2026/05/29/psg-arsenal-un-equipo-de-leyenda-ante-una-deuda-historica/"}], "source": "La Raz\u00f3n", "title": "Con los \u2018Gabrieles\u2019 del Arsenal y Marquinhos, Brasil juega en Budapest", "url": "https://larazon.bo/marcas/2026/05/29/con-los-gabrieles-del-arsenal-y-marquinhos-brasil-juega-en-budapest/"}, {"actor": [], "authors": ["El Deber"], "body": "Los puntos de bloqueos en seis de los nueve departamentos del pa\u00eds contin\u00faan aumentando en demanda de la renuncia del presidente Rodrigo Paz.\n\nEste viernes comenz\u00f3 una nueva jornada de conflicto con 76 bloqueos, seg\u00fan el mapa de transitabilidad de la Administradora Boliviana de Carreteras (ABC) actualizado hasta las 07:26. El jueves el pa\u00eds amaneci\u00f3 con 66 bloqueos.\n\nDe acuerdo con el detalle de la informaci\u00f3n, 21 bloqueos est\u00e1n el departamento de La Paz, 16 en Cochabamba, 15 en Potos\u00ed, 12 en Oruro, 10 en Chuquisaca y 2 en Santa Cruz.\n\nLos departamentos de Pando, Beni y Tarija siguen sin ning\u00fan punto de bloqueo, al menos en las carreteras administradas por la ABC.\n\nEl conflicto comenz\u00f3 el 1 de mayo con una declaratoria de paro general indefinido por parte de la COB y d\u00edas despu\u00e9s los campesinos de La Paz comenzaron con un bloqueo indefinido de carreteras, que mantiene un cerco a la sede de Gobierno hasta la fecha.\n\nLas organizaciones movilizadas en un principio ped\u00edan la atenci\u00f3n a determinadas demandas sectoriales, pero ahora solo exigen la renuncia de Paz sin asistir a los constantes llamados al di\u00e1logo.\n\nHace dos d\u00edas, el presidente Paz hizo una \u201c\u00faltima\u201d llamada al di\u00e1logo y advirti\u00f3 con aplicar luego la ley. Mientras que, en las ciudades m\u00e1s afectadas por el cerco, como La Paz y El Alto, se agrava la escasez de combustibles, alimentos y hasta de ox\u00edgeno medicinal.", "dateTimeNews": "2026-05-29T12:07:37+00:00", "dateTimeReceived": "2026-05-29T14:47:33+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1780056369076.jpeg?\u0026cw=1200\u0026ch=630", "position": 18, "similar": [{"source": "Asuntos Centrales", "url": "https://asuntoscentrales.com/bloqueos-suman-77-puntos-y-afectan-rutas-en-seis-departamentos/"}], "source": "El Deber", "title": "Suman 76 los bloqueos en las carreteras en el comienzo del d\u00eda 29 del conflicto", "url": "https://eldeber.com.bo/pais/suman-76-bloqueos-carreteras-comienzo-dia-29-conflicto_1780056457"}, {"actor": [], "authors": ["Asuntos Centrales"], "body": "La Direcci\u00f3n Departamental de Educaci\u00f3n (DDE) de Santa Cruz inform\u00f3 que el horario de invierno comenzar\u00e1 a aplicarse desde el pr\u00f3ximo lunes en las unidades educativas del departamento, como medida...\n\nDesde cu\u00e1ndo regir\u00e1 el horario de invierno en las escuelas de Santa Cruz\n\nLa Direcci\u00f3n Departamental de Educaci\u00f3n (DDE) de Santa Cruz inform\u00f3 que el horario de invierno comenzar\u00e1 a aplicarse desde el pr\u00f3ximo lunes en las unidades educativas del departamento, como medida preventiva ante el descenso de temperaturas y el ingreso de nuevos frentes fr\u00edos.\n\nLa decisi\u00f3n fue coordinada con el Servicio Departamental de Salud (Sedes) y el Servicio Nacional de Meteorolog\u00eda e Hidrolog\u00eda (Senamhi), instituciones que alertaron sobre bajas temperaturas previstas para las siguientes semanas.\n\n\u201cEstamos previendo con anticipaci\u00f3n que en junio vamos a ingresar con el horario de invierno\u201d, inform\u00f3 el director departamental de Educaci\u00f3n, Nelson Alc\u00f3cer.\n\nCon la aplicaci\u00f3n de la medida, el ingreso en el turno de la ma\u00f1ana se retrasar\u00e1 30 minutos y la salida en el turno de la tarde se adelantar\u00e1 media hora, tomando como referencia los horarios actuales de cada unidad educativa. Seg\u00fan la DDE, el objetivo es evitar que los estudiantes est\u00e9n expuestos al fr\u00edo durante las primeras horas de la ma\u00f1ana y la noche.\n\nLa instituci\u00f3n tambi\u00e9n ratific\u00f3 la continuidad de otras medidas preventivas, entre ellas la tolerancia en los horarios de ingreso, la flexibilizaci\u00f3n del uso del uniforme escolar y la activaci\u00f3n de filtros sanitarios para prevenir enfermedades respiratorias.\n\nA trav\u00e9s de un instructivo oficial, las autoridades educativas recomendaron adem\u00e1s reforzar las medidas de bioseguridad dentro de las aulas y solicitaron a los padres de familia enviar a los estudiantes con el abrigo adecuado.", "dateTimeNews": "2026-05-29T11:46:32+00:00", "dateTimeReceived": "2026-05-29T14:47:33+00:00", "pic": "https://asuntoscentrales.com/wp-content/uploads/2026/05/colegis.jpg", "position": 19, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/santa-cruz/lunes-rige-horario-invierno-escuelas-crucenas_1780053493"}], "source": "Asuntos Centrales", "title": "Desde cu\u00e1ndo regir\u00e1 el horario de invierno en las escuelas de Santa Cruz", "url": "https://asuntoscentrales.com/desde-cuando-regira-el-horario-de-invierno-en-las-escuelas-de-santa-cruz/"}, {"actor": [], "authors": ["Patricia Canido Aroni"], "body": "ENTEL Empresas, ENTEL PyME y ENTEL Gobierno nacen para acercar soluciones tecnol\u00f3gicas especializadas a empresas, emprendedores e instituciones, respaldadas por infraestructura de clase mundial y alianzas estrat\u00e9gicas internacionales.\n\nLa Empresa Nacional de Telecomunicaciones (ENTEL S.A.) present\u00f3 oficialmente tres nuevas marcas orientadas a atender de manera especializada las necesidades del sector empresarial, emprendedor e institucional del pa\u00eds.\n\nEl anuncio se realiz\u00f3 durante ENTEL Conecta CEO Summit, un espacio que reuni\u00f3 a l\u00edderes empresariales, expertos internacionales y representantes de compa\u00f1\u00edas tecnol\u00f3gicas globales para analizar el impacto de la innovaci\u00f3n, la inteligencia artificial, la ciberseguridad y la infraestructura digital en el crecimiento econ\u00f3mico y la competitividad.\n\nLa nueva estrategia busca acercar soluciones diferenciadas a cada sector mediante equipos especializados y una oferta enfocada en servicios en la nube, automatizaci\u00f3n, protecci\u00f3n de datos, conectividad avanzada e infraestructura tecnol\u00f3gica.\n\nEl gerente general de ENTEL S.A., Jorge del Solar, explic\u00f3 que esta evoluci\u00f3n responde a una nueva forma de relacionarse con las organizaciones bolivianas.\n\n\u00abCuando empezamos a redise\u00f1ar nuestra estrategia comercial, ten\u00edamos claro que era necesario ajustar la forma de proyectarnos y de ver las cosas. Deb\u00edamos crear especialistas y expertos en servicios digitales para acercarnos de manera m\u00e1s efectiva a las diferentes empresas que tiene Bolivia. En una primera etapa, hemos definido tres divisiones, aunque existen varias otras y trabajaremos inicialmente sobre tres l\u00edneas de servicios digitales, dirigidas a distintos \u00e1mbitos del sector empresarial boliviano\u00bb, detall\u00f3 Del Solar.\n\nEstas tres nuevas marcas abren una nueva etapa para el desarrollo digital del pa\u00eds y la construcci\u00f3n de una Bolivia tecnol\u00f3gica, acercando soluciones especializadas a organizaciones de todos los tama\u00f1os y fortaleciendo su capacidad para competir, innovar y crecer en un entorno cada vez m\u00e1s digital.\n\nLa propuesta est\u00e1 respaldada por una infraestructura tecnol\u00f3gica consolidada, compuesta por centros de datos certificados internacionalmente, plataformas de nube, redes de alta capacidad y alianzas con compa\u00f1\u00edas l\u00edderes del ecosistema digital. Estas capacidades permitir\u00e1n acercar tecnolog\u00eda de nivel internacional a organizaciones p\u00fablicas y privadas, facilitando procesos de modernizaci\u00f3n, eficiencia operativa y crecimiento.\n\nPor su parte, el presidente del Directorio de ENTEL S.A., \u00c1lvaro Baz\u00e1n, destac\u00f3 que la tecnolog\u00eda se ha convertido en un elemento fundamental para mejorar la gesti\u00f3n y fortalecer la actividad econ\u00f3mica.\n\n\u00abHoy la conversaci\u00f3n en ENTEL ya no es solamente de conectividad. Hablamos de ciberseguridad, de inteligencia artificial, de automatizaci\u00f3n, servicios en la nube, edge computing, en fin, mucha infraestructura digital que permite operar mejor, tomar decisiones m\u00e1s r\u00e1pido, proteger la informaci\u00f3n de las organizaciones\u00bb.\n\nBaz\u00e1n se\u00f1al\u00f3 que uno de los principales desaf\u00edos es acercar estas capacidades a empresas, emprendedores e instituciones, mediante soluciones accesibles y adaptadas a la realidad boliviana, contribuyendo a una mayor productividad y competitividad.\n\nEl encuentro cont\u00f3 con la participaci\u00f3n de Eduardo La Rosa (Google), Gonzalo Garc\u00eda (Fortinet), Dan Miller (Armada), Luis Berger, especialista en ciberseguridad, y el conferencista internacional Oscar Mart\u00e1n, quienes compartieron experiencias sobre inteligencia artificial, liderazgo, innovaci\u00f3n, seguridad digital e infraestructura tecnol\u00f3gica.\n\nLas exposiciones destacaron la importancia de fortalecer las capacidades nacionales para proteger la informaci\u00f3n, impulsar la soberan\u00eda digital y aprovechar las nuevas tecnolog\u00edas como herramientas para generar desarrollo econ\u00f3mico, modernizaci\u00f3n institucional y nuevas oportunidades de crecimiento.\n\nCon el lanzamiento de ENTEL Empresas, ENTEL PyME y ENTEL Gobierno, ENTEL consolida una propuesta orientada a acompa\u00f1ar la evoluci\u00f3n digital del pa\u00eds, poniendo a disposici\u00f3n de Bolivia infraestructura, conocimiento y tecnolog\u00eda para fortalecer su capacidad productiva y afrontar los desaf\u00edos de una econom\u00eda cada vez m\u00e1s digital.", "dateTimeNews": "2026-05-29T06:47:00+00:00", "dateTimeReceived": "2026-05-29T14:47:37+00:00", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/05/entel.webp", "position": 20, "similar": [{"source": "RTP Bolivia", "url": "https://rtpbolivia.com.bo/economia/tres-nuevas-marcas-de-entel-abren-una-nueva-etapa-para-el-desarrollo-digital-de-bolivia/"}], "source": "El Mundo", "title": "ENTEL lanza tres nuevas marcas para el desarrollo digital de Bolivia", "url": "https://elmundo.com.bo/entel-lanza-tres-nuevas-marcas-para-el-desarrollo-digital-de-bolivia/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "El abogado Abel Loma inform\u00f3 este jueves que el Ministerio P\u00fablico emiti\u00f3 la acusaci\u00f3n formal contra el exejecutivo de la Central Obrera Boliviana (COB), Juan Carlos Huuarachi, para ir a juicio oral por el caso denominado \u201ccoimas\u201d en el Ministerio de Medio Ambiente y Agua.\n\n\u201cHemos tenido conocimiento de que en las \u00faltimas horas el fiscal del caso ha emitido una resoluci\u00f3n de acusaci\u00f3n formal en contra del se\u00f1or Juan Carlos Huarachi por enriquecimiento il\u00edcito y otros delitos\u201d, asegur\u00f3 Loma.\n\nCon la emisi\u00f3n de esta determinaci\u00f3n, se aguardar\u00e1 el inicio del juicio oral contra el dirigente. El abogado indic\u00f3 que de establecerse la responsabilidad del acusado, este podr\u00eda enfrentar una pena privativa de libertad de 10 a\u00f1os.\n\nEn el juicio, \u201cel Ministerio P\u00fablico fundamentar\u00e1 su acusaci\u00f3n, seguramente tambi\u00e9n vamos a ser convocados, vamos a estar presente para ratificar nuestra denuncia\u201d, mencion\u00f3.\n\nHuarachi fue denunciado en el caso \u201ccoimas\u201d debido a que habr\u00eda recibido al menos Bs 40.000 en sus cuentas personales en el Ministerio de Medio Ambiente y Agua durante el anterior Gobierno.", "dateTimeNews": "2026-05-29T03:37:06+00:00", "dateTimeReceived": "2026-05-29T17:29:04+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/huarachi_cob1.png", "position": 21, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/29/ministerio-publico-acusa-formalmente-a-huarachi-para-inicio-de-juicio-oral/"}], "source": "Ox\u00edgeno", "title": "Caso coimas: Presentan acusaci\u00f3n formal contra Juan Carlos Huarachi, seg\u00fan abogado", "url": "https://oxigeno.bo/caso-coimas-presentan-acusacion-formal-contra-juan-carlos-huarachi-segun-abogado/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "En el vig\u00e9simo octavo de d\u00eda de bloqueos y movilizaciones, el presidente del Estado, Rodrigo Paz, asegur\u00f3 este jueves que la ciudad de El Alto ya viva una relativa \u201cnormalidad\u201d y se\u00f1al\u00f3 que ahora el trabajo del Gobierno se enfocar\u00e1 en buscar consensos en todas las comunidades del departamento de La Paz.\n\nEl Jefe de Estado afirm\u00f3 que en El Alto solo hay \u201calgunos puntos\u201d formados por grupos que buscan \u201cfraccionar la relaci\u00f3n con el Gobierno\u201d, pero asegur\u00f3 que la mayor parte de esa ciudad entendi\u00f3 que las acusaciones contra el Ejecutivo, referidas a sus presuntas intenciones de tener una pol\u00edtica de privatizaci\u00f3n, son mentiras.\n\n\u201cLa ciudad de El Alto ya est\u00e1 en una normalidad relativa, salvo en algunos puntos que quieren incidir para friccionar la relaci\u00f3n con el Gobierno. Han entendido que eso que \u00edbamos a privatizar la salud, la educaci\u00f3n, las empresas estatales\u2026 todas las mentiras han quedado desmentidas, El Alto ya lo entendi\u00f3\u201d, asever\u00f3 entrevistado por TN24 de Argentina.\n\nAfirm\u00f3 que ahora toca que el Gobierno vaya \u201ccaminando comunidad por comunidad para que vuelva la normalidad\u201d y se abastezca al departamento de medicinas, alimentos, combustibles\u201d.\n\nEn ese sentido, Paz insisti\u00f3 que, en el pa\u00eds hay un clima de tranquilidad, exceptuando el departamento de La Paz, departamento que concentra la mayor parte de los bloqueos.\n\nEntretanto, este martes fracas\u00f3 el intento de di\u00e1logo para pacificar el pa\u00eds, debido a que los sectores m\u00e1s radicales que piden la renuncia de Paz condicionaron el encuentro a que se levante la orden de aprehensi\u00f3n que hay en contra del secretario general de la Central Obrera Boliviana (COB), Mario Argollo.\n\nEste jueves se cumplen 28 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-29T01:53:25+00:00", "dateTimeReceived": "2026-05-29T17:29:04+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/paz_presidente9.png", "position": 22, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/lara-sectores-movilizados-no-fueron-al-dialogo-piden-levantar-las-ordenes-de-aprehension-contra-sus-dirigentes/"}], "source": "Ox\u00edgeno", "title": "Paz: La ciudad de El Alto ya est\u00e1 en una normalidad relativa, ahora tenemos que ir comunidad por comunicad", "url": "https://oxigeno.bo/paz-la-ciudad-de-el-alto-ya-esta-en-una-normalidad-relativa-ahora-tenemos-que-ir-comunidad-por-comunicad/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "La Empresa de Luz y Fuerza Cochabamba S.A. (ELFEC) inform\u00f3 que el corte de energ\u00eda el\u00e9ctrica en sectores del Tr\u00f3pico de Cochabamba, registrado la noche del mi\u00e9rcoles, fue por la ca\u00edda de postes de alta tensi\u00f3n.\n\nEl hecho ocurri\u00f3 cerca de las 19:52, afectando el sistema el\u00e9ctrico y ocasionando ausencia de tensi\u00f3n y p\u00e9rdida de carga en las subestaciones Villa Tunari y Chimor\u00e9, se\u00f1ala un comunicado oficial de la entidad estatal.\n\n\u201cDe acuerdo con la informaci\u00f3n preliminar, el evento fue provocado por la ca\u00edda de una estructura (postes de alta tensi\u00f3n); sin embargo, las causas y circunstancias de este hecho se mantienen en investigaci\u00f3n y an\u00e1lisis t\u00e9cnico\u201d, se lee en parte del documento.\n\nLuego de conocerse el corte, seg\u00fan el texto, de manera inmediata, personal t\u00e9cnico y operativo de ELFEC realiz\u00f3 los trabajos correspondientes para la reposici\u00f3n del servicio, logrando el retorno gradual de la energ\u00eda a partir de las 22:00.\n\nLa empresa lament\u00f3 los inconvenientes ocasionados a los habitantes del Tr\u00f3pico y reafirm\u00f3 su compromiso de continuar trabajando para garantizar un servicio seguro y confiable a la poblaci\u00f3n.", "dateTimeNews": "2026-05-29T00:27:32+00:00", "dateTimeReceived": "2026-05-29T17:29:04+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/tropico_apagon.jpg", "position": 23, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/evo-dice-tener-companeros-dentro-del-gobierno-y-que-apagon-en-el-tropico-fue-un-ensayo-para-intervenir-lauca-n/"}], "source": "Ox\u00edgeno", "title": "Elfec afirma que ca\u00edda de postes dej\u00f3 sin luz a sectores del Tr\u00f3pico de Cochabamba", "url": "https://oxigeno.bo/elfec-afirma-que-caida-de-postes-dejo-sin-luz-a-sectores-del-tropico-de-cochabamba/"}, {"actor": [], "authors": ["La Patria"], "body": "La Felcn descubre un sustancia, que presuntamente es marihuana en la c\u00e1rcel de Palmasola, involucrando a Luis Marcelo Arce Mosqueira.\n\nFicha informativa El 28 de mayo de 2026, la Felcn hall\u00f3 marihuana en la celda de Luis Marcelo Arce Mosqueira en la c\u00e1rcel de Palmasola durante un control rutinario. Este descubrimiento llev\u00f3 a una reuni\u00f3n de emergencia para evaluar posibles acciones legales. Toca para ver el contexto completo Contexto: Luis Marcelo Arce Mosqueira fue aprehendido el 21 de marzo de 2026 en Equipetrol por agentes de la Felcc. Desde su traslado a Palmasola, ha sido objeto de investigaciones por movimientos econ\u00f3micos sospechosos, supervisados por la UIF. Marco Corrales, gobernador del recinto penitenciario, confirm\u00f3 que la sustancia encontrada tiene caracter\u00edsticas de marihuana para consumo. La intervenci\u00f3n fue parte de controles rutinarios planificados por unidades de inteligencia. Por qu\u00e9 importa: Las autoridades del penal convocaron una reuni\u00f3n de emergencia para evaluar el hallazgo y determinar si se abrir\u00e1 una nueva causa penal contra Arce Mosqueira y otros involucrados. Datos clave: Fecha: 28 de mayo de 2026\n\n28 de mayo de 2026 Lugar: C\u00e1rcel de Palmasola, Bolivia\n\nC\u00e1rcel de Palmasola, Bolivia Pabell\u00f3n: PC-6\n\nPC-6 D\u00edas de detenci\u00f3n preventiva: 140 d\u00edas\n\n140 d\u00edas Bienes inmuebles: 18\n\n18 Veh\u00edculos: 20\n\n20 Transacciones bancarias sospechosas (2022-2024): Bs 300.000 y Bs 500.000 IngresarDesbloquear acceso completo\n\nHallan sustancias en la celda del hijo de Luis Arce \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nOperativo en Palmasola y hallazgo de marihuana\n\nUn operativo de control rutinario y de inteligencia se realiz\u00f3 sorpresivamente el jueves, 28 de mayo de 2026, por la Fuerza Especial de Lucha Contra el Narcotr\u00e1fico (Felcn) en el centro penitenciario de Palmasola. Este operativo deriv\u00f3 en el hallazgo de presuntas sustancias controladas en la celda ocupada por Luis Marcelo Arce Mosqueira, hijo del expresidente de Bolivia, Luis Arce.\n\nContexto del caso\n\nArce Mosqueira se encuentra cumpliendo una medida cautelar de detenci\u00f3n preventiva en este establecimiento desde el pasado mes de marzo, tras ser imputado por la Fiscal\u00eda dentro de un proceso investigativo por la presunta comisi\u00f3n del delito de legitimaci\u00f3n de ganancias il\u00edcitas.\n\nLa intervenci\u00f3n se registr\u00f3 formalmente poco antes de las 18:00 horas, seg\u00fan confirm\u00f3 el gobernador del recinto carcelario, Marco Corrales, en declaraciones a Unitel.\n\nDetalles del hallazgo\n\nLa autoridad penitenciaria precis\u00f3 que los elementos detectados corresponden a sustancias controladas que presentan caracter\u00edsticas de marihuana, las cuales est\u00e1n destinadas presuntamente al consumo.\n\nAnte este hallazgo, los agentes especializados de la Felcn, apoyados por unidades caninas adiestradas, procedieron al secuestro formal de la sustancia con el fin de someterla a los an\u00e1lisis de laboratorio y peritajes cient\u00edficos que estipula la norma, los cuales determinar\u00e1n con exactitud el tipo y el peso neto del material incautado.\n\nInvestigaciones y antecedentes financieros\n\nDe acuerdo con los datos t\u00e9cnicos del informe policial al que accedi\u00f3 el diario El Deber, la acci\u00f3n directa se concentr\u00f3 espec\u00edficamente en el pabell\u00f3n PC-6 de Palmasola, un sector asignado a internos que enfrentan procesos por delitos econ\u00f3micos, financieros o de corrupci\u00f3n.\n\nEn dicho pabell\u00f3n, Arce Mosqueira comparte los espacios de reclusi\u00f3n con otros investigados, entre los que se menciona al exjuez Hebert Zeballos, implicado formalmente en la causa judicial denominada \u201ccaso maletas\u201d.\n\nComo consecuencia inmediata del descubrimiento de la presunta droga, los mandos policiales y las autoridades administrativas del penal instalaron una reuni\u00f3n de emergencia para evaluar la situaci\u00f3n y coordinar las acciones institucionales a seguir.\n\nLa detenci\u00f3n preventiva se estableci\u00f3 por un periodo de 140 d\u00edas, solicitado por el Ministerio P\u00fablico debido a una investigaci\u00f3n financiera que revel\u00f3 un origen desproporcionado e injustificado de sus activos econ\u00f3micos.\n\nPatrimonio y transacciones inusuales\n\nLa Fiscal\u00eda basa su imputaci\u00f3n en informes t\u00e9cnicos elaborados por la Unidad de Investigaciones Financieras (UIF).\n\nEstas auditor\u00edas identificaron que Arce Mosqueira acumul\u00f3 un patrimonio compuesto por al menos 18 bienes inmuebles y un parque automotor con 20 veh\u00edculos registrados a su nombre. Adem\u00e1s, entre 2022 y 2024, registr\u00f3 dos transacciones bancarias catalogadas como \u2018inusuales\u2019, superando Bs 300.000 y Bs 500.000 respectivamente.\n\nReacciones y pr\u00f3ximos pasos\n\nHasta el momento, no se han registrado declaraciones ni posturas de los abogados defensores o familiares respecto a la presunta marihuana hallada.\n\nSe espera que en las pr\u00f3ximas horas la Direcci\u00f3n Departamental de la Polic\u00eda de Santa Cruz brinde una conferencia de prensa con el informe t\u00e9cnico y el pesaje definitivo sobre la sustancia incautada.", "dateTimeNews": "2026-05-29T00:13:58+00:00", "dateTimeReceived": "2026-05-29T14:47:43+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a18d58bbd3fb.jpg", "position": 24, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/28/hallan-droga-en-celda-de-hijo-del-expresidente-luis-arce-en-palmasola/"}], "source": "La Patria", "title": "Hallan sustancias en la celda del hijo de Luis Arce - La Patria 3.0", "url": "https://lapatria.bo/actualidad/hallan-sustancias-en-la-celda-del-hijo-de-luis-arce/"}];
    const riskCategories = [
      {
        status: "Bajo",
        icon: "B",
        iconColor: "text-blue-500",
        badge: "bg-blue-50 text-blue-700 ring-blue-600/20 dark:bg-blue-400/10 dark:text-blue-400 dark:ring-blue-400/20",
        progressColor: "rgb(59 130 246)",
        orders: []
      },
      {
        status: "Medio",
        icon: "M",
        iconColor: "text-emerald-500",
        badge: "bg-emerald-50 text-emerald-700 ring-emerald-600/20 dark:bg-emerald-400/10 dark:text-emerald-400 dark:ring-emerald-400/20",
        progressColor: "rgb(16 185 129)",
        orders: []
      },
      {
        status: "Alta",
        icon: "A",
        iconColor: "text-red-500",
        badge: "bg-red-50 text-red-700 ring-red-600/20 dark:bg-red-400/10 dark:text-red-400 dark:ring-red-400/20",
        progressColor: "rgb(239 68 68)",
        orders: []
      }
    ];

    const categories = [
      {
        status: "Todos",
        icon: "T",
        iconColor: "text-gray-600",
        badge: "bg-gray-100 text-gray-700 ring-gray-500/20 dark:bg-gray-700/30 dark:text-gray-200 dark:ring-gray-500/30",
        progressColor: "rgb(107 114 128)",
        orders: []
      },
      ...riskCategories
    ];

    function buildOrderFromCluster(cluster) {
      const similar = Array.isArray(cluster.similar) ? cluster.similar : [];
      const rawActors = Array.isArray(cluster.actor)
        ? cluster.actor
        : Array.isArray(cluster.actors)
          ? cluster.actors
          : (cluster.actor || cluster.actors ? [cluster.actor || cluster.actors] : []);
      const actors = rawActors
        .map((item) => String(item || "").trim())
        .filter((item) => item.length > 0);
      const rawAuthor = Array.isArray(cluster.authors)
        ? (cluster.authors.find((item) => String(item || "").trim()) || "")
        : (cluster.author || cluster.authors || "");
      const author = String(rawAuthor || "").trim();
      const actual = Math.min(similar.length + 1, 9);
      const total = Math.min(actual + 2, 10);
      const dateTimeNews = String(
        cluster.dateTimeNews
        || buildLegacyDateTime(cluster.date, cluster.time)
        || ""
      ).trim();
      const dateTimeReceived = String(
        cluster.dateTimeReceived
        || cluster.dateTimeRecieved
        || ""
      ).trim();

      return {
        item: cluster.title || "Noticia sin titulo",
        company: cluster.source || "Fuente desconocida",
        author: author,
        pic: cluster.pic || cluster.image_url || "",
        fulfillmentActual: actual,
        fulfillmentTotal: total,
        dateTimeNews: dateTimeNews,
        dateTimeReceived: dateTimeReceived,
        url: cluster.url || "#",
        body: cluster.body || "",
        actors: actors,
        similar: similar
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function safeUrl(value) {
      const url = String(value || "").trim();
      if (url.startsWith("http://") || url.startsWith("https://")) {
        return url;
      }
      return "#";
    }

    function formatHourMinute(value) {
      const raw = String(value || "").trim();
      if (!raw) {
        return "";
      }

      const match = raw.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
      if (!match) {
        return "";
      }

      const hours = match[1].padStart(2, "0");
      const minutes = match[2];
      return `${hours}:${minutes}`;
    }

    function buildLegacyDateTime(dateValue, timeValue) {
      const dateText = String(dateValue || "").trim();
      if (!dateText) {
        return "";
      }

      const hourText = formatHourMinute(timeValue);
      if (!hourText) {
        return `${dateText}T00:00:00`;
      }

      return `${dateText}T${hourText}:00`;
    }

    function parseDateTimeParts(value) {
      const raw = String(value || "").trim();
      if (!raw) {
        return { date: "", time: "" };
      }

      const dateMatch = raw.match(/(\d{4})-(\d{2})-(\d{2})/);
      const timeText = formatHourMinute(raw);
      if (!dateMatch) {
        return { date: "", time: timeText };
      }

      const year = dateMatch[1].slice(2);
      const month = dateMatch[2];
      const day = dateMatch[3];
      return {
        date: `${day}/${month}/${year}`,
        time: timeText
      };
    }

    function buildDateTimeDisplayString(dateTimeNews, dateTimeReceived) {
      const published = parseDateTimeParts(dateTimeNews);
      const received = parseDateTimeParts(dateTimeReceived);
      const parts = [];

      const sameDate = published.date && received.date && published.date === received.date;
      const sameTime = published.time && received.time && published.time === received.time;

      if (sameDate) {
        parts.push(`Fecha: ${published.date}`);
        if (sameTime) {
          parts.push(`Hora: ${published.time}`);
          return parts.join(" | ");
        }

        if (published.time) {
          parts.push(`Publicado: ${published.time}`);
        }
        if (received.time) {
          parts.push(`Recibido: ${received.time}`);
        }
        return parts.join(" | ");
      }

      if (published.date || published.time) {
        const publishedParts = [published.date, published.time].filter((part) => part);
        parts.push(`Publicado: ${publishedParts.join(" ")}`);
      }

      if (received.date || received.time) {
        const receivedParts = [received.date, received.time].filter((part) => part);
        parts.push(`Recibido: ${receivedParts.join(" ")}`);
      }

      if (parts.length === 0) {
        parts.push("Fecha:");
      }

      return parts.join(" | ");
    }

    rawClusters.forEach((cluster, index) => {
      const order = buildOrderFromCluster(cluster);
      const lane = riskCategories[index % riskCategories.length];

      order.riskStatus = lane.status;
      order.riskBadge = lane.badge;
      order.riskColor = lane.progressColor;

      categories[0].orders.push(order);
      lane.orders.push(order);
    });

    let activeTab = 0;

    function tabButton(category, index) {
      const selected = index === activeTab;
      return `
        <button
          type="button"
          data-index="${index}"
          class="inline-flex items-center gap-2 rounded-md border px-3 py-2 text-sm font-medium transition ${selected ? "border-gray-300 bg-white text-gray-900 dark:border-gray-600 dark:bg-gray-950 dark:text-gray-100" : "border-transparent text-gray-600 hover:border-gray-300 dark:text-gray-400 dark:hover:border-gray-700"}"
        >
          <span class="${category.iconColor} hidden sm:inline">${category.icon}</span>
          <span>${category.status}</span>
          <span class="rounded bg-gray-100 px-2 py-0.5 text-xs font-semibold tabular-nums ring-1 ring-inset ring-gray-200 dark:bg-gray-800 dark:ring-gray-700">${category.orders.length}</span>
        </button>
      `;
    }

    function renderActorsList(actors) {
      if (!Array.isArray(actors) || actors.length === 0) {
        return "";
      }

      const actorTags = actors
        .filter((item) => String(item || "").trim())
        .map((item) => `
          <span class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 dark:border-gray-700 dark:text-gray-300">${escapeHtml(item)}</span>
        `)
        .join("");

      if (!actorTags) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Actores</p>
          ${actorTags}
        </div>
      `;
    }

    function renderSimilarCoverage(similar) {
      if (!Array.isArray(similar) || similar.length === 0) {
        return "";
      }

      const links = similar
        .filter((item) => item && item.source && item.url)
        .map((item) => `
          <a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer" class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 hover:border-blue-400 hover:text-blue-700 dark:border-gray-700 dark:text-gray-300 dark:hover:border-blue-500 dark:hover:text-blue-400">${escapeHtml(item.source)}</a>
        `)
        .join("");

      if (!links) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Cobertura similar</p>
          ${links}
        </div>
      `;
    }

    function orderCard(order, statusClass, statusText, progressColor) {
      const progress = Math.round((order.fulfillmentActual / order.fulfillmentTotal) * 100);
      const safeBodyText = order.body ? `${order.body.slice(0, 220)}${order.body.length > 220 ? "..." : ""}` : "No hay resumen disponible.";
      const safeTitle = escapeHtml(order.item);
      const safeSource = escapeHtml(order.company);
      const safeAuthor = escapeHtml(order.author || "");
      const subtitle = safeAuthor ? `${safeSource} | ${safeAuthor}` : safeSource;
      const safeBody = escapeHtml(safeBodyText);
      const articleUrl = safeUrl(order.url);
      const pictureUrl = safeUrl(order.pic);
      const dateTimeText = buildDateTimeDisplayString(order.dateTimeNews, order.dateTimeReceived);
      const imageBlock = pictureUrl === "#"
        ? ""
        : `<a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="block h-20 w-28 shrink-0 overflow-hidden rounded-md border border-gray-200 bg-gray-100 dark:border-gray-700 dark:bg-gray-800"><img src="${pictureUrl}" alt="Imagen de noticia" class="h-full w-full object-cover" loading="lazy"></a>`;

      return `
        <article class="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900 sm:p-5">
          <div class="flex items-start gap-3">
            ${imageBlock}

            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <h4 class="min-w-0 flex-1 truncate text-sm font-medium text-gray-900 dark:text-gray-100">
                  <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-700 dark:hover:text-blue-400">${safeTitle}</a>
                </h4>
                <span class="inline-flex items-center whitespace-nowrap rounded px-1.5 py-0.5 text-xs font-medium ring-1 ring-inset ${statusClass}">${statusText}</span>
              </div>

              <div class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                <p>${subtitle}</p>
              </div>

              <p class="mt-3 text-sm leading-6 text-gray-700 dark:text-gray-300">${safeBody}</p>

              ${renderActorsList(order.actors)}

              ${renderSimilarCoverage(order.similar)}
            </div>
          </div>

          <hr class="my-4 border-gray-200 dark:border-gray-700">

          <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-2">
              <span class="progress-ring" style="background: conic-gradient(${progressColor} ${progress}%, rgb(209 213 219) ${progress}% 100%); --ring-inner: rgb(255 255 255);"></span>
              <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Riesgo</p>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(dateTimeText)}</p>
          </div>
        </article>
      `;
    }

    function emptyPanel() {
      return `
        <article class="rounded-lg border border-dashed border-gray-300 bg-gray-50 p-6 text-sm text-gray-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-400">
          No hay noticias disponibles en esta seccion.
        </article>
      `;
    }

    function render() {
      const list = document.getElementById("tab-list");
      const panel = document.getElementById("panel");
      const current = categories[activeTab];
      const showAll = activeTab === 0;

      list.innerHTML = categories.map(tabButton).join("");
      panel.innerHTML = current.orders.length
        ? current.orders
            .map((order) => {
              const badge = showAll ? order.riskBadge : current.badge;
              const status = showAll ? order.riskStatus : current.status;
              const color = showAll ? order.riskColor : current.progressColor;
              return orderCard(order, badge, status, color);
            })
            .join("")
        : emptyPanel();

      list.querySelectorAll("button[data-index]").forEach((button) => {
        button.addEventListener("click", () => {
          activeTab = Number(button.getAttribute("data-index"));
          render();
        });
      });
    }

    render();
  </script>
