 contra la Vida para realizar todos los actos investigativos necesarios que permitan esclarecer este lamentable hecho y determinar las responsabilidades conforme a ley\u201d, expres\u00f3 Mogro.\n\nLa fiscal de materia asignada al caso, Gabriela Soruco Llampa, inform\u00f3 que el hecho ocurri\u00f3 el 23 de mayo en la ciudad de Tarija, cuando la v\u00edctima fue brutalmente agredida por su concubino. Recibi\u00f3 golpes en el rostro, cabeza y brazos. Esas lesiones le provocaron graves da\u00f1os en su humanidad.\n\nLa mujer fue trasladada al Hospital Regional San Juan de Dios, donde permaneci\u00f3 internada en terapia intensiva; sin embargo, falleci\u00f3 el 26 de mayo a horas 23:00, aproximadamente, debido a un traumatismo craneoencef\u00e1lico, conforme al informe emitido por el Instituto de Investigaciones Forenses (IDIF).\n\nAsimismo, el Ministerio P\u00fablico inici\u00f3 la investigaci\u00f3n de oficio desde el momento en que se tom\u00f3 conocimiento del hecho, disponiendo la colecci\u00f3n de elementos de convicci\u00f3n, entrevistas testificales, registro del lugar y otros actos investigativos orientados a esclarecer plenamente el caso y determinar la responsabilidad penal del presunto autor.", "dateTimeNews": "2026-05-28T14:40:43+00:00", "dateTimeReceived": "2026-05-28T17:37:26+00:00", "pic": "https://sumandovoces.com.bo/wp-content/uploads/2026/05/WhatsApp-Image-2026-05-28-at-09.31.11.jpeg", "position": 20, "similar": [{"source": "El Mundo", "url": "https://elmundo.com.bo/investigan-feminicidio-de-una-mujer-de-37-anos-en-tarija/"}, {"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/investigan-feminicidio-en-tarija-tras-muerte-de-mujer-de-37-anos/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/tarija-suma-su-segundo-feminicidio-y-bolivia-ya-acumula-35-casos-en-lo-que-va-del-2026/"}], "source": "Sumando Voces", "title": "Fiscal\u00eda investiga feminicidio de una mujer de 37 a\u00f1os en Tarija; el principal sospechoso es el concubino de la v\u00edctima -", "url": "https://sumandovoces.com.bo/fiscalia-investiga-feminicidio-de-una-mujer-de-37-anos-en-tarija-el-principal-sospechoso-es-el-concubino-de-la-victima/"}, {"actor": [], "authors": ["C\u00e9sar Del Castillo"], "body": "La nueva Ley 1733 de alivio tributario ya comenz\u00f3 a generar movimiento entre contribuyentes, empresas y profesionales independientes que arrastraban deudas con el fisco desde hace a\u00f1os. La norma, promulgada el 27 de mayo por el presidente Rodrigo Paz Pereira, incorpora un esquema de condonaci\u00f3n y regularizaci\u00f3n tributaria que, seg\u00fan el Gobierno, busca \u201creactivar la econom\u00eda\u201d liberando recursos que hoy estaban inmovilizados en multas, intereses y procesos de cobranza.\n\nDurante una entrevista en el programa Influyentes de EL DEBER, el director ejecutivo de la Autoridad de Impugnaci\u00f3n Tributaria, Rodrigo Palazuelos, asegur\u00f3 que se trata de una medida \u201cic\u00f3nica\u201d porque \u201cnunca antes el Estado boliviano ha tenido alg\u00fan tipo de condonaci\u00f3n de esta magnitud\u201d.\n\nA continuaci\u00f3n, siete preguntas para entender el alcance y funcionamiento de la norma.\n\n1. \u00bfQui\u00e9nes se benefician con la ley?\n\nLa ley beneficia a personas naturales y empresas que tengan deudas tributarias generadas hasta el 31 de diciembre de 2017 y cuyo monto total adeudado no supere los Bs 10 millones.\n\nSeg\u00fan explic\u00f3 Palazuelos, la medida alcanzar\u00e1 principalmente a peque\u00f1os y medianos actores econ\u00f3micos que arrastraban obligaciones tributarias desde hace a\u00f1os. \u201cLa gran ventaja de esta norma es que apoya a los ciudadanos para que, en vez de pagarle al Estado este dinero, puedan dedicarlo o invertirlo en su actividad econ\u00f3mica pensando en una reactivaci\u00f3n importante del Estado hacia el futuro\u201d, afirm\u00f3.\n\nLa autoridad precis\u00f3 que los beneficiarios potenciales incluyen \u201cemprendedores, peque\u00f1os empresarios, medianos empresarios, artesanos, transportistas, comerciantes y profesionales independientes\u201d.\n\n2. \u00bfLa condonaci\u00f3n es total o parcial?\n\nDepende del tipo y tama\u00f1o de la deuda.\n\nPara obligaciones tributarias anteriores al 31 de diciembre de 2017 y menores a Bs 10 millones, la condonaci\u00f3n es total y autom\u00e1tica. \u201cEl ciudadano o el contribuyente no tiene que pagar ni un solo boliviano al fisco y esta extinci\u00f3n es de car\u00e1cter autom\u00e1tico\u201d, sostuvo Palazuelos.\n\nLa autoridad explic\u00f3 que la medida alcanza incluso a multas peque\u00f1as acumuladas durante a\u00f1os. \u201cSi hoy en d\u00eda hay una persona que tiene alguna multa de impuestos por 6 mil, 15 mil, 20 mil o 50 mil bolivianos y esa deuda emerge de un periodo fiscal anterior al 31 de diciembre del 2017, por efecto de la ley ha quedado extinta esa obligaci\u00f3n\u201d, detall\u00f3.\n\nSin embargo, para deudas superiores a Bs 10 millones o posteriores a 2017, la norma contempla un esquema de regularizaci\u00f3n parcial.\n\n3. \u00bfEs necesario realizar tr\u00e1mites en Impuestos Nacionales?\n\nLa extinci\u00f3n de las deudas menores a Bs 10 millones es autom\u00e1tica, pero eso no significa que todos los casos quedar\u00e1n resueltos sin tr\u00e1mites adicionales.\n\nLos contribuyentes podr\u00e1n acudir a Impuestos Nacionales o a la Aduana Nacional para solicitar certificados de no adeudo tributario. Adem\u00e1s, quienes tengan procesos administrativos, judiciales o medidas de cobranza deber\u00e1n completar procedimientos espec\u00edficos.\n\n\u201cEsta condonaci\u00f3n alcanza a todos aquellos casos que est\u00e1n hoy en d\u00eda en impugnaciones en la v\u00eda administrativa, en proceso de fiscalizaci\u00f3n, en proceso de ejecuci\u00f3n tributaria o en proceso de impugnaci\u00f3n por la v\u00eda judicial\u201d, explic\u00f3 Palazuelos.\n\nEn esos casos, la ley exige el desistimiento formal de los procesos para consolidar el beneficio.\n\n4. \u00bfQu\u00e9 ocurre con las personas o empresas que tienen deudas mayores a Bs 10 millones?\n\nLa ley establece una segunda modalidad basada en la regularizaci\u00f3n tributaria.\n\nEn esos casos, el contribuyente podr\u00e1 pagar solamente el tributo omitido \u2014es decir, el capital adeudado\u2014 junto con una parte del mantenimiento de valor. La norma elimina intereses, multas y otras sanciones accesorias.\n\n\u201cRecordemos que la deuda tributaria est\u00e1 compuesta por tributo omitido, intereses, actualizaciones y multas. Entonces, en este caso, el contribuyente va a poder pagar solo el tributo omitido\u201d, se\u00f1al\u00f3 Palazuelos.\n\nLa autoridad explic\u00f3 adem\u00e1s que quienes realicen un pago inmediato cancelar\u00e1n el capital m\u00e1s el 50% del mantenimiento de valor. Tambi\u00e9n podr\u00e1n acogerse a planes de pago de hasta 36 cuotas.\n\n5. \u00bfLa ley rige igual para tributos nacionales y aduaneros?\n\nS\u00ed. La norma alcanza tanto a obligaciones administradas por Impuestos Nacionales como por la Aduana Nacional.\n\nDe hecho, parte de la reglamentaci\u00f3n pendiente est\u00e1 relacionada con procedimientos administrativos vinculados a ambas instituciones, especialmente en casos de retenciones bancarias, embargos o levantamiento de grav\u00e1menes.\n\n6. \u00bfExiste un tratamiento especial para deudas posteriores al 31 de diciembre de 2017?\n\nS\u00ed. Las obligaciones tributarias generadas entre el 1 de enero de 2018 y el 31 de diciembre de 2025 no quedan extinguidas autom\u00e1ticamente, pero s\u00ed pueden acogerse a programas de regularizaci\u00f3n.\n\nEn esos casos, el contribuyente deber\u00e1 pagar el capital adeudado y parte del mantenimiento de valor, mientras que intereses y sanciones ser\u00e1n condonados parcialmente seg\u00fan el tipo de pago elegido.\n\nPalazuelos explic\u00f3 que esta parte de la ley busca facilitar que empresas y personas regularicen su situaci\u00f3n tributaria sin enfrentar cargas financieras acumuladas durante a\u00f1os.\n\n7. \u00bfQu\u00e9 impacto econ\u00f3mico espera el Gobierno?\n\nEl Ejecutivo sostiene que la medida busca inyectar liquidez y movimiento econ\u00f3mico en un contexto de desaceleraci\u00f3n y dificultades financieras.\n\n\u201cNosotros como Estado estamos en una situaci\u00f3n econ\u00f3mica cr\u00edtica y lo que se necesita es una reactivaci\u00f3n econ\u00f3mica\u201d, afirm\u00f3 Palazuelos.\n\nSeg\u00fan la autoridad, el objetivo es que los contribuyentes utilicen esos recursos en inversi\u00f3n y actividad econ\u00f3mica, en lugar de destinarlos al pago de deudas acumuladas con el Estado.\n\n\u201cLas peque\u00f1as y medianas empresas, los artesanos, los transportistas y los profesionales independientes van a tener la posibilidad de destinar esos recursos en inversi\u00f3n directa en su actividad econ\u00f3mica\u201d, sostuvo.\n\nPalazuelos remarc\u00f3 adem\u00e1s que la medida no resolver\u00e1 por s\u00ed sola la crisis econ\u00f3mica, pero s\u00ed puede convertirse en un mecanismo de alivio y reactivaci\u00f3n parcial. \u201cUna sola medida econ\u00f3mica como esta no es la soluci\u00f3n, pero es parte de la soluci\u00f3n integral que est\u00e1 pensando el Estado para mejorar la econom\u00eda de todos los bolivianos\u201d, afirm\u00f3.", "dateTimeNews": "2026-05-28T14:31:16+00:00", "dateTimeReceived": "", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779978283356.jpeg?\u0026cw=1200\u0026ch=630", "position": 21, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/economia-y-empresa/2026/05/28/condonacion-de-deudas-y-facilidades-de-pago-que-la-ley-de-alivio-tributario/"}], "source": "El Deber", "title": "Rige el alivio tributario: 7 claves para entender c\u00f3mo funciona la ley", "url": "https://eldeber.com.bo/economia/rige-alivio-tributario-siete-claves-entender-funciona-ley_1779978676"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nEste jueves, la Iglesia Cat\u00f3lica encabezar\u00e1 un nuevo intento de di\u00e1logo entre el Gobierno y los sectores movilizados, luego de que los principales dirigentes de la Central Obrera Boliviana (COB) y de la Federaci\u00f3n T\u00fapac Katari no asistieran a la convocatoria realizada por el presidente Rodrigo Paz el mi\u00e9rcoles.\n\nLa reuni\u00f3n est\u00e1 prevista para esta jornada en instalaciones de la Conferencia Episcopal Boliviana (CEB), en la ciudad de La Paz, con la participaci\u00f3n de representantes del Gobierno, la Defensor\u00eda del Pueblo, la Asamblea Permanente de Derechos Humanos y otros actores que buscan acercar posiciones tras 28 d\u00edas de conflicto social.\n\nEl mi\u00e9rcoles, durante el primer acercamiento impulsado desde la Vicepresidencia, el Gobierno no logr\u00f3 concretar la presencia de Mario Argollo, ejecutivo de la COB, ni de Vicente Salazar, ejecutivo de la T\u00fapac Katari y uno de los principales impulsores de los bloqueos en carreteras.\n\nLea tambi\u00e9n: Doria Medina ve en el di\u00e1logo una salida a la crisis: \u2018Hoy es un d\u00eda importante para Bolivia\u2019\n\nTras ese encuentro, el ministro de la Presidencia, Jos\u00e9 Luis Lupo, inform\u00f3 que la Iglesia Cat\u00f3lica, junto con organismos defensores de derechos humanos y representantes internacionales, asumi\u00f3 la tarea de promover una nueva mesa de negociaci\u00f3n con todos los sectores involucrados.\n\nHoras antes, el presidente Rodrigo Paz insisti\u00f3 p\u00fablicamente en su convocatoria a los dos dirigentes movilizados. Incluso, envi\u00f3 una carta notariada con emisario a Salazar.\n\n\u201cAl se\u00f1or Argollo, que venga a hablar\u201d, afirm\u00f3 el mandatario durante el Consejo Econ\u00f3mico y Social.\n\nLa tensi\u00f3n pol\u00edtica y social persiste en el pa\u00eds mientras los bloqueos mantienen complicaciones en el abastecimiento de combustibles, alimentos y productos b\u00e1sicos, principalmente en La Paz y El Alto, donde los precios contin\u00faan en ascenso y el transporte p\u00fablico opera de manera irregular.", "dateTimeNews": "2026-05-28T14:03:04+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/700325517-1489047543262385-691104851_101-15457774_20260518175043.webp", "position": 22, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/28/bolivia-amanece-con-64-puntos-de-bloqueo-en-medio-de-nuevos-intentos-de-dialogo/"}], "source": "La Raz\u00f3n", "title": "Ni la COB ni la T\u00fapac cedieron al llamado de Paz; la Iglesia lidera nuevo intento de di\u00e1logo", "url": "https://larazon.bo/nacional/2026/05/28/ni-la-cob-ni-la-tupac-cedieron-al-llamado-de-paz-la-iglesia-lidera-nuevo-intento-de-dialogo/"}, {"actor": [], "authors": ["Israel Munguia"], "body": "El presidente Rodrigo Paz y autoridades y representantes c\u00edvicos de los nueve departamentos se reunir\u00e1n este jueves en la ciudad de Santa Cruz con la finalidad de conversar sobre la coyuntura en el pa\u00eds a causa de los bloqueos de caminos.\n\n\u201cLos presidentes y los representantes (c\u00edvicos) de los nueve departamentos van a estar hoy (jueves) reunidos con el presidente (Paz) para hacerle conocer a \u00e9l c\u00f3mo se est\u00e1 viendo en los distintos puntos del pa\u00eds esta problem\u00e1tica\u201d, afirm\u00f3 el presidente del Comit\u00e9 C\u00edvico de Santa Cruz, Stello Cochamanidis, en contacto con los periodistas.\n\nExplic\u00f3 que, en el encuentro, programado para las 10.00, en Santa Cruz, las autoridades y representantes c\u00edvicos abordar\u00e1n como tema central el respeto a la democracia y \u201cla situaci\u00f3n cr\u00edtica que actualmente est\u00e1 viviendo el pa\u00eds\u201d a causa de los conflictos sociales.\n\nSe conversar\u00e1 con el jefe de Estado \u201cc\u00f3mo se est\u00e1 viviendo y en realidad cu\u00e1les son las alternativas que vemos nosotros viables como movimiento c\u00edvico nacional para buscarle una salida a este problema en el cual nos encontramos\u201d, a\u00f1adi\u00f3 Cochamanidis.\n\nEste jueves se cumplen 28 d\u00edas de bloqueos de caminos en La Paz, mientras el Gobierno mantiene la convocatoria al di\u00e1logo con los sectores movilizados para atender las demandas y evitar mayores perjuicios a la poblaci\u00f3n. Medidas similares tambi\u00e9n se registran en otras regiones del pa\u00eds.", "dateTimeNews": "2026-05-28T13:51:39+00:00", "dateTimeReceived": "2026-05-28T17:37:02+00:00", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/05/IMG_7318.webp", "position": 23, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/rodrigo-paz-asistira-a-reunion-de-comites-civicos-en-santa-cruz/"}], "source": "El Mundo", "title": "Paz se re\u00fane con c\u00edvicos del pa\u00eds en Santa Cruz", "url": "https://elmundo.com.bo/paz-se-reune-con-civicos-del-pais-en-santa-cruz/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "Rodrigo Paz, presidente del Estado boliviano, reiter\u00f3 su llamado al di\u00e1logo a dos de los sectores m\u00e1s radicales que bloquean y se movilizan hace 28 d\u00edas exigiendo su renuncia: la Federaci\u00f3n Departamental de Trabajadores Campesinos de La Paz \u201cTupac Katari\u201d y la Central Obrera Boliviana (COB).\n\nEn la clausura de la primera reuni\u00f3n del Consejo Econ\u00f3mico y Social, Paz afirm\u00f3 que enviar\u00e1 \u201ccartita\u201d a Vicente Choque, m\u00e1ximo dirigente de los Tupac Katari, para invitarlo a dialogar \u201ca la hora que quiera\u201d.\n\n\u201cInvito, voy a mandar una carta al se\u00f1or Vicente Salazar, al de Tupac, ya lo he invitado varias veces. Hoy le espero a la hora que el quiera, porque en este Gobierno trabajamos 24/7\u201d, asever\u00f3.\n\nY acot\u00f3: \u201cHoy el espero, estoy seguro que si sumamos esfuerzo nos va a ir mejor\u201d, a tiempo de anunciar que en los siguientes d\u00edas viajar\u00e1 a todas las provincias de La Paz.\n\n\u201cEstoy mandando cartita para hoy verlo y que venga con todo su Comit\u00e9 para que no le digan traidor\u201d, afirm\u00f3.\n\nAsimismo, llam\u00f3 al di\u00e1logo al secretario ejecutivo de la COB, Mario Argollo, a pesar de que \u00e9ste tiene una orden de aprehensi\u00f3n en su contra acusado por los delitos de instigaci\u00f3n p\u00fablica a delinquir y terrorismo, y se haya declarado en la clandestinidad.\n\n\u201cQue venga a hablar, tantas invitaciones. (\u00c9l dice:) \u2018No, no vamos a ir a hablar con imperialistas, neoliberales\u2019. Tienes que venir a hablar porque yo soy el presidente con el 55% del voto nacional\u201d, afirm\u00f3.\n\nEl llamado al di\u00e1logo de Paz llega despu\u00e9s de 27 d\u00edas de bloqueos y movilizaciones que han aislado a La Paz y El Alto y han generado desabastecimiento de combustible, alimentos y medicamentos.\n\nEn ese sentido, Paz reproch\u00f3 los pedidos de renuncia que hay en su contra. \u201cNo puedes botar a presidentes porque se te da la gana, el voto se respeta y la Constituci\u00f3n tambi\u00e9n, as\u00ed no m\u00e1s es. Son las reglas\u201d, se\u00f1al\u00f3.\n\nFinalmente, advirti\u00f3 que, si no prospera el di\u00e1logo, \u201cel que le hace da\u00f1o a otro boliviano tiene que ser castigado por la ley\u201d y pidi\u00f3 no creer en rumores difundidos en redes sociales.", "dateTimeNews": "2026-05-28T13:50:11+00:00", "dateTimeReceived": "2026-05-28T17:24:41+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/paz-argollo_choque-scaled.jpg", "position": 24, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260528/dos-mesas-dialogo-dan-primeros-pasos-paz-invoca-asistir-dirigentes"}], "source": "Ox\u00edgeno", "title": "Paz reitera llamado al di\u00e1logo y enviar\u00e1 \u201ccartitas\u201d a Vicente Choque de los \u201cTupac\u201d y Mario Argollo de la COB", "url": "https://oxigeno.bo/paz-reitera-llamado-al-dialogo-y-enviara-cartitas-a-vicente-choque-de-los-tupac-y-mario-argollo-de-la-cob/"}, {"actor": [], "authors": ["Roy Alex Muguertegui T."], "body": "El gobernador cruce\u00f1o, Juan Pablo Velasco, sali\u00f3 al frente tras los problemas en el sistema de iluminaci\u00f3n del estadio \u201cTahuichi\u201d Aguilera, luego del apag\u00f3n registrado durante el partido entre Bol\u00edvar e Independiente de Rivadavia por la Copa Libertadores de Am\u00e9rica.\n\nLa autoridad explic\u00f3 que el incidente se produjo por fallas en los tableros superiores del sistema el\u00e9ctrico, los cuales, seg\u00fan indic\u00f3, no tienen acceso inmediato para realizar intervenciones r\u00e1pidas.\n\n\u201cHay un tema de garant\u00eda con las empresas internacionales que ejecutaron el trabajo. Nosotros mantuvimos personal en cada tablero, pero los que fallaron fueron los de la parte superior y por eso tom\u00f3 tiempo solucionar el problema\u201d, se\u00f1al\u00f3 Velasco.\n\nAsimismo, anunci\u00f3 que la Gobernaci\u00f3n presentar\u00e1 denuncias formales contra las empresas responsables de la instalaci\u00f3n de las luminarias, asegurando que los trabajos entregados no cumplen con los est\u00e1ndares de calidad. \u201cLo que hemos recibido en el Tahuichi ha sido muy malo. No son luces de calidad, no hubo una buena instalaci\u00f3n y eso es lo que vamos a denunciar\u201d, afirm\u00f3.\n\nVelasco tambi\u00e9n remarc\u00f3 que hasta el momento no existe una entrega oficial de las obras ni un acta definitiva, motivo por el cual la Gobernaci\u00f3n evita intervenir directamente en el sistema para no perder una garant\u00eda valuada en m\u00e1s de dos millones de d\u00f3lares. \u201cHasta que llegue el receso del f\u00fatbol y venga la empresa brasile\u00f1a adjudicada internacionalmente para solucionar el problema de ra\u00edz, seguiremos dependiendo de este sistema\u201d, sostuvo.\n\nLa autoridad departamental atribuy\u00f3 las fallas a una \u201cmala operaci\u00f3n, mala instalaci\u00f3n y materiales inadecuados\u201d, aunque asegur\u00f3 que ya se trabaja en una soluci\u00f3n definitiva para evitar que el problema vuelva a repetirse en futuros compromisos internacionales.\n\nFinalmente, Velasco reiter\u00f3 que las acciones legales alcanzar\u00e1n tanto a las empresas constructoras como a anteriores responsables vinculados al proyecto de iluminaci\u00f3n del principal escenario deportivo cruce\u00f1o.", "dateTimeNews": "2026-05-28T13:49:35+00:00", "dateTimeReceived": "2026-05-28T17:37:02+00:00", "pic": "https://cdn.diez.bo/diez/052026/1779974189419.jpg?cw=1200\u0026ch=630", "position": 25, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/marcas/2026/05/28/velasco-responsabiliza-a-empresas-por-fallas-en-el-tahuichi/"}], "source": "El Deber", "title": "JP Velasco: \u201cSobre la iluminaci\u00f3n del Tahuichi, nos dejaron un desastre\u201d", "url": "https://eldeber.com.bo/deportes/jp-velasco-iluminacion-tahuichi-nos-dejaron-desastre_1779976141"}, {"actor": [], "authors": ["Carolina Galarza Villagran"], "body": "El caso de la ni\u00f1a de siete a\u00f1os que falleci\u00f3 tras complicaciones de salud provocadas por una coinfecci\u00f3n de sarampi\u00f3n y parvovirus ser\u00e1 evaluado por el Comit\u00e9 Cient\u00edfico Departamental de Santa Cruz, as\u00ed lo inform\u00f3 el epidemi\u00f3logo Roberto Torrez. La menor muri\u00f3 la noche del 26 de mayo, luego de permanecer 19 d\u00edas internada debido al deterioro progresivo de su salud.\n\n\"La ni\u00f1a tambi\u00e9n compart\u00eda otros diagn\u00f3sticos. Ya ten\u00eda una coinfecci\u00f3n con parvovirus y otras infecciones. Entonces, a\u00fan est\u00e1 por determinarse si fue el sarampi\u00f3n el que realmente provoc\u00f3 el deceso. Esta historia va a entrar al Comit\u00e9 Cient\u00edfico Departamental, que va a ser el encargado de dar el resultado\", explic\u00f3 el especialista.\n\nTorrez lament\u00f3 que el conjunto de enfermedades haya generado las complicaciones que derivaron en el fallecimiento de la menor. Adem\u00e1s, se\u00f1al\u00f3 que se debe investigar si exist\u00eda alguna patolog\u00eda previa, ya que las enfermedades detectadas en la paciente \"no suelen agravarse de esa manera\".\n\nLa menor fue la primera paciente con sarampi\u00f3n atendida este a\u00f1o en el Hospital de Ni\u00f1os Mario Ortiz Su\u00e1rez. \"Es la primer paciente que hemos tenido este a\u00f1o\", indic\u00f3 el epidemi\u00f3logo. Asimismo, remarc\u00f3 que ning\u00fan otro caso registrado este a\u00f1o hab\u00eda requerido atenci\u00f3n en un hospital de tercer nivel.\n\nEl m\u00e9dico recomend\u00f3 a padres y madres llevar a sus hijos a los centros de salud para recibir la vacuna contra el sarampi\u00f3n. Destac\u00f3 que en el departamento ya se registran m\u00e1s de 600 pacientes recuperados, lo que demuestra la efectividad de la inmunizaci\u00f3n.", "dateTimeNews": "2026-05-28T13:03:15+00:00", "dateTimeReceived": "2026-05-28T17:24:16+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779973317297.jpg?\u0026cw=1200\u0026ch=630", "position": 26, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/sociedad/2026/05/28/comite-cientifico-indaga-si-muerte-de-nina-fue-por-sarampion/"}, {"source": "La Patria", "url": "https://lapatria.bo/actualidad/investigan-la-muerte-de-una-nina-por-sarampion-y-parvovirus/"}], "source": "El Deber", "title": "El caso de la ni\u00f1a fallecida por sarampi\u00f3n y parvovirus ser\u00e1 analizado por el Comit\u00e9 Cient\u00edfico", "url": "https://eldeber.com.bo/santa-cruz/caso-nina-fallecida-sarampion-parvovirus-sera-analizado-comite-cientifico_1779973395"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nLos presidentes de los comit\u00e9s c\u00edvicos de los nueve departamentos sostendr\u00e1n este jueves una reuni\u00f3n con el presidente Rodrigo Paz y ministros de Estado en la ciudad de Santa Cruz, con el prop\u00f3sito de analizar la crisis derivada de los bloqueos y plantear medidas para restablecer la normalidad en el pa\u00eds.\n\nLa cita ser\u00e1 a las 10.00 y desarrollar\u00e1 en medio de protestas y cortes de rutas que desde hace casi un mes afectan al eje troncal, provocan problemas en el abastecimiento y generan p\u00e9rdidas en distintos sectores productivos, principalmente, de la ciudad de La Paz.\n\nDesde el Comit\u00e9 C\u00edvico Pro Santa Cruz se\u00f1alaron que el encuentro buscar\u00e1 consolidar una posici\u00f3n conjunta del movimiento c\u00edvico en defensa de la democracia y de la institucionalidad, adem\u00e1s de exigir soluciones frente al conflicto social.\n\nLea tambi\u00e9n: Paz lanza \u2018\u00faltima convocatoria\u2019 a Vicente Salazar, de la T\u00fapac, para instalar di\u00e1logo\n\nEl vicepresidente c\u00edvico cruce\u00f1o, Agust\u00edn Zambrana, indic\u00f3 que uno de los pedidos centrales estar\u00e1 enfocado en que el Gobierno asuma acciones concretas para encaminar un proceso de pacificaci\u00f3n y garantizar el libre tr\u00e1nsito en el territorio nacional.\n\nAsimismo, indic\u00f3 que los sectores c\u00edvicos consideran urgente reactivar el aparato productivo y devolver estabilidad a las regiones afectadas por las movilizaciones y los bloqueos.\n\nPor su parte, el Comit\u00e9 C\u00edvico de Cochabamba confirm\u00f3 su participaci\u00f3n en el encuentro nacional. Desde la instituci\u00f3n se\u00f1alaron que asistir\u00e1n con la postura de defender el respeto a la democracia y promover salidas mediante el di\u00e1logo y la institucionalidad.\n\nDurante la reuni\u00f3n tambi\u00e9n se prev\u00e9 evaluar la situaci\u00f3n pol\u00edtica y econ\u00f3mica del pa\u00eds, adem\u00e1s de emitir un pronunciamiento conjunto tras el encuentro entre autoridades nacionales y representantes c\u00edvicos.", "dateTimeNews": "2026-05-28T12:43:33+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/whatsapp-image-2026-05-18-at-15-02_101-15474934_20260519211103.webp", "position": 27, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/rodrigo-paz-asistira-a-reunion-de-comites-civicos-en-santa-cruz/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-se-reunira-este-jueves-con-civicos-de-los-nueve-departamentos-este-jueves-en-santa-cruz/"}], "source": "La Raz\u00f3n", "title": "C\u00edvicos se re\u00fanen con el Gobierno y pedir\u00e1n acciones para pacificar el pa\u00eds", "url": "https://larazon.bo/nacional/2026/05/28/civicos-se-reunen-con-el-gobierno-y-pediran-acciones-para-pacificar-el-pais/"}, {"actor": [], "authors": ["rorellana"], "body": "A 28 d\u00edas de las movilizaciones de sectores sociales, cerco a la ciudades de La Paz y El Alto y m\u00e1s de 60 puntos de bloqueo de carreteras en el todo el pa\u00eds, finalmente se avizoran se\u00f1ales de di\u00e1logo con dos iniciativas que empezaron a funcionar desde ayer en forma simult\u00e1nea.\n\nSe trata de la instalaci\u00f3n del Consejo Econ\u00f3mico y Social al mando del presidente del Estado, Rodrigo Paz, y de la Comisi\u00f3n de Di\u00e1logo que encabeza el vicepresidente Edmand Lara.\n\nEn la primera iniciativa,Paz reiter\u00f3 su convocatoria al di\u00e1logo dirigida a Vicente Salazar, de la Federaci\u00f3n Departamental \u00danica de Trabajadores Campesinos de La Paz \u201cT\u00fapac Katari\u201d, y Mario Argollo, de la Central Obrera Boliviana (COB), los dos sectores que lideran las protestas desde el 1 de mayo.\n\n\u201cQuiero volver a reiterar. Vuelvo a invitar, por \u00faltima vez, porque venimos meses invitando. Pero invito y le voy a mandar una carta al se\u00f1or Vicente Salazar, que ya lo he invitado varias veces. Hoy lo espero, a la hora que \u00e9l quiera\u201d, convoc\u00f3 el mandatario durante el cierre del Consejo Econ\u00f3mico Social.\n\nTambi\u00e9n se dirigi\u00f3 a Argollo, \u201cTienes que venir a hablar porque yo soy el presidente con el 55% del voto nacional\u201d, afirm\u00f3.\n\n\u201cCompa\u00f1eros del T\u00fapac, compa\u00f1eros de la Central Obrera, vengan. El pliego que ustedes han presentado tiene sus respuestas. Vengan\u201d, dijo Paz, antes de se\u00f1alar que el tiempo se acaba y de recordar que tiene respaldo constitucional para tomar medidas.\n\nLa reuni\u00f3n cuenta con la participaci\u00f3n del presidente Paz, ministros, representantes de distintos sectores, embajadas y organismos de cooperaci\u00f3n internacional, entre otros.\n\nMesa de Lara\n\nEn la segunda mesa de di\u00e1logo, tambi\u00e9n participan representantes de la Iglesia cat\u00f3lica y la Asamblea Permanente de Derechos Humanos de la ciudad de El Alto y el Defensor del Pueblo, Pedro Callisaya.\n\nEn representaci\u00f3n del Gobierno, acuden los ministros de la Presidencia, Jos\u00e9 Luis Lupo, y de Educaci\u00f3n, Beatriz Garc\u00eda.\n\n\u201cLlegamos a este espacio de di\u00e1logo convocado por el Legislativo con la misma esperanza y convicci\u00f3n con las que hemos participado siempre de este tipo de encuentros: de que el di\u00e1logo es el camino para encontrar soluciones\u201d, dijo Lupo en sus redes sociales.\n\nPor parte de sectores y organizaciones sociales estuvo Pedro Quispe, secretario ejecutivo de los Choferes del Transporte Pesado Nacional e Internacional, y otros delegados que se acreditaron como representantes de organizaciones sociales como la T\u00fapac Katari, el Conamaq, la Cidob, la Confederaci\u00f3n de Mujeres Campesinas Bartolina Sisa y juntas vecinales.\n\nLos representante de los sectores tambi\u00e9n pidieron la presencia del ejecutivo de la COB, Mario Argollo, que se ha declarado en la clandestinidad al existir una orden de aprehensi\u00f3n en su contra por terrorismo e instigaci\u00f3n p\u00fablica a delinquir.", "dateTimeNews": "2026-05-28T12:19:44+00:00", "dateTimeReceived": "2026-05-28T17:37:15+00:00", "pic": "https://www.lostiempos.com/sites/default/files/media_imagen/2026/5/28/4_p_1_dircom_vepb.jpg", "position": 28, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-reitera-llamado-al-dialogo-y-enviara-cartitas-a-vicente-choque-de-los-tupac-y-mario-argollo-de-la-cob/"}], "source": "Los Tiempos", "title": "Two dialogue tables launch in Bolivia as President Paz urges protest leaders to attend.", "url": "https://www.lostiempos.com/actualidad/pais/20260528/dos-mesas-dialogo-dan-primeros-pasos-paz-invoca-asistir-dirigentes"}, {"actor": [], "authors": ["Patricia Canido Aroni"], "body": "El Fiscal Departamental de Tarija, Jos\u00e9 Ernesto Mogro Palacios, inform\u00f3 que se investiga la muerte de Melani P. I. M., de 37 a\u00f1os de edad, quien habr\u00eda sido golpeada por su concubino Orlando L. B. N., de 52 a\u00f1os, y luego de permanecer internada por varios d\u00edas, perdi\u00f3 la vida la madrugada de este mi\u00e9rcoles en la ciudad de Tarija. Inicialmente el caso fue abierto por el delito de Feminicidio en grado de Tentativa en contra del sospechoso que fue enviado con detenci\u00f3n preventiva al penal de Morros Blancos; sin embargo, ante el fallecimiento de la v\u00edctima se recalific\u00f3 el tipo penal a Feminicidio.\n\n\u201cComo Ministerio P\u00fablico se dispuso de manera inmediata el inicio de la investigaci\u00f3n y el despliegue del Equipo Multidisciplinario de la Fiscal\u00eda Especializada en Delitos contra la Vida para realizar todos los actos investigativos necesarios que permitan esclarecer este lamentable hecho y determinar las responsabilidades conforme a ley\u201d, expres\u00f3 Mogro.\n\nPor su parte, la Fiscal de Materia asignada al caso, Gabriela Soruco Llampa, inform\u00f3 que el hecho ocurri\u00f3 el 23 de mayo en la ciudad de Tarija, cuando la v\u00edctima habr\u00eda sido brutalmente agredida f\u00edsicamente por su concubino, recibiendo golpes en el rostro, cabeza y brazos, lesiones que le provocaron graves da\u00f1os. La mujer fue trasladada al Hospital Regional San Juan de Dios, donde permaneci\u00f3 internada en terapia intensiva; sin embargo, falleci\u00f3 el 26 de mayo a horas 23:00, aproximadamente, debido a un traumatismo craneoencef\u00e1lico, conforme al informe emitido por el Instituto de Investigaciones Forenses (IDIF).\n\nAsimismo, el Ministerio P\u00fablico inici\u00f3 la investigaci\u00f3n de oficio desde el momento en que se tom\u00f3 conocimiento del hecho, disponiendo la colecci\u00f3n de elementos de convicci\u00f3n, entrevistas testificales, registro del lugar y otros actos investigativos orientados a esclarecer plenamente el caso y determinar la responsabilidad penal del presunto autor. (FGE)", "dateTimeNews": "2026-05-28T05:58:00+00:00", "dateTimeReceived": "", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/05/feminicidio-3.webp", "position": 29, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/tarija-suma-su-segundo-feminicidio-y-bolivia-ya-acumula-35-casos-en-lo-que-va-del-2026/"}, {"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/investigan-feminicidio-en-tarija-tras-muerte-de-mujer-de-37-anos/"}, {"source": "Sumando Voces", "url": "https://sumandovoces.com.bo/fiscalia-investiga-feminicidio-de-una-mujer-de-37-anos-en-tarija-el-principal-sospechoso-es-el-concubino-de-la-victima/"}], "source": "El Mundo", "title": "Investigan feminicidio de una mujer de 37 a\u00f1os en Tarija", "url": "https://elmundo.com.bo/investigan-feminicidio-de-una-mujer-de-37-anos-en-tarija/"}, {"actor": [], "authors": ["La Patria"], "body": "Este mi\u00e9rcoles sali\u00f3 derrotado del estadio Monumental, a manos de River Plate que le propin\u00f3 una goleada de 3-0\n\nFicha informativa Blooming fue eliminado de la Copa Sudamericana tras perder 3-0 contra River Plate en el estadio Monumental. El equipo cruce\u00f1o no pudo sostener el empate en el primer tiempo y termin\u00f3 \u00faltimo en su grupo. Toca para ver el contexto completo Contexto: Blooming logr\u00f3 un punto en el partido de ida ante River Plate en Santa Cruz. En los dem\u00e1s compromisos, el equipo sufri\u00f3 derrotas. Maximiliano Salas fall\u00f3 un penal a los diez minutos del partido. La falta dudosa de Mat\u00edas Abisab llev\u00f3 al segundo gol de River Plate. Por qu\u00e9 importa: La eliminaci\u00f3n de Blooming implica su despedida de la Copa Sudamericana y la finalizaci\u00f3n de su participaci\u00f3n en el torneo internacional. Datos clave: Resultado : 3-0\n\n: 3-0 Estadio : Monumental\n\n: Monumental Minuto del primer gol : 56\n\n: 56 Minuto del segundo gol : 74\n\n: 74 Minuto del tercer gol : 83\n\n: 83 Puntos obtenidos por Blooming: 1 IngresarDesbloquear acceso completo\n\nBlooming se despide humillado de la Copa Sudamericana \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nBlooming vs River Plate: Un adi\u00f3s humillante en la Copa Sudamericana\n\nEl encuentro entre Blooming vs River Plate dej\u00f3 una marca dolorosa para el equipo cruce\u00f1o. A pesar de aguantar el primer tiempo con el marcador en blanco, no pudieron sostener su resistencia en la segunda parte. El resultado final fue un contundente 3-0, lo que signific\u00f3 la eliminaci\u00f3n de Blooming de la Copa Sudamericana.\n\nUn comienzo complicado\n\nDesde el inicio, las cosas se complicaron para los celestes. A los diez minutos, enfrentaron un penal en contra. Maximiliano Salas tuvo la oportunidad de abrir el marcador, pero fall\u00f3 al enviar la pelota al poste. Este momento marc\u00f3 un cambio en el \u00e1nimo del equipo.\n\nGoles que sellaron el destino\n\nEn el complemento, Salas se redimi\u00f3 al anotar el primer gol a los 56 minutos. Control\u00f3 un pase sin marcaci\u00f3n y defini\u00f3 dentro del \u00e1rea. Sin embargo, Blooming no pudo mantener su esperanza por mucho tiempo. A los 74 minutos, una falta dudosa de Mat\u00edas Abisab result\u00f3 en el segundo gol de Fausto Vera, quien remat\u00f3 hacia el centro del p\u00f3rtico.\n\nFinalmente, Lucas Silva sell\u00f3 la goleada con un potente derechazo desde fuera del \u00e1rea a los 83 minutos. Este gol evidenci\u00f3 los nervios de un Blooming que no pod\u00eda despejar el peligro.\n\nUn an\u00e1lisis del partido\n\nEl desempe\u00f1o de Blooming fue decepcionante, ya que terminaron \u00faltimos en su grupo con apenas un punto. Este punto lo lograron en el partido de ida contra River Plate en Santa Cruz. Los dem\u00e1s compromisos culminaron en derrota, lo que refleja una campa\u00f1a muy por debajo de las expectativas.\n\nResultados y reflexiones finales\n\nResultados Copa Sudamericana: Blooming termin\u00f3 con un solo punto.\n\nBlooming termin\u00f3 con un solo punto. Goles River Plate Blooming: 3-0 fue el resultado final.\n\n3-0 fue el resultado final. Resumen partido Blooming River Plate: Una actuaci\u00f3n que dej\u00f3 mucho que desear.\n\nUna actuaci\u00f3n que dej\u00f3 mucho que desear. An\u00e1lisis partido Copa Sudamericana: Un equipo que no pudo responder ante la presi\u00f3n.\n\nA medida que Blooming se despide de la Copa Sudamericana, queda la esperanza de que puedan aprender de esta experiencia y regresar m\u00e1s fuertes en futuras competiciones.\n\nRIVER PLATE (3): Santiago Beltr\u00e1n, Fabricio Bustos, Lucas Mart\u00ednez, Lautaro Rivero, Facundo Gonz\u00e1lez, Juan Cruz Meza, Lucas Silva, Fausto Vera, Tom\u00e1s Galv\u00e1n, Joaqu\u00edn Freitas y Maximiliano Salas; alternaron: Lautaro Pereyra, Jonathan Spiff, Santiago Lencina y Ulises Gim\u00e9nez; D.T. Eduardo Coudet; goles: Maximiliano Salas 56\u2019, Fausto Vera 74\u2019 (penal) y Lucas Silva 83\u2019.\n\nBLOOMING (0): Gustavo Almada, Marc Enoumba, Jos\u00e9 Carrasco, Julio Vila, Mauricio Cabral, Mat\u00edas Abisab, Juan Mercado, Guilmar Centella, Roberto Hinojoza, Auli Oliveros y Bayron Garc\u00e9s; alternaron: C\u00e9sar Menacho, Miguel Villarroel, Percy Loza, Roberto Melgar y Sa\u00fal Severiche; D.T. Erwin S\u00e1nchez.", "dateTimeNews": "2026-05-28T04:42:16+00:00", "dateTimeReceived": "2026-05-28T17:37:05+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a17c70a991a6.jpg", "position": 30, "similar": [{"source": "ATB Digital", "url": "https://www.atb.com.bo/2026/05/28/river-plate-aplasta-a-blooming-y-avanza-a-octavos-de-la-sudamericana/"}], "source": "La Patria", "title": "Blooming se despide humillado de la Copa Sudamericana - La Patria 3.0", "url": "https://lapatria.bo/deportes/blooming-se-despide-humillado-de-la-copa-sudamericana/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "La Federaci\u00f3n Boliviana de F\u00fatbol (FBF) confirm\u00f3 el segundo amistoso que tendr\u00e1 la Verde en junio.\n\nAdem\u00e1s de enfrentar a Escocia el 6 de junio, tambi\u00e9n rivalizar\u00e1 ante Argelia el pr\u00f3ximo 10 del mismo mes. El encuentro se jugar\u00e1 en Kansas, Estados Unidos.\n\n\u201cArgelia, selecci\u00f3n clasificada a la pr\u00f3xima Copa del Mundo y actualmente ubicada en el puesto 28 del ranking FIFA, consolid\u00e1ndose como una de las selecciones m\u00e1s competitivas del continente africano\u201d, destac\u00f3 la FBF a trav\u00e9s de sus cuentas en las redes sociales.\n\nAs\u00ed, la Verde enfrentar\u00e1 a dos selecciones mundialistas en lo que es su preparaci\u00f3n pensando ya en la Copa del Mundo 2030.\n\nLa Verde, cabe recordar, enfrentar\u00e1 a Escocia el 6 de junio en Ney Jersey, en lo que ser\u00e1 su primer partido tras su eliminaci\u00f3n en el repechaje al Mundial 2022.", "dateTimeNews": "2026-05-28T03:51:29+00:00", "dateTimeReceived": "2026-05-28T17:37:25+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/bolivia_argelia_anuncio.png", "position": 31, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/deportes/bolivia-se-enfrentara-en-partido-amistoso-ante-argelia-en-kansas/"}], "source": "Ox\u00edgeno", "title": "La FBF confirma el segundo amistoso que tendr\u00e1 la Verde en junio: enfrentar\u00e1 a Argelia el 10", "url": "https://oxigeno.bo/la-fbf-confirma-el-segundo-amistoso-que-tendra-la-verde-en-junio-enfrentara-a-argelia-el-10-de-junio/"}, {"actor": [], "authors": ["Carlos Corz"], "body": "La Iglesia Cat\u00f3lica est\u00e1 entre las organizaciones facilitadoras del di\u00e1logo, para resolver el bloqueo que afecta, principalmente, a La Paz y El Alto\n\neju.tv\n\nEn manos de los facilitadores est\u00e1 la viabilizaci\u00f3n del di\u00e1logo que busca sentar en una mesa de negociaci\u00f3n a los sectores en conflicto desde hace 27 d\u00edas. El Gobierno del presidente Rodrigo Paz ya confirm\u00f3 su asistencia a cualquier escenario con respuestas a las demandas leg\u00edtimas del movimiento campesino, inform\u00f3 el ministro de la Presidencia, Jos\u00e9 Luis Lupo.\n\n\u201cLa pr\u00f3xima convocatoria viene por parte de los facilitadores, a quienes adem\u00e1s aprovecho de agradecer: a la Iglesia Cat\u00f3lica, a Derechos Humanos de El Alto, al Defensor del Pueblo y a todos estos auspiciadores del di\u00e1logo, quienes van a continuar, a partir de esta reuni\u00f3n que hemos tenido (hoy), trabajando para poder entablar ma\u00f1ana (jueves) una siguiente reuni\u00f3n\u201d, explic\u00f3.\n\n=\u003e Recibir por Whatsapp las noticias destacadas\n\nEn la Vicepresidencia del Estado, el vicepresidente Edmund Lara, el ministro Lupo y representantes pol\u00edticos se reunieron con los facilitadores de las negociaciones. El principal acuerdo fue encomendarles las gestiones necesarias para lograr que todos los sectores movilizados participen en la mesa de di\u00e1logo.\n\nEste trabajo de acercamiento se maneja con bajo perfil. Grupos afines a Evo Morales, maestros rurales, campesinos de La Paz y afiliados a la Central Obrera Boliviana (COB) protagonizan el bloqueo que ya lleva 27 d\u00edas y golpea con mayor fuerza a El Alto y La Paz, aunque en las \u00faltimas semanas se ha ido extendiendo a otras regiones del pa\u00eds.\n\nHasta el momento, los movilizados \u2014que exigen la renuncia del presidente Paz\u2014 han descartado acudir a los llamados del Ejecutivo.\n\n\u201cLo importante ac\u00e1 es que realmente los l\u00edderes que tienen la representaci\u00f3n de los sectores sociales movilizados asistan, porque el Gobierno tiene absolutamente todo el pliego respondido. No hemos tenido la oportunidad de discutir y debatir con ellos cada uno de los 37 puntos, por ejemplo, del pliego de la Federaci\u00f3n de Campesinos T\u00fapac Katari\u201d, explic\u00f3 Lupo en Bolivia Tv.\n\nSe espera el llamado al di\u00e1logo de los mediadores para continuar con este proceso que conduzca a la pacificaci\u00f3n de Bolivia, afirm\u00f3 la autoridad, tras a\u00f1adir que el Ejecutivo tambi\u00e9n cuenta con las respuestas al pliego petitorio de la COB.\n\n\u201cTodos queremos lo mismo, todos queremos pacificar el pa\u00eds, particularmente el departamento de La Paz. Los bolivianos est\u00e1n ansiosos y han hecho un sacrificio inmenso, sobre todo en el departamento de La Paz con estos bloqueos que han afectado la vida cotidiana de todos\u201d, concluy\u00f3.", "dateTimeNews": "2026-05-28T03:32:31+00:00", "dateTimeReceived": "2026-05-28T17:24:11+00:00", "pic": "https://eju.tv/wp-content/uploads/2026/05/vice-e1779939117699.jpg", "position": 32, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/comision-de-dialogo-acuerda-gestionar-la-presencia-de-todos-los-sectores-sociales-y-continuara-este-jueves/"}], "source": "Eju.tv", "title": "Facilitadores buscan destrabar el di\u00e1logo con bloqueadores, el Gobierno tiene listas las respuestas a demandas", "url": "https://eju.tv/2026/05/facilitadores-buscan-destrabar-el-dialogo-con-bloqueadores-el-gobierno-tiene-listas-las-respuestas-a-demandas/"}, {"actor": [], "authors": ["La Patria"], "body": "La Fiscal\u00eda investiga el feminicidio de Melani P. I. M. en Tarija, tras su muerte el 26 de mayo.\n\nFicha informativa La Fiscal\u00eda investiga el feminicidio de Melani P. I. M. en Tarija tras su muerte el 27 de mayo, luego de ser agredida por su concubino Orlando L. B. N. Toca para ver el contexto completo Contexto: Melani fue agredida f\u00edsicamente por Orlando, recibiendo golpes en rostro, cabeza y brazos. Estuvo internada en el Hospital Regional San Juan de Dios en terapia intensiva antes de fallecer debido a un traumatismo craneoencef\u00e1lico. El Fiscal Departamental, Jos\u00e9 Ernesto Mogro Palacios, inform\u00f3 sobre el despliegue del Equipo Multidisciplinario de la Fiscal\u00eda Especializada en Delitos contra la Vida para realizar investigaciones necesarias. Por qu\u00e9 importa: El caso ha llevado a la detenci\u00f3n preventiva del agresor y a la apertura de una investigaci\u00f3n por parte del Ministerio P\u00fablico para esclarecer los hechos y determinar responsabilidades penales. Datos clave: Fecha del hecho: 23 de mayo\n\n23 de mayo Fecha de fallecimiento: 26 de mayo a las 23:00 horas\n\n26 de mayo a las 23:00 horas Edad de la v\u00edctima: 37 a\u00f1os\n\n37 a\u00f1os Edad del agresor: 52 a\u00f1os\n\n52 a\u00f1os Tipo penal inicial: Feminicidio en grado de Tentativa\n\nFeminicidio en grado de Tentativa Tipo penal recalificado: Feminicidio IngresarDesbloquear acceso completo\n\nInvestigan feminicidio en Tarija tras muerte de mujer de 37 a\u00f1os \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nInvestigaci\u00f3n por feminicidio en Tarija tras la muerte de Melani P. I. M.\n\nLa noche del 26 de mayo, la ciudad de Tarija vivi\u00f3 un suceso tr\u00e1gico que conmocion\u00f3 a la comunidad. El Fiscal Departamental, Jos\u00e9 Ernesto Mogro Palacios, confirm\u00f3 el fallecimiento de Melani P. I. M., de 37 a\u00f1os, quien perdi\u00f3 la vida tras ser brutalmente golpeada por su concubino, Orlando L. B. N., de 52 a\u00f1os.\n\nDetalles del caso y acciones del Ministerio P\u00fablico\n\nInicialmente, se abri\u00f3 un caso por el delito de feminicidio en grado de tentativa contra Orlando L. B. N., quien fue enviado a detenci\u00f3n preventiva en el penal de Morros Blancos. Sin embargo, tras el fallecimiento de Melani, el tipo penal se recalific\u00f3 a feminicidio.\n\nMogro expres\u00f3: \u201cComo Ministerio P\u00fablico se dispuso de manera inmediata el inicio de la investigaci\u00f3n y el despliegue del Equipo Multidisciplinario de la Fiscal\u00eda Especializada en Delitos contra la Vida para realizar todos los actos investigativos necesarios que permitan esclarecer este lamentable hecho y determinar las responsabilidades conforme a ley\u201d.\n\nLa brutal agresi\u00f3n y su tr\u00e1gico desenlace\n\nEl hecho ocurri\u00f3 el 23 de mayo, cuando Melani fue agredida f\u00edsicamente por su concubino, recibiendo golpes en rostro, cabeza y brazos que le provocaron graves da\u00f1os. Fue trasladada al Hospital Regional San Juan de Dios, donde permaneci\u00f3 internada en terapia intensiva; sin embargo, falleci\u00f3 el 26 de mayo a las 23:00 horas debido a un traumatismo craneoencef\u00e1lico, seg\u00fan el informe del Instituto de Investigaciones Forenses (IDIF).\n\nAvances en la investigaci\u00f3n fiscal\n\nEl Ministerio P\u00fablico inici\u00f3 la investigaci\u00f3n desde que tuvo conocimiento del hecho y dispuso la colecci\u00f3n de elementos probatorios, entrevistas testificales y registro del lugar para esclarecer plenamente el caso y determinar la responsabilidad penal del presunto autor.", "dateTimeNews": "2026-05-28T03:14:04+00:00", "dateTimeReceived": "2026-05-28T17:24:22+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a17a67a995bf.jpg", "position": 33, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/tarija-suma-su-segundo-feminicidio-y-bolivia-ya-acumula-35-casos-en-lo-que-va-del-2026/"}, {"source": "Sumando Voces", "url": "https://sumandovoces.com.bo/fiscalia-investiga-feminicidio-de-una-mujer-de-37-anos-en-tarija-el-principal-sospechoso-es-el-concubino-de-la-victima/"}, {"source": "El Mundo", "url": "https://elmundo.com.bo/investigan-feminicidio-de-una-mujer-de-37-anos-en-tarija/"}], "source": "La Patria", "title": "Investigan feminicidio en Tarija tras muerte de mujer de 37 a\u00f1os - La Patria 3.0", "url": "https://lapatria.bo/enfoque-nacional/investigan-feminicidio-en-tarija-tras-muerte-de-mujer-de-37-anos/"}, {"actor": [], "authors": ["Jorge Asturizaga Quisbert"], "body": "Nabil Nacif, el joven delantero boliviano goleador de la Selecci\u00f3n Sub-17 en el Sudamericano de este a\u00f1o, es la gran novedad de la convocatoria de Bolivia para los amistosos contra Escocia y Argelia, del 6 y 10 de junio en Nueva Jersey y Kansas, respectivamente.\n\nLa segunda es la de Leonardo Viviani, de destacado presente en Aurora de Cochabamba.\n\nEl t\u00e9cnico \u00d3scar Villegas comunic\u00f3 la n\u00f3mina mediante los canales oficiales de la Selecci\u00f3n.\n\nNacif marc\u00f3 cuatro goles para la Verde Sub-17 en el Sudamericano disputado en Paraguay. Fue uno de los goleadores del certamen.\n\nSon 28 jugadores con los regresos de Daniel Ribera, juvenil de Talleres de C\u00f3rdoba de Argentina y \u00d3scar L\u00f3pez, del Mallorca espa\u00f1ol, quienes no estuvieron en la citaci\u00f3n para el repechaje de marzo, donde Bolivia qued\u00f3 en el camino por llegar a la Copa del Mundo.\n\nDe ese grupo no est\u00e1n los delanteros Enzo Monteiro, quien juega en Corea del Sur; ni Juan Sinforiano Godoy. Richet G\u00f3mez, ni Fernando Nava, los tres de Always Ready.\n\nEl resto son habituales entre legionarios y jugadores de clubes del balompi\u00e9 nacional.\n\nEl cotejo con Escocia ser\u00e1 el s\u00e1bado 6 de junio desde las 16.00 en el estadio Sports Illustrated de Nueva Jersey. El conjunto europeo est\u00e1 en el Grupo C del Mundial con Brasil, Marruecos y Hait\u00ed.\n\nFrente a Argelia est\u00e1 programado para el mi\u00e9rcoles 10 de junio en Kansas sin horario ni estadio definido. En esa ciudad el conjunto africano debutar\u00e1 en el Mundial frente a Argentina. Los otros rivales del Grupo J son Austria y Jordania.\n\nLos jugadores deben presentarse en Santa Cruz hasta el lunes 1 de junio para comenzar con los entrenamientos.\n\nLos convocados\n\nArqueros\n\nGuillermo Viscarra / Alianza Lima, Per\u00fa\n\nCarlos Lampe / Bol\u00edvar\n\nGer\u00f3nimo Govea / Wanderers, Uruguay\n\nDefensas\n\nDiego Medina / CSKA Sof\u00eda, Bulgaria\n\nLucas Macazaga / Legan\u00e9s, e1n a Jordania y Austria.\n\nRecuerdos del \u00faltimo encuentro\n\nEn marzo de 2024, la selecci\u00f3n boliviana, bajo la direcci\u00f3n del t\u00e9cnico brasile\u00f1o Antonio Carlos Zago, jug\u00f3 un cotejo contra Argelia. En ese partido, Bolivia perdi\u00f3 3-2, con goles anotados por Carmelo Algara\u00f1az y Jos\u00e9 Sagredo.\n\nPreparaci\u00f3n y lista de convocados\n\nA pesar de quedar fuera de la Copa Mundial, el seleccionado boliviano utilizar\u00e1 la doble fecha FIFA de junio para darle ritmo de competencia a sus jugadores. El director t\u00e9cnico \u00d3scar Villegas anunciar\u00e1 la lista de convocados en los pr\u00f3ximos d\u00edas. La concentraci\u00f3n se llevar\u00e1 a cabo en Santa Cruz.\n\nEn esta n\u00f3mina estar\u00e1n futbolistas que juegan en el extranjero, ya que los torneos est\u00e1n ingresando en receso. Los clubes deben ceder a los jugadores con cinco d\u00edas de anticipaci\u00f3n seg\u00fan lo establece la norma. Entre las principales figuras convocadas destacan: Miguel Terceros (Santos FC), Gabriel Villamil (Liga Deportiva Universitaria de Quito) y Guillermo Viscarra (Alianza Lima).\n\nPartidos previos al amistoso\n\nLa delegaci\u00f3n boliviana partir\u00e1 desde Santa Cruz rumbo a Estados Unidos. All\u00ed, jugar\u00e1n dos partidos amistosos. El primero ser\u00e1 el 6 de junio a las 17:00 horas bolivianas en New Jersey contra Escocia, otro equipo mundialista que tambi\u00e9n se prepara para su participaci\u00f3n en la Copa Mundial. Escocia enfrentar\u00e1 a Hait\u00ed, Marruecos y Brasil durante su preparaci\u00f3n.\n\nEste partido contra Argelia representa una gran oportunidad para que la selecci\u00f3n boliviana ajuste su estrategia y mejore su rendimiento antes del inicio del torneo mundialista. Los aficionados esperan ver un buen desempe\u00f1o del equipo y apoyar a sus jugadores en este camino hacia el futuro.", "dateTimeNews": "2026-05-28T01:04:59+00:00", "dateTimeReceived": "", "pic": "https://lapatria.bo/wp-content/uploa  \u00e1reas: exposici\u00f3n de stands, presentaciones comerciales y conferencias t\u00e9cnicas especializadas, donde se abordar\u00e1n temas como movilidad el\u00e9ctrica, ciudades inteligentes, eficiencia energ\u00e9tica, energ\u00eda solar, hidr\u00f3geno, biog\u00e1s y nuevas tecnolog\u00edas aplicadas al sector el\u00e9ctrico.\n\nDesde ENDE Corporaci\u00f3n resaltaron que el evento representa una apuesta por el desarrollo en medio de la coyuntura econ\u00f3mica que atraviesa el pa\u00eds.\n\n\u201cBolivia atraviesa momentos dif\u00edciles, pero nosotros apostamos por el trabajo y por el desarrollo. Creemos que este es el camino para que el pa\u00eds avance\u201d, se\u00f1al\u00f3 el vicepresidente de la estatal el\u00e9ctrica, Luis Fernando A\u00f1ez.\n\nPor su parte, representantes de CRE afirmaron que Finergy 2026 se realiza en una etapa decisiva para el sistema energ\u00e9tico nacional, marcada por nuevas disposiciones que impulsan la generaci\u00f3n distribuida, la eficiencia energ\u00e9tica y las energ\u00edas renovables.\n\n\u201cFinergy se convierte en el espacio ideal para analizar estas tem\u00e1ticas, debatir soluciones y generar propuestas para el corto, mediano y largo plazo\u201d, indicaron.\n\nLa programaci\u00f3n incluir\u00e1 exposiciones t\u00e9cnicas y comerciales de empresas nacionales e internacionales, adem\u00e1s de espacios de networking y foros especializados. Entre las conferencias destacadas figuran presentaciones sobre electromovilidad, transici\u00f3n energ\u00e9tica, energ\u00eda e\u00f3lica en Santa Cruz, almacenamiento energ\u00e9tico y nuevas tecnolog\u00edas para sistemas de generaci\u00f3n y distribuci\u00f3n.\n\nAdem\u00e1s, durante la \u00faltima jornada se realizar\u00e1 el sorteo de un sistema solar para vivienda o negocio, impulsado junto a AMESOL.\n\nCon ocho a\u00f1os de trayectoria, Finergy se consolid\u00f3 como una de las principales plataformas del pa\u00eds para conectar innovaci\u00f3n, negocios y conocimiento en t     function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function safeUrl(value) {
      const url = String(value || "").trim();
      if (url.startsWith("http://") || url.startsWith("https://")) {
        return url;
      }
      return "#";
    }

    function formatHourMinute(value) {
      const raw = String(value || "").trim();
      if (!raw) {
        return "";
      }

      const match = raw.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
      if (!match) {
        return "";
      }

      const hours = match[1].padStart(2, "0");
      const minutes = match[2];
      return `${hours}:${minutes}`;
    }

    function buildLegacyDateTime(dateValue, timeValue) {
      const dateText = String(dateValue || "").trim();
      if (!dateText) {
        return "";
      }

      const hourText = formatHourMinute(timeValue);
      if (!hourText) {
        return `${dateText}T00:00:00`;
      }

      return `${dateText}T${hourText}:00`;
    }

    function parseDateTimeParts(value) {
      const raw = String(value || "").trim();
      if (!raw) {
        return { date: "", time: "" };
      }

      const dateMatch = raw.match(/(\d{4})-(\d{2})-(\d{2})/);
      const timeText = formatHourMinute(raw);
      if (!dateMatch) {
        return { date: "", time: timeText };
      }

      const year = dateMatch[1].slice(2);
      const month = dateMatch[2];
      const day = dateMatch[3];
      return {
        date: `${day}/${month}/${year}`,
        time: timeText
      };
    }

    function buildDateTimeDisplayString(dateTimeNews, dateTimeReceived) {
      const published = parseDateTimeParts(dateTimeNews);
      const received = parseDateTimeParts(dateTimeReceived);
      const parts = [];

      const sameDate = published.date && received.date && published.date === received.date;
      const sameTime = published.time && received.time && published.time === received.time;

      if (sameDate) {
        parts.push(`Fecha: ${published.date}`);
        if (sameTime) {
          parts.push(`Hora: ${published.time}`);
          return parts.join(" | ");
        }

        if (published.time) {
          parts.push(`Publicado: ${published.time}`);
        }
        if (received.time) {
          parts.push(`Recibido: ${received.time}`);
        }
        return parts.join(" | ");
      }

      if (published.date || published.time) {
        const publishedParts = [published.date, published.time].filter((part) => part);
        parts.push(`Publicado: ${publishedParts.join(" ")}`);
      }

      if (received.date || received.time) {
        const receivedParts = [received.date, received.time].filter((part) => part);
        parts.push(`Recibido: ${receivedParts.join(" ")}`);
      }

      if (parts.length === 0) {
        parts.push("Fecha:");
      }

      return parts.join(" | ");
    }

    rawClusters.forEach((cluster, index) => {
      const order = buildOrderFromCluster(cluster);
      const lane = riskCategories[index % riskCategories.length];

      order.riskStatus = lane.status;
      order.riskBadge = lane.badge;
      order.riskColor = lane.progressColor;

      categories[0].orders.push(order);
      lane.orders.push(order);
    });

    let activeTab = 0;

    function tabButton(category, index) {
      const selected = index === activeTab;
      return `
        <button
          type="button"
          data-index="${index}"
          class="inline-flex items-center gap-2 rounded-md border px-3 py-2 text-sm font-medium transition ${selected ? "border-gray-300 bg-white text-gray-900 dark:border-gray-600 dark:bg-gray-950 dark:text-gray-100" : "border-transparent text-gray-600 hover:border-gray-300 dark:text-gray-400 dark:hover:border-gray-700"}"
        >
          <span class="${category.iconColor} hidden sm:inline">${category.icon}</span>
          <span>${category.status}</span>
          <span class="rounded bg-gray-100 px-2 py-0.5 text-xs font-semibold tabular-nums ring-1 ring-inset ring-gray-200 dark:bg-gray-800 dark:ring-gray-700">${category.orders.length}</span>
        </button>
      `;
    }

    function renderActorsList(actors) {
      if (!Array.isArray(actors) || actors.length === 0) {
        return "";
      }

      const actorTags = actors
        .filter((item) => String(item || "").trim())
        .map((item) => `
          <span class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 dark:border-gray-700 dark:text-gray-300">${escapeHtml(item)}</span>
        `)
        .join("");

      if (!actorTags) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Actores</p>
          ${actorTags}
        </div>
      `;
    }

    function renderSimilarCoverage(similar) {
      if (!Array.isArray(similar) || similar.length === 0) {
        return "";
      }

      const links = similar
        .filter((item) => item && item.source && item.url)
        .map((item) => `
          <a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer" class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 hover:border-blue-400 hover:text-blue-700 dark:border-gray-700 dark:text-gray-300 dark:hover:border-blue-500 dark:hover:text-blue-400">${escapeHtml(item.source)}</a>
        `)
        .join("");

      if (!links) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Cobertura similar</p>
          ${links}
        </div>
      `;
    }

    function orderCard(order, statusClass, statusText, progressColor) {
      const progress = Math.round((order.fulfillmentActual / order.fulfillmentTotal) * 100);
      const safeBodyText = order.body ? `${order.body.slice(0, 220)}${order.body.length > 220 ? "..." : ""}` : "No hay resumen disponible.";
      const safeTitle = escapeHtml(order.item);
      const safeSource = escapeHtml(order.company);
      const safeAuthor = escapeHtml(order.author || "");
      const subtitle = safeAuthor ? `${safeSource} | ${safeAuthor}` : safeSource;
      const safeBody = escapeHtml(safeBodyText);
      const articleUrl = safeUrl(order.url);
      const pictureUrl = safeUrl(order.pic);
      const dateTimeText = buildDateTimeDisplayString(order.dateTimeNews, order.dateTimeReceived);
      const imageBlock = pictureUrl === "#"
        ? ""
        : `<a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="block h-20 w-28 shrink-0 overflow-hidden rounded-md border border-gray-200 bg-gray-100 dark:border-gray-700 dark:bg-gray-800"><img src="${pictureUrl}" alt="Imagen de noticia" class="h-full w-full object-cover" loading="lazy"></a>`;

      return `
        <article class="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900 sm:p-5">
          <div class="flex items-start gap-3">
            ${imageBlock}

            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <h4 class="min-w-0 flex-1 truncate text-sm font-medium text-gray-900 dark:text-gray-100">
                  <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-700 dark:hover:text-blue-400">${safeTitle}</a>
                </h4>
                <span class="inline-flex items-center whitespace-nowrap rounded px-1.5 py-0.5 text-xs font-medium ring-1 ring-inset ${statusClass}">${statusText}</span>
              </div>

              <div class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                <p>${subtitle}</p>
              </div>

              <p class="mt-3 text-sm leading-6 text-gray-700 dark:text-gray-300">${safeBody}</p>

              ${renderActorsList(order.actors)}

              ${renderSimilarCoverage(order.similar)}
            </div>
          </div>

          <hr class="my-4 border-gray-200 dark:border-gray-700">

          <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-2">
              <span class="progress-ring" style="background: conic-gradient(${progressColor} ${progress}%, rgb(209 213 219) ${progress}% 100%); --ring-inner: rgb(255 255 255);"></span>
              <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Riesgo</p>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(dateTimeText)}</p>
          </div>
        </article>
      `;
    }

    function emptyPanel() {
      return `
        <article class="rounded-lg border border-dashed border-gray-300 bg-gray-50 p-6 text-sm text-gray-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-400">
          No hay noticias disponibles en esta seccion.
        </article>
      `;
    }

    function render() {
      const list = document.getElementById("tab-list");
      const panel = document.getElementById("panel");
      const current = categories[activeTab];
      const showAll = activeTab === 0;

      list.innerHTML = categories.map(tabButton).join("");
      panel.innerHTML = current.orders.length
        ? current.orders
            .map((order) => {
              const badge = showAll ? order.riskBadge : current.badge;
              const status = showAll ? order.riskStatus : current.status;
              const color = showAll ? order.riskColor : current.progressColor;
              return orderCard(order, badge, status, color);
            })
            .join("")
        : emptyPanel();

      list.querySelectorAll("button[data-index]").forEach((button) => {
        button.addEventListener("click", () => {
          activeTab = Number(button.getAttribute("data-index"));
          render();
        });
      });
    }

    render();
  </script>
</body>
</html>
