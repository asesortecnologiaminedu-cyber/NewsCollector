  <script>
    const rawClusters = [{"actor": [], "authors": ["La Patria"], "body": "El ministro de Econom\u00eda, Gabriel Espinoza, represent\u00f3 al Presidente en la reuni\u00f3n con los c\u00edvicos para tratar la crisis del pa\u00eds.\n\nFicha informativa El Presidente Rodrigo Paz no asisti\u00f3 a la reuni\u00f3n c\u00edvica en Santa Cruz, donde el Ministro de Econom\u00eda, Gabriel Espinoza, represent\u00f3 al Gobierno para tratar la crisis del pa\u00eds y buscar soluciones a los bloqueos. Toca para ver el contexto completo Contexto: Los c\u00edvicos esperaban la presencia del Presidente, quien hab\u00eda comprometido su asistencia un d\u00eda antes. Stello Cochamanidis, presidente c\u00edvico cruce\u00f1o, enfatiz\u00f3 el respeto a la democracia como tema central. Se mencion\u00f3 el estado de excepci\u00f3n como posible respuesta a los conflictos sociales. Gabriel Espinoza asegur\u00f3 que est\u00e1 enviado por el presidente Paz para escuchar y trabajar con los movimientos c\u00edvicos. El Gobierno no atender\u00e1 pedidos que promuevan la desestabilizaci\u00f3n de la democracia. Por qu\u00e9 importa: La ausencia del Presidente podr\u00eda afectar la percepci\u00f3n de di\u00e1logo entre el Gobierno y los c\u00edvicos. La posibilidad de un estado de excepci\u00f3n podr\u00eda intensificar las tensiones sociales y pol\u00edticas en el pa\u00eds. Datos clave: Fecha: 28 de mayo\n\n28 de mayo Lugar: Comit\u00e9 Pro Santa Cruz\n\nComit\u00e9 Pro Santa Cruz N\u00famero de departamentos: 9 IngresarDesbloquear acceso completo\n\nRodrigo Paz no asiste a reuni\u00f3n con c\u00edvicos en Santa Cruz \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nPresidente Rodrigo Paz no asiste a reuni\u00f3n c\u00edvica en Santa Cruz\n\nEste jueves 28 de mayo, el Presidente Rodrigo Paz no asisti\u00f3 a la reuni\u00f3n programada con los c\u00edvicos nacionales en las instalaciones del Comit\u00e9 Pro Santa Cruz. Los c\u00edvicos esperaban su presencia, ya que un d\u00eda antes hab\u00eda comprometido su llegada para analizar la coyuntura y plantear soluciones a la crisis Bolivia.\n\nExpectativas de los c\u00edvicos\n\nLos presidentes de los comit\u00e9s c\u00edvicos de los nueve departamentos aguardaban al Presidente y a ministros de Estado en Santa Cruz. El objetivo era discutir la crisis derivada de los bloqueos y proponer medidas para restablecer la normalidad en el pa\u00eds.\n\nDeclaraciones del presidente c\u00edvico cruce\u00f1o\n\nEn este contexto, Stello Cochamanidis, presidente c\u00edvico cruce\u00f1o, mencion\u00f3 que \u201cel tema central a tratar ser\u00e1 el respeto a la democracia y la situaci\u00f3n cr\u00edtica que est\u00e1 viviendo el pa\u00eds\u201d. Adem\u00e1s, se refiri\u00f3 al estado de excepci\u00f3n como una posibilidad ante los conflictos sociales que mantienen cercadas a las ciudades de La Paz y El Alto.\n\nLlegada del Ministro de Econom\u00eda\n\nEl ministro de Econom\u00eda, Gabriel Espinoza, lleg\u00f3 al encuentro en lugar del Presidente. Espinoza asegur\u00f3 que tiene instrucciones de escuchar y trabajar en propuestas. \u201cComo Gobierno nacional estamos abiertos al di\u00e1logo en todos los espacios. Yo estoy enviado por el Presidente Paz para escuchar a los movimientos c\u00edvicos y trabajar con ellos\u201d, afirm\u00f3 Espinoza.\n\nCompromiso del Gobierno con el di\u00e1logo\n\nAsimismo, remarc\u00f3 que el Gobierno est\u00e1 dialogando con diversos sectores sociales para solucionar los conflictos. Sin embargo, indic\u00f3 que no atender\u00e1n pedidos que promuevan la desestabilizaci\u00f3n de la democracia en Bolivia. \u201cEst\u00e1 claro que hay personas con reclamos v\u00e1lidos y otras con otra agenda que impulsan situaciones de desestabilizaci\u00f3n en el pa\u00eds y tendr\u00e1n que responder a la ley\u201d, agreg\u00f3.\n\nPosibilidad del estado de excepci\u00f3n\n\nFinalmente, Cochamanidis tambi\u00e9n se\u00f1al\u00f3: \u201cSiempre hemos dicho que se debe actuar con la Constituci\u00f3n por delante; el estado de excepci\u00f3n es una de las opciones que hoy est\u00e1 en manos absolutas del Ejecutivo sobre lo que vaya a pasar de aqu\u00ed en adelante\u201d.", "dateTimeNews": "2026-05-28T17:28:41+00:00", "dateTimeReceived": "2026-05-28T17:37:04+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a187985d1fb2.jpg", "position": 1, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/28/paz-no-llega-a-reunion-con-civicos-espinoza-dice-que-escuchara-propuestas/"}], "source": "La Patria", "title": "Rodrigo Paz no asiste a reuni\u00f3n con c\u00edvicos en Santa Cruz - La Patria 3.0", "url": "https://lapatria.bo/actualidad/rodrigo-paz-no-asiste-a-reunion-con-civicos-en-santa-cruz/"}, {"actor": [], "authors": ["La Patria"], "body": "El Comit\u00e9 Cient\u00edfico investiga el caso de una ni\u00f1a fallecida por sarampi\u00f3n y parvovirus, resaltando la urgencia de vacunar a los ni\u00f1os\n\nFicha informativa El Comit\u00e9 Cient\u00edfico investiga la muerte de una ni\u00f1a de siete a\u00f1os por complicaciones de sarampi\u00f3n y parvovirus, resaltando la urgencia de vacunar a los ni\u00f1os. Toca para ver el contexto completo Contexto: La ni\u00f1a present\u00f3 una coinfecci\u00f3n con parvovirus y otras infecciones. El epidemi\u00f3logo Roberto Torrez mencion\u00f3 que las enfermedades no suelen agravarse en un organismo previamente sano. Se requiere un an\u00e1lisis profundo para determinar si el sarampi\u00f3n fue la causa del deceso. El caso se convierte en un evento significativo dentro del contexto epidemiol\u00f3gico actual, dado que es el primer paciente con sarampi\u00f3n atendido en el a\u00f1o en un hospital de tercer nivel. Por qu\u00e9 importa: La comunidad m\u00e9dica considera preocupante este evento at\u00edpico. Se hace un llamado urgente a los padres para vacunar a sus hijos, asegurando as\u00ed la inmunizaci\u00f3n colectiva. Datos clave: Fecha del fallecimiento: 26 de mayo\n\n26 de mayo Edad de la ni\u00f1a: 7 a\u00f1os\n\n7 a\u00f1os D\u00edas internada: 19 d\u00edas\n\n19 d\u00edas Primer caso de sarampi\u00f3n del a\u00f1o: en el Hospital de Ni\u00f1os Mario Ortiz Su\u00e1rez\n\nen el Hospital de Ni\u00f1os Mario Ortiz Su\u00e1rez N\u00famero de pacientes recuperados: m\u00e1s de 600 IngresarDesbloquear acceso completo\n\nInvestigan la muerte de una ni\u00f1a por sarampi\u00f3n y parvovirus \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nInvestigaci\u00f3n sobre la muerte de una ni\u00f1a por sarampi\u00f3n\n\nEl Comit\u00e9 Cient\u00edfico Departamental de Santa Cruz analizar\u00e1 el fallecimiento de una ni\u00f1a tras las complicaciones severas provocadas por su coinfecci\u00f3n. Esta informaci\u00f3n provino del epidemi\u00f3logo del Hospital de Ni\u00f1os Mario Ortiz Su\u00e1rez, Roberto Torrez, quien detall\u00f3 la situaci\u00f3n.\n\nDetalles del caso\n\nLa noche del 26 de mayo, una ni\u00f1a de siete a\u00f1os falleci\u00f3 en el Hospital de Ni\u00f1os Mario Ortiz Su\u00e1rez. La menor estuvo internada durante 19 d\u00edas, tiempo en el cual su estado general se deterior\u00f3 de manera progresiva e irreversible. Torrez explic\u00f3 que el caso requiere un an\u00e1lisis exhaustivo, ya que la paciente presentaba una coinfecci\u00f3n con parvovirus y otras infecciones. A\u00fan se debe determinar si el sarampi\u00f3n fue la causa directa del deceso.\n\nComplicaciones multisist\u00e9micas\n\nEl doctor Torrez lament\u00f3 que este conjunto complejo de enfermedades generara complicaciones multisist\u00e9micas que llevaron a la muerte de la menor. Adem\u00e1s, enfatiz\u00f3 la necesidad de investigar si exist\u00eda alguna patolog\u00eda subyacente o condici\u00f3n m\u00e9dica previa no diagnosticada. Las enfermedades detectadas en la paciente no suelen agravarse as\u00ed en un organismo previamente sano.\n\nContexto epidemiol\u00f3gico\n\nEn cuanto al contexto epidemiol\u00f3gico, las autoridades sanitarias confirmaron que esta ni\u00f1a se convirti\u00f3 en la primera paciente con sarampi\u00f3n atendida este a\u00f1o en el Hospital de Ni\u00f1os Mario Ortiz Su\u00e1rez. El epidemi\u00f3logo indic\u00f3 que es el primer caso registrado que requiri\u00f3 atenci\u00f3n m\u00e9dica de emergencia en un hospital de tercer nivel, lo que convierte a este hecho en un evento at\u00edpico y preocupante para la comunidad m\u00e9dica.\n\nRecomendaciones a los padres\n\nAnte esta situaci\u00f3n, el m\u00e9dico extendi\u00f3 una recomendaci\u00f3n urgente a los padres para que acudan a los centros de salud locales y aseguren que sus hijos reciban la vacuna contra el sarampi\u00f3n, completando as\u00ed sus esquemas de inmunizaci\u00f3n. Para contrarrestar el alarmismo, Torrez destac\u00f3 que ya se registran m\u00e1s de 600 pacientes recuperados satisfactoriamente de la enfermedad en el departamento, cifra que demuestra la efectividad e importancia de la inmunizaci\u00f3n colectiva.", "dateTimeNews": "2026-05-28T17:21:46+00:00", "dateTimeReceived": "2026-05-28T17:37:04+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a1873479e93a.jpg", "position": 2, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/santa-cruz/caso-nina-fallecida-sarampion-parvovirus-sera-analizado-comite-cientifico_1779973395"}], "source": "La Patria", "title": "Investigan la muerte de una ni\u00f1a por sarampi\u00f3n y parvovirus - La Patria 3.0", "url": "https://lapatria.bo/actualidad/investigan-la-muerte-de-una-nina-por-sarampion-y-parvovirus/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "Un apag\u00f3n el\u00e9ctrico, que se alarg\u00f3 por casi dos horas, puso en alerta a los seguidores de Evo Morales en el Tr\u00f3pico de Cochabamba y los sectores radicalizaron sus bloqueos y vigilias para \u201cproteger\u201d al expresidente, quien tiene \u00f3rdenes aprehensi\u00f3n vigente en su contra por el caso de trata de personas.\n\nLos evistas denunciaron que el apag\u00f3n fue por \u201c\u00f3rdenes\u201d del Gobierno para supuestamente detener a Morales, por lo que inmediatamente aumentaron sus puntos de bloqueo en la regi\u00f3n.\n\nEl dirigente Juan Carlos Fern\u00e1ndez dijo a Kawsachun Coca que el apag\u00f3n fue un acto de intimidaci\u00f3n de parte del Gobierno y advirti\u00f3 que \u00absi quiere guerra, guerra tendr\u00e1\u00bb.\n\nLa misma radio cocalera inform\u00f3 que desde esta jornada el Tr\u00f3pico se encuentra \u201ccon bloqueo indefinido de carreteras y movilizaci\u00f3n permanente\u201d.\n\nEntretanto, el ministro de la Presidencia, Jos\u00e9 Luis Lupo, se\u00f1al\u00f3 que, seg\u00fan los reportes, el apag\u00f3n fue causado por la ca\u00edda de un poste de alta tensi\u00f3n que dej\u00f3 sin luz a estos municipios por m\u00e1s de dos horas.\n\n\u201cS\u00f3lo he escuchado que cay\u00f3 un poste de alta tensi\u00f3n\u201d, afirm\u00f3 el ministro en contacto con la Red Uno.\n\nMorales, cabe se\u00f1alar, tiene \u00f3rdenes de aprehensi\u00f3n vigentes acusado por el delito de trata de personas con agravante por haber mantenido una relaci\u00f3n y haber embarazado a una joven menor de edad a\u00f1os atr\u00e1s.", "dateTimeNews": "2026-05-28T17:14:20+00:00", "dateTimeReceived": "2026-05-28T17:37:23+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/bloqueo_tropico.png", "position": 3, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/apagon-en-el-tropico-genera-bloqueos-en-defensa-de-evo-morales/"}], "source": "Ox\u00edgeno", "title": "Apag\u00f3n el\u00e9ctrico en el Tr\u00f3pico pone en alerta a evistas y se radicalizan los bloqueos en la regi\u00f3n", "url": "https://oxigeno.bo/apagon-electrico-en-el-tropico-pone-en-alerta-a-evistas-y-se-radicalizan-los-bloqueos-en-la-region/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "En Santa Cruz, Bol\u00edvar no estuvo a la altura. En un flojo partido, perdi\u00f3 ante Independiente Rivadavia de Argentina (1-3) y qued\u00f3 eliminado de la Libertadores.\n\nLa Academia ten\u00eda que ganar para pasar a octavos del torneo de clubes m\u00e1s importante de este lado del mundo, pero fall\u00f3 y ahora deber\u00e1 conformarse con disputar los play-off de la Sudamericana.\n\nAs\u00ed como el propio estadio Tahuichi, Bol\u00edvar se qued\u00f3 sin luces r\u00e1pidamente -el partido se detuvo el primer tiempo por m\u00e1s de 5 minutos por fallos en la iluminaci\u00f3n- y dej\u00f3 claro que tiene muchos problemas defensivos.\n\nY es que aunque tuvo el dominio del bal\u00f3n gran parte del encuentro, vio caer su arco en tres contragolpes r\u00e1pidos. La velocidad del equipo argentino sac\u00f3 a relucir las debilidades de la defensa celeste.\n\nPrecisamente un primer contragolpe argentino dio la \u00fanica emoci\u00f3n a la etapa inicial. Tras un tiro de esquina acad\u00e9mico, Independiente Rivadavia logr\u00f3 hacer un contragolpe y con tres toques dej\u00f3 a Leonel Bucca solo frente a Lampe y el jugador visitante logr\u00f3 el primer con un tiro cruzado (45+7\u2019).\n\nCon el gol en contra, Bol\u00edvar se mostr\u00f3 m\u00e1s protagonista en el segundo tiempo, pero nunca tuvo la claridad para encontrar la ruta del gol. El empate, de hecho, lleg\u00f3 gracias a un remate de Robson Matheus que rebot\u00f3 en Cauteruccio para confundir al arquero rival y poner tablas en el marcador (55\u2019).\n\nEmpero, ni el empate dio las ideas y fortalezas a Bol\u00edvar para lograr el gol de la clasificaci\u00f3n y, de hecho, pudo volver a estar en desventaja, pero el gol visitante se anul\u00f3 por mano previa.\n\nYa en el final del encuentro la desesperaci\u00f3n provoc\u00f3 que descuide, en demas\u00eda, su parte defensiva e Independiente Rivadavia volvi\u00f3 a sacar su velocidad.\n\nEn las \u00faltimas jugadas del encuentro, el visitante atac\u00f3 siempre con mayor\u00eda de jugadores y fue su gran figura, Sebasti\u00e1n Villa, quien encar\u00f3 con esa ventaja. Siempre fingiendo con habilitar a su compa\u00f1ero, se hizo el espacio para sacar un remate que dej\u00f3 sin reacci\u00f3n a un desconocido Carlos Lampe para marcar el 2-1 (92\u2019).\n\nPor si fuera poco, la estocada final lleg\u00f3 en la \u00faltima jugada del encuentro. Lampe dej\u00f3 escapar un remate centrado y permiti\u00f3 que Diego Crego anote el definitivo 3 a 1.\n\nAs\u00ed, la Academia dej\u00f3 escapar una gran oportunidad de pasar a octavos, pero, al menos, ser\u00e1 el \u00fanico club boliviano con competencia internacional en el segundo semestre del a\u00f1o.", "dateTimeNews": "2026-05-28T17:14:13+00:00", "dateTimeReceived": "2026-05-28T17:37:24+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/bolivar_independiente_rivadavia1.jpg", "position": 4, "similar": [{"source": "ATB Digital", "url": "https://www.atb.com.bo/2026/05/28/bolivar-cae-ante-independiente-rivadavia-y-seguira-su-camino-en-la-sudamericana/"}], "source": "Ox\u00edgeno", "title": "Libertadores: Bol\u00edvar no estuvo a la altura, perdi\u00f3 con Independiente Rivadavia en Santa Cruz y pas\u00f3 a la Sudamericana", "url": "https://oxigeno.bo/libertadores-bolivar-no-estuvo-a-la-altura-perdio-con-independiente-rivadavia-en-santa-cruz-y-paso-a-la-sudamericana/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "El vicepresidente del Estado, Edmand Lara, particip\u00f3 de la audiencia de la Acci\u00f3n de Libertad planteada por el secretario general de la Central Obrera Boliviana (COB), Mario Argollo, y en la oportunidad apoy\u00f3 la tutela solicitada por el dirigente cobista.\n\n\u201cVicepresidencia del Estado Plurinacional de Bolivia, en calidad de Tercer Interesado, particip\u00f3 en la audiencia virtual desarrollada dentro de la Acci\u00f3n de Libertad Preventiva relacionada con la situaci\u00f3n del dirigente m\u00e1ximo de la Central Obrera Boliviana (COB), Mario Argollo\u201d, inform\u00f3 la instituci\u00f3n a trav\u00e9s de sus cuentas en las redes sociales.\n\nLa Vicepresidencia, en ese sentido, inform\u00f3 que Lara \u201csolicit\u00f3 a la autoridad jurisdiccional conceder la tutela impetrada en la presente acci\u00f3n, con el objetivo de resguardar las garant\u00edas constitucionales y convencionales de los ciudadanos expuestos a riesgo inminente en el territorio nacional\u201d.\n\nAsimismo, se inform\u00f3 que Lara tambi\u00e9n pidi\u00f3 a la autoridad jurisdiccional disponer la restricci\u00f3n expresa para que el \u00d3rgano Ejecutivo no disponga medidas de excepci\u00f3n o militarizaci\u00f3n sin respaldo legal.\n\n\u201cSe solicit\u00f3 disponer la restricci\u00f3n expresa para que el \u00d3rgano Ejecutivo se abstenga de ordenar, dictar o ejecutar medidas propias de un Estado de Excepci\u00f3n o militarizaci\u00f3n del orden interno, mientras la Asamblea Legislativa Plurinacional no restituya una ley formal que regule la materia, en cumplimiento del art\u00edculo 139, par\u00e1grafo III de la Constituci\u00f3n Pol\u00edtica del Estado\u201d, a\u00f1ade la informaci\u00f3n.\n\nLa anulaci\u00f3n de la orden de aprehensi\u00f3n contra Argollo \u2013 por instigaci\u00f3n p\u00fablica a delinquir y terrorismo- es una de las condiciones de parte de los grupos movilizados para acudir a la \u201cComisi\u00f3n de di\u00e1logo.\u201d Convocada por Lara.\n\nEn ese sentido, la ma\u00f1ana de este jueves, en entrevista con Unitel, el Ministro de la Presidencia confirm\u00f3 que el Gobierno envi\u00f3 las respectivas invitaciones para entablar el di\u00e1logo con Vicente Choque y Mario Argollo, secretarios ejecutivos de la Federaci\u00f3n Departamental de Trabajadores Campesinos de La Paz \u201cTupac Katari\u201d y la Central Obrera Boliviana (COB), respectivamente.\n\nEn ese sentido, el Ministro afirm\u00f3 que el Gobierno dar\u00e1 las \u201cgarant\u00edas\u201d para que se pueda entablar el di\u00e1logo, lo que, especific\u00f3, significa que no se ejecutar\u00e1n las \u00f3rdenes de aprehensi\u00f3n que hayan en su contra.\n\n\u201cObviamente que nosotros garantizamos que durante la reuni\u00f3n y en la reuni\u00f3n van a poder gozar de todas las garant\u00edas para poder desarrollar de forma adecuada y encontrar las soluciones que corresponda\u201d, asegur\u00f3.\n\nNo obstante, el ministro de Obras P\u00fablicas, Mauricio Zamora, se\u00f1al\u00f3 que la decisi\u00f3n depende de la Fiscal\u00eda y no del Gobierno.\n\n\u201cYa no depende del Gobierno, hay una independencia de poderes y no es que el Gobierno dice a qui\u00e9n aprenden y a qui\u00e9n no, eso ya pas\u00f3. Ah\u00ed ya tendr\u00eda que ver la Fiscal\u00eda, pero no puede ser un condicionamiento, porque si alguien comete delito no puedes decir su\u00e9ltenlo\u201d, asever\u00f3 a Radio Fides.\n\nEste jueves se cumplen 28 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-28T17:13:27+00:00", "dateTimeReceived": "2026-05-28T17:24:40+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/lara_argollo-scaled.jpg", "position": 5, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/lupo-confirma-que-se-cito-al-dialogo-a-choque-y-argollo-y-asegura-no-se-ejecutaran-sus-ordenes-de-aprehension/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/mineros-exigen-a-lara-que-se-deje-sin-efecto-el-mandamiento-de-aprehension-contra-argollo-para-ir-al-dialogo/"}], "source": "Ox\u00edgeno", "title": "En audiencia, Lara respalda la Acci\u00f3n de Libertad de Argollo y pide evitar medidas de excepci\u00f3n sin respaldo legal", "url": "https://oxigeno.bo/en-audiencia-lara-respalda-la-accion-de-libertad-de-argollo-y-pide-evitar-medidas-de-excepcion-sin-respaldo-legal/"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nEl presidente Rodrigo Paz no particip\u00f3 este jueves de la reuni\u00f3n convocada por los comit\u00e9s c\u00edvicos de los nueve departamentos, pese a que los representantes esperaban sostener un encuentro directo con el mandatario para abordar la crisis social y pol\u00edtica que atraviesa el pa\u00eds.\n\nEn su lugar, el Gobierno envi\u00f3 al ministro de Econom\u00eda, Gabriel Espinoza, quien finalmente no ingres\u00f3 a la reuni\u00f3n debido a que los c\u00edvicos decidieron continuar deliberando entre ellos sin recibir a la comisi\u00f3n oficialista.\n\n\u201cEl presidente ha hablado con ellos. Entendemos que las representaciones c\u00edvicas est\u00e1n dialogando entre ellas y nos han pedido que todav\u00eda no ingresemos, o bueno, que no ingresemos. Quer\u00edan que el presidente venga\u201d, afirm\u00f3 Espinoza ante los medios.\n\nLea tambi\u00e9n: Bolivia amanece con 64 puntos de bloqueo en medio de nuevos intentos de di\u00e1logo\n\nExplic\u00f3 que Paz ten\u00eda prevista su participaci\u00f3n en el encuentro, aunque cambi\u00f3 su agenda debido a los conflictos que enfrenta el pa\u00eds y permaneci\u00f3 en La Paz para atender otros asuntos vinculados a la crisis.\n\nEspinoza se\u00f1al\u00f3 que lleg\u00f3 a Santa Cruz con el objetivo de transmitir las disculpas del mandatario y reiterar la disposici\u00f3n del Ejecutivo para dialogar con los distintos sectores.\n\nEl ministro tambi\u00e9n alert\u00f3 sobre las p\u00e9rdidas econ\u00f3micas derivadas de los conflictos. Seg\u00fan indic\u00f3, las exportaciones ya registran afectaciones cercanas a los $us 500 millones y varios sectores productivos enfrentan complicaciones por las medidas de presi\u00f3n.\n\nSe prev\u00e9 la participaci\u00f3n de Paz en el di\u00e1logo que propiciar\u00e1 la Iglesia Cat\u00f3lica.", "dateTimeNews": "2026-05-28T16:55:54+00:00", "dateTimeReceived": "2026-05-28T17:24:36+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/WhatsApp-Image-2026-05-28-at-11.46.23.webp", "position": 6, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/santa-cruz/presidente-rodrigo-paz-no-logro-acudir-reunion-civicos-santa-cruz_1779985851"}], "source": "La Raz\u00f3n", "title": "C\u00edvicos esperaban a Paz y rechazan reuni\u00f3n con ministro enviado por el Gobierno", "url": "https://larazon.bo/nacional/2026/05/28/civicos-esperaban-a-paz-y-rechazan-reunion-con-ministro-enviado-por-el-gobierno/"}, {"actor": [], "authors": ["La Patria"], "body": "La C\u00e1mara Departamental de la Peque\u00f1a Industria respalda la nueva ley tributaria que alivia deudas y promueve la reactivaci\u00f3n econ\u00f3mica\n\nFicha informativa La C\u00e1mara Departamental de la Peque\u00f1a Industria y Artesan\u00eda Productiva de Cochabamba respalda la Ley de Alivio Tributario, considerada fundamental para la reactivaci\u00f3n econ\u00f3mica y la supervivencia de unidades productivas en el pa\u00eds. Toca para ver el contexto completo Contexto: Luz Mary Zelaya, asesora de Cadepia, mencion\u00f3 el impacto devastador de la presi\u00f3n fiscal sobre los productores locales. Muchos emprendedores han cerrado o abandonado el pa\u00eds debido a los altos impuestos. El ministro de Econom\u00eda y Finanzas P\u00fablicas, Jos\u00e9 Gabriel Espinoza, calific\u00f3 la medida como un \u2018perdonazo tributario\u2019 y detall\u00f3 que se condonar\u00e1n tributos como el Impuesto al Valor Agregado (IVA), Impuesto sobre las Utilidades de las Empresas (IUE) e Impuesto a las Transacciones (IT). Por qu\u00e9 importa: La ley busca evitar el cierre definitivo de unidades productivas y contribuir a la reactivaci\u00f3n econ\u00f3mica global del pa\u00eds, beneficiando directamente a los productores al liberar deudas vinculadas a tributos esenciales. Datos clave: Hasta Bs 10 millones en deudas acumuladas pueden ser condonadas.\n\nen deudas acumuladas pueden ser condonadas. Deudas deben corresponder a dos periodos espec\u00edficos: hasta el 31 de diciembre de 2017 o durante la gesti\u00f3n 2020. IngresarDesbloquear acceso completo\n\nCochabamba: Peque\u00f1a Industria destaca beneficios de nueva ley tributaria \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nC\u00e1mara Departamental destaca beneficios de nueva ley tributaria\n\nLa C\u00e1mara Departamental de la Peque\u00f1a Industria y Artesan\u00eda Productiva (Cadepia) de Cochabamba, a trav\u00e9s de su asesora Luz Mary Zelaya, manifest\u00f3 un firme respaldo a la recientemente promulgada Ley de Alivio Tributario. En declaraciones ofrecidas a Bolivia Tv, la representante destac\u00f3 que esta normativa se constituye en una herramienta fundamental para que el sector productivo logre superar la crisis actual, evite el cierre definitivo de unidades productivas y contribuya de manera activa a la reactivaci\u00f3n econ\u00f3mica global de todo el pa\u00eds.\n\nImpacto positivo en el sector productivo\n\nZelaya describi\u00f3 el complejo panorama que enfrentaban los productores locales antes de la aprobaci\u00f3n de esta medida, se\u00f1alando el impacto devastador que la presi\u00f3n fiscal ejerc\u00eda sobre el sector. Al respecto, la asesora explic\u00f3 de forma contundente la dura realidad de muchos emprendedores: \u201cEste alivio tributario les va a ayudar para poder reactivarse, para poder pensar un poquito m\u00e1s en seguir haciendo industria en nuestro pa\u00eds porque muchos de ellos han tenido que cerrar, viajar o irse del pa\u00eds porque el cobro de los impuestos los ten\u00eda agotados\u201d.\n\nDetalles t\u00e9cnicos del ministro de Econom\u00eda\n\nEn sinton\u00eda con estas declaraciones, el ministro de Econom\u00eda y Finanzas P\u00fablicas, Jos\u00e9 Gabriel Espinoza, brind\u00f3 detalles t\u00e9cnicos sobre el alcance de la medida. La autoridad gubernamental inform\u00f3 que este mecanismo, calificado popularmente como un \u201cperdonazo tributario\u201d, contempla la condonaci\u00f3n de deudas acumuladas que alcancen un l\u00edmite de hasta Bs 10 millones.\n\nRequisitos para acogerse al beneficio\n\nPara acogerse a este beneficio excepcional, los contribuyentes deben cumplir con el requisito de que sus obligaciones fiscales pendientes correspondan estrictamente a dos periodos espec\u00edficos: aquellas deudas generadas de manera previa hasta el 31 de diciembre de 2017, o bien las que se originaron espec\u00edficamente durante la gesti\u00f3n 2020 debido a las restricciones operativas y la crisis sanitaria provocada por la pandemia de la Covid-19.\n\nTributos sujetos a condonaci\u00f3n estatal\n\nFinalmente, el ministro Espinoza precis\u00f3 cu\u00e1les ser\u00e1n los tributos espec\u00edficos de car\u00e1cter nacional que quedan sujetos a esta condonaci\u00f3n estatal. La medida beneficiar\u00e1 directamente a los productores al liberar deudas vinculadas a grav\u00e1menes esenciales para el funcionamiento empresarial, tales como el Impuesto al Valor Agregado (IVA), el Impuesto sobre las Utilidades de las Empresas (IUE) y el Impuesto a las Transacciones (IT), entre otros tributos cuya recaudaci\u00f3n y fiscalizaci\u00f3n dependen directamente del Servicio de Impuestos Nacionales (SIN).", "dateTimeNews": "2026-05-28T16:36:01+00:00", "dateTimeReceived": "2026-05-28T17:37:04+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a186b3c9a91a.jpg", "position": 7, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-promulga-el-perdonazo-tributario-se-condonara-deudas-de-hasta-bs-10-millones-generadas-hasta-2017-y-durante-2020/"}], "source": "La Patria", "title": "Cochabamba: Peque\u00f1a Industria destaca beneficios de nueva ley tributaria - La Patria 3.0", "url": "https://lapatria.bo/dinero-negocios/cochabamba-pequena-industria-destaca-beneficios-de-nueva-ley-tributaria/"}, {"actor": [], "authors": ["Carolina Galarza Villagran"], "body": "El presidente Rodrigo Paz no lleg\u00f3 hasta Santa Cruz para asistir a la reuni\u00f3n convocada por el movimiento c\u00edvico nacional. En su lugar, lleg\u00f3 hasta la capital cruce\u00f1a el ministro de Econom\u00eda, Jos\u00e9 Gabriel Espinoza, quien asegur\u00f3 que los conflictos que atraviesa el pa\u00eds, mayormente en la Paz, requieren la presencia del mandatario en la sede de Gobierno.\n\n\"Por la situaci\u00f3n que ten\u00edamos, tuvo que cambiar su agenda. No les puedo dar detalles, pero estamos en una situaci\u00f3n con varios temas pendientes. Estamos con varios temas hoy d\u00eda en desarrollo, y por lo tanto, el presidente me ha enviado primero para presentarles las excusas y las disculpas por su no asistencia. Estaba en su intenci\u00f3n de venir, por eso yo estoy ac\u00e1, pero claro, los dirigentes c\u00edvicos, con toda libertad y con todo el derecho que tienen, han preferido seguir discutiendo entre ellos\", indic\u00f3 el ministro a los medios de comunicaci\u00f3n.\n\nEspinoza habl\u00f3 con los medios | Foto: Juan Carlos Torrej\u00f3n\n\nLa autoridad asegur\u00f3 que el mandatario ten\u00eda previsto asistir al encuentro con los representantes c\u00edvicos de los nueve departamentos, pero la agenda presidencial tuvo que ser modificada por la coyuntura nacional.\n\n\u201cEl presidente ha hablado con ellos, acaba de cortar al tel\u00e9fono. Entendemos que las representaciones c\u00edvicas est\u00e1n dialogando entre ellos, as\u00ed que nos han pedido que no ingresemos todav\u00eda. Quer\u00edan que el presidente venga, pero est\u00e1 claro que el presidente, por la situaci\u00f3n que ten\u00edamos, tuvo que cambiar su agenda\u201d, se\u00f1al\u00f3 Espinoza.\n\nC\u00edvicos continuaron con la reuni\u00f3n pese a la ausencia del jefe de Estado\n\nLos nueve presidentes c\u00edvicos se reunieron en Santa Cruz de la Sierra para abordar soluciones ante los conflictos que vive Bolivia hace casi un mes. Bolivia este jueves presenta m\u00e1s de 60 bloqueos a nivel nacional, adem\u00e1s de amenazas con protestas de otras movilizaciones, como el sector de transporte pesado.\n\n\"Hay situaciones que est\u00e1n cambiando en cada minuto, requieren la presencia del presidente en La Paz. \u00c9l se ha comunicado por tel\u00e9fono con los dirigentes c\u00edvicos, ellos ya han recibido toda la informaci\u00f3n y los comentarios que requer\u00edan del presidente. Por lo tanto, contin\u00faan ellos con su reuni\u00f3n\u201d, sostuvo.\n\nEl ministro no entr\u00f3 a la reuni\u00f3n; los c\u00edvicos continuaron con su encuentro | Foto: Juan Carlos Torrej\u00f3n\n\nEspinoza manifest\u00f3 que el presidente ya se comunic\u00f3 telef\u00f3nicamente con los dirigentes c\u00edvicos y les transmiti\u00f3 la informaci\u00f3n requerida, mientras los representantes contin\u00faan reunidos.\n\nLa autoridad indic\u00f3 que la reuni\u00f3n con los c\u00edvicos no ser\u00e1 reprogramada, ya que el presidente ya sostuvo una conversaci\u00f3n con los dirigentes y les explic\u00f3 la situaci\u00f3n. Seg\u00fan la autoridad, los representantes c\u00edvicos decidieron continuar con el encuentro previsto.\n\n\"Entiendo que los c\u00edvicos van a tener una declaraci\u00f3n m\u00e1s tarde, como les digo, el presidente (Rodrigo Paz) ya ha hablado con ellos, por lo tanto no tendr\u00edamos necesidad de reprogramar\", a\u00f1adi\u00f3.\n\nBloqueos y conflictos impactan en la econom\u00eda; Gobierno se apega a acciones constitucionales\n\nReuni\u00f3n de los c\u00edvicos | Foto: Juan Carlos Torrej\u00f3n\n\nRespecto al impacto econ\u00f3mico de los bloqueos, el ministro afirm\u00f3 que las p\u00e9rdidas por exportaciones ya superan los 500 millones de d\u00f3lares, adem\u00e1s de afectar a transportistas, gremiales y al sector tur\u00edstico.\n\n\u201cUn chofer por d\u00eda pierde entre 150 y 200 Bs de ingresos. Un gremial pierde entre 200 y 250 Bs. A eso, adem\u00e1s, hay que sumarle todo el impacto que se tiene en sectores como el turismo, donde estamos registrando suspensiones de reservas de cerca de tres o cuatro meses adelante\u201d, detall\u00f3.\n\nLa autoridad remarc\u00f3 que el Gobierno trabaja dentro del marco constitucional y se\u00f1al\u00f3 que la aplicaci\u00f3n de un estado de excepci\u00f3n contin\u00faa siendo una medida contemplada legalmente.\n\n\u201cNosotros estamos trabajando dentro de la Constituci\u00f3n. Evidentemente estas medidas est\u00e1n dentro de la Constituci\u00f3n, siempre y cuando se cumpla el procedimiento y el marco constitucional. Esto implica una ley en el Congreso, ya se ha avanzado, el Congreso ha avanzado en la eliminaci\u00f3n de la ley que restring\u00eda esta aplicaci\u00f3n, y obviamente se sigue trabajando en ese marco constitucional\", explic\u00f3 sobre la aplicaci\u00f3n de Estado de Excepci\u00f3n.", "dateTimeNews": "2026-05-28T16:30:51+00:00", "dateTimeReceived": "2026-05-28T17:36:55+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779985822925.jpeg?\u0026cw=1200\u0026ch=630", "position": 8, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/28/civicos-esperaban-a-paz-y-rechazan-reunion-con-ministro-enviado-por-el-gobierno/"}], "source": "El Deber", "title": "El presidente Rodrigo Paz no logr\u00f3 acudir a la reuni\u00f3n con los c\u00edvicos en Santa Cruz", "url": "https://eldeber.com.bo/santa-cruz/presidente-rodrigo-paz-no-logro-acudir-reunion-civicos-santa-cruz_1779985851"}, {"actor": [], "authors": ["La Patria"], "body": "Se registr\u00f3 puntos de bloqueos en el tr\u00f3pico cochabambino, tras la noche de tensi\u00f3n por apag\u00f3n el\u00e9ctrico y temor por captura de Morales\n\nFicha informativa Cochabamba enfrenta bloqueos y apagones por temor a un operativo gubernamental contra Evo Morales, tras un apag\u00f3n de dos horas que gener\u00f3 p\u00e1nico entre los habitantes. Las federaciones del Tr\u00f3pico convocaron movilizaciones en defensa de su l\u00edder. Toca para ver el contexto completo Contexto: Los dirigentes denunciaron el apag\u00f3n como un sabotaje del gobierno. Juan Carlos Fern\u00e1ndez afirm\u00f3 que el apag\u00f3n fue un acto intimidatorio y exigi\u00f3 la renuncia de Rodrigo Paz. Morales enfrenta una orden de aprehensi\u00f3n por trata y tr\u00e1fico. Las emisoras locales reportaron movilizaciones y bloqueos en defensa de Morales. Los dirigentes instaron a sus seguidores a hacer vigilia en los regimientos militares. Por qu\u00e9 importa: Se registr\u00f3 una ola de p\u00e1nico e incertidumbre entre los pobladores. Los seguidores de Morales se declararon en alerta m\u00e1xima, temiendo acciones represivas por parte del gobierno. Datos clave: Fecha: 28 de mayo\n\n28 de mayo Duraci\u00f3n del apag\u00f3n: 2 horas\n\n2 horas Municipios afectados: Villa Tunari, Chimor\u00e9, Shinahota e Ivirgarzama\n\nVilla Tunari, Chimor\u00e9, Shinahota e Ivirgarzama Posible estado de sitio: S\u00e1bado a las 00:00 horas IngresarDesbloquear acceso completo\n\nApag\u00f3n en el Tr\u00f3pico genera bloqueos en defensa de Evo Morales \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nCochabamba: Bloqueos tras apag\u00f3n inesperado\n\nCochabamba amaneci\u00f3 este jueves 28 de mayo con bloqueos de caminos y movilizaciones. Las emisoras del Tr\u00f3pico reportaron una noche de tensi\u00f3n debido a un corte el\u00e9ctrico y al temor de un operativo contra Evo Morales. Este apag\u00f3n, que se registr\u00f3 durante dos horas la noche del mi\u00e9rcoles, gener\u00f3 denuncias de sabotaje gubernamental, seg\u00fan la dirigencia.\n\nMovilizaci\u00f3n en defensa de Evo Morales\n\nLas federaciones del Tr\u00f3pico convocaron a movilizaciones y bloqueos en protecci\u00f3n de su l\u00edder. Los dirigentes denunciaron un \u201crepentino apag\u00f3n\u201d en la regi\u00f3n y llamaron a sus bases a \u201cestar alertas ante cualquier movimiento\u201d. Adem\u00e1s, instaron a \u201csalir a las carreteras, concentrarse en Lauca \u00d1 y hacer vigilia en los regimientos militares\u201d.\n\nTensi\u00f3n pol\u00edtica y posible estado de sitio\n\nLos l\u00edderes advirtieron que esta situaci\u00f3n podr\u00eda ser la antesala de acciones represivas por parte del gobierno, que planea dictar un estado de sitio el s\u00e1bado a las 00:00 horas. Durante el apag\u00f3n total en el Chapare, los dirigentes llamaron a cercar cuarteles ante el supuesto estado de sitio.\n\nApag\u00f3n total y reacci\u00f3n comunitaria\n\nLa tensi\u00f3n pol\u00edtica y social en el pa\u00eds ha alcanzado niveles cr\u00edticos e impredecibles. Las Seis Federaciones del Tr\u00f3pico denunciaron un \u201capag\u00f3n total\u201d que dej\u00f3 sin energ\u00eda el\u00e9ctrica a los principales municipios del Chapare. La dirigencia emiti\u00f3 instrucciones claras: \u201cLlamamos a estar alertas ante cualquier movimiento y hacer vigilia combativa en las puertas de los regimientos militares\u201d.\n\nDurante el apag\u00f3n, grupos de comunarios se movilizaron con piedras, troncos y llantas, cercando el ingreso del comando de Umopar en Chimor\u00e9. Encendieron fogatas y quemaron llantas como medida preventiva ante la sospecha de que all\u00ed saldr\u00edan tropas para un operativo.\n\nReacciones y advertencias\n\nLos seguidores de Evo Morales se declararon en alerta m\u00e1xima y piden proteger a su l\u00edder. Morales se encuentra en Lauca \u00d1, sede de la Coordinadora de las Seis Federaciones, donde recibe custodia. El dirigente Juan Carlos Fern\u00e1ndez afirm\u00f3 que el apag\u00f3n fue un acto intimidatorio por parte del Gobierno y advirti\u00f3: \u201csi quiere guerra, guerra tendr\u00e1\u201d. Tambi\u00e9n pidi\u00f3 la renuncia del Presidente Rodrigo Paz, argumentando traici\u00f3n tras haber recibido su voto.\n\nCausas del apag\u00f3n y respuesta t\u00e9cnica\n\nFern\u00e1ndez denunci\u00f3: \u201cSe registr\u00f3 un apag\u00f3n en 4 municipios de Villa Tunari: Chimor\u00e9, Shinahota e Ivirgarzama; donde no hay luz\u201d. Llam\u00f3 a todas las bases a salir a las carreteras debido a amenazas gubernamentales con intervenci\u00f3n militar.\n\nPor otro lado, Elfecc inform\u00f3 que el apag\u00f3n fue ocasionado por la ausencia de tensi\u00f3n y p\u00e9rdida de carga en subestaciones. Seg\u00fan informaci\u00f3n preliminar, esto fue provocado por la ca\u00edda de postes de alta tensi\u00f3n. Las causas exactas a\u00fan est\u00e1n bajo investigaci\u00f3n. Elfecc indic\u00f3 que se despleg\u00f3 personal t\u00e9cnico para restablecer el servicio el\u00e9ctrico gradualmente desde las 22:00 horas.", "dateTimeNews": "2026-05-28T16:01:22+00:00", "dateTimeReceived": "", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a1864bb488ba.jpg", "position": 9, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/apagon-electrico-en-el-tropico-pone-en-alerta-a-evistas-y-se-radicalizan-los-bloqueos-en-la-region/"}], "source": "La Patria", "title": "Apag\u00f3n en el Tr\u00f3pico genera bloqueos en defensa de Evo Morales - La Patria 3.0", "url": "https://lapatria.bo/enfoque-nacional/apagon-en-el-tropico-genera-bloqueos-en-defensa-de-evo-morales/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "La Comisi\u00f3n del Di\u00e1logo convocada por el vicepresidente Edmand Lara, con el objetivo de pacificar el pa\u00eds, tuvo una primera jornada \u201cfruct\u00edfera\u201d y continuar\u00e1 este jueves en instalaciones de la Conferencia Episcopal Boliviana (CEB).\n\nEl encuentro cont\u00f3 con la presencia del ministro de la Presidencia, Jos\u00e9 Luis Lupo, en representaci\u00f3n del Gobierno. El presidente Rodrigo Paz se\u00f1al\u00f3 que no asisti\u00f3 a la cita al tener que participar de la inauguraci\u00f3n del Consejo Econ\u00f3mico y Social.\n\nEn ese sentido, la Vicepresidencia inform\u00f3 que como resultado de esta primera reuni\u00f3n, \u201cse acord\u00f3 realizar las gestiones necesarias para garantizar la asistencia de todos los dirigentes al di\u00e1logo\u201d.\n\nAsimismo, se recomend\u00f3 a los representantes de la Iglesia Cat\u00f3lica, a la Defensor\u00eda del Pueblo, a los representantes de la Asamblea Permanente de Derechos Humanos, as\u00ed como a representantes de la comunidad y organismos internacionales, encabezar la continuidad de las mesas de di\u00e1logo.\n\n\u201cSe convocar\u00e1 a la participaci\u00f3n presencial de todos los actores de las organizaciones sociales\u201d, a\u00f1ade la informaci\u00f3n de la Vicepresidencia.\n\nAl respecto, el Ministro de la Presidencia afirm\u00f3 que la primera reuni\u00f3n fue muy \u201cfruct\u00edfera\u201d y \u201crespetuosa\u201d y se encontr\u00f3 con \u201cmucha voluntad de di\u00e1logo y encontrar soluciones\u201d.\n\n\u201cSe esta trabajando una serie de elementos que faciliten la presencia de todos los dirigentes que representan a las organizaciones movilizadas\u201d, se\u00f1al\u00f3.\n\nLupo, en esa l\u00ednea, afirm\u00f3 que primero se trabaja en sentar las bases y condiciones para instalar una mesa de di\u00e1logo con los \u201cinterlocutores v\u00e1lidos\u201d.\n\nDe la reuni\u00f3n de este lunes participaron representantes del Legislativo, Ejecutivo, Iglesia Cat\u00f3lica, Defensor del Pueblo, adem\u00e1s de representantes de organizaciones sociales.\n\nEste mi\u00e9rcoles se cumplen 27 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-28T16:01:19+00:00", "dateTimeReceived": "2026-05-28T17:37:24+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/comision_dialogo_vicepresidencia.jpg", "position": 10, "similar": [{"source": "Eju.tv", "url": "https://eju.tv/2026/05/facilitadores-buscan-destrabar-el-dialogo-con-bloqueadores-el-gobierno-tiene-listas-las-respuestas-a-demandas/"}], "source": "Ox\u00edgeno", "title": "Comisi\u00f3n de Di\u00e1logo acuerda gestionar la presencia de todos los sectores sociales y continuar\u00e1 este jueves", "url": "https://oxigeno.bo/comision-de-dialogo-acuerda-gestionar-la-presencia-de-todos-los-sectores-sociales-y-continuara-este-jueves/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "El presidente del Estado, Rodrigo Paz, promulg\u00f3 la Ley del Perdonazo Tributario, misma que permitir\u00e1 la condonaci\u00f3n de deudas de hasta Bs 10 millones generadas hasta 2017 y durante 2020 y beneficiar\u00e1 a m\u00e1s de 100 mil ciudadanos bolivianos.\n\n\u201cCumplimos nuestra palabra con la vigencia de la ley del perdonazo tributario. Esta medida hist\u00f3rica beneficiar\u00e1 a m\u00e1s de 100.000 hombres y mujeres que apostaron por Bolivia, transformando multas acumuladas en verdaderas oportunidades de reinversi\u00f3n\u201d, inform\u00f3 el Presidente del Estado a trav\u00e9s de sus cuentas en las redes sociales.\n\nEl Jefe de Estado explic\u00f3 que se trata de \u201cun alivio directo para peque\u00f1os empresarios, gremiales, cuentapropistas, transportistas y artesanos que hoy ven nacer una nueva realidad econ\u00f3mica\u201d.\n\nEl \u201cperdonazo tributario\u201d, establecido en la Ley de Alivio Tributario, condonar\u00e1 deudas de hasta Bs 10 millones que fueron generadas hasta diciembre de 2017 o durante la gesti\u00f3n 2020, a ra\u00edz de la pandemia de la Covid-19, afirm\u00f3 el ministro de Econom\u00eda y Finanzas P\u00fablicas, Jos\u00e9 Gabriel Espinoza.\n\n\u201cLa Ley de Alivio Tributario contempla cinco medidas; una de ellas es el \u2018perdonazo tributario\u2019. Esto significa que aquellos contribuyentes que tengan una deuda tributaria total de 10 millones de bolivianos o menos podr\u00e1n ser perdonados, siempre y cuando estas deudas correspondan a obligaciones generadas hasta el 31 de diciembre de 2017 o durante la gesti\u00f3n 2020, por la pandemia\u201d, explic\u00f3.\n\nLa autoridad detall\u00f3 que, con esa norma, ser\u00e1n condonados los tributos de car\u00e1cter nacional como el Impuesto al Valor Agregado (IVA), el Impuesto sobre las Utilidades de las Empresas (IUE) y el Impuesto a las Transacciones (IT), entre otros recaudados por Impuestos Nacionales.\n\n\u201cAqu\u00ed entran tambi\u00e9n aquellos artesanos que tienen un NIT (N\u00famero de Identificaci\u00f3n Tributaria) o aquellos peque\u00f1os comerciantes que tributan en el R\u00e9gimen Simplificado y que han ido acumulando obligaciones no pagadas\u201d, a\u00f1adi\u00f3.\n\nEl titular de la cartera de Econom\u00eda y Finanzas P\u00fablicas precis\u00f3 que las deudas tributarias totales no solo comprenden el tributo omitido, sino tambi\u00e9n multas, intereses y mantenimiento de valor de la deuda.", "dateTimeNews": "2026-05-28T16:01:12+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/paz_captura22.png", "position": 11, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/dinero-negocios/cochabamba-pequena-industria-destaca-beneficios-de-nueva-ley-tributaria/"}], "source": "Ox\u00edgeno", "title": "Paz promulga el Perdonazo Tributario: se condonar\u00e1 deudas de hasta Bs 10 millones generadas hasta 2017 y durante 2020", "url": "https://oxigeno.bo/paz-promulga-el-perdonazo-tributario-se-condonara-deudas-de-hasta-bs-10-millones-generadas-hasta-2017-y-durante-2020/"}, {"actor": [], "authors": ["Marco Huanca"], "body": "\ud83d\udd0a Escuchar la nota\n\nArgentina, 28 may 2026 (ATB Media) .- River Plate confirm\u00f3 su superioridad y derrot\u00f3 3-0 a Blooming para asegurar su clasificaci\u00f3n a los octavos de final de la Copa Sudamericana. El conjunto boliviano resisti\u00f3 durante gran parte del primer tiempo, pero termin\u00f3 superado por el dominio y la presi\u00f3n constante del equipo argentino. Con la derrota, los celestes cerraron su participaci\u00f3n en el torneo con apenas un punto en la fase de grupos.\n\nDesde el arranque del partido, el cuadro dirigido por Eduardo Coudet tom\u00f3 el control absoluto de las acciones y convirti\u00f3 al arquero Gustavo Almada en una de las figuras del encuentro. La primera gran oportunidad lleg\u00f3 a los 10 minutos, cuando Tom\u00e1s Galv\u00e1n fue derribado dentro del \u00e1rea y el \u00e1rbitro Roberto Bruno P\u00e9rez Guti\u00e9rrez sancion\u00f3 penal. Maxi Salas asumi\u00f3 la responsabilidad desde los doce pasos, pero su remate se estrell\u00f3 en el poste y mantuvo el empate.\n\nA pesar del fallo, River continu\u00f3 dominando el compromiso con posesi\u00f3n y constantes aproximaciones al arco rival. Salas volvi\u00f3 a generar peligro poco despu\u00e9s con un cabezazo que exigi\u00f3 una buena intervenci\u00f3n de Almada. Con el paso de los minutos, Blooming comenz\u00f3 a replegarse y apost\u00f3 por cerrar espacios defensivos para resistir la presi\u00f3n del equipo argentino. Aunque River sigui\u00f3 siendo el due\u00f1o de la pelota, le cost\u00f3 generar ocasiones claras durante el tramo final del primer tiempo.\n\nEl empate sin goles al descanso gener\u00f3 molestia entre los hinchas locales, que despidieron con silbidos a los jugadores del conjunto millonario. En el segundo tiempo, River retom\u00f3 la intensidad ofensiva y encontr\u00f3 r\u00e1pidamente el camino al gol. Lucas Mart\u00ednez Quarta protagoniz\u00f3 una destacada acci\u00f3n individual que anticip\u00f3 lo que vendr\u00eda minutos despu\u00e9s.\n\nA los 56 minutos, el defensor volvi\u00f3 a sumarse al ataque y habilit\u00f3 a Maxi Salas, quien defini\u00f3 de derecha para vencer a Almada y abrir finalmente el marcador. El tanto golpe\u00f3 an\u00edmicamente a Blooming, que perdi\u00f3 solidez defensiva y comenz\u00f3 a sufrir cada avance rival. A los 67 minutos, Joaqu\u00edn Freitas cay\u00f3 dentro del \u00e1rea y el \u00e1rbitro volvi\u00f3 a se\u00f1alar penal. Aunque la jugada fue revisada por el VAR, la decisi\u00f3n inicial se mantuvo.\n\nFausto Vera transform\u00f3 la ejecuci\u00f3n en el segundo gol del partido y celebr\u00f3 as\u00ed su primera anotaci\u00f3n con la camiseta de River Plate. La goleada se complet\u00f3 en la recta final con una gran definici\u00f3n de Lucas Silva. El juvenil sac\u00f3 un potente remate desde fuera del \u00e1rea para establecer el 3-0 definitivo y marcar su estreno goleador en la m\u00e1xima categor\u00eda. River Plate avanz\u00f3 con comodidad a los octavos de final de la Copa Sudamericana, mientras que Blooming se despidi\u00f3 del certamen dejando una campa\u00f1a discreta, con solo una unidad sumada en toda la fase de grupos.\n\nFuente: La Red Deportiva de ATB", "dateTimeNews": "2026-05-28T15:55:43+00:00", "dateTimeReceived": "", "pic": "https://142.11.196.137/wp-content/uploads/2022/11/logo-ATB-DIGITAL-2022-b-768x291-1.png", "position": 12, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/deportes/blooming-se-despide-humillado-de-la-copa-sudamericana/"}], "source": "ATB Digital", "title": "River Plate aplasta a Blooming y avanza a octavos de la Sudamericana", "url": "https://www.atb.com.bo/2026/05/28/river-plate-aplasta-a-blooming-y-avanza-a-octavos-de-la-sudamericana/"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nDirigentes de organizaciones sociales de la Central Obrera Boliviana (COB) y la Federaci\u00f3n Departamental De Trabajadores Campesinos De La Paz \u00abT\u00fapac Katari\u00bb anunciaron este jueves la convocatoria a un cabildo nacional con el objetivo de definir la continuidad de las movilizaciones y una posible participaci\u00f3n en el di\u00e1logo promovido por el Gobierno.\n\nEl exdirigente de la Federaci\u00f3n T\u00fapac Katari David Mamani afirm\u00f3 que cualquier decisi\u00f3n sobre una negociaci\u00f3n con el Ejecutivo debe surgir de las bases movilizadas y no \u00fanicamente de los principales dirigentes sindicales.\n\n\u201cVamos a convocar a un gran cabildo nacional para que las bases decidan si vamos al di\u00e1logo o continuamos la lucha con mayor fuerza hasta que se vaya Rodrigo Paz\u201d, dijo.\n\nLea tambi\u00e9n: Para facilitar di\u00e1logo, Gobierno compromete \u2018garant\u00edas\u2019 a l\u00edderes de COB y T\u00fapac\n\nIndic\u00f3 que existe preocupaci\u00f3n dentro de algunos sectores por versiones relacionadas con posibles acuerdos con el Gobierno y asegur\u00f3 que ninguna determinaci\u00f3n puede asumirse \u201ca espaldas o a escondidas\u201d de las organizaciones sociales que mantienen las medidas de presi\u00f3n en carreteras y ciudades.\n\nEl cabildo buscar\u00e1 reunir a representantes de los nueve departamentos para debatir el rumbo de las movilizaciones y establecer una posici\u00f3n conjunta frente a la convocatoria al di\u00e1logo instalada por la Iglesia Cat\u00f3lica, la Defensor\u00eda del Pueblo y el Gobierno.\n\nEste jueves, est\u00e1 prevista la reuni\u00f3n del Gobierno en instalaciones de la Conferencia Episcopal Boliviana (CEB), donde autoridades nacionales e instituciones mediadoras intentar\u00e1n acercar posiciones con sectores movilizados para encontrar una salida al conflicto social y pol\u00edtico que atraviesa el pa\u00eds.\n\nHace 28 d\u00edas, los movilizados no permiten el ingreso de alimentos, medicamentos y carburantes. La sede de gobierno est\u00e1 desbastecida y paralizada.", "dateTimeNews": "2026-05-28T15:43:18+00:00", "dateTimeReceived": "2026-05-28T17:24:41+00:00", "pic": "https://larazon.bo/wp-content/uploads/2025/07/2025031711261114401.webp", "position": 13, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/campesinos-paz-preparan-cabildo-definir-si-dialogan-rodrigo-paz_1779987528"}], "source": "La Raz\u00f3n", "title": "COB y T\u00fapac Katari anuncian cabildo para definir si aceptan di\u00e1logo con el Gobierno", "url": "https://larazon.bo/nacional/2026/05/28/cob-y-tupac-katari-anuncian-cabildo-para-definir-si-aceptan-dialogo-con-el-gobierno/"}, {"actor": [], "authors": ["La Patria"], "body": "Finergy 2026 reunir\u00e1 a universidades y empresas para discutir sobre energ\u00edas renovables y su impacto en la econom\u00eda nacional\n\nFicha informativa La Feria Internacional de Energ\u00edas, FINERGY 2026, se celebra del 28 al 30 de mayo en Santa Cruz, Bolivia, reuniendo a expertos y empresas para discutir energ\u00edas renovables y desaf\u00edos del sector energ\u00e9tico. Toca para ver el contexto completo Contexto: Denis Arteaga, presidente del Colegio de Ingenieros El\u00e9ctricos y Electr\u00f3nicos de Santa Cruz, mencion\u00f3 \u201cEste a\u00f1o la feria ha dado un salto de calidad porque nos trasladamos a Fexpocruz para brindar mayor comodidad a las empresas\u201d. Luis Fernando A\u00f1ez, vicepresidente de ENDE Corporaci\u00f3n, enfatiz\u00f3 \u201cBolivia atraviesa momentos dif\u00edciles, pero nosotros apostamos por el trabajo y por el desarrollo\u201d. Juan Pablo Liechtenstein de la CRE indic\u00f3 que FINERGY 2026 coincide con una etapa decisiva para el sistema el\u00e9ctrico nacional. Las tem\u00e1ticas incluyen transici\u00f3n energ\u00e9tica y tecnolog\u00edas para generaci\u00f3n distribuida. Durante la \u00faltima jornada habr\u00e1 un sorteo de un sistema solar. Se destaca el lanzamiento del primer auto solar 100% boliviano y camiones el\u00e9ctricos de carga pesada. Por qu\u00e9 importa: FINERGY 2026 es crucial para redefinir la econom\u00eda nacional ante la escasez de combustibles tradicionales. La preocupaci\u00f3n por el agotamiento del gas natural resalta la necesidad urgente de construir nuevas alternativas energ\u00e9ticas. Datos clave: Fecha: 28 al 30 de mayo\n\n28 al 30 de mayo Lugar: Sal\u00f3n Guarayo de Fexpocruz, Santa Cruz, Bolivia\n\nSal\u00f3n Guarayo de Fexpocruz, Santa Cruz, Bolivia N\u00famero de empresas participantes: M\u00e1s de 50 IngresarDesbloquear acceso completo\n\nFeria Internacional de Energ\u00edas reunir\u00e1 a expertos y empresas en Santa Cruz \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nFINERGY 2026\n\nLa octava versi\u00f3n de la Feria Internacional de Energ\u00edas (Finergy) 2026, se llevar\u00e1 a cabo del 28 al 30 de mayo en el Sal\u00f3n Guarayo de Fexpocruz, Santa Cruz, Bolivia. Este evento reunir\u00e1 a empresas, expertos, universidades e instituciones del sector energ\u00e9tico para debatir sobre generaci\u00f3n distribuida, energ\u00edas renovables y movilidad el\u00e9ctrica.\n\nEn un contexto marcado por los desaf\u00edos energ\u00e9ticos que enfrenta Bolivia y los cambios regulatorios que comienzan a transformar el sector, Fingergy se posiciona como el principal punto de encuentro para discutir el futuro energ\u00e9tico del pa\u00eds.\n\nLema y Participantes\n\nLa feria se desarrollar\u00e1 bajo el lema \u201cDesarrollando Futuro, Energ\u00eda, Innovaci\u00f3n y Tecnolog\u00eda\u201d y contar\u00e1 con:\n\nM\u00e1s de 50 empresas participantes.\n\nExpositores internacionales.\n\nUniversidades y profesionales del sector energ\u00e9tico.\n\nEspacios de networking y foros t\u00e9cnicos.\n\nPresentaciones comerciales sobre eficiencia energ\u00e9tica, electromovilidad y energ\u00eda solar.\n\nOpiniones de los Organizadores\n\nDurante el lanzamiento oficial, Denis Arteaga, presidente del Colegio de Ingenieros El\u00e9ctricos y Electr\u00f3nicos de Santa Cruz, destac\u00f3 que la feria ha evolucionado este a\u00f1o para ofrecer mejores condiciones a los expositores y asistentes. \u201cEste a\u00f1o la feria ha dado un salto de calidad porque nos trasladamos a Fexpocruz para brindar mayor comodidad a las empresas, instituciones, universidades y profesionales que nos acompa\u00f1an\u201d, se\u00f1al\u00f3 Arteaga.\n\nLuis Fernando A\u00f1ez, vicepresidente de ENDE Corporaci\u00f3n, remarc\u00f3 que \u201cBolivia atraviesa momentos dif\u00edciles, pero nosotros apostamos por el trabajo y por el desarrollo\u201d. A\u00f1ez enfatiz\u00f3 la importancia del evento al afirmar que \u201ccreemos que este es el camino para que el pa\u00eds avance\u201d. Por su parte, Juan Pablo Liechtenstein de la Cooperativa Rural de Electrificaci\u00f3n (CRE) indic\u00f3 que Finergy coincide con una etapa decisiva para el sistema el\u00e9ctrico nacional.\n\nTema Central y Sorteos\n\nLas tem\u00e1ticas a tratar incluyen:\n\nTransici\u00f3n energ\u00e9tica.\n\nTecnolog\u00edas para generaci\u00f3n distribuida.\n\nDebate sobre el modelo energ\u00e9tico del pa\u00eds.\n\nAdem\u00e1s, durante la \u00faltima jornada se realizar\u00e1 un sorteo de un sistema solar para vivienda o negocio. Este evento es crucial no solo por reunir tecnolog\u00eda avanzada sino tambi\u00e9n por redefinir la econom\u00eda nacional en un momento cr\u00edtico debido a la escasez de combustibles tradicionales.\n\nNovedades Destacadas\n\nUn hito destacado es el lanzamiento del primer auto solar 100% boliviano y la llegada de camiones el\u00e9ctricos de carga pesada. Esto demuestra que Bolivia tiene tanto talento t\u00e9cnico como la urgencia necesaria para romper su dependencia de los hidrocarburos.\n\nPunto de Encuentro Energ\u00e9tico\n\nFinergy 2026 apunta a convertirse nuevamente en un espacio donde se discuta no solo tecnolog\u00eda y negocios sino tambi\u00e9n el rumbo del futuro energ\u00e9tico del pa\u00eds. La preocupaci\u00f3n por el agotamiento progresivo del gas natural resalta la necesidad urgente de construir nuevas alternativas energ\u00e9ticas para garantizar sostenibilidad y seguridad energ\u00e9tica.", "dateTimeNews": "2026-05-28T15:35:02+00:00", "dateTimeReceived": "2026-05-28T17:37:05+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a184c1857b96.jpg", "position": 14, "similar": [{"source": "El Mundo", "url": "https://elmundo.com.bo/con-un-enfoque-en-la-innovacion-este-jueves-inicia-la-finergy-2026/"}], "source": "La Patria", "title": "Feria Internacional de Energ\u00edas reunir\u00e1 a expertos y empresas en Santa Cruz - La Patria 3.0", "url": "https://lapatria.bo/dinero-negocios/feria-internacional-de-energias-reunira-a-expertos-y-empresas-en-santa-cruz/"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nBolivia inici\u00f3 este jueves su jornada n\u00famero 28 de conflictos y movilizaciones con 64 puntos de bloqueo instalados en seis departamentos del pa\u00eds, seg\u00fan el informe de transitabilidad de la Administradora Boliviana de Carreteras (ABC).\n\nHasta pasadas las 06:00, La Paz era el departamento m\u00e1s afectado con 22 puntos de corte, situaci\u00f3n que mantiene complicaciones en el abastecimiento de combustibles, alimentos y transporte. Potos\u00ed registr\u00f3 15 bloqueos y Cochabamba 11. En Oruro se contabilizaron 10 puntos, mientras que Chuquisaca y Santa Cruz reportaron tres cada uno.\n\nLa crisis mantiene presi\u00f3n sobre el Gobierno y distintos sectores sociales, que este jueves volver\u00e1n a intentar instalar una mesa de di\u00e1logo con mediaci\u00f3n de la Iglesia Cat\u00f3lica. La reuni\u00f3n se realizar\u00e1 en instalaciones de la Conferencia Episcopal Boliviana (CEB), luego del primer acercamiento desarrollado el mi\u00e9rcoles en la Vicepresidencia.\n\nLea tambi\u00e9n: Ni la COB ni la T\u00fapac cedieron al llamado de Paz; la Iglesia lidera nuevo intento de di\u00e1logo\n\nTras ese encuentro, el ministro de la Presidencia, Jos\u00e9 Luis Lupo, inform\u00f3 que el objetivo consiste en garantizar la presencia de todos los dirigentes involucrados en las protestas para avanzar hacia una negociaci\u00f3n. La Iglesia Cat\u00f3lica, la Defensor\u00eda del Pueblo y la Asamblea Permanente de Derechos Humanos encabezan las gestiones para concretar la reuni\u00f3n.\n\nEn paralelo, el Movimiento C\u00edvico Nacional prev\u00e9 sostener este jueves un encuentro con el presidente Rodrigo Paz en la ciudad de Santa Cruz, en medio de una creciente preocupaci\u00f3n por el impacto econ\u00f3mico y social que dejan casi cuatro semanas de bloqueos en distintas regiones del pa\u00eds.", "dateTimeNews": "2026-05-28T15:17:57+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/WhatsApp-Image-2026-05-26-at-11.37.32.webp", "position": 15, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/28/ni-la-cob-ni-la-tupac-cedieron-al-llamado-de-paz-la-iglesia-lidera-nuevo-intento-de-dialogo/"}], "source": "La Raz\u00f3n", "title": "Bolivia amanece con 64 puntos de bloqueo en medio de nuevos intentos de di\u00e1logo", "url": "https://larazon.bo/nacional/2026/05/28/bolivia-amanece-con-64-puntos-de-bloqueo-en-medio-de-nuevos-intentos-de-dialogo/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "La Federaci\u00f3n Sindical de Trabajadores Mineros de Bolivia (FSTMB) envi\u00f3 una carta al vicepresidente del Estado, Edmand Lara, para exigir que se levante la orden de aprehensi\u00f3n que existe en contra del secretario ejecutivo de la Central Obrera Boliviana (COB), Mario Argollo, y se les d\u00e9 todas las garant\u00edas para participar de la Comisi\u00f3n de Di\u00e1logo convocada por la Vicepresidencia y el Legislativo.\n\nLa carta tiene fecha de 28 de mayo y lleva las firmas de dirigentes de la Federaci\u00f3n Sindical de Trabajadores Mineros de Bolivia.\n\nEn el documento, la dirigencia minera se\u00f1ala que el pedido busca garantizar la presencia de Mario Argollo Mamani en las reuniones convocadas por el Gobierno, recordando adem\u00e1s que el ministro de la Presidencia, Jos\u00e9 Luis Lupo, manifest\u00f3 p\u00fablicamente que se garantizar\u00eda la participaci\u00f3n de todos los dirigentes sindicales invitados.\n\nLa FSTMB sostiene que la \u00fanica forma de asegurar la presencia del ejecutivo de la COB es garantizando su libertad personal, por lo que solicita la anulaci\u00f3n de la orden de aprehensi\u00f3n y el desistimiento de cualquier persecuci\u00f3n judicial o pol\u00edtica contra dirigentes sindicales a nivel nacional.\n\nAsimismo, el ente minero exige que se otorguen garant\u00edas necesarias para los dirigentes en todo el pa\u00eds y pide una respuesta inmediata a su solicitud.\n\nLa ma\u00f1ana de este jueves, en entrevista con Unitel, el Ministro de la Presidencia confirm\u00f3 que el Gobierno envi\u00f3 las respectivas invitaciones para entablar el di\u00e1logo con Vicente Choque y Mario Argollo, secretarios ejecutivos de la Federaci\u00f3n Departamental de Trabajadores Campesinos de La Paz \u201cTupac Katari\u201d y la Central Obrera Boliviana (COB), respectivamente.\n\nEn ese sentido, el Ministro afirm\u00f3 que el Gobierno dar\u00e1 las \u201cgarant\u00edas\u201d para que se pueda entablar el di\u00e1logo, lo que, especific\u00f3, significa que no se ejecutar\u00e1n las \u00f3rdenes de aprehensi\u00f3n que hayan en su contra.\n\n\u201cObviamente que nosotros garantizamos que durante la reuni\u00f3n y en la reuni\u00f3n van a poder gozar de todas las garant\u00edas para poder desarrollar de forma adecuada y encontrar las soluciones que corresponda\u201d, asegur\u00f3", "dateTimeNews": "2026-05-28T14:59:48+00:00", "dateTimeReceived": "2026-05-28T17:37:24+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/argollo_paye.png", "position": 16, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/28/para-facilitar-dialogo-gobierno-compromete-garantias-a-lideres-de-cob-y-tupac/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/lupo-confirma-que-se-cito-al-dialogo-a-choque-y-argollo-y-asegura-no-se-ejecutaran-sus-ordenes-de-aprehension/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/en-audiencia-lara-respalda-la-accion-de-libertad-de-argollo-y-pide-evitar-medidas-de-excepcion-sin-respaldo-legal/"}], "source": "Ox\u00edgeno", "title": "Mineros exigen a Lara que se deje sin efecto el mandamiento de aprehensi\u00f3n contra Argollo para ir al di\u00e1logo", "url": "https://oxigeno.bo/mineros-exigen-a-lara-que-se-deje-sin-efecto-el-mandamiento-de-aprehension-contra-argollo-para-ir-al-dialogo/"}, {"actor": [], "authors": ["Marco Huanca"], "body": "\ud83d\udd0a Escuchar la nota\n\nSanta Cruz, 28 may 2026 (ATB Media) .- Bol\u00edvar dej\u00f3 escapar la clasificaci\u00f3n a los octavos de final de la Copa Libertadores tras perder 1-3 frente a Independiente Rivadavia en el estadio Tahuichi Aguilera de Santa Cruz. La Academia necesitaba un triunfo para avanzar, pero volvi\u00f3 a mostrar fragilidad defensiva y termin\u00f3 castigada por tres contragolpes letales del conjunto argentino. Pese a la derrota, el cuadro pace\u00f1o asegur\u00f3 el tercer lugar del Grupo C y disputar\u00e1 los Play-Offs de la Copa Sudamericana.\n\nEl equipo dirigido por Flavio Robatto lleg\u00f3 a la \u00faltima jornada dependiendo de s\u00ed mismo para continuar en la Libertadores. Sin embargo, los errores defensivos volvieron a pasar factura y el conjunto boliviano qued\u00f3 eliminado del principal torneo continental.\n\nDesde el inicio, Bol\u00edvar intent\u00f3 imponer condiciones y gener\u00f3 peligro r\u00e1pidamente. A los nueve minutos, Patricio Rodr\u00edguez habilit\u00f3 a Dorny Romero, quien dej\u00f3 en el camino al arquero Nicol\u00e1s Bolcato, pero cuando ten\u00eda el arco a disposici\u00f3n apareci\u00f3 Iv\u00e1n Villalba para despejar el bal\u00f3n sobre la l\u00ednea. La presi\u00f3n celeste continu\u00f3 en los primeros minutos y Romero volvi\u00f3 a inquietar tras un tiro de esquina, aunque Bolcato reaccion\u00f3 a tiempo para cortar el centro.\n\nEl compromiso tuvo una interrupci\u00f3n ins\u00f3lita a los 16 minutos, cuando parte de las luminarias del estadio se apagaron, obligando a detener las acciones durante seis minutos. Tras la reanudaci\u00f3n, el encuentro se hizo m\u00e1s equilibrado, con llegadas para ambos equipos. Jos\u00e9 Florent\u00edn e Ignacio Gariglio probaron desde fuera del \u00e1rea, mientras Carlos Lampe respondi\u00f3 con seguridad ante un intento de Mat\u00edas Fern\u00e1ndez.\n\nEl arquero boliviano sostuvo a su equipo con varias intervenciones importantes, pero en el tiempo a\u00f1adido del primer tiempo lleg\u00f3 el golpe visitante. Luego de una p\u00e9rdida de Mart\u00edn Cauteruccio, Sheyko Studer lanz\u00f3 un pase largo para Fern\u00e1ndez, quien asisti\u00f3 a Leonel Bucca para que definiera cruzado ante Lampe y pusiera el 0-1.\n\nEn la segunda mitad, Bol\u00edvar mostr\u00f3 una actitud m\u00e1s ofensiva y encontr\u00f3 en Robson Matheus a su principal figura. El brasile\u00f1o manej\u00f3 el ritmo del equipo y lider\u00f3 las aproximaciones locales antes de salir lesionado en la recta final del partido. Matheus avis\u00f3 primero con un remate que control\u00f3 Bolcato y luego particip\u00f3 en otra acci\u00f3n clara protagonizada por Cauteruccio. Finalmente, a los 55 minutos, consigui\u00f3 el empate con un disparo de zurda que se desvi\u00f3 en el delantero argentino antes de ingresar al arco.\n\nCon la igualdad, la Academia se volc\u00f3 al ataque en busca del tanto de la clasificaci\u00f3n. Independiente tambi\u00e9n respondi\u00f3 y lleg\u00f3 a marcar nuevamente por intermedio de Bucca, aunque el gol fue anulado por una mano previa de Villalba. Bol\u00edvar sigui\u00f3 insistiendo y estuvo cerca con un cabezazo de Cauteruccio y remates de Matheus y Lucas Ch\u00e1vez, pero Bolcato se convirti\u00f3 en una de las figuras del encuentro.\n\nCuando el equipo boliviano arriesgaba todo en ofensiva, llegaron los golpes definitivos del conjunto mendocino. Sebasti\u00e1n Villa anot\u00f3 el segundo tanto en el minuto 92 y Diego Crego sentenci\u00f3 el partido en el 95, ambos en veloces contragolpes que encontraron desprotegida a la defensa celeste. Con este resultado, Bol\u00edvar cerr\u00f3 la fase de grupos en el tercer lugar con cinco puntos y continuar\u00e1 su participaci\u00f3n internacional en los Play-Offs de la Copa Sudamericana, donde enfrentar\u00e1 al gremio de Porto Alegre.\n\nFuente: Red Deportiva de ATB", "dateTimeNews": "2026-05-28T14:53:56+00:00", "dateTimeReceived": "2026-05-28T17:24:17+00:00", "pic": "https://142.11.196.137/wp-content/uploads/2022/11/logo-ATB-DIGITAL-2022-b-768x291-1.png", "position": 17, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/libertadores-bolivar-no-estuvo-a-la-altura-perdio-con-independiente-rivadavia-en-santa-cruz-y-paso-a-la-sudamericana/"}], "source": "ATB Digital", "title": "Bol\u00edvar cae ante Independiente Rivadavia y seguir\u00e1 su camino en la Sudamericana", "url": "https://www.atb.com.bo/2026/05/28/bolivar-cae-ante-independiente-rivadavia-y-seguira-su-camino-en-la-sudamericana/"}, {"actor": [], "authors": ["Carolina Galarza Villagran"], "body": "El presidente del Comit\u00e9 pro Santa Cruz, Stello Cochamanidis, confirm\u00f3 este jueves la reuni\u00f3n entre el presidente del pa\u00eds y el movimiento c\u00edvico nacional. El encuentro se realizar\u00e1 en Santa Cruz y contar\u00e1 con la participaci\u00f3n de representantes de los nueve departamentos de Bolivia para abordar la crisis que atraviesa el pa\u00eds debido a los bloqueos y en medio de intentos de desestabilizaci\u00f3n pol\u00edtica.\n\n\"El presidente de Bolivia llega hoy en la ma\u00f1ana. Tendr\u00e1 una reuni\u00f3n con nosotros, con el movimiento c\u00edvico nacional. Va a estar sentado con los presidentes, representantes de los nueve departamentos del pa\u00eds. Definitivamente el tema central a tratar ser\u00e1 el respeto a la democracia y tambi\u00e9n la situaci\u00f3n cr\u00edtica que est\u00e1 viviendo el pa\u00eds\", se\u00f1al\u00f3 el c\u00edvico.\n\nLa reuni\u00f3n comenz\u00f3 a las 10:00 y se esperar\u00e1 la llegada del jefe de Estado, quien debe trasladarse hasta la capital cruce\u00f1a.\n\nEl l\u00edder c\u00edvico indic\u00f3 que el problema afecta a todo el territorio nacional y que los representantes departamentales expondr\u00e1n al mandatario la situaci\u00f3n que se vive en cada regi\u00f3n. Adem\u00e1s, los l\u00edderes buscar\u00e1n alternativas ante el conflicto que afecta 28 d\u00edas al pa\u00eds. Tan s\u00f3lo este martes, Bolivia reporta 66 bloqueos a nivel nacional, tres de estos est\u00e1n en Santa Cruz.\n\n\u201cLos presidentes y los representantes de los nueve departamentos van a estar reunidos con el presidente para hacerle conocer a \u00e9l c\u00f3mo se est\u00e1 viendo desde los distintos puntos del pa\u00eds esta problem\u00e1tica. C\u00f3mo se est\u00e1 viviendo y, en realidad, cu\u00e1les son las alternativas que vemos nosotros viables como movimiento c\u00edvico nacional para buscarle una salida a este problema en el cual nos encontramos hoy\u201d, explic\u00f3.\n\nRemarc\u00f3 que la reuni\u00f3n s\u00f3lo ser\u00e1 con los c\u00edvicos, no habr\u00e1 otras instituciones.\n\nEstado de excepci\u00f3n, una opci\u00f3n contemplada\n\nCochamanidis asegur\u00f3 \"se debe actuar con la Constituci\u00f3n por delante y que el Estado de Excepci\u00f3n es una de las opciones\". Sin embargo, se\u00f1al\u00f3 que la decisi\u00f3n est\u00e1 en manos del Ejecutivo nacional, ya que la C\u00e1mara de Senadores y Diputados llevaron a cabo la abrogaci\u00f3n de una ley que regulaba los estados de excepci\u00f3n en Bolivia.\n\n\"Se tiene que actuar con la Constituci\u00f3n por delante y definitivamente, el Estado de Excepci\u00f3n es una de las opciones (...) Hoy es el Ejecutivo el que tiene que actuar. Aqu\u00ed lo que nosotros siempre hemos pedido es que se act\u00fae conforme a ley, que se act\u00fae con la Constituci\u00f3n por delante, pero sobre todo se haga respetar el derecho de los millones de bolivianos que lo que buscamos es que este pa\u00eds salga adelante y no as\u00ed unos cuantos que lo \u00fanico que buscan es destruir el pa\u00eds\", apunt\u00f3 el c\u00edvico.\n\nTambi\u00e9n sostuvo que el Gobierno debe garantizar la libre transitabilidad y el respeto a los derechos de la poblaci\u00f3n ante los bloqueos que afectan al pa\u00eds desde hace varias semanas.\n\n\u201cNosotros solamente estamos en representaci\u00f3n de la sociedad civil, pero \u00e9l (el presidente Paz) s\u00ed tiene la obligaci\u00f3n, \u00e9l y su gabinete, de garantizarnos la libre transitabilidad en el pa\u00eds, de garantizar que nuestras libertades y derechos se tienen que respetar por encima del deseo y de la angurria de otros que lo \u00fanico que buscan es perpetuarse en el poder y tomarlo por la fuerza. Nosotros estamos aqu\u00ed para hacer respetar la democracia, para defenderla, pero sobre todo para poder vivirla\u201d, expres\u00f3.\n\nBolivia necesita flujo de alimentos y carreteras expeditas\n\nEl c\u00edvico expres\u00f3 que es necesario que el alimento, los insumos y la econom\u00eda circulen en el pa\u00eds, que est\u00e1 restringido debido a los bloqueos. Reiter\u00f3 que todas las carreteras tienen que quedar expeditas.\n\nRespecto al bloqueo en San Juli\u00e1n, que ya cumple m\u00e1s de dos semanas, explic\u00f3 que este jueves habr\u00e1 una mesa de di\u00e1logo entre la Gobernaci\u00f3n cruce\u00f1a y los dirigentes que bloquean ese municipio.\n\nAsegur\u00f3 que las acciones siguientes ahora caen en el jefe de Estado:\n\n\"Los pendientes que quedaron es lo del Ejecutivo y, obviamente, otros est\u00e1n avanzando. El cuarto intermedio es para que se solucione tanto en la mediaci\u00f3n de la Iglesia Cat\u00f3lica que ya tambi\u00e9n avanz\u00f3. Aqu\u00ed lo que necesitamos es que el pa\u00eds est\u00e9 totalmente expedito en las v\u00edas para que se pueda circular libremente, no solamente las personas, sino tambi\u00e9n el flujo de alimentos\", manifest\u00f3.\n\nCochamanidis remarc\u00f3 que esperan una respuesta inmediata del Gobierno para resolver el conflicto y restablecer la normalidad en las carreteras del pa\u00eds.", "dateTimeNews": "2026-05-28T14:49:58+00:00", "dateTimeReceived": "2026-05-28T17:24:16+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779980789125.jpeg?\u0026cw=1200\u0026ch=630", "position": 18, "similar": [{"source": "El Mundo", "url": "https://elmundo.com.bo/conflictos-civicos-del-pais-se-reuniran-con-paz-en-santa-cruz/"}], "source": "El Deber", "title": "\"El Estado de Excepci\u00f3n es una de las opciones\": c\u00edvicos inician la reuni\u00f3n y se espera el arribo de Rodrigo Paz", "url": "https://eldeber.com.bo/santa-cruz/estado-excepcion-opciones-civicos-inician-reunion-espera-arribo-rodrigo-paz_1779979798"}, {"actor": [], "authors": ["Ignacio Rocabado"], "body": "\u200eBol\u00edvar enfrentar\u00e1 al brasile\u00f1o Gr\u00eamio en los playoffs de la Conmebol Sudamericana, luego de quedar eliminado en la fase de grupos de la Conmebol Libertadores.\n\n\u200eLa \u2018Academia\u2019 cay\u00f3 por 3-1 ante Independiente Rivadavia en la \u00faltima jornada y perdi\u00f3 la posibilidad de avanzar a los octavos de final.\n\n\u200eEl equipo pace\u00f1o termin\u00f3 tercero del Grupo C con cinco puntos; adem\u00e1s, fue el peor tercero entre todos los grupos de la m\u00e1xima competencia continental.\n\nTAMBI\u00c9N PUEDE LEER:\n\nBlooming pierde 3-0 ante River y se despide de la Sudamericana\n\nMEJOR SEGUNDO\n\n\u200ePor ese motivo, qued\u00f3 emparejado con el \u2018Tricolor Ga\u00facho\u2019, que concluy\u00f3 como el mejor segundo de la fase de grupos de la Sudamericana.\n\n\u200eEl conjunto de Porto Alegre acab\u00f3 segundo del Grupo F con 11 puntos, por detr\u00e1s de Montevideo City Torque, l\u00edder con 13 unidades.\n\n\u200eSeg\u00fan el Manual de Clubes de la Conmebol, los playoffs enfrentan a los ocho segundos de la Sudamericana contra los ocho terceros de la Libertadores.\n\nLLAVE\n\n\u200eLas llaves se conforman de acuerdo con el rendimiento obtenido en la fase de grupos de ambos torneos continentales.\n\n\u200eBol\u00edvar abrir\u00e1 la serie como local en el estadio Hernando Siles de La Paz, entre el 21 y 23 de julio. La vuelta se disputar\u00e1 en la Arena do Gr\u00eamio, en Porto Alegre, del 28 al 30.\n\n\u200ePor disputar esta fase, la \u2018Academia\u2019 recibir\u00e1 un premio econ\u00f3mico de 500.000 d\u00f3lares; y en caso de clasificar a los a la siguiente instancia sumar\u00e1 otros 600.000 d\u00f3lares.\n\nSORTEO\n\n\u200eEl sorteo de los octavos de final se realizar\u00e1 el viernes 29 de mayo desde las 11.00 en Asunci\u00f3n, Paraguay.\n\n\u200eAmbos equipos quedaron ubicados en la llave A para el evento que tambi\u00e9n definir\u00e1 las local\u00edas y el camino rumbo a cuartos de final, semifinales y final.\n\n\u200eBol\u00edvar y Gr\u00eamio volver\u00e1n a enfrentarse en torneos continentales tras sus cruces en las ediciones 1983 y 2003 de la Libertadores.", "dateTimeNews": "2026-05-28T14:49:29+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/1779978355686.webp", "position": 19, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/futbol/gremio-sera-rival-bolivar-play-off-copa-sudamericana_1779939168"}], "source": "La Raz\u00f3n", "title": "Bol\u00edvar jugar\u00e1 ante el brasile\u00f1o Gr\u00eamio por la Sudamericana", "url": "https://larazon.bo/lr-article/2026/05/28/bolivar-jugara-ante-el-brasileno-gremio-por-la-sudamericana/"}, {"actor": [], "authors": ["Yenny Escalante"], "body": "Reporte de la Fiscal\u00eda General del Estado\n\nEl fiscal departamental de Tarija, Jos\u00e9 Ernesto Mogro Palacios, inform\u00f3 que se investiga la muerte de Melani P. I. M., de 37 a\u00f1os de edad, quien presuntamente fue golpeada por su concubino Orlando L. B. N., de 52 a\u00f1os. Luego de permanecer internada por varios d\u00edas, perdi\u00f3 la vida la madrugada de ayer mi\u00e9rcoles en la ciudad de Tarija.\n\nInicialmente el caso fue abierto por el delito de \u2018feminicidio en grado de tentativa\u2019 en contra del sospechoso que fue enviado con detenci\u00f3n preventiva al penal de Morros Blancos; sin embargo, ante el fallecimiento de la v\u00edctima se recalific\u00f3 el tipo penal a feminicidio.\n\n\u201cComo Ministerio P\u00fablico se dispuso de manera inmediata el inicio de la investigaci\u00f3n y el despliegue del Equipo Multidisciplinario de la Fiscal\u00eda Especializada en Delitos
