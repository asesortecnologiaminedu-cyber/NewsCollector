    const rawClusters = [{"actor": [], "authors": [], "body": "La diputada argentina de la Izquierda Socialista, Mercedes Trimarchi, particip\u00f3 en movilizaciones en Senkata, en la ciudad de El Alto, y lanz\u00f3 un discurso en contra del Gobierno boliviano de Rodrigo Paz.\n\nEn su discurso, Trimarchi afirma que los sectores que se movilizan contra el Gobierno bolivianos son un \u201cfaro\u201d ya que lograron \u201cponer en jaque\u201d \u201ca un Gobierno como el de Rodrigo Paz\u201d, al que calific\u00f3 de \u201cderechista\u201d.\n\nSeg\u00fan la Diputada argentina, Paz y su Gobierno buscan \u201cquitar los derechos\u201d del pueblo movilizado,\n\n\u201cSon nuestro faro, en seis meses han logrado poner en jaque a un Gobierno como el de Rodrigo Paz, un Gobierno derechista que viene a quitar todos los derechos que hemos conquistado con nuestra fuerza como trabajadores\u201d, se\u00f1al\u00f3. Advertisement:\n\nAfirm\u00f3 que en su pa\u00eds, tres 3 a\u00f1os del Gobierno de un \u201cfacho, fascista\u201d como Javier Milei, se perdi\u00f3 \u201chasta el agua que tomamos todos los d\u00edas\u201d.\n\nLuego, a trav\u00e9s de un video difundido en las redes, explic\u00f3 que su presidencia en las movilizaciones bolivianas se da en el marco de la \u201cUnidad Internacional de Trabajadores\u201d y la \u201cCuarta Internacional de la izquierda socialista\u201d.\n\nEn su discurso, Trimarchi tambi\u00e9n sostuvo adem\u00e1s que existe una articulaci\u00f3n internacional de gobiernos de derecha y mencion\u00f3 al presidente de Estados Unidos, Donald Trump, y al primer ministro israel\u00ed, Benjamin Netanyahu.\n\n\u201cContra toda esa ultraderecha que se organiza en el mundo contra el pueblo trabajador, tenemos un faro y es esta organizaci\u00f3n. Tenemos al pueblo boliviano que lucha y que es un ejemplo para toda Latinoam\u00e9rica\u201d, manifest\u00f3. Adem\u00e1s, acus\u00f3 \u00abrepresi\u00f3n\u00bb de parte de la Polic\u00eda cuando, asegur\u00f3, las mmovilizaciones contra el Gobierno de Paz son \u00abpac\u00edficas\u00bb.\n\nEste mi\u00e9rcoles se cumplen 27 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-27T19:50:24+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/diputada_argentina_elalto.jpg", "position": 1, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/diputada-argentina-llega-alto-destaca-protestas-pusieron-jaque-gobierno_1779899768"}], "source": "Ox\u00edgeno", "title": "Diputada socialista de Argentina particip\u00f3 en movilizaciones en Senkata y discursa contra el Gobierno de Paz", "url": "https://oxigeno.bo/diputada-socialista-de-argentina-participo-en-movilizaciones-en-senkata-y-discursa-contra-el-gobierno-de-paz/"}, {"actor": [], "authors": [], "body": "en Nacional\n\nLa primera reuni\u00f3n de la Comisi\u00f3n de Di\u00e1logo concluy\u00f3 este mi\u00e9rcoles con acuerdos orientados a ampliar la participaci\u00f3n de sectores movilizados y fortalecer las mesas de concertaci\u00f3n instaladas en medio de la crisis social que atraviesa el pa\u00eds.\n\nEl encuentro, promovido por la Asamblea Legislativa y respaldado por el vicepresidente Edmand Lara, reuni\u00f3 a autoridades y representantes de distintos sectores con el objetivo de abrir espacios de negociaci\u00f3n frente a las protestas y bloqueos que persisten desde hace casi un mes.\n\nTras la reuni\u00f3n, la Comisi\u00f3n inform\u00f3 que realizar\u00e1 gestiones para garantizar la presencia de todos los dirigentes convocados al di\u00e1logo.\n\n\u201cSe acord\u00f3 realizar las gestiones necesarias para garantizar la asistencia de todos los dirigentes\u201d, se\u00f1ala parte del comunicado.\n\nAdem\u00e1s, los participantes definieron incorporar a representantes de la Iglesia Cat\u00f3lica, la Defensor\u00eda del Pueblo, la Asamblea Permanente de Derechos Humanos y organismos internacionales para acompa\u00f1ar y dar continuidad al proceso de di\u00e1logo.\n\nLea tambi\u00e9n: Sin sectores movilizados que exigen su renuncia, Paz da inicio al Consejo Econ\u00f3mico y Social\n\nLa Comisi\u00f3n tambi\u00e9n determin\u00f3 convocar de forma presencial a todos los actores vinculados al conflicto social, con el objetivo de avanzar en consensos que permitan reducir la tensi\u00f3n y atender las demandas de distintos sectores.\n\nAl finalizar el encuentro, las mesas de di\u00e1logo buscar\u00e1n encaminar soluciones orientadas a la pacificaci\u00f3n social y a la atenci\u00f3n de las demandas de la poblaci\u00f3n boliviana.\n\nYa son 27 d\u00edas de protestas, bloqueos y conflictos que afectan principalmente al occidente del pa\u00eds y generan problemas de abastecimiento, transporte y distribuci\u00f3n de combustibles.\n\nEntretanto, el presidente Rodrigo Paz se encuentra encabezando la primera reuni\u00f3n del Consejo Econ\u00f3mico y Social, en el Campo Ferial Chuquiago Marka.", "dateTimeNews": "2026-05-27T19:00:06+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/707415637_1392464762913759_3024673879377028805_n.webp", "position": 2, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/comision-de-dialogo-acuerda-gestionar-la-presencia-de-todos-los-sectores-sociales-y-continuara-este-jueves/"}], "source": "La Raz\u00f3n", "title": "Di\u00e1logo en Vicepresidencia: Acuerdan ampliar convocatoria a dirigentes para lograr pacificaci\u00f3n", "url": "https://larazon.bo/nacional/2026/05/27/vicepresidencia-comision-de-dialogo-acuerda-ampliar-convocatoria-para-destrabar-la-crisis/"}, {"actor": [], "authors": [], "body": "DETERMINACIONES. En la resoluci\u00f3n del ampliado se sostiene que en el departamento de La Paz se ha generado una situaci\u00f3n cr\u00edtica que afecta a toda la poblaci\u00f3n: se registra una grave falta de suministro de carburantes, derivada de los bloqueos y movilizaciones que se han desarrollado en distintos puntos.\n\nLa Federaci\u00f3n Departamental de Choferes 1ro de mayo ha decidido este martes ingresar en un paro indefinido con movilizaciones, en protesta contra por los incumplimientos de compromisos del Gobierno y la situaci\u00f3n de conflicto que atraviesa el pa\u00eds. El ejecutivo departamental, Edson Valdez, indic\u00f3 que la medida de presi\u00f3n se cumplir\u00e1 a partir de las cero horas.\n\n\u201cNo hay cumplimiento a los acuerdos que hemos hecho, mejor calidad de combustible, el tema del resarcimiento que ha llegado ni siquiera a un 5%, por lo tanto, era la primera medida que toma el departamento de La Paz a trav\u00e9s del transporte federado\u201d, manifest\u00f3 Valdez.\n\nEn la resoluci\u00f3n del ampliado se sostiene que en el departamento de La Paz se ha generado una situaci\u00f3n cr\u00edtica que afecta a toda la poblaci\u00f3n: se registra una grave falta de suministro de carburantes (gasolina y di\u00e9sel), derivada de los bloqueos y movilizaciones que se han desarrollado en distintos puntos.\n\nA ra\u00edz de esta circunstancia, que repercute directamente en la ciudad de La Paz, no solo se ha convertido en un problema generalizado en la vida diaria, la actividad econ\u00f3mica y el funcionamiento de los servicios de todo el departamento, afirma.\n\nPor su parte, el dirigente de la Federaci\u00f3n Chuquiago Marka, Santos Escalante, explic\u00f3 que se ha tomado la determinaci\u00f3n por el tema de la gasolina de mala calidad y los reclamos por el renacimiento, pero adem\u00e1s los incumplimientos del Gobierno con el sector. Asimismo, dijo que los choferes se suman a la poblaci\u00f3n en la protesta por los altos precios de los alimentos.\n\nEscalante enfatiz\u00f3 que los choferes tambi\u00e9n demandan diferimiento de cr\u00e9ditos bancarios, debido a los perjuicios que han sufrido. Seg\u00fan Valdez, las bases ped\u00edan sumarse al pedido de renuncia del presidente Rodrigo Paz, pero la dirigencia persuadi\u00f3 para no incorporar este tema a la resoluci\u00f3n. Escalante complement\u00f3 que no quieren politizar sus medidas.\n\nDemandaron que el Gobierno resuelva los conflictos que atraviesa el pa\u00eds, que han afectado a la poblaci\u00f3n con desabastecimiento. Algunos sectores de choferes ya comenzaron con medidas de presi\u00f3n desde el lunes, debido a la falta de combustible que les impide desarrollar su labor.\n\nAgencias", "dateTimeNews": "2026-05-27T18:14:56+00:00", "dateTimeReceived": "", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/05/1-5-21.webp", "position": 3, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/choferes-de-la-paz-declaran-paro-indefinido-desde-el-miercoles-y-sus-bases-ya-piden-la-renuncia-de-paz/"}], "source": "El Mundo", "title": "Choferes en La Paz van a paro indefinido, piden dimisi\u00f3n de Paz", "url": "https://elmundo.com.bo/choferes-en-la-paz-van-a-paro-indefinido-piden-dimision-de-paz/"}, {"actor": [], "authors": [], "body": "NORMATIVA. La sesi\u00f3n comenz\u00f3 a las 11:30 y dur\u00f3 hasta la noche de ayer. La Ley 1341 regulaba los procedimientos y l\u00edmites para la aplicaci\u00f3n de estados de excepci\u00f3n, incluyendo mecanismos de control legislativo y restricciones temporales para las medidas asumidas por el Ejecutivo.\n\nLuego de una sesi\u00f3n virtual, la C\u00e1mara de Diputados sancion\u00f3 el proyecto de ley que busca abrogar la denominada \u201cLey Copa\u201d, que regula los estados de excepci\u00f3n en Bolivia. Tras su aprobaci\u00f3n por m\u00e1s de dos tercios, la norma fue remitida al \u00d3rgano Ejecutivo para su promulgaci\u00f3n.\n\n\u201cHabiendo aprobado en sus dos estaciones y al ser c\u00e1mara revisora queda sancionada la presente ley, rem\u00edtase al \u00d3rgano Ejecutivo para fines constitucionales\u201d, se\u00f1al\u00f3 el presidente de Diputados, Roberto Castro.\n\nDicha normativa abroga la Ley 1341, consideradas por sus impulsores como una disposici\u00f3n que impone restricciones para la declaratoria de estados de excepci\u00f3n en territorio nacional.\n\n\u201cSe ha aprobado la ley con m\u00e1s de dos tercios de votos\u201d, dijo Rafael L\u00f3pez, diputado de Libre. \u201cLa protesta y la huelga est\u00e1n garantizadas. Dejemos de ser tibios. No podemos tolerar este tipo de actos violentos ni que un militar o un polic\u00eda sea golpeado. No podemos tolerar que maten a j\u00f3venes\u201d, sostuvo su colega del Partido Dem\u00f3crata Cristiano (PDC), Manolo Rojas.\n\nOtras asamble\u00edstas expresaron su preocupaci\u00f3n por la aprobaci\u00f3n de esta normativa e incluso propusieron cambios. Tal es el caso de la diputada del PDC, Milka Rojas, quien dijo que la abrogaci\u00f3n puede provocar \u201cconsecuencias legales\u201d, al tiempo de sugerir la derogaci\u00f3n de algunos art\u00edculos y no proceder con la abrogaci\u00f3n total de la norma, seg\u00fan Unitel.\n\nSin embargo, otros parlamentarios rechazaron el proyecto de ley. \u201cEs como echar gasolina al fuego, eso tenemos que entender; no podemos acallar al pueblo. Yo no voy a abrogar esta ley. Cuando hay un problema no podemos incitar m\u00e1s con esta abrogaci\u00f3n\u201d, dijo la diputada del PDC, Sonia Si\u00f1ani.\n\nLa sesi\u00f3n comenz\u00f3 a las 11:30 y tuvo un cuarto intermedio de dos horas. No obstante, se reinstal\u00f3 a las 15:00 para iniciar el tratamiento inmediato del proyecto. Posiciones divididas entre los parlamentarios marcaron el debate sobre el alcance de la abrogaci\u00f3n de la normativa.\n\nPreviamente, el proyecto normativo fue tratado en el Senado y aprobado durante una sesi\u00f3n de la C\u00e1mara Alta realizada en la ciudad de Sucre, en la Casa de la Libertad, en la v\u00edspera del aniversario de Chuquisaca.\n\nLa Ley 1341 regulaba los procedimientos y l\u00edmites para la aplicaci\u00f3n de estados de excepci\u00f3n, incluyendo mecanismos de control legislativo y restricciones temporales para las medidas asumidas por el Ejecutivo.", "dateTimeNews": "2026-05-27T18:11:39+00:00", "dateTimeReceived": "", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/05/1-4-22.webp", "position": 4, "similar": [{"source": "Sumando Voces", "url": "https://sumandovoces.com.bo/paz-promulga-la-abrogacion-de-la-ley-de-estados-de-excepcion-en-medio-de-la-crisis-por-bloqueos/"}], "source": "El Mundo", "title": "Diputados abroga \u201cLey Copa\u201d que regulaba Estados de Excepci\u00f3n", "url": "https://elmundo.com.bo/diputados-abroga-ley-copa-que-regulaba-estados-de-excepcion/"}, {"actor": [], "authors": [], "body": "La Embajada de Estados Unidos en Bolivia emiti\u00f3 la noche de este martes una alerta de seguridad ante la conflictividad en diferentes regiones, lo que implic\u00f3 la suspensi\u00f3n de sus servicios consulares de rutina por dos d\u00edas y nueve recomendaciones de seguridad a sus ciudadanos.\n\nLos servicios consulares que se prestan en la legaci\u00f3n diplom\u00e1tica en La Paz fueron suspendidos este mi\u00e9rcoles y jueves, por lo que se habilit\u00f3 la l\u00ednea de emergencia +591 2 216 8000.\n\nAnte los bloqueos que se dan en diferentes regiones, la Embajada hizo conocer que tiene una capacidad limitada para ofrecer servicios de emergencia a ciudadanos estadounidenses debido a los riesgos de seguridad.\n\nTambi\u00e9n recomend\u00f3 no viajar por carretera entre ciudades, porque los conductores que intentan pasar los bloqueos han reportado violencia, agresiones f\u00edsicas y da\u00f1os a sus veh\u00edculos.\n\nSobre los servicios a\u00e9reos, dio cuenta de que operan normalmente, aunque en la terminal a\u00e9rea de El Alto el flujo es intermitente debido a bloqueos ocasionales en la entrada del aeropuerto.", "dateTimeNews": "2026-05-27T18:06:35+00:00", "dateTimeReceived": "", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/05/2-3-10.webp", "position": 5, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/embajada-de-eeuu-suspende-servicios-consulares-en-la-paz-y-pide-a-sus-ciudadanos-evitar-viajes-por-bolivia/"}], "source": "El Mundo", "title": "Embajada de EEUU en Bolivia emite una alerta de seguridad", "url": "https://elmundo.com.bo/embajada-de-eeuu-en-bolivia-emite-una-alerta-de-seguridad/"}, {"actor": [], "authors": [], "body": "BLOQUEOS. En ese sentido, el comandante de la Polic\u00eda Boliviana pidi\u00f3 a los grupos movilizados permitir el paso de productos esenciales para la poblaci\u00f3n, sobre todo tomando en cuenta el da\u00f1o directo que se genera a los sectores m\u00e1s vulnerables.\n\nEl comandante general de la Polic\u00eda boliviana, Mirko Sokol, inform\u00f3 que a nivel nacional se reportan 150 puntos de bloqueo que afectan a varios departamentos y pidi\u00f3 a los grupos movilizados tener m\u00e1s \u201chumanidad\u201d y habilitar corredores para el paso de alimentos, medicamentos, ox\u00edgeno, combustible, entre otros.\n\nSokol inform\u00f3 que se reportan bloqueos en cinco de los nueve departamentos; sin embargo, afirm\u00f3 que al bloquear rutas troncales todas las regiones resultan afectadas.\n\n\u201cTenemos 150 puntos de bloqueo a nivel nacional. En los departamentos donde no tenemos bloqueo son Beni, Pando, Tarija y Chuquisaca, pero cualquier bloqueo en alguna ruta troncal afecta a diferentes departamentos. As\u00ed en el departamento no haya bloqueo, igual les afecta\u201d, se\u00f1al\u00f3.\n\nEn ese sentido, el Comandante de la Polic\u00eda pidi\u00f3 a los grupos movilizados permitir el paso de productos esenciales para la poblaci\u00f3n, sobre todo tomando en cuenta el da\u00f1o directo que se genera a los sectores m\u00e1s vulnerables.\n\n\u201cExhortarles a que eso se replique en otros puntos de bloqueo. Seamos m\u00e1s humanitarios, pensemos en la gente que est\u00e1 siendo afectada, que es la m\u00e1s pobre, la m\u00e1s desvalida\u201d, exhort\u00f3.\n\nEl jefe policial tambi\u00e9n advirti\u00f3 que algunos sectores estar\u00edan reinstalando bloqueos en rutas que hab\u00edan sido liberadas temporalmente.\n\nEste martes se cumplen 26 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.\n\nAgencias", "dateTimeNews": "2026-05-27T18:05:07+00:00", "dateTimeReceived": "", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/05/1-3-11.webp", "position": 6, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/policia-reporta-150-puntos-de-bloqueo-y-pide-humanidad-para-permitir-el-paso-de-alimentos-combustible-y-medicamentos/"}], "source": "El Mundo", "title": "Polic\u00eda reporta 150 puntos de bloqueo, y pide \u201chumanidad\u201d", "url": "https://elmundo.com.bo/policia-reporta-150-puntos-de-bloqueo-y-pide-humanidad/"}, {"actor": [], "authors": [], "body": "Gerson Palermo, l\u00edder del PCC, fue capturado en Cotoca y ser\u00e1 extraditado a Brasil tras seis a\u00f1os pr\u00f3fugo.\n\nFicha informativa Gerson Palermo, l\u00edder del PCC, fue capturado en Bolivia y ser\u00e1 extraditado a Brasil tras seis a\u00f1os pr\u00f3fugo. Su arresto es resultado de un operativo conjunto entre la Polic\u00eda Federal de Brasil y la Felcn. Toca para ver el contexto completo Contexto: Palermo ten\u00eda una alerta roja de Interpol y estaba vinculado a una estructura criminal dedicada al tr\u00e1fico internacional de drogas. En 2000 particip\u00f3 en el secuestro de un avi\u00f3n y en 2017 fue identificado como cabecilla en la Operaci\u00f3n All In. Palermo ingres\u00f3 ilegalmente a Bolivia con identidad falsa como empresario agr\u00edcola. Durante su captura, se arrestaron otras personas e incautaron drogas sint\u00e9ticas como \u00e9xtasis y ketamina en un operativo realizado sin resistencia. Por qu\u00e9 importa: La captura refleja el fortalecimiento de los mecanismos de cooperaci\u00f3n regional contra el narcotr\u00e1fico y el crimen organizado. Se aceler\u00f3 su entrega a Brasil por razones de seguridad estatal, evitando el proceso judicial habitual para extradiciones. Datos clave: Fecha de captura: 26 de mayo de 2026\n\n26 de mayo de 2026 Fecha de entrega a Brasil: 27 de mayo de 2026\n\n27 de mayo de 2026 A\u00f1os pr\u00f3fugo: 6 a\u00f1os (desde 2020)\n\n6 a\u00f1os (desde 2020) Condena acumulada: 126 a\u00f1os\n\n126 a\u00f1os Monto robado en secuestro: 5.5 millones de reales IngresarDesbloquear acceso completo\n\nTrasladan a l\u00edder del PCC a Brasil \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nGerson Palermo: el l\u00edder del PCC extraditado a Brasil\n\nLa ma\u00f1ana de este mi\u00e9rcoles 27 de mayo, un fuerte contingente de seguridad de la Fuerza Especial de Lucha Contra el Narcotr\u00e1fico (Felcn) custodi\u00f3 a Gerson Palermo, considerado uno de los l\u00edderes del Primer Comando Capital (PCC). Palermo fue trasladado al aeropuerto Viru Viru para ser entregado a agentes brasile\u00f1os y ser llevado en un avi\u00f3n de la Polic\u00eda Federal hasta su pa\u00eds, donde es requerido por la justicia.\n\nDetalles del traslado y captura\n\nEl acusado baj\u00f3 manillado de un veh\u00edculo de la Felcn, con polic\u00edas en ambos costados. Vest\u00eda un buso negro, chinelas, una polera crema y un abrigo. Al ver las c\u00e1maras de los medios de comunicaci\u00f3n, evit\u00f3 ser captado. El brasile\u00f1o fue capturado el martes 26 de mayo en una casa en Cotoca, durante un operativo conjunto del Grupo de Inteligencia y Operaciones Especiales (GIOE Oriente-GER) y la Polic\u00eda Federal de Brasil.\n\nUn historial criminal alarmante\n\nTras su captura, Palermo fue llevado a dependencias de Interpol para fines investigativos. Este individuo ten\u00eda una alerta roja de Interpol y estaba pr\u00f3fugo desde 2020. Manten\u00eda una condena total acumulada de 126 a\u00f1os por delitos como tr\u00e1fico internacional de drogas y asalto a bancos. La mayor pena se debi\u00f3 al secuestro de un avi\u00f3n y el robo de dinero reci\u00e9n retirado de un banco en Brasil.\n\nV\u00ednculos con el narcotr\u00e1fico internacional\n\nLas investigaciones en Brasil vinculan a Palermo con una estructura criminal que operaba con aeronaves y log\u00edstica destinada al transporte internacional de droga. Adem\u00e1s, la justicia federal de Mato Grosso do Sul lo identifica como l\u00edder en el tr\u00e1fico transnacional de coca\u00edna relacionado con rutas que operaban en la frontera boliviana.\n\nReacciones oficiales ante la captura\n\nErnesto Justiniano, viceministro de Defensa Social y Sustancias Controladas, destac\u00f3 que \u201cla captura refleja el fortalecimiento de los mecanismos de cooperaci\u00f3n regional contra el narcotr\u00e1fico y el crimen organizado\u201d. La captura y expulsi\u00f3n de Gerson Palermo es resultado de una fuga que dur\u00f3 seis a\u00f1os, un pol\u00e9mico fallo judicial y un operativo binacional.\n\nHechos m\u00e1s relevantes sobre Gerson Palermo\n\nHistorial criminal y condena en Brasil:\n\nA\u00f1o 2000: Particip\u00f3 en el secuestro del Boeing 737 para robar 5.5 millones de reales del Banco do Brasil.\n\n\n\nA\u00f1o 2017: Identificado como cabecilla en la Operaci\u00f3n All In por tr\u00e1fico internacional mediante rutas a\u00e9reas.\n\n\n\nCondena acumulada: Totaliza 126 a\u00f1os.\n\nPol\u00e9mica liberaci\u00f3n y fuga (2020):\n\nArresto domiciliario: En abril, se le otorg\u00f3 prisi\u00f3n domiciliaria por problemas alegados de salud.\n\n\n\nLa huida: Desapareci\u00f3 tras romperse la tobillera electr\u00f3nica cinco horas despu\u00e9s.\n\nVida oculta en Bolivia:\n\nIdentidad falsa: Ingres\u00f3 ilegalmente a Bolivia haci\u00e9ndose pasar por empresario agr\u00edcola.\n\nIntercambio e inteligencia (Mayo 2026):\n\nLocalizaci\u00f3n: Detectado por la Polic\u00eda Federal mediante enlaces fronterizos.\n\n\n\nOperativo en Cotoca: Allanamiento realizado sin resistencia; se arrestaron otras personas e incautaron drogas sint\u00e9ticas como \u00e9xtasis y ketamina.\n\nAl confirmarse su identidad mediante Interpol, las autoridades bolivianas redactaron una orden inmediata para su salida obligatoria del pa\u00eds por razones de seguridad estatal. Esto aceler\u00f3 su entrega directa a Brasil sin necesidad del largo proceso judicial habitual para extradiciones.", "dateTimeNews": "2026-05-27T18:04:46+00:00", "dateTimeReceived": "", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a172ffde5331.jpg", "position": 7, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/santa-cruz/fuerte-dispositivo-seguridad-trasladan-capo-pcc-brasil_1779899804"}], "source": "La Patria", "title": "Trasladan a l\u00edder del PCC a Brasil - La Patria 3.0", "url": "https://lapatria.bo/enfoque-nacional/trasladan-a-lider-del-pcc-a-brasil/"}, {"actor": [], "authors": [], "body": "La Embajada de Estados Unidos en Bolivia inform\u00f3 que, debido a los bloqueos y conflictos sociales, decidido suspender sus servicios consulares por dos d\u00edas en La Paz. Adem\u00e1s, pidi\u00f3 a sus ciudadanos evitar viajar por tierra dentro del territorio nacional.\n\n\u201cUbicaci\u00f3n: La Paz y carreteras en toda Bolivia. Evento: Los servicios consulares de rutina en la Embajada de EE.UU. en La Paz, Bolivia, est\u00e1n suspendidos el mi\u00e9rcoles 27 de mayo y el jueves 28 de mayo\u201d, se lee en la p\u00e1gina oficial de la delegaci\u00f3n estadounidense.\n\nAsimismo, el despacho inform\u00f3 que solo se atender\u00e1n emergencias y que los ciudadanos pueden comunicarse al n\u00famero +591 2 216 8000.\n\nLa representaci\u00f3n gubernamental estadounidense alert\u00f3 sobre el car\u00e1cter imprevisto de estas movilizaciones viales y advirti\u00f3 a sus connacionales sobre reportes de agresiones f\u00edsicas, da\u00f1os a la propiedad vehicular y hechos de violencia civil cometidos contra conductores que intentaron sortear los puntos de protesta en las v\u00edas interdepartamentales.\n\n\u201cEvite las \u00e1reas de manifestaciones y no viaje por carretera entre ciudades en Bolivia. El gobierno de EEUU tiene capacidad limitada para ofrecer servicios de emergencia a ciudadanos estadounidenses en estos bloqueos debido a los riesgos de seguridad\u201d, a\u00f1ade el pronunciamiento.\n\nAsimismo, la instituci\u00f3n aclar\u00f3 que aunque los servicios de transporte a\u00e9reo operan con normalidad en el pa\u00eds, el acceso vehicular hacia el Aeropuerto Internacional de El Alto presenta cortes intermitentes a causa de protestas espor\u00e1dicas en el ingreso a la terminal de pasajeros.\n\nComo consecuencia de este escenario, la delegaci\u00f3n diplom\u00e1tica emiti\u00f3 un listado de acciones obligatorias para los ciudadanos extranjeros, instruyendo de manera expresa evitar las \u00e1reas de conflicto, no viajar por carretera entre ciudades del pa\u00eds y mantener un perfil bajo estando conscientes de su entorno.", "dateTimeNews": "2026-05-27T17:59:43+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/embajada_eeuu_bolivia.png", "position": 8, "similar": [{"source": "Asuntos Centrales", "url": "https://asuntoscentrales.com/embajada-de-estados-unidos-suspende-servicios-consulares-por-dos-dias-ante-los-bloqueos-en-bolivia/"}], "source": "Ox\u00edgeno", "title": "Embajada de EEUU suspende servicios consulares en La Paz y pide a sus ciudadanos evitar viajes por Bolivia", "url": "https://oxigeno.bo/embajada-de-eeuu-suspende-servicios-consulares-en-la-paz-y-pide-a-sus-ciudadanos-evitar-viajes-por-bolivia/"}, {"actor": [], "authors": [], "body": "El director general de Migraci\u00f3n, Eddy Ordo\u00f1ez, anunci\u00f3 este mi\u00e9rcoles que se asumir\u00e1n acciones ante la Canciller\u00eda, luego de conocerse que una diputada argentina lleg\u00f3 al pa\u00eds para abordar asuntos internos de Bolivia.\n\nSe trata de la diputada argentina de la provincia de Buenos Aires por la Izquierda Socialista, Mercedes Trimarchi, quien particip\u00f3 en un cabildo en Senkata, El Alto, donde expres\u00f3 su respaldo y aliento a las movilizaciones contra el Gobierno de Rodrigo Paz.\n\n\u201cEstamos coordinando con la Canciller\u00eda de nuestro pa\u00eds para que, mediante la Embajada de Argentina, podamos saber por qu\u00e9 la diputada est\u00e1 haciendo una intromisi\u00f3n directa a asuntos internos de nuestro pa\u00eds\u201d, afirm\u00f3 Ordo\u00f1ez.\n\nPara el director de Migraci\u00f3n, la diputada Trimarchi, en su calidad de autoridad extranjera, no puede inmiscuirse en asuntos internos del pa\u00eds, al igual que ning\u00fan ciudadano boliviano puede hacerlo en Argentina u otro pa\u00eds.\n\nEntre las acciones que se asumir\u00e1n est\u00e1 la notificaci\u00f3n a Trimarchi sobre la evaluaci\u00f3n de su actuaci\u00f3n por la presunta intromisi\u00f3n en asuntos internos, al considerar que habr\u00eda incurrido en una \u201cfalta grave\u201d. La legisladora argentina ingres\u00f3 a Bolivia en calidad de turista.\n\nOrdo\u00f1ez se\u00f1al\u00f3 que ser\u00e1 la Canciller\u00eda la encargada de contactar a la Embajada de Argentina y, posteriormente, al Poder Legislativo del vecino pa\u00eds, para poner en conocimiento la situaci\u00f3n.", "dateTimeNews": "2026-05-27T17:59:22+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/diputada_argentina_elalto1.png", "position": 9, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/27/una-diputada-argentina-participa-de-movilizaciones-en-el-alto/"}, {"source": "RTP Bolivia", "url": "https://rtpbolivia.com.bo/politica/migracion-activa-acciones-contra-diputada-argentina-por-actos-de-intromision-en-bolivia/"}], "source": "Ox\u00edgeno", "title": "Migraci\u00f3n anuncia acciones ante Canciller\u00eda por intromisi\u00f3n de diputada argentina en asuntos de Bolivia", "url": "https://oxigeno.bo/migracion-anuncia-acciones-ante-cancilleria-por-intromision-de-diputada-argentina-en-asuntos-de-bolivia/"}, {"actor": [], "authors": [], "body": "El operativo de 18.000 efectivos en Guadalajara incluye robots y helic\u00f3pteros para garantizar la seguridad del Mundial\n\nFicha informativa Guadalajara implementar\u00e1 un operativo de seguridad con 18.000 efectivos durante el Mundial, utilizando tecnolog\u00eda avanzada como robots y radares para resguardar la ciudad. Toca para ver el contexto completo Contexto: En febrero, Jalisco fue epicentro de una ola de violencia tras la detenci\u00f3n del narcotraficante Nemesio Oceguera, lo que caus\u00f3 cancelaciones de eventos masivos. Candelario Hern\u00e1ndez anunci\u00f3 un juzgado itinerante en el Estadio Guadalajara. El secretario Juan Pablo Hern\u00e1ndez mencion\u00f3 que se utilizar\u00e1n pistolas anti drones y que el Escuadr\u00f3n de T\u00e9cnicos Especialistas en Desactivaci\u00f3n de Artefactos Explosivos recibi\u00f3 capacitaci\u00f3n por parte de la Polic\u00eda Nacional de Espa\u00f1a. Por qu\u00e9 importa: El operativo busca garantizar la seguridad durante el Mundial y prevenir actos delictivos, lo que podr\u00eda impactar positivamente en la percepci\u00f3n de seguridad en eventos masivos. Datos clave: 18.000 efectivos en total\n\nefectivos en total 500 unidades de patrullas, veh\u00edculos blindados y motocicletas\n\nunidades de patrullas, veh\u00edculos blindados y motocicletas 4 helic\u00f3pteros\n\nhelic\u00f3pteros 10.000 polic\u00edas municipales, estatales, Guardia Nacional y Ej\u00e9rcito\n\npolic\u00edas municipales, estatales, Guardia Nacional y Ej\u00e9rcito 8.000 miembros de seguridad privada\n\nmiembros de seguridad privada Partido M\u00e9xico-Corea programado para el 18 de junio\n\nPartido Uruguay-Espa\u00f1a previsto para el 26 de junio IngresarDesbloquear acceso completo\n\nDurante el Mundial: 18.000 efectivos resguardar\u00e1n Guadalajara \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nSeguridad en Guadalajara durante el Mundial 2026\n\nDurante el Mundial, Guadalajara implementar\u00e1 18.000 efectivos para resguardar la ciudad. La seguridad incluir\u00e1 tecnolog\u00eda avanzada, como robots humanoides y perros capaces de intervenir en potenciales amenazas de explosivos. \u201cAdem\u00e1s utilizaremos radares y pistolas anti drones\u201d, afirm\u00f3 este mi\u00e9rcoles a EFE Juan Pablo Hern\u00e1ndez, Secretario de Seguridad P\u00fablica de Jalisco.\n\nOperativo de seguridad\n\nEl operativo contar\u00e1 con unas 500 unidades, que incluyen patrullas, veh\u00edculos blindados y motocicletas, adem\u00e1s de cuatro helic\u00f3pteros. La polic\u00eda estatal desplegar\u00e1 tres patrullas \u2018Cyber truck\u2019, que podr\u00e1n convertirse en centros de comando m\u00f3viles en cualquier lugar del estado. \u201cDesde ah\u00ed podremos hacer transmisi\u00f3n de datos, de voz y visualizar c\u00e1maras urbanas\u201d, a\u00f1adi\u00f3 Hern\u00e1ndez.\n\nCapacitaci\u00f3n del personal de seguridad\n\nEl secretario tambi\u00e9n indic\u00f3 que el Escuadr\u00f3n de T\u00e9cnicos Especialistas en Desactivaci\u00f3n de Artefactos Explosivos recibi\u00f3 capacitaci\u00f3n por parte de la Polic\u00eda Nacional de Espa\u00f1a para neutralizar posibles amenazas. Adem\u00e1s, trabajadores de las polic\u00edas municipales y estatal recibieron cursos sobre explosivos, control de multitudes, tiro e intervenciones de alto impacto por parte de las Polic\u00edas Nacionales de Colombia, Francia, Argentina y del FBI.\n\nComposici\u00f3n del contingente\n\nEl contingente que resguardar\u00e1 la ciudad y los sitios tur\u00edsticos del estado estar\u00e1 formado por 10.000 polic\u00edas municipales, estatales, Guardia Nacional, Ej\u00e9rcito, as\u00ed como personal de Protecci\u00f3n Civil, bomberos y servicios m\u00e9dicos. Asimismo, unos 8.000 miembros de seguridad privada vigilar\u00e1n una milla alrededor del Estadio Guadalajara y otros resguardar\u00e1n a las selecciones nacionales, sus campamentos base y los tres kil\u00f3metros entre el estadio, el FIFA Fan Fest, los hoteles y zonas tur\u00edsticas.\n\nContexto de seguridad en Jalisco\n\nEn febrero pasado, Jalisco fue el epicentro de una ola de violencia tras la detenci\u00f3n del narcotraficante Nemesio Oceguera, l\u00edder del C\u00e1rtel Jalisco Nueva Generaci\u00f3n. Este suceso caus\u00f3 cancelaciones de eventos masivos como la Copa Mundial de Clavados 2026. Candelario Hern\u00e1ndez, comisario en jefe de la polic\u00eda de Zapopan, anunci\u00f3 que habr\u00e1 un juzgado itinerante en el Estadio Guadalajara junto a un Ministerio P\u00fablico y personal fiscal para atender posibles casos de vandalismo. \u201cTenemos un juzgado en las inmediaciones del Estadio para la pronta puesta a disposici\u00f3n de personas que incurran en alguna actitud impropia o delito\u201d, explic\u00f3.\n\nPartidos programados en Guadalajara\n\nGuadalajara ser\u00e1 sede de cuatro partidos durante la fase de grupos del Mundial 2026. Entre ellos se encuentran el M\u00e9xico-Corea programado para el 18 de junio y el Uruguay-Espa\u00f1a previsto para el 26 del mismo mes.\n\n*Con informaci\u00f3n de EFE", "dateTimeNews": "2026-05-27T17:58:51+00:00", "dateTimeReceived": "", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a172e3c423bf.jpg", "position": 10, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/deportes/guadalajara-tendra-18-000-personas-encargadas-seguridad-mundial_1779901617"}], "source": "La Patria", "title": "Durante el Mundial: 18.000 efectivos resguardar\u00e1n Guadalajara - La Patria 3.0", "url": "https://lapatria.bo/global/durante-el-mundial-18-000-efectivos-resguardaran-guadalajara/"}, {"actor": [], "authors": [], "body": "en Ciudades\n\nEl director de Transparencia de la Alcald\u00eda de Santa Cruz de la Sierra, Alberto Vaca lleg\u00f3 a la fiscal\u00eda para presentar varias denuncias contra cuatro exfuncionarios por diferentes hechos de corrupci\u00f3n.\n\n\u201cEstamos presentando cuatro diferentes denuncias contra funcionarios de la gesti\u00f3n de Johnny Fern\u00e1ndez por hechos de corrupci\u00f3n\u201d, expres\u00f3 Vaca, en conferencia de prensa.\n\nExplic\u00f3 que los casos ser\u00edan por venta de \u00edtems, cobros irregulares para agilizaci\u00f3n de tr\u00e1mites y por el uso de t\u00edtulos profesionales falsos.\n\n\u201cLe recordamos a la poblaci\u00f3n que ya no hay m\u00e1s tramitadores, no les paguen a los tramitadores, se acabaron. Esos p\u00edcaros que utilizaban la burocracia para sonsacarle plata al ciudadano cruce\u00f1o, se acabaron. En la gesti\u00f3n del alcalde Manuel Saavedra, no hay esos cobros\u201d se\u00f1al\u00f3 el funcionario.\n\nLea. La alcald\u00eda cruce\u00f1a investiga dos casos de corrupci\u00f3n\n\nDenuncia\n\nCon relaci\u00f3n a la denuncia contra exfuncionarios por t\u00edtulos falsos, indic\u00f3 que ir\u00e1n hasta las \u00faltimas consecuencias para que devuelvan el dinero que recibieron durante la gesti\u00f3n pasada cuando ejerc\u00edan un cargo p\u00fablico que no les correspond\u00eda.\n\n\u201cTodas las personas que ejercieron un cargo p\u00fablico, sin contar con los requisitos, habiendo falsificado libreta de servicio militar, o del t\u00edtulo de provisi\u00f3n nacional, les vamos a hacer devolver el dinero que recibieron todos los meses que trabajaron, porque eso es lo que dice la ley\u201d, concluy\u00f3 Vaca", "dateTimeNews": "2026-05-27T17:34:08+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/captura-de-pantalla-2026-05-27-120445_101-15564945_20260527160503.webp", "position": 11, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/santa-cruz/alcaldia-crucena-denuncia-cuatro-exfuncionarios-venta-items-titulos-falsificados_1779897422"}], "source": "La Raz\u00f3n", "title": "Denuncian a exfuncionarios de la alcald\u00eda cruce\u00f1a por corrupci\u00f3n", "url": "https://larazon.bo/ciudades/2026/05/27/denuncian-a-exfuncionarios-de-la-alcaldia-crucena-por-corrupcion/"}, {"actor": [], "authors": [], "body": "en Nacional\n\nEl presidente Rodrigo Paz asegur\u00f3 este mi\u00e9rcoles que quiere que las organizaciones sociales formen parte del Gobierno y en ese marco reiter\u00f3 su invitaci\u00f3n a la Federaci\u00f3n T\u00fapac Katari, la Central Obrera Boliviana (COB) y otros sectores movilizados para instalar mesas de di\u00e1logo en medio de la crisis social y los bloqueos que afectan al pa\u00eds desde hace casi un mes.\n\n\u201cQuiero invitarlos a todos las organizaciones sociales a que sean parte del Gobierno nacional, a todos, a todos\u201d, dijo el mandatario durante la inauguraci\u00f3n del Consejo Econ\u00f3mico y Social.\n\n\u201cCompa\u00f1eros T\u00fapac, vengan con todas las organizaciones. Estaremos para dialogar, tenemos el pliego, los hemos invitado muchas veces. Compa\u00f1eros de la Central Obrera, vengan, todo el pliego est\u00e1 con respuesta\u201d, acot\u00f3.\n\n\u201cVengan al di\u00e1logo, el pa\u00eds les est\u00e1 pidiendo. Que la gente nos vea la cara. Los invito, con la prensa, para que el pa\u00eds sepa la verdad\u201d, a\u00f1adi\u00f3.\n\nPaz asegur\u00f3 que el Gobierno mantiene disposici\u00f3n para escuchar demandas y buscar soluciones a los conflictos. \u201cNo puedo solucionar todo, pero debo responder a cada problema que hay en el pa\u00eds\u201d.\n\nEl mandatario cuestion\u00f3 las medidas de presi\u00f3n que afectan a La Paz y El Alto y denunci\u00f3 discursos violentos en medio de las protestas. \u201cLo que no pueden es hacerle da\u00f1o a otra gente. Hay convocatorias de quemar edificios, dicen que quemar\u00e1n casas de ministros y casas de periodistas, y esto lo tiene que saber la prensa internacional\u201d.\n\nPidi\u00f3 movilizaciones pac\u00edficas y rechaz\u00f3 la confrontaci\u00f3n como mecanismo para resolver diferencias pol\u00edticas. \u201cMovilic\u00e9monos pac\u00edficamente. Lo \u00fanico que supera al odio es el amor, el amor por la patria\u201d.\n\nAsimismo, defendi\u00f3 la legitimidad de su Gobierno y cuestion\u00f3 los pedidos de renuncia impulsados por sectores movilizados. \u201c\u00bfPorque no te gusta el Gobierno el 55% de la poblaci\u00f3n que vot\u00f3 por \u00e9l se tiene que ir? Es mejor que vengas a hablar y expliques tus motivos\u201d.\n\n\u201cEste boliviano no va abandonar la patria. Y el que quiera destruir la patria se la va a ver con este Presidente y toda la fuerza de la Constituci\u00f3n\u201d, dijo.\n\nEl presidente advirti\u00f3 que el tiempo para resolver la crisis se reduce y anunci\u00f3 nuevas reuniones con distintos sectores. \u201cHoy El Alto no est\u00e1 de pie, lo han puesto de rodillas\u201d.\n\nAdem\u00e1s, adelant\u00f3 que este jueves sostendr\u00e1 encuentros con comit\u00e9s c\u00edvicos de diferentes regiones del pa\u00eds.", "dateTimeNews": "2026-05-27T17:17:13+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/WhatsApp-Image-2026-05-27-at-12.45.38.webp", "position": 12, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/presidente-paz-convoca-todos-dialogo-pide-respaldo-gobernar-27-dias-bloqueos_1779900497"}], "source": "La Raz\u00f3n", "title": "\u2018Quiero que organizaciones sociales sean parte del Gobierno\u2019, dice Paz y llama a la COB y a la T\u00fapac", "url": "https://larazon.bo/nacional/2026/05/27/quiero-que-organizaciones-sociales-sean-parte-del-gobierno-dice-paz-y-llama-a-la-cob-y-la-tupac/"}, {"actor": [], "authors": [], "body": "El presidente Rodrigo Paz volvi\u00f3 este mi\u00e9rcoles a convocar al di\u00e1logo a los campesinos y a la Central Obrera Boliviana (COB), que lideran bloqueos y marchas por cuarta semana consecutiva.\n\n\u201cYo tengo instrumentos constitucionales, el tiempo se acaba, el tiempo se acaba, el tiempo se acaba. Hoy d\u00eda aqu\u00ed convocamos al di\u00e1logo, los espero esta tarde compa\u00f1eros (campesinos de) Tupac Katari, vengan con todas sus organizaciones, (\u2026) tenemos todo el pliego. Compa\u00f1eros de la Central Obrera vengan, todo el pliego est\u00e1 con respuesta\u201d, dijo.\n\nEl presidente Paz, en el acto de conformaci\u00f3n oficial del consejo econ\u00f3mico social realizado en La Paz, afirm\u00f3 que los bolivianos siempre van a dialogar antes de confrontarse porque aman su patria.\n\n\u201cAquel que le hace da\u00f1o a otro boliviano no ama a la patria, aquel que le hace da\u00f1o a una ciudad, como La Paz y El Alto, no ama a la patria\u201d, agreg\u00f3.\n\nBolivia se encuentra en el d\u00eda 27 de conflicto, que empez\u00f3 con protestas callejeras y luego se agrav\u00f3 con una declaratoria de bloqueo indefinido de carreteras.\n\nLas protestas inicialmente ped\u00edan la atenci\u00f3n a demandas sectoriales; sin embargo, ahora solo exigen la renuncia del presidente Paz.\n\nPero \u201cvengan al di\u00e1logo compa\u00f1eros, nadie est\u00e1 insultando, nadie est\u00e1 mintiendo. El pa\u00eds les est\u00e1 pidiendo ya basta de hacernos da\u00f1o, los estoy esperando para este di\u00e1logo\u201d, insisti\u00f3 el Jefe del Estado.\n\nAdem\u00e1s, el mandatario remarc\u00f3 que la revoluci\u00f3n se hace con el di\u00e1logo, no con muertos.\n\nEntre el 1 y el 24 de mayo de 2026, la Defensor\u00eda del Pueblo registr\u00f3 321 personas arrestadas, 23 heridas y siete fallecidas.", "dateTimeNews": "2026-05-27T17:08:42+00:00", "dateTimeReceived": "", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779902443793.jpeg?\u0026cw=1200\u0026ch=630", "position": 13, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-advierte-a-campesinos-y-la-cob-para-que-accedan-al-dialogo-tengo-instrumentos-constitucionales-el-tiempo-se-acaba/"}], "source": "El Deber", "title": "\u201cTengo instrumentos constitucionales, el tiempo se acaba\u201d: Rodrigo Paz convoca a bloqueadores a dialogar esta tarde", "url": "https://eldeber.com.bo/pais/yo-tengo-instrumentos-constitucionales-tiempo-acaba-rodrigo-paz-convoca-bloqueadores-dialogar-esta-tarde_1779901631"}, {"actor": [], "authors": [], "body": "Unos 18.000 miembros estatales y federales as\u00ed como robots resguardar\u00e1n a las selecciones, afici\u00f3n, turistas y directivos que asistir\u00e1n a los cuatro partidos mundialistas en la sede de Guadalajara.\n\nLa tecnolog\u00eda que ser\u00e1 usada para resguardar la ciudad incluye robots humanoides y perros capaces de intervenir en potenciales amenazas de explosivos; adem\u00e1s utilizaremos radares y pistolas anti drones\", dijo este mi\u00e9rcoles a EFE, Juan Pablo Hern\u00e1ndez, Secretario de Seguridad P\u00fablica de Jalisco.\n\nA\u00f1adi\u00f3 que unas 500 unidades, entre patrullas, veh\u00edculos blindados y motocicletas, adem\u00e1s de cuatro helic\u00f3pteros, ser\u00e1n parte del operativo.\n\nLa polic\u00eda estatal desplegar\u00e1 tres patrullas \u0027Cyber truck\u0027 con posibilidad de convertirse en centros de comando m\u00f3viles en cualquier lugar del estado.\n\n\"Desde ah\u00ed podremos hacer transmisi\u00f3n de datos, de voz y visualizar c\u00e1maras urbanas. Tambi\u00e9n tenemos varias plataformas de consulta interconectadas con otros pa\u00edses en las que pudi\u00e9ramos darnos cuenta de alguna alerta roja por la Interpol\", dijo.\n\nEl secretario dio a conocer que el Escuadr\u00f3n de T\u00e9cnicos Especialistas en Desactivaci\u00f3n de Artefactos Explosivos recibi\u00f3 capacitaci\u00f3n por la Polic\u00eda Nacional de Espa\u00f1a para neutralizar posibles amenazas.\n\nTrabajadores de las polic\u00edas municipales y estatal recibieron cursos de explosivos, control de multitudes, tiro e intervenciones de alto impacto por parte de las Polic\u00edas Nacionales de Colombia, Francia, Argentina y del FBI.\n\nEl contingente que resguardar\u00e1 la ciudad y los sitios tur\u00edsticos del estado de Jalisco estar\u00e1 formado por 10.000 polic\u00edas municipales, estatales, Guardia Nacional, Ej\u00e9rcito, adem\u00e1s de personal de Protecci\u00f3n Civil, bomberos y servicios m\u00e9dicos.\n\nUnos 8.000 miembros de seguridad privada vigilar\u00e1n una milla alrededor del Estadio Guadalajara y otros resguardar\u00e1n a las selecciones, sus campamentos base y los tres kil\u00f3metros entre el estadio, el FIFA Fan Fest, los hoteles y zonas tur\u00edsticas.\n\nEn febrero pasado, Jalisco fue el epicentro de una ola de violencia por la detenci\u00f3n del narcotraficante Nemesio Oceguera, l\u00edder del C\u00e1rtel Jalisco Nueva Generaci\u00f3n, que caus\u00f3 cancelaciones de eventos masivos como la Copa Mundial de Clavados 2026.\n\nCandelario Hern\u00e1ndez, comisario en jefe de la polic\u00eda de Zapopan dio a conocer que habr\u00e1 un juzgado itinerante en el Estadio Guadalajara, un Ministerio P\u00fablico y personal de fiscal\u00eda de Jalisco para atender posibles casos de vandalismo.\n\n\"Tenemos un juzgado en las inmediaciones del Estadio para la pronta puesta a disposici\u00f3n de personas que incurran en alguna actitud impropia o delito\", explic\u00f3.\n\nGuadalajara ser\u00e1 sede de cuatro partidos de la fase de grupos del Mundial, entre ellos el M\u00e9xico-Corea, el 18 de junio; y el Uruguay-Espa\u00f1a, el 26.", "dateTimeNews": "2026-05-27T17:07:06+00:00", "dateTimeReceived": "", "pic": "https://cdn.diez.bo/diez/052026/1779901495079.jpg", "position": 14, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/global/durante-el-mundial-18-000-efectivos-resguardaran-guadalajara/"}], "source": "El Deber", "title": "Guadalajara tendr\u00e1 m\u00e1s de 18.000 personas encargadas de la seguridad durante el Mundial", "url": "https://eldeber.com.bo/deportes/guadalajara-tendra-18-000-personas-encargadas-seguridad-mundial_1779901617"}, {"actor": [], "authors": [], "body": "El asalto madre Santa Cruz dej\u00f3 a la v\u00edctima aterrorizada. Un taxista y otros ciudadanos ayudaron a recuperar su celular tras el ataque\n\nFicha informativa Este mi\u00e9rcoles 27 de mayo, una madre fue asaltada en un microb\u00fas en Santa Cruz de la Sierra. Cuatro delincuentes la rodearon y le quitaron su celular, amenaz\u00e1ndola con un cuchillo. Un taxista y otros ciudadanos ayudaron a recuperar el tel\u00e9fono tras una intensa persecuci\u00f3n. Toca para ver el contexto completo Contexto: La madre se dirig\u00eda a clases con su hijo cuando fue asaltada. Relat\u00f3 que los delincuentes la amenazaron con un cuchillo mientras ella proteg\u00eda a su ni\u00f1o. El taxista que la ayud\u00f3 decidi\u00f3 intervenir al ver su desesperaci\u00f3n. El taxista expres\u00f3 que sinti\u00f3 una conexi\u00f3n divina al ayudar a la madre. La situaci\u00f3n evidenci\u00f3 la solidaridad entre ciudadanos ante actos delictivos. Por qu\u00e9 importa: El incidente gener\u00f3 una respuesta inmediata de las autoridades, quienes iniciaron investigaciones para capturar a los delincuentes. Adem\u00e1s, el taxista recibi\u00f3 apoyo econ\u00f3mico de transe\u00fantes para reparar su veh\u00edculo da\u00f1ado. Datos clave: Fecha: 27 de mayo\n\n27 de mayo Lugar: Santa Cruz de la Sierra\n\nSanta Cruz de la Sierra N\u00famero de delincuentes: 4\n\n4 Tipo de arma utilizada: cuchillo\n\ncuchillo Da\u00f1os materiales: parabrisas del taxi destruido IngresarDesbloquear acceso completo\n\nUna madre y su hijo sufren un violento asalto a bordo de un microb\u00fas en Santa Cruz \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nAsalto violento en microb\u00fas de Santa Cruz\n\nEste mi\u00e9rcoles 27 de mayo, una joven madre vivi\u00f3 momentos de terror en Santa Cruz de la Sierra. La v\u00edctima se dirig\u00eda hacia sus clases con su ni\u00f1o en brazos cuando, de manera imprevista, cuatro sujetos abordaron la unidad de transporte con el \u00fanico objetivo de asaltarla.\n\nDetalles del asalto\n\nEn cuesti\u00f3n de segundos, los delincuentes rodearon a la madre para arrebatarle su tel\u00e9fono celular. Para consumar el robo y asegurar su huida, uno de los antisociales no dud\u00f3 en amedrentarla frontalmente. \u201cEstaba sentada en el micro de ida a clases, y en eso suben cuatro sujetos y me quitan el celular. Uno de ellos me amenaz\u00f3 con un cuchillo para que no me baje\u201d, relat\u00f3 la afectada, reviviendo el p\u00e1nico de verse enca\u00f1onada con el arma blanca mientras proteg\u00eda a su hijo.\n\nLa reacci\u00f3n de la madre\n\nA pesar del shock inicial y movida por la desesperaci\u00f3n, la mujer descendi\u00f3 del microb\u00fas apenas los asaltantes bajaron. En plena v\u00eda p\u00fablica, comenz\u00f3 a pedir auxilio a gritos, una escena que llam\u00f3 de inmediato la atenci\u00f3n de un taxista que transitaba por el lugar.\n\nIntervenci\u00f3n del taxista\n\nEl conductor, empatizando con la angustia de la madre, detuvo su marcha y la inst\u00f3 a subir al veh\u00edculo para iniciar una intensa persecuci\u00f3n tras los delincuentes. Sin embargo, el seguimiento se torn\u00f3 sumamente peligroso al alcanzar la ubicaci\u00f3n de los sospechosos.\n\nViolencia durante la persecuci\u00f3n\n\nAl verse acorralados, los sujetos reaccionaron con extrema violencia y comenzaron a lanzar piedras de gran tama\u00f1o contra el taxi, logrando destruir por completo el parabrisas delantero del autom\u00f3vil. En medio de esa lluvia de proyectiles, los delincuentes intentaron darse a la fuga nuevamente; sin embargo, la intervenci\u00f3n de otro ciudadano solidario cambi\u00f3 el rumbo de la situaci\u00f3n.\n\nLa ayuda inesperada\n\nUn conductor que pasaba por la zona presenci\u00f3 el ataque, persigui\u00f3 a los v\u00e1ndalos y, tras alcanzarlos, logr\u00f3 presionarlos de tal manera que consigui\u00f3 que le devolvieran el tel\u00e9fono celular a la v\u00edctima.\n\nReflexiones sobre el acto heroico\n\nEl taxista, pieza clave para evitar que el delito quedara impune, reflexion\u00f3 sobre los riesgos corridos y la motivaci\u00f3n que lo llev\u00f3 a actuar al ver a la joven desesperada en la calle. \u201cYo creo que Dios me puso en el camino de la mam\u00e1 para que yo la ayude\u201d, manifest\u00f3 conmovido.\n\nAgradecimientos y apoyo comunitario\n\nEl trabajador tambi\u00e9n aprovech\u00f3 la oportunidad para expresar su profundo agradecimiento hacia los transe\u00fantes y vecinos que, conmovidos por su noble acci\u00f3n y el da\u00f1o material sufrido en su herramienta de trabajo, le brindaron ayuda econ\u00f3mica voluntaria para poder solventar los gastos de reposici\u00f3n de su parabrisas quebrado.\n\nAcciones policiales tras el incidente\n\nUna vez que el violento incidente fue de conocimiento p\u00fablico y se report\u00f3 a las autoridades, efectivos de la Fuerza Especial de Lucha Contra el Crimen (Felcc) se constituyeron de forma inmediata en la zona del ataque. Los investigadores policiales iniciaron el relevamiento de datos, tomaron declaraciones a los testigos y comenzaron con las pesquisas correspondientes para identificar y capturar a los cuatro peligrosos delincuentes que contin\u00faan pr\u00f3fugos.", "dateTimeNews": "2026-05-27T16:45:27+00:00", "dateTimeReceived": "", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a171c4c92ed4.jpg", "position": 15, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/ciudades/2026/05/27/santa-cruz-una-mujer-fue-asaltada-dentro-de-un-micro/"}], "source": "La Patria", "title": "Una madre y su hijo sufren un violento asalto a bordo de un microb\u00fas en Santa Cruz - La Patria 3.0", "url": "https://lapatria.bo/actualidad/una-madre-y-su-hijo-sufren-un-violento-asalto-a-bordo-de-un-microbus-en-santa-cruz/"}, {"actor": [], "authors": [], "body": "en Nacional\n\nLa diputada argentina Mercedes Trimarchi, de izquierda socialista, participa de las movilizaciones que se realizan en la ciudad de El Alto y que piden la renuncia del presidente, Rodrigo Paz.\n\nLa legisladora extranjera emiti\u00f3 un discurso en contra de la gesti\u00f3n de Paz y aplaudi\u00f3 las protestas que mantienen cercado principalmente al departamento de La Paz, generando la falta de alimentos, ox\u00edgeno para hospitales y combustibles.\n\n\u201cUstedes son nuestro faro porque han logrado en seis meses poner en jaque a un gobierno como el de Rodrigo Paz\u201d, dijo la parlamentaria en un video.\n\nAl respecto, la Canciller\u00eda boliviana est\u00e1 realizando los reclamos respectivos por v\u00eda diplom\u00e1tica y aplicar\u00e1 otros mecanismos migratorios establecidos en la norma.\n\nLea. Conflictos dejan 321 arrestados, 7 fallecidos y 23 heridos seg\u00fan Defensor\u00eda del Pueblo\n\nLa presencia de Trimarchi en Bolivia gener\u00f3 pol\u00e9mica y el cuestionamiento de una posible injerencia extranjera en el conflicto social.\n\nSeg\u00fan publicaciones en redes sociales, la legisladora lleg\u00f3 a Bolivia el s\u00e1bado 24 de mayo y particip\u00f3 del ampliado de la Central Obrera Boliviana (COB), adem\u00e1s de acompa\u00f1ar movilizaciones en la ciudad de El Alto y La Paz.\n\nLa participaci\u00f3n de la parlamentaria extranjera desat\u00f3 cuestionamientos en redes y sectores pol\u00edticos, donde algunos consideran que podr\u00eda tratarse de una intromisi\u00f3n en asuntos internos del pa\u00eds.\n\nLa Direcci\u00f3n General de Migraci\u00f3n inform\u00f3 que activ\u00f3 acciones de la diputada argentina Mercedes Trimarchi, quien particip\u00f3 de un cabildo en Senkata para alentar a movilizados con un mensaje contra el Gobierno.\n\nEl director de Migraci\u00f3n, Eddy Ordo\u00f1ez, indic\u00f3 que la parlamentaria ingres\u00f3 al pa\u00eds en calidad de \u201cturista\u201d.", "dateTimeNews": "2026-05-27T16:41:14+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/diputada-argentina_101-15563640_20260527125440-1.webp", "position": 16, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/migracion-anuncia-acciones-ante-cancilleria-por-intromision-de-diputada-argentina-en-asuntos-de-bolivia/"}], "source": "La Raz\u00f3n", "title": "Una diputada argentina participa de movilizaciones en El Alto", "url": "https://larazon.bo/nacional/2026/05/27/una-diputada-argentina-participa-de-movilizaciones-en-el-alto/"}, {"actor": [], "authors": [], "body": "La ma\u00f1ana de este mi\u00e9rcoles, un fuerte contingente de seguridad de la Fuerza Especial de Lucha Contra el Narcotr\u00e1fico (Felcn) custodi\u00f3 a Gerson Palermo, considerado como uno de los l\u00edderes del Primer Comando Capital (PCC), hasta el aeropuerto Viru Viru donde ser\u00e1 entregado a los agentes del Brasil para ser trasladado en un avi\u00f3n de la Polic\u00eda Federal hasta su pa\u00eds de origen donde es requerido por la justicia.\n\nEl acusado baj\u00f3 enmanillado de un veh\u00edculo de la Felcn, con polic\u00edas en ambos costados. Vest\u00eda de un buso de color negro, con chinelas, una polera crema y un abrigo. Al ver las c\u00e1maras de los medios de comunicaci\u00f3n el extranjero evit\u00f3 que lo captaran.\n\nEl brasile\u00f1o fue capturado ayer en una c\u00f3moda casa en el municipio de Cotoca, en un operativo en conjunto realizado por el Grupo de Inteligencia y Operaciones Especiales (GIOE Oriente-GER) en coordinaci\u00f3n con la Polic\u00eda Federal de Brasil. Tras su captura, el sujeto fue trasladado a dependencias de Interpol con fines investigativos y para las actuaciones correspondientes.\n\nGerson Palermo, con alerta de sello rojo de Interpol, estaba pr\u00f3fugo de la justicia desde 2020, manten\u00eda una condena de 126 a\u00f1os de c\u00e1rcel en su pa\u00eds por delito de tr\u00e1fico internacional de drogas, asalto a bancos. Sin embargo, la mayor pena que le impuso la justicia es por el secuestro de un avi\u00f3n y el robo de dinero reci\u00e9n sacado de un banco del Brasil.\n\nLas investigaciones en Brasil lo vinculan adem\u00e1s con una estructura criminal que operaba con aeronaves, veh\u00edculos, camiones y log\u00edstica destinada al transporte internacional de droga. Adem\u00e1s, la justicia federal de Mato Grosso do Sul lo identifica como l\u00edder de una organizaci\u00f3n criminal vinculada al tr\u00e1fico transnacional de coca\u00edna y relacionada con rutas que operaban en la frontera boliviana.\n\nEn un mensaje difundido en sus redes sociales, el viceministro de Defensa Social y Sustancias Controladas, Ernesto Justiniano destac\u00f3 que la captura refleja el fortalecimiento de los mecanismos de cooperaci\u00f3n regional contra el narcotr\u00e1fico y el crimen organizado.\n\n\u201cNo se trata solo de una aprehensi\u00f3n. Se trata de cooperaci\u00f3n internacional funcionando en hechos concretos: intercambio de informaci\u00f3n, inteligencia operativa y acci\u00f3n en territorio\u201d, afirm\u00f3.", "dateTimeNews": "2026-05-27T16:36:44+00:00", "dateTimeReceived": "", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779900628669.jpeg?\u0026cw=1200\u0026ch=630", "position": 17, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/trasladan-a-lider-del-pcc-a-brasil/"}], "source": "El Deber", "title": "Bajo fuerte dispositivo de seguridad trasladan a capo del PCC a Brasil", "url": "https://eldeber.com.bo/santa-cruz/fuerte-dispositivo-seguridad-trasladan-capo-pcc-brasil_1779899804"}, {"actor": [], "authors": [], "body": "Mercedes Trimarchi, legisladora de la Ciudad Aut\u00f3noma de Buenos Aires y dirigente de izquierda en Argentina, expres\u00f3 su respaldo a los grupos movilizados que exigen el acortamiento del mandato constitucional del presidente Rodrigo Paz, durante un mitin que tuvo lugar hace algunas horas en el Distrito 8 de El Alto.\n\nLa pol\u00edtica argentina, militante de Izquierda Socialista e integrante del Frente de Izquierda y de Trabajadores-Unidad, afirm\u00f3 haber llegado a Bolivia invitada por la Unidad Internacional de Trabajadores de la Cuarta Internacional (UIT-CI) y, seg\u00fan dijo, las protestas bolivianas representan una referencia para sectores pol\u00edticos afines en su pa\u00eds.\n\n\u201cPorque ustedes son nuestro faro, porque han logrado en seis meses poner en jaque a un gobierno como el de Rodrigo Paz, un gobierno derechista que viene a quitar lo que hemos conquistado con nuestra fuerza\u201d, declar\u00f3 Trimarchi en un acto en el que apareci\u00f3 sobre una peque\u00f1a mesa, rodeada de manifestantes que aplaudieron su intervenci\u00f3n.\n\nEn un video publicado en sus redes sociales, explic\u00f3 su presencia en Bolivia. \u201cMe llena de orgullo poder estar ac\u00e1. Yo vengo de Argentina, soy diputada, electa por Izquierda Socialista. Vine invitada por la Unidad Internacional de Trabajadores de la Cuarta Internacional (UIT) y compa\u00f1eros del PT me acercaron aqu\u00ed\u201d, se\u00f1al\u00f3.\n\nEn otra publicaci\u00f3n, difundida a su llegada a La Paz el 23 de mayo, cuestion\u00f3 el operativo de desbloqueo ejecutado por las fuerzas del orden y denunci\u00f3 una supuesta represi\u00f3n policial. La operaci\u00f3n ten\u00eda el prop\u00f3sito de permitir el ingreso de alimentos combustibles y medicinas a La Paz y El Alto donde la carencia de productos golpea a miles de familias.\n\n\u201cCon un operativo descomunal \u2014dijo la legisladora argentina\u2014, con camiones, armas largas y gases, reprimieron un bloqueo en la autopista que conecta Oruro con La Paz. En ese ataque represivo se cuenta que hubo un nuevo muerto. Exigimos el cese de la represi\u00f3n\u201d, afirm\u00f3 ante los movilizados que piden derrocar al gobierno.\n\nEl Gobierno insisti\u00f3 que el operativo del 23 de mayo ten\u00eda el objetivo de generar un corredor humanitario. Ese d\u00eda, los movilizados incendiaron estaciones de peaje e instalaciones de la Aduana Nacional.\n\nEn otras publicaciones, Trimarchi aparece junto a manifestantes que descendieron desde El Alto hacia La Paz. En uno de esos registros audiovisuales aparecen declaraciones de Kuyen Flores, otra ciudadana argentina y militante de la UIT, quien pide \u201cla renuncia del presidente Paz\u201d por la falta de soluciones a la crisis del combustible y otras demandas sectoriales.\n\n\n\nEl polit\u00f3logo Iv\u00e1n Rada consider\u00f3 que la presencia de Trimarchi en El Alto refleja v\u00ednculos entre las movilizaciones y sectores pol\u00edticos internacionales de izquierda radical.\n\n\n\n\u201cEsto confirma que el denominado movimiento popular y autoconvocado mantiene nexos con facciones partidarias socialistas y comunistas, que buscan influir en la narrativa de las protestas\u201d, sostuvo el profesional tras ser consultado sobre la presencia de ciudadanos extranjeros en protestas que demandan la ca\u00edda del Gobierno.\n\nTras la protesta del 18 de mayo que deriv\u00f3 en saqueo y actos violentos contra propiedades p\u00fablicas y privadas, el canciller Fernando Aramayo dijo que las protestas que a\u00edslan a La Paz y El Alto pueden contar con financiamiento extranjero. \u201cEsto no se financia solamente con los recursos propios, esto es algo financiado para desestabilizar al Gobierno\u201d, dijo Aramayo", "dateTimeNews": "2026-05-27T16:36:08+00:00", "dateTimeReceived": "", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779899683546.jpg?\u0026cw=1200\u0026ch=630", "position": 18, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/diputada-socialista-de-argentina-participo-en-movilizaciones-en-senkata-y-discursa-contra-el-gobierno-de-paz/"}], "source": "El Deber", "title": "Una diputada de izquierda argentina llega hasta El Alto y destaca las protestas que \u201cpusieron en jaque\u201d al Gobierno", "url": "https://eldeber.com.bo/pais/diputada-argentina-llega-alto-destaca-protestas-pusieron-jaque-gobierno_1779899768"}, {"actor": [], "authors": [], "body": "en Nacional\n\nLa investigaci\u00f3n iniciada por la Polic\u00eda tras el hallazgo de una encomienda con Bs 350.000, en el aeropuerto Jorge Henrich de Trinidad, permiti\u00f3 hallar nuevos elementos vinculados al caso, inform\u00f3 el viceministro de Defensa Socia, Ernesto Justiniano.\n\nLos investigadores realizaron la requisa del veh\u00edculo de un sargento del Servicio A\u00e9reo Policial aprehendido por este caso, se encontraron tres bolsones y mochilas con dinero y una pistola calibre 9 mil\u00edmetros.\n\n\u201cEn Santa Ana del Yacuma, durante la requisa del veh\u00edculo donde se encontraba el sargento del Servicio A\u00e9reo Policial, al momento de su aprehensi\u00f3n, se encontraron tres mochilas con dinero en efectivo, adem\u00e1s de un arma de fuego\u201d, explic\u00f3 Justiniano en una publicaci\u00f3n en redes sociales.\n\nLa Polic\u00eda realiz\u00f3 una requisa en el aeropuerto Jos\u00e9 Ch\u00e1vez Su\u00e1rez de Santa Ana del Yacuma, en presencia de un testigo y con conocimiento del Ministerio P\u00fablico.\n\nLea. En una encomienda llegan Bs 350.000 al aeropuerto de Beni\n\nHallazgo\n\nEn una mochila negra se hall\u00f3 $us 121.000 y Bs 648.000; en una segunda mochila se hall\u00f3 Bs 252.500 y en el tercer bolso hab\u00eda Bs 255.500. Durante las indagaciones, se hall\u00f3 un total de Bs 1.156.000 y $us 121.000, adem\u00e1s del arma e veh\u00edculo fue incautado\u201d, indic\u00f3 la autoridad.\n\n\u201cEste caso confirma algo importante: cuando se activa una alerta, la investigaci\u00f3n no se queda en la superficie. Se sigue la ruta, se analiza el entorno, se revisan veh\u00edculos, y se hallan pruebas. Luego todo en conocimiento de las autoridades\u201d, se\u00f1al\u00f3 Justiniano en sus redes sociales.\n\nInvestigados\n\nDe acuerdo con el reporte de la autoridad, entre los implicados est\u00e1 el piloto, un capit\u00e1n de Umopar de Santa Ana, una subteniente del BOL-110 y un sargento del Servicio A\u00e9reo Policial, \u201ceste uniformado fue quien habr\u00eda entregado el dinero en Santa Ana del Yacuma y fue llevado a Trinidad\u201d.\n\n\u201cEstas personas fueron puestas a disposici\u00f3n de las instancias competentes con fines investigativos\u201d, se\u00f1al\u00f3 Justiniano al precisar que el caso es de conocimiento de la Fiscal\u00eda Anticorrupci\u00f3n, la Fiscal\u00eda de Sustancias Controladas, la FELCC, Transparencia y la Didipi.", "dateTimeNews": "2026-05-27T16:25:10+00:00", "dateTimeReceived": "", "pic": "https://larazon.bo/wp-content/uploads/2026/05/709550098-1523151912716860-651540422_101-15563091_20260527122756.webp", "position": 19, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/decomiso-encomienda-bs-350-mil-aeropuerto-trinidad-hallan-dinero-arma-fuego_1779890688"}, {"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/aeropuerto-de-trinidad-hallazgo-de-121-000-dolares-bs-11-millones-y-un-arma/"}], "source": "La Raz\u00f3n", "title": "Hallan m\u00e1s de Bs 1 mill\u00f3n en el veh\u00edculo de un Polic\u00eda", "url": "https://larazon.bo/nacional/2026/05/27/hallan-mas-de-bs-1-millon-en-el-vehiculo-de-un-policia/"}, {"actor": [], "authors": [], "body": "La Federaci\u00f3n Departamental de Choferes de La Paz determin\u00f3 acatar un paro indefinido a partir de las 00:00 horas de este mi\u00e9rcoles ante lo que consideran el incumplimiento del Gobierno a los acuerdos firmados por el sector.\n\nEl secretario ejecutivo de la Federaci\u00f3n de los Choferes, Edson Valdez, afirm\u00f3 que la decisi\u00f3n e tom\u00f3 en un ampliado y revel\u00f3 que las bases ya piden la renuncia del presidente Rodrigo Paz, aunque eso no ser\u00e1 parte de sus demandas.\n\n\u201cEl ampliado ha sido contundente, ha sido claro, todos han pedido que vayamos a un paro indefinido de transporte\u201d, afirm\u00f3.\n\nValdez, en ese sentido, revel\u00f3 que las bases, en el ampliado, empezaron a exigir la renuncia del Presidente del Estado, pero asever\u00f3 que ese punto no ir\u00e1 en la resoluci\u00f3n de la Federaci\u00f3n.\n\n\u201cA partir de las 00:00 horas hay el paro indefinido en el departamento de La Paz\u201d, sentenci\u00f3.\n\nValdez afirm\u00f3 que el Gobierno no cumpli\u00f3 con garantizar el abastecimiento del combustible de buena calidad, adem\u00e1s de acelerar el resarcimiento econ\u00f3mico por los da\u00f1os ocasionados por la gasolina de mala calidad a los motorizados, entre otros puntos.\n\nLa medida de los choferes se da tras 26 d\u00edas de bloqueos de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-27T16:23:06+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/01/autos_lapaz-1.jpg", "position": 20, "similar": [{"source": "El Mundo", "url": "https://elmundo.com.bo/choferes-en-la-paz-van-a-paro-indefinido-piden-dimision-de-paz/"}], "source": "Ox\u00edgeno", "title": "Choferes de La Paz declaran paro indefinido desde el mi\u00e9rcoles y sus bases ya piden la renuncia de Paz", "url": "https://oxigeno.bo/choferes-de-la-paz-declaran-paro-indefinido-desde-el-miercoles-y-sus-bases-ya-piden-la-renuncia-de-paz/"}, {"actor": [], "authors": [], "body": "El denominado \u201cconsejo econ\u00f3mico social de la patria\u201d fue creado este mi\u00e9rcoles de manera oficial en un encuentro realizado en el campo ferial Chuquiago Marka de la ciudad de La Paz.\n\nEl encuentro cont\u00f3 con la participaci\u00f3n de distintos sectores y fue liderado por el presidente Rodrigo Paz.\n\nEl consejo fue creado \u201cpara que encontremos entre bolivianos las soluciones. Cuando haya debate sobre las leyes, ustedes ser\u00e1n los primeros en enterarse qu\u00e9 leyes; cuando empiecen las carreteras, ser\u00e1n los primeros en saber de las carreteras; (\u2026) ser\u00e1n los primeros en saber hacia d\u00f3nde va Bolivia porque solo en el encuentro podemos superarnos\u201d, dijo Paz a los asistentes.\n\nEste consejo fue constituido en medio de bloqueos de carreteras y marchas que se realizan desde principios de este mes en contra del Gobierno.\n\nPero \u201caqu\u00ed estamos para dar la cara, nosotros no tenemos miedo al futuro, (\u2026) los bolivianos vamos a paso de vencedores y siempre con las manos abiertas, los bolivianos siempre vamos a dialogar antes de confrontarnos, los bolivianos amamos la patria y aquel que le hace da\u00f1o a otro boliviano no ama la patria, aquel que le hace da\u00f1o a una ciudad, como La Paz y El Alto, no ama la patria\u201d, afirm\u00f3.", "dateTimeNews": "2026-05-27T16:07:56+00:00", "dateTimeReceived": "", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779898615129.jpeg?\u0026cw=1200\u0026ch=630", "position": 21, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/buscan-pacificacion-pais-dos-escenarios-dialogo-paz_1779891932"}], "source": "El Deber", "title": "Se instala el consejo econ\u00f3mico social liderado por Rodrigo Paz", "url": "https://eldeber.com.bo/pais/instala-consejo-economico-social-liderado-rodrigo-paz_1779898076"}, {"actor": [], "authors": [], "body": "A las seis de la ma\u00f1ana, cuando la ciudad todav\u00eda bosteza, muchas madres bolivianas ya llevan horas despiertas. Preparan desayuno, buscan medias perdidas, alistan mochilas, dejan comida adelantada y organizan el d\u00eda antes de salir a trabajar. Horas despu\u00e9s volver\u00e1n a casa para empezar otra jornada: cocinar, limpiar, escuchar, contener, cuidar.\n\nLa escena se repite todos los d\u00edas en Bolivia, aunque pocas veces se la mira como lo que realmente es: una pieza central de la econom\u00eda.\n\nCada 27 de mayo el pa\u00eds celebra el D\u00eda de la Madre entre mensajes de amor y sacrificio. Pero detr\u00e1s de esa imagen entra\u00f1able existe otra realidad m\u00e1s silenciosa y compleja. Las madres no solo sostienen afectivamente a las familias; sostienen tambi\u00e9n gran parte del funcionamiento social y econ\u00f3mico del pa\u00eds mediante un trabajo cotidiano que sigue siendo invisible y, en la mayor\u00eda de los casos, no remunerado.\n\n\u201cSin este trabajo ser\u00eda imposible sostener la econom\u00eda, la educaci\u00f3n, la salud y el bienestar social\u201d, explica Andrea Llerena, jefa de ONU Mujeres en Bolivia. Y el concepto que pone sobre la mesa no es menor: el cuidado.\n\nCocinar, limpiar, acompa\u00f1ar tareas escolares, atender enfermos, cuidar adultos mayores o sostener emocionalmente a una familia forman parte de una estructura invisible sobre la que descansa la vida cotidiana del pa\u00eds.\n\nEl problema es que esa carga todav\u00eda tiene rostro femenino\n\nEn Bolivia, las mujeres entre 28 y 37 a\u00f1os dedican en promedio 6,5 horas diarias al trabajo de cuidado no remunerado. Los hombres llegan apenas a 3,8 horas. En comunidades rurales e ind\u00edgenas, muchas mujeres destinan entre siete y diez horas diarias a estas tareas, adem\u00e1s de trabajar o generar ingresos.\n\nEl informe Tiempo para cuidar, elaborado por Oxfam, describe esta situaci\u00f3n como una \u201ccrisis del cuidado\u201d: las mujeres ingresaron masivamente al mercado laboral, pero la distribuci\u00f3n de las tareas dom\u00e9sticas y de cuidado dentro de los hogares casi no cambi\u00f3.\n\nEl resultado es una doble jornada permanente\n\n\u201cLa sobrecarga limita la autonom\u00eda econ\u00f3mica de las mujeres, reduce sus oportunidades laborales y afecta incluso su derecho al descanso y al autocuidado\u201d, sostiene Llerena.\n\nAh\u00ed aparece uno de los conceptos m\u00e1s duros \u2014y menos discutidos\u2014 del debate actual: la pobreza de tiempo.\n\nMuchas mujeres no solo ganan menos. Tambi\u00e9n tienen menos horas para descansar, estudiar, crecer profesionalmente o simplemente existir fuera de las obligaciones familiares. Mientras el mercado laboral exige productividad, los hogares contin\u00faan descansando sobre un modelo donde el cuidado sigue siendo considerado una responsabilidad \u201cnatural\u201d femenina.\n\n\n\nLas mujeres sostienen gran parte del trabajo de cuidado en Bolivia./Foto: ONU MUjeres Bolivia\n\nEl informe de Oxfam advierte que la econom\u00eda no puede entenderse \u00fanicamente desde el dinero o el mercado. Tambi\u00e9n depende de millones de horas de trabajo cotidiano que permiten sostener la vida.\n\nDetr\u00e1s de cada oficina abierta, cada micro en circulaci\u00f3n y cada aula llena, existe alguien que cuid\u00f3, cocin\u00f3, limpi\u00f3 o sostuvo emocionalmente a otra persona.\n\nY ah\u00ed aparece otra palabra clave: corresponsabilidad\n\nPara ONU Mujeres y diversos organismos internacionales, el cuidado no debe recaer exclusivamente en las mujeres ni \u00fanicamente en las familias. El desaf\u00edo implica redistribuir responsabilidades entre hombres, Estado, empresas y comunidad.\n\nLa discusi\u00f3n ya no pasa solo por homenajear a las madres, sino por preguntarse c\u00f3mo se organiza el tiempo, qui\u00e9n cuida y bajo qu\u00e9 costo emocional, econ\u00f3mico y f\u00edsico.\n\nLos datos muestran adem\u00e1s una transformaci\u00f3n cultural silenciosa. El propio informe recoge una frase reveladora: \u201cLo que antes se sobrellevaba como normal, ahora las j\u00f3venes lo viven como injusto\u201d.\n\nEn Am\u00e9rica Latina, el debate sobre cuidados ya dej\u00f3 de ser \u00fanicamente social o familiar. Pa\u00edses como M\u00e9xico, Colombia y Costa Rica avanzan en sistemas nacionales de cuidado, pol\u00edticas de corresponsabilidad y programas para redistribuir las tareas dom\u00e9sticas entre hombres, Estado y empresas.\n\nLa corresponsabilidad del cuidado sigue siendo uno de los grandes desaf\u00edos. /Foto;ONU MUjeres Bolivia\n\nBolivia todav\u00eda discute ese camino. Pero cada vez resulta m\u00e1s evidente que el cuidado no es solo un gesto de amor privado. Tambi\u00e9n es infraestructura invisible de la econom\u00eda, tiempo de trabajo y una condici\u00f3n b\u00e1sica para sostener la vida cotidiana.\n\nY quiz\u00e1s esa sea la reflexi\u00f3n m\u00e1s urgente de este 27 de mayo: ninguna sociedad puede seguir funcionando indefinidamente sobre un trabajo esencial que todav\u00eda no aprende a reconocer, redistribuir ni cuidar.", "dateTimeNews": "2026-05-27T15:28:28+00:00", "dateTimeReceived": "", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779895127125.jpeg?\u0026cw=1200\u0026ch=630", "position": 22, "similar": [{"source": "Sumando Voces", "url": "https://sumandovoces.com.bo/entre-el-empleo-y-el-cuidado-la-carga-invisible-de-ser-madre/"}], "source": "El Deber", "title": "Las madres sostienen una econom\u00eda que todav\u00eda no aprende a cuidarlas", "url": "https://eldeber.com.bo/pais/madres-sostienen-economia-todavia-no-aprende-cuidarlas_1779895708"}, {"actor": [], "authors": [], "body": "El ministro de la Presidencia, Jos\u00e9 Luis Lupo, inform\u00f3 este mi\u00e9rcoles que el Gobierno recibi\u00f3 un pliego de la Federaci\u00f3n Departamental \u00danica de Trabajadores Campesinos de La Paz \u201cT\u00fapac Katari\u201d que \u201cest\u00e1 respondido satisfactoriamente\u201d, seg\u00fan un reporte de Unitel.\n\nEl ministro de la Presidencia, Jos\u00e9 Luis Lupo, lleg\u00f3 en representaci\u00f3n del Gobierno al di\u00e1logo convocado por el vicepresidente Edmand Lara para la ma\u00f1ana de este mi\u00e9rcoles.\n\n\u201cEl Gobierno ha asistido a 80 reuniones para dialogar con diferentes sectores, en la mayor parte de los casos ha participado el presidente de la rep\u00fablica (Estado) y en todos ellos hemos llegado a acuerdos satisfactorios y a compromisos importantes para el pa\u00eds\u201d, se\u00f1al\u00f3.\n\n\u201cHoy asistimos a este espacio de di\u00e1logo, que ha sido convocado por el vicepresidente (Lara) con la misma esperanza y convicci\u00f3n de que el di\u00e1logo es el camino para encontrar soluciones\u201d, dijo\n\nLa Vicepresidencia anunci\u00f3 que invit\u00f3 a la cita a diversos actores y sectores que a la fecha se movilizan y exigen la renuncia de Paz. Adem\u00e1s, est\u00e1n convocados los jefes de bancada y representantes de la Iglesia.\n\nLupo asegur\u00f3 que el Gobierno recibi\u00f3 un pliego de la Federaci\u00f3n Departamental \u00danica de Trabajadores Campesinos de La Paz \u201cT\u00fapac Katari\u201d que \u201cest\u00e1 respondido satisfactoriamente\u201d.\n\n\u201cNo hemos tenido la oportunidad de exponerlo, de entrar punto por punto porque hasta hoy no nos hemos podido sentar\u201d, se\u00f1al\u00f3.\n\n\u201cEsperamos que en este espacio convocado por el vicepresidente y el Legislativo podamos hacerlo\u201d, sostuvo.\n\nLupo confirm\u00f3 que el presidente Paz participar\u00e1 del Consejo Econ\u00f3mico Social, que se desarrolla en campo ferial del sur de La Paz.", "dateTimeNews": "2026-05-27T15:12:23+00:00", "dateTimeReceived": "", "pic": "https://www.lostiempos.com/sites/default/files/media_imagen/2026/5/27/lupo_en_la_vicepresidencia_ed_va.jpg", "position": 23, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/buscan-pacificacion-pais-dos-escenarios-dialogo-paz_1779891932"}], "source": "Los Tiempos", "title": "Lupo representa al Gobierno en el di\u00e1logo convocado por Lara", "url": "https://www.lostiempos.com/actualidad/pais/20260527/lupo-representa-al-gobierno-dialogo-convocado-lara"}, {"actor": [], "authors": [], "body": "\ud83d\udd0a Escuchar la nota\n\nLa Paz, 27 may 2026 (ATB Media).- Always Ready cerr\u00f3 su participaci\u00f3n en la Copa Libertadores con una derrota por 3-2 frente a Liga de Quito en Ecuador, en un partido donde dej\u00f3 escapar una gran oportunidad para despedirse con una victoria. El equipo de la banda sangre mostr\u00f3 personalidad y gener\u00f3 numerosas ocasiones de gol, pero pag\u00f3 caro su falta de contundencia en los momentos decisivos. Liga reaccion\u00f3 en el tramo final del encuentro y termin\u00f3 remontando el marcador para quedarse con el liderato del Grupo G.\n\nEl inicio del compromiso hac\u00eda prever una noche complicada para el conjunto boliviano. Apenas a los seis minutos, Yerl\u00edn Qui\u00f1\u00f3nez abri\u00f3 el marcador para el cuadro ecuatoriano que comenzaba a ilusionarse con una goleada. Sin embargo, el desarrollo del partido tom\u00f3 un rumbo distinto. Liga de Quito perdi\u00f3 precisi\u00f3n y cedi\u00f3 terreno, mientras Always Ready se anim\u00f3 a tomar el control del juego, impulsado por una destacada actuaci\u00f3n de Fernando Saucedo, quien se convirti\u00f3 en el conductor ofensivo del equipo alte\u00f1o.\n\nLa igualdad lleg\u00f3 a los 18 minutos tras un tiro libre ejecutado por Saucedo desde el sector derecho. Enrique Triverio apareci\u00f3 en el \u00e1rea para desviar el bal\u00f3n y vencer al guardameta Gonzalo Valle. El cuadro boliviano mantuvo la presi\u00f3n y estuvo cerca del segundo tanto con un remate de media distancia de Saucedo que exigi\u00f3 al arquero ecuatoriano. Poco despu\u00e9s, nuevamente Saucedo fue clave con un centro preciso para que Nava anticipara a la defensa y anotara de cabeza el 2-1 a los 38 minutos.\n\nAntes del descanso, Jes\u00fas Maraude desperdici\u00f3 una clara oportunidad para ampliar la ventaja cuando qued\u00f3 mano a mano con Valle y no logr\u00f3 definir con precisi\u00f3n, provocando la reacci\u00f3n de los aficionados locales.\n\nEn el complemento, Always Ready tuvo sus mejores momentos y estuvo cerca de sentenciar el partido. Gonzalo Valle evit\u00f3 el tercer tanto con varias intervenciones determinantes ante Nava, Maraude y Triverio. La atajada m\u00e1s espectacular lleg\u00f3 tras un tiro libre de Saucedo que ten\u00eda destino de red dirigida al \u00e1ngulo.\n\nCon el paso de los minutos, Liga de Quito recuper\u00f3 protagonismo y comenz\u00f3 a
