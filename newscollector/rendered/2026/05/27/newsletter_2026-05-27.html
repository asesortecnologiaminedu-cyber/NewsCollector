 arrinconar al equipo boliviano. El empate lleg\u00f3 a los 77 minutos por intermedio del brasile\u00f1o Deyverson, quien sac\u00f3 un potente remate desde fuera del \u00e1rea. El gol impuls\u00f3 al conjunto ecuatoriano, que fue en busca de la remontada aprovechando el desgaste defensivo de Always Ready. En los minutos finales, Maraude volvi\u00f3 a desperdiciar una oportunidad clara y, casi de inmediato, Deyverson apareci\u00f3 nuevamente para marcar el 3-2 definitivo tras una desatenci\u00f3n de la defensa visitante.\n\nEl fin del encuentro marc\u00f3 la eliminaci\u00f3n de Always Ready y consolid\u00f3 a Liga de Quito como primero en su grupo.\n\nFuente: Red Deportiva de ATB", "dateTimeNews": "2026-05-27T14:41:22+00:00", "dateTimeReceived": "", "pic": "https://142.11.196.137/wp-content/uploads/2022/11/logo-ATB-DIGITAL-2022-b-768x291-1.png", "position": 24, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/deportes/always-ready-se-despide-con-derrota-ante-liga-de-quito/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/libertadores-always-no-aguanto-la-ventaja-en-ecuador-perdio-ante-la-liga-de-quito-y-cerro-una-copa-para-el-olvido/"}], "source": "ATB Digital", "title": "Always Ready cay\u00f3 ante Liga de Quito y se despidi\u00f3 de la Libertadores", "url": "https://www.atb.com.bo/2026/05/27/always-ready-cayo-ante-liga-de-quito-y-se-despidio-de-la-libertadores/"}, {"actor": [], "authors": [], "body": "El vicepresidente del Estado y presidente nato de la Asamblea Legislativa Plurinacional (ALP), Edmand Lara, present\u00f3 una Acci\u00f3n de Amparo Constitucional con el objetivo de frenar la abrogaci\u00f3n de la Ley 1341 que regula los Estados de Excepci\u00f3n.\n\nLa norma que abroga la mencionada Ley fue aprobada por el Senado el fin de semana y es tratada por la C\u00e1mara de Diputados este martes.\n\nSeg\u00fan informaci\u00f3n de DTV, el recurso solicita el \u201crestablecimiento inmediato de derechos y la nulidad del acto lesivo de aprobaci\u00f3n normativa\u201d, argumentando una presunta vulneraci\u00f3n al debido proceso legislativo, al principio de proporcionalidad y a la prohibici\u00f3n de generar un vac\u00edo jur\u00eddico prevista en el art\u00edculo 139.III de la Constituci\u00f3n Pol\u00edtica del Estado.\n\nLa acci\u00f3n fue presentada contra el presidente de la C\u00e1mara de Senadores, Diego Esteban Mateo \u00c1vila Navajas. En el memorial se sostiene que durante el tratamiento del proyecto existi\u00f3 una afectaci\u00f3n al debido proceso legislativo por una presunta falta de imparcialidad.\n\nEl documento argumenta que la autoridad demandada habr\u00eda participado como impulsor del proyecto y, al mismo tiempo, mantenido la conducci\u00f3n de la sesi\u00f3n en la que se debati\u00f3 y aprob\u00f3 la iniciativa, aspecto que el recurso vincula al principio nemo iudex in causa sua (\u201cnadie puede ser juez en su propia causa\u201d).\n\nEl memorial se\u00f1ala adem\u00e1s que el proyecto aprobado busca la abrogaci\u00f3n total de la Ley 1341 y sostiene que esa decisi\u00f3n generar\u00eda un \u201cvac\u00edo jur\u00eddico inconstitucional\u201d, debido a que el art\u00edculo 139.III de la Constituci\u00f3n establece que \u201clos estados de excepci\u00f3n ser\u00e1n regulados por la ley\u201d. En ese marco, el recurso menciona que la norma vigente regula escenarios relacionados con conmoci\u00f3n interna, desastres naturales y peligro para la seguridad del Estado y amenaza externa.\n\nDentro de la fundamentaci\u00f3n, el accionante tambi\u00e9n cuestiona la proporcionalidad de la medida aprobada y argumenta que, de existir observaciones a determinados contenidos de la ley, deb\u00eda analizarse una modificaci\u00f3n parcial y no necesariamente una abrogaci\u00f3n total. El documento diferencia entre derogaci\u00f3n y abrogaci\u00f3n y sostiene que esta \u00faltima elimina \u00edntegramente el cuerpo normativo.\n\nAsimismo, el recurso indica que previamente se habr\u00eda agotado la v\u00eda parlamentaria mediante la presentaci\u00f3n de una moci\u00f3n de reconsideraci\u00f3n, la cual \u2014seg\u00fan el memorial\u2014 fue rechazada durante el tratamiento legislativo. Sobre esa base, se argumenta el cumplimiento del principio de subsidiariedad para acudir a la jurisdicci\u00f3n constitucional.\n\nComo medida cautelar, el vicepresidente solicit\u00f3 la \u201csuspensi\u00f3n inmediata del tr\u00e1mite legislativo y de los efectos de la aprobaci\u00f3n del proyecto de abrogaci\u00f3n de la Ley N\u00b0 1341\u201d, adem\u00e1s de mantener vigente la norma mientras se resuelve el fondo del amparo. El memorial se\u00f1ala que la petici\u00f3n se sustenta en el art\u00edculo 34 del C\u00f3digo Procesal Constitucional y menciona riesgos vinculados a un eventual escenario sin regulaci\u00f3n espec\u00edfica para estados de excepci\u00f3n.\n\nEn el petitorio final, la autoridad solicita admitir la acci\u00f3n, fijar audiencia, conceder la tutela constitucional y dejar sin efecto el acto legislativo aprobado en el Senado, adem\u00e1s de ordenar que, si corresponde, el tratamiento del proyecto se realice bajo nuevas condiciones procedimentales\n\nLa Ley 1341, promulgada en octubre de 2020, regula la aplicaci\u00f3n de los estados de excepci\u00f3n en Bolivia y establece mecanismos de control legislativo sobre las decisiones del \u00d3rgano Ejecutivo.\n\nSeg\u00fan la Constituci\u00f3n Pol\u00edtica del Estado \u201cel presidente puede declarar estado de excepci\u00f3n en casos de grave peligro para la seguridad del Estado, conflicto interno o desastre natural\u201d.\n\nEste martes se cumplen 26 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-27T14:28:40+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/02/lara_conf4.jpg", "position": 25, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/diputados-modifica-el-orden-del-dia-para-tratar-la-abrogacion-de-la-ley-que-regula-los-estados-de-excepcion/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-promulga-la-abrogacion-de-la-ley-sobre-estados-de-excepcion/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/diputados-sanciona-la-norma-que-abroga-la-ley-que-regula-los-estados-de-excepcion/"}], "source": "Ox\u00edgeno", "title": "Estado de Excepci\u00f3n: Lara presenta Acci\u00f3n de Amparo Constitucional para frenar la abrogaci\u00f3n de la Ley 1341", "url": "https://oxigeno.bo/estado-de-excepcion-lara-presenta-accion-de-amparo-constitucional-para-frenar-la-abrogacion-de-la-ley-1341/"}, {"actor": [], "authors": [], "body": "En el d\u00eda 27 de conflicto, autoridades y otros sectores propiciaron dos encuentros este mi\u00e9rcoles en la ciudad de La Paz para intentar pacificar el pa\u00eds mediante el di\u00e1logo.\n\nLa primera reuni\u00f3n fue convocada por el vicepresidente Edmand Lara, que fue instalada en la Vicepresidencia con la presencia del ministro de la Presidencia, Jos\u00e9 Luis Lupo; la ministra de Educaci\u00f3n, Beatriz Garc\u00eda; jefes de bancada de distintas fuerzas pol\u00edticas con representaci\u00f3n en la Asamblea Legislativa; y otras autoridades.\n\n\u201cHoy asistimos a este espacio de di\u00e1logo que ha sido convocado por el Vicepresidente con la misma esperanza, con la misma convicci\u00f3n, de que el di\u00e1logo es el camino para encontrar soluciones\u201d, dijo Lupo.\n\nSeg\u00fan informaci\u00f3n publicada por la Vicepresidencia, se trata de la \u201capertura de un di\u00e1logo nacional con organizaciones sociales, autoridades del \u00d3rgano Ejecutivo e instituciones como la Iglesia Cat\u00f3lica y la Defensor\u00eda del Pueblo\u201d.\n\nDi\u00e1logo en la Vicepresidencia. Foto: APG\n\nParte del pa\u00eds se encuentra bloqueado por algunos sectores que ahora piden la renuncia del presidente Rodrigo Paz despu\u00e9s de haber exigido, en un principio, la atenci\u00f3n a demandas sectoriales.\n\n\u201cNosotros tenemos un pliego (de los campesinos) Tupac Katari particularmente, que est\u00e1 respondido satisfactoriamente, (pero) que no hemos tenido la oportunidad de exponerlo, de tratar punto por punto, porque hasta el d\u00eda de hoy no nos hemos podido sentar. Esperamos que en este espacio de di\u00e1logo podamos hacerlo\u201d, agreg\u00f3 Lupo.\n\nLos campesinos lideran un cerco a la sede de gobierno por cuarta semana consecutiva generando un desabastecimiento de alimentos, combustibles y hasta de medicamentos.\n\nConsejo Econ\u00f3mico y Social\n\nEl segundo encuentro fue convocado por el presidente Rodrigo Paz y se realiz\u00f3 con la participaci\u00f3n de distintos sectores en el campo ferial Chuquiago Marka.\n\nEn ese espacio fue creado de manera oficial el denominado \u201cconsejo econ\u00f3mico social de la patria\u201d.\n\nEl consejo fue creado \u201cpara que encontremos entre bolivianos las soluciones. Cuando haya debate sobre las leyes, ustedes ser\u00e1n los primeros en enterarse qu\u00e9 leyes; cuando empiecen las carreteras, ser\u00e1n los primeros en saber de las carreteras; (\u2026) ser\u00e1n los primeros en saber hacia d\u00f3nde va Bolivia porque solo en el encuentro podemos superarnos\u201d, dijo Paz a los asistentes.\n\nEl mandatario tambi\u00e9n volvi\u00f3 a convocar al di\u00e1logo a los campesinos y la Central Obrera Boliviana, que lideran las protestas.", "dateTimeNews": "2026-05-27T14:25:32+00:00", "dateTimeReceived": "", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779891859291.jpeg?\u0026cw=1200\u0026ch=630", "position": 26, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260527/lupo-representa-al-gobierno-dialogo-convocado-lara"}], "source": "El Deber", "title": "Buscan la pacificaci\u00f3n del pa\u00eds en dos escenarios de di\u00e1logo en La Paz", "url": "https://eldeber.com.bo/pais/buscan-pacificacion-pais-dos-escenarios-dialogo-paz_1779891932"}, {"actor": [], "authors": [], "body": "Tras una larga sesi\u00f3n, la C\u00e1mara de Diputados sancion\u00f3, la noche de este martes, la norma que abroga la Ley 1341, misma que regulaba los Estados de Excepci\u00f3n.\n\nLa norma fue aprobada por m\u00e1s de dos tercios en sus estaciones en grande y en detalle. En ese sentido, el presidente de la C\u00e1mara de Diputados, Roberto Castro, dio la Ley por sancionada y la remiti\u00f3 al Ejecutivo para los fines constitucionales.\n\n\u201cLa C\u00e1mara de Diputados sancion\u00f3 la abrogaci\u00f3n de la denominada Ley Copa, N\u00ba 1341 norma sobre estados de excepci\u00f3n promulgada en 2020, con el respaldo de m\u00e1s de dos tercios de los legisladores presentes, luego de un debate en sesi\u00f3n virtual\u201d, confirm\u00f3 la C\u00e1mara Baja a trav\u00e9s de sus cuentas en las redes sociales.\n\nLa C\u00e1mara de Diputados sesion\u00f3 virtualmente ante los conflictos y movilizaciones que aquejan al pa\u00eds y especialmente a las ciudades de La Paz y El Alto.\n\nLa Ley 1341, promulgada en octubre de 2020, regula la aplicaci\u00f3n de los estados de excepci\u00f3n en Bolivia y establece mecanismos de control legislativo sobre las decisiones del \u00d3rgano Ejecutivo.\n\nSeg\u00fan la Constituci\u00f3n Pol\u00edtica del Estado \u201cel presidente puede declarar estado de excepci\u00f3n en casos de grave peligro para la seguridad del Estado, conflicto interno o desastre natural\u201d.\n\nEsta misma jornada, cabe recordar, el vicepresidente del Estado y presidente nato de la Asamblea Legislativa Plurinacional (ALP), Edmand Lara, present\u00f3 una Acci\u00f3n de Amparo Constitucional con el objetivo de frenar la abrogaci\u00f3n de la Ley 1341 que regula los Estados de Excepci\u00f3n.\n\nComo medida cautelar, el Vicepresidente solicit\u00f3 la \u201csuspensi\u00f3n inmediata del tr\u00e1mite legislativo y de los efectos de la aprobaci\u00f3n del proyecto de abrogaci\u00f3n de la Ley N\u00b0 1341\u201d, adem\u00e1s de mantener vigente la norma mientras se resuelve el fondo del amparo. El memorial se\u00f1ala que la petici\u00f3n se sustenta en el art\u00edculo 34 del C\u00f3digo Procesal Constitucional y menciona riesgos vinculados a un eventual escenario sin regulaci\u00f3n espec\u00edfica para estados de excepci\u00f3n.\n\nEste martes se cumplen 26 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-27T14:12:20+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/diputados_sesion_virtual1.png", "position": 27, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-promulga-la-abrogacion-de-la-ley-sobre-estados-de-excepcion/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/estado-de-excepcion-lara-presenta-accion-de-amparo-constitucional-para-frenar-la-abrogacion-de-la-ley-1341/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/diputados-modifica-el-orden-del-dia-para-tratar-la-abrogacion-de-la-ley-que-regula-los-estados-de-excepcion/"}], "source": "Ox\u00edgeno", "title": "Diputados sanciona la norma que abroga la Ley que regula los Estados de Excepci\u00f3n", "url": "https://oxigeno.bo/diputados-sanciona-la-norma-que-abroga-la-ley-que-regula-los-estados-de-excepcion/"}, {"actor": [], "authors": [], "body": "El presidente del Estado, Rodrigo Paz, no asiste a la \u201cComisi\u00f3n de Di\u00e1logo\u201d convocada por el vicepresidente Edmand Lara y los jefes de bancada del Legislativo; en su lugar, se hizo presente el ministro de la Presidencia, Jos\u00e9 Luis Lupo, y otros de sus colegas.\n\n\u201cEl Gobierno ha asistido ya a 80 reuniones para dialogar con diversos sectores, en muchos de los que ha participado el Presidente y en todos ellos hemos llegado a acuerdos satisfactorios\u201d, afirm\u00f3 Lupo antes de ingresar a la reuni\u00f3n.\n\nSe\u00f1al\u00f3 que espera que en la oportunidad pueda exponer, particularmente ante la Federaci\u00f3n Departamental de Trabajadores Campesinos de La Paz \u201cTupac Katari\u201d, los avances del cumplimiento de su pliego petitorio.\n\nAyer, el vicepresidente del Estado y presidente nato de la Asamblea Legislativa Plurinacional (ALP), Edmand Lara, junto a los jefes de bancada, decidieron crear una \u201cComisi\u00f3n de Di\u00e1logo\u201d con el objetivo de viabilizar los encuentros entre el Gobierno y los sectores movilizados.\n\nLa Comisi\u00f3n de Di\u00e1logo determin\u00f3 invitar a una primera reuni\u00f3n, para este mi\u00e9rcoles a las 9 de la ma\u00f1ana, al presidente del Estado, Rodrigo Paz, ministros de Estado, representantes de la Organizaci\u00f3n de las Naciones Unidas (ONU) en Bolivia, representantes de Derechos Humanos, la Defensor\u00eda del Pueblo, la Cruz Roja, la Iglesia Cat\u00f3lica y sectores movilizados con reivindicaciones leg\u00edtimas.\n\n\u201cAl encuentro ser\u00e1n invitados representantes de la Central Obrera Boliviana (COB), maestros, transportistas y otros sectores sociales movilizados que mantienen demandas reivindicativas\u201d, especific\u00f3 la Vicepresidencia.\n\nEste mi\u00e9rcoles se cumplen 27 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-27T14:11:30+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/dialogo_vicepresidencia_26.5.jpg", "position": 28, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/lara-y-jefes-de-bancada-impulsan-una-comision-de-dialogo-convocan-al-gobierno-sectores-movilizados/"}, {"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260527/suman-sectores-que-piden-dialogo-lara-cita-paz-dirigentes-negociar"}], "source": "Ox\u00edgeno", "title": "Paz no, Lupo s\u00ed: El Gobierno asiste a la reuni\u00f3n convocada por Lara y la ALP para buscar salidas a las crisis", "url": "https://oxigeno.bo/paz-no-lupo-si-el-gobierno-asiste-a-la-reunion-convocada-por-lara-y-la-alp-para-buscar-salidas-a-las-crisis/"}, {"actor": [], "authors": [], "body": "El decomiso de 350.000 bolivianos que fueron enviados como \"encomienda\" al aeropuerto de Trinidad, llev\u00f3 a las autoridades de Beni a ampliar las investigaciones e incautar m\u00e1s dinero y un arma de fuego, caso que salpica a funcionarios policiales y a un piloto.\n\nEl viceministro de Sustancias Controladas, Ernesto Justiniano, inform\u00f3 que se ha abierto una investigaci\u00f3n por la encomienda de los 350 mil bolivianos que lleg\u00f3 a Trinidad desde el aeropuerto de Santa Ana del Yacuma, tambi\u00e9n en Beni. All\u00ed se encontr\u00f3 a un sargento en un veh\u00edculo, con m\u00e1s dinero dentro de tres mochilas.\n\nInvestigan el env\u00edo de encomienda irregular de dinero.\n\n\"En Santa Ana del Yacuma, durante la requisa del veh\u00edculo donde se encontraba el sargento del Servicio A\u00e9reo Policial al momento de su aprehensi\u00f3n, se encontraron tres bolsones/mochilas con dinero en efectivo, adem\u00e1s de un arma de fuego\", explic\u00f3 el viceministro.\n\nLa suma de dinero alcanza los $us 121.000 y Bs 1,156.000, que se encontraban acopiados en dos mochilas y un bols\u00f3n.\n\nEl veh\u00edculo en el que se encontraba el uniformado en el aeropuerto Prof. Jos\u00e9 Ch\u00e1vez Su\u00e1rez, de Santa Ana del Yacuma, tambi\u00e9n fue secuestrado por los investigadores.\n\nJustiniano precis\u00f3 que en una de las mochilas se encontraron los 648.000 bolivianos y 121.000 d\u00f3lares, de los cuales 30.000 d\u00f3lares no tendr\u00edan valor legal.\n\nEn la segunda mochila hab\u00eda 252.500 bolivianos y un arma de fuego calibre 9 mil\u00edmetros; mientras que en el \u00faltimo equipaje, un bols\u00f3n celeste, 255.500 bolivianos\n\n\"Se cuantific\u00f3 un total de 1.156.000 bolivianos y 121.000 d\u00f3lares, se decomis\u00f3 el arma y se secuestr\u00f3 el veh\u00edculo durante el procedimiento en presencia del Ministerio P\u00fablico\", remarca el informe.\n\nUn arma de fuego fue encontrada entre el dinero.\n\nEl hallazgo del dinero en los dos aeropuertos de Beni activ\u00f3 una alerta investigativa a fin de detectar la ruta de la encomienda que fue enviada, el entorno y los veh\u00edculos involucrados, adem\u00e1s de dar con los part\u00edcipes.\n\n\"La lucha contra el narcotr\u00e1fico y el crimen organizado tambi\u00e9n exige mirar hacia adentro, fortalecer controles y actuar con decisi\u00f3n frente a cualquier hecho irregular\", indic\u00f3 el viceministro.", "dateTimeNews": "2026-05-27T14:04:48+00:00", "dateTimeReceived": "", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1779883764734.jpg?\u0026cw=1200\u0026ch=630", "position": 29, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/aeropuerto-de-trinidad-hallazgo-de-121-000-dolares-bs-11-millones-y-un-arma/"}, {"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/27/hallan-mas-de-bs-1-millon-en-el-vehiculo-de-un-policia/"}], "source": "El Deber", "title": "Tras decomiso de encomienda de Bs 350 mil en el aeropuerto de Trinidad, hallan m\u00e1s dinero y un arma de fuego", "url": "https://eldeber.com.bo/pais/decomiso-encomienda-bs-350-mil-aeropuerto-trinidad-hallan-dinero-arma-fuego_1779890688"}, {"actor": [], "authors": [], "body": "El vicepresidente del Estado y presidente nato de la Asamblea Legislativa Plurinacional (ALP), Edmand Lara, junto a los jefes de bancada, ayer decidieron crear una \u201cComisi\u00f3n de Di\u00e1logo\u201d con el objetivo de viabilizar los encuentros entre el Gobierno y los sectores movilizados.\n\nEn tanto, gremiales, choferes del transporte sindicalizado y panificadores salieron ayer a las calles a exigir al gobierno de Rodrigo Paz y a los bloqueadores que se sienten en una mesa de di\u00e1logo para solucionar el conflicto social.\n\n\u201cPedimos gasolina para trabajar. Que haga caso de una vez el presidente a la poblaci\u00f3n. Que agache la cabeza; su ego le quiere ganar. Ahora, si hace estado de sitio, habr\u00e1 m\u00e1s matanza. \u00bfEso quiere?, eso va a tener\u201d, protest\u00f3 Arturo Guti\u00e9rrez, chofer del transporte sindicalizado en contacto con la ANF.\n\nLos gremiales tambi\u00e9n se movilizaron ayer exigiendo al gobierno pacificar el pa\u00eds. Los comerciantes salieron a las calles con sus banderas blancas y pidiendo que los dejen trabajar.\n\nNo hay mejora en la calidad del combustible y el tema del resarcimiento que no ha llegado ni al 5 %, a\u00f1adi\u00f3 Vald\u00e9s.\n\nEl dirigente panificador de La Paz, Fernando Chambi, indic\u00f3 que su sector est\u00e1 en emergencia porque ya no cuentan con harina y gas para la elaboraci\u00f3n del pan.\n\nInform\u00f3 que sus afiliados en las provincias tuvieron que acudir al uso de la le\u00f1a para calentar los hornos y hornear con la poca harina que tienen.\n\nA estos sectores se suman los m\u00e9dicos. El presidente del Colegio M\u00e9dico de La Paz, Luis Larrea, inform\u00f3 que ma\u00f1ana a las 10:00, se realizar\u00e1 una marcha en rechazo a los bloqueos y conflictos sociales.\n\nVicepresidencia\n\nLa Comisi\u00f3n de Di\u00e1logo de la Vicepresidencia y la ALP, determin\u00f3 invitar a una primera reuni\u00f3n, para hoy a las 09:00, al presidente del Estado, Rodrigo Paz, ministros de Estado, representantes de la Organizaci\u00f3n de las Naciones Unidas (ONU) en Bolivia, representantes de Derechos Humanos, la Defensor\u00eda del Pueblo, la Cruz Roja, la Iglesia Cat\u00f3lica y sectores movilizados con reivindicaciones leg\u00edtimas.\n\n\u201cAl encuentro ser\u00e1n invitados representantes de la Central Obrera Boliviana (COB), maestros, transportistas y otros sectores sociales movilizados que mantienen demandas reivindicativas\u201d, especific\u00f3 la Vicepresidencia.\n\nHoy se cumplen 27 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz y los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nEl presidente de la Asamblea Legislativa Departamental de La Paz, Rufo Calle, tambi\u00e9n pidi\u00f3 a las autoridades nacionales y a los sectores movilizados instalar mesas de concertaci\u00f3n con la participaci\u00f3n de tods los sectores.", "dateTimeNews": "2026-05-27T13:24:14+00:00", "dateTimeReceived": "", "pic": "https://www.lostiempos.com/sites/default/files/media_imagen/2026/5/27/4_p1_marka_registrada.jpg", "position": 30, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-no-lupo-si-el-gobierno-asiste-a-la-reunion-convocada-por-lara-y-la-alp-para-buscar-salidas-a-las-crisis/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/lara-y-jefes-de-bancada-impulsan-una-comision-de-dialogo-convocan-al-gobierno-sectores-movilizados/"}], "source": "Los Tiempos", "title": "Suman sectores que piden di\u00e1logo y Lara cita a Paz y dirigentes a negociar", "url": "https://www.lostiempos.com/actualidad/pais/20260527/suman-sectores-que-piden-dialogo-lara-cita-paz-dirigentes-negociar"}, {"actor": [], "authors": [], "body": "La maternidad profundiza las desigualdades que enfrentan las mujeres de las \u00e1reas urbanas del pa\u00eds, no solo frente a los hombres, sino tambi\u00e9n entre ellas. Mientras las madres solas trabajan m\u00e1s horas fuera de casa, las que viven en pareja asumen la mayor carga dom\u00e9stica y de cuidado; en ambos casos la carga total de trabajo sigue siendo elevada.\n\nAs\u00ed lo se\u00f1ala el bolet\u00edn \u201cMujeres que trabajan (el doble). Desigualdades ocultas entre las mujeres de ciudades del eje central de Bolivia\u201d, del Centro de Estudios para el Desarrollo Laboral y Agrario (CEDLA), que se basa en los datos de la Encuesta Urbana de Uso del Tiempo 2023 aplicada en La Paz, El Alto, Santa Cruz y Cochabamba.\n\nEl an\u00e1lisis muestra que las madres no viven una \u00fanica experiencia de maternidad: el tipo de hogar en el que viven \u2014si cr\u00edan solas a sus hijos o en pareja\u2014 determina c\u00f3mo distribuyen su tiempo y a qu\u00e9 deben renunciar.\n\nLa estructura del hogar condiciona las decisiones de tiempo de las madres: cuidar m\u00e1s o trabajar m\u00e1s para generar ingresos. \u201cLas madres solas sacrifican su tiempo de cuidado para asegurar el sustento econ\u00f3mico; en cambio, las madres en pareja sacrifican su tiempo personal para sostener el modelo tradicional de cuidado\u201d, expone la investigadora del CEDLA, Giovanna Hurtado.\n\nSeg\u00fan el bolet\u00edn, las madres solas dedican m\u00e1s tiempo al trabajo remunerado: m\u00e1s de 8 horas diarias. Esto se debe a que, al ser el \u00fanico sost\u00e9n econ\u00f3mico del hogar, se ven obligadas a priorizar el ingreso, incluso reduciendo el tiempo destinado al cuidado y a las tareas dom\u00e9sticas.\n\nPor el contrario, las madres que viven en hogares nucleares \u2014con pareja e hijos\u2014 registran las cargas m\u00e1s altas de trabajo dom\u00e9stico y de cuidado, con cerca de 7 horas diarias dedicadas a cocinar, limpiar y atender a los hijos.\n\n\u201cEn estos hogares, aunque hay una pareja presente, la responsabilidad de que la familia funcione sigue recayendo sobre la mujer\u201d, se\u00f1ala Hurtado.\n\nEl momento m\u00e1s cr\u00edtico ocurre cuando los hijos son peque\u00f1os. Seg\u00fan el an\u00e1lisis, cuando los ni\u00f1os tienen menos de cuatro a\u00f1os, la participaci\u00f3n laboral de las mujeres cae a su nivel m\u00e1s bajo y el tiempo dedicado al trabajo dom\u00e9stico llega hasta casi 8 horas diarias.\n\n\u201cMuchas mujeres se ven forzadas a dejar sus empleos o sus estudios porque no pueden con todo: criar, cuidar, trabajar y sostener el hogar\u201d, explica la investigadora.\n\nPara Hurtado, estas interrupciones tienen consecuencias de largo plazo. Como muchas mujeres salen temporalmente el mercado laboral durante la crianza de sus hijos, especialmente en la primera infancia, esto no solo afecta sus ingresos presentes, sino tambi\u00e9n sus ingresos futuros y sus aportes a la jubilaci\u00f3n.\n\n\u201cEl trabajo dom\u00e9stico nunca desaparece. Incluso cuando los hijos crecen, muchas mujeres siguen asumiendo tareas de cuidado de sus parejas o de otros familiares mayores; o contin\u00faan trabajando porque no tienen jubilaci\u00f3n\u201d, sostiene Hurtado.\n\nFrente a este panorama, el CEDLA plantea la necesidad de avanzar hacia pol\u00edticas p\u00fablicas de cuidado y corresponsabilidad. \u201cEl cuidado de los ni\u00f1os, de los enfermos y de los ancianos no puede seguir siendo un asunto privado que solo resuelven las madres en sus casas. Debe ser una responsabilidad compartida entre el Estado, las empresas y las familias\u201d, concluye la investigadora y agrega: \u201csolamente as\u00ed el trabajo de cuidado dejar\u00e1 de ser una condena a la desigualdad y se podr\u00e1 convertir en un derecho reconocido\u201d.\n\nTambi\u00e9n te puede interesar:", "dateTimeNews": "2026-05-27T13:00:00+00:00", "dateTimeReceived": "", "pic": "https://sumandovoces.com.bo/wp-content/uploads/2026/05/WhatsApp-Image-2026-05-27-at-12.29.15-AM.jpeg", "position": 31, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/madres-sostienen-economia-todavia-no-aprende-cuidarlas_1779895708"}], "source": "Sumando Voces", "title": "Entre el empleo y el cuidado: la carga invisible de ser madre -", "url": "https://sumandovoces.com.bo/entre-el-empleo-y-el-cuidado-la-carga-invisible-de-ser-madre/"}, {"actor": [], "authors": [], "body": "El gobierno de Rusia inst\u00f3 formalmente a los ciudadanos extranjeros, incluyendo al personal diplom\u00e1tico y a los miembros de organizaciones internacionales, a abandonar la ciudad de Kiev \u00ablo antes...\n\nEl gobierno de Rusia inst\u00f3 formalmente a los ciudadanos extranjeros, incluyendo al personal diplom\u00e1tico y a los miembros de organizaciones internacionales, a abandonar la ciudad de Kiev \u00ablo antes posible\u00bb ante el desarrollo de nuevos ataques de represalia dirigidos hacia objetivos militares. La advertencia, que coincide con un comunicado oficial emitido por la Canciller\u00eda rusa, exhorta de igual manera a los residentes locales a evitar las inmediaciones de la infraestructura militar y administrativa del r\u00e9gimen ucraniano, argumentando que las operaciones son una respuesta a los delitos cometidos contra civiles rusos, en particular el bombardeo mortal de la residencia estudiantil de Starobelsk.\n\nLas autoridades de defensa comunicaron que, en el marco de estas incursiones coordinadas el pasado 24 de mayo, se emplearon misiles bal\u00edsticos Or\u00e9shnik, aerobal\u00edsticos Iskander, hipers\u00f3nicos Kinzhal y de crucero Tsirk\u00f3n, adem\u00e1s de drones de ataque, especificando que no se planificaron ni se llevaron a cabo ataques contra instalaciones de infraestructura civil de Ucrania.\n\n\u201cInstamos asimismo a los residentes de Kiev a que se abstengan de acercarse a las instalaciones militares y administrativas, as\u00ed como a las infraestructuras pertenecientes al r\u00e9gimen de Zelenski. Estos ataques tendr\u00e1n como objetivo los centros de toma de decisiones y los puestos de mando, ya que las instalaciones mencionadas se encuentran dispersas por toda Kiev\u201d, declar\u00f3 el representante permanente de Rusia ante la ONU, Vasili Nebenzia.\n\nLa delegaci\u00f3n rusa enfatiz\u00f3 que los ataques sistem\u00e1ticos buscan desarticular espec\u00edficamente los centros dedicados al dise\u00f1o, fabricaci\u00f3n, programaci\u00f3n y preparaci\u00f3n de drones para su uso operativo, justificando la intensidad del despliegue bal\u00edstico por los constantes impactos de proyectiles ucranianos sobre viviendas, veh\u00edculos, zonas de ocio y centros comerciales en territorio ruso.\n\n\u201cAdvertimos a los ciudadanos extranjeros, incluido el personal de las misiones diplom\u00e1ticas y de las representaciones de organizaciones internacionales, de la necesidad de abandonar la ciudad lo antes posible, y a los residentes de la capital ucraniana, de no acercarse a las instalaciones de la infraestructura militar y administrativa del r\u00e9gimen de Zelenski\u201d, indic\u00f3 la nota oficial publicada por la Canciller\u00eda rusa.\n\n(Fuente: RT)", "dateTimeNews": "2026-05-27T10:51:34+00:00", "dateTimeReceived": "", "pic": "https://asuntoscentrales.com/wp-content/uploads/2026/05/ki.jpg", "position": 32, "similar": [{"source": "Eju.tv", "url": "https://eju.tv/2026/05/rusia-insta-a-extranjeros-y-personal-diplomatico-a-abandonar-kiev-lo-antes-posible/"}], "source": "Asuntos Centrales", "title": "Rusia insta a ciudadanos extranjeros y diplom\u00e1ticos a evacuar Kiev antes de nuevos ataques", "url": "https://asuntoscentrales.com/rusia-insta-a-ciudadanos-extranjeros-y-diplomaticos-a-evacuar-kiev-antes-de-nuevos-ataques/"}, {"actor": [], "authors": [], "body": "Fotocomposici\u00f3n: Visi\u00f3n 360.\n\nVISI\u00d3N 360\n\nLuego de que la C\u00e1mara de Diputados abrogara la Ley 1341, que regulaba los estados de excepci\u00f3n en Bolivia, el presidente Rodrigo Paz promulg\u00f3 la norma y esta fue publicada de inmediato en la Gaceta Oficial de Bolivia.\n\n\u00abSe abroga la Ley N\u00b0 1341, de 23 de julio de 2020, de Estados de Excepci\u00f3n\u00bb, se lee en el art\u00edculo \u00fanico de la norma.\n\nEl presidente Paz promulg\u00f3 esta norma el martes 26 de mayo, cuando se cumpl\u00edan 26 d\u00edas de bloqueos y protestas que cercan los principales puntos de ingreso a La Paz, el departamento m\u00e1s golpeado por el desabastecimiento de alimentos, medicamentos y combustible a causa de los conflictos.\n\nEn una sesi\u00f3n virtual realizada el martes 26 de mayo, la C\u00e1mara de Diputados sancion\u00f3 el proyecto de ley que anula la tambi\u00e9n denominada \u201cLey Copa\u201d. \u201cAhora, el presidente Rodrigo Paz tiene la potestad de llamar a un estado de excepci\u00f3n y tiene la responsabilidad de asumir acciones inmediatas para restablecer el orden, garantizar el libre tr\u00e1nsito y pacificar Bolivia\u201d, dijo el diputado de la alianza Libre, Rafael L\u00f3pez.\n\nSu colega del Partido Dem\u00f3crata Cristiano (PDC), Manolo Rojas, tambi\u00e9n defendi\u00f3 la normativa. \u201cLa protesta y la huelga est\u00e1n garantizadas. Dejemos de ser tibios. No podemos tolerar este tipo de actos violentos ni que un militar o un polic\u00eda sea golpeado. No podemos tolerar que maten a j\u00f3venes\u201d, sostuvo.\n\nLa ahora abrogada Ley de Estados de Excepci\u00f3n fue sancionada en 2020 por la entonces senadora Eva Copa, en su calidad de presidenta en ejercicio de la Asamblea Legislativa Plurinacional, cuando la presidenta Jeanine \u00c1\u00f1ez estaba en el poder tras la renuncia de Evo Morales. Si bien regula el r\u00e9gimen, sus cr\u00edticos indican que, en realidad, tiene una serie de elementos que operan como barreras para que un presidente dicte el estado de excepci\u00f3n.\n\nEl domingo, el Senado, en Sucre, aprob\u00f3 este proyecto y posteriormente lo remiti\u00f3 a Diputados. Hoy, durante casi cinco horas, esa C\u00e1mara llev\u00f3 adelante una sesi\u00f3n virtual para tratar esta normativa ante la situaci\u00f3n de conflictos que vive Bolivia, cuyo epicentro est\u00e1 en La Paz. Esa urbe, desde hace m\u00e1s de tres semanas, est\u00e1 aislada del resto del pa\u00eds a causa de los bloqueos de carreteras de los campesinos.", "dateTimeNews": "2026-05-27T05:04:57+00:00", "dateTimeReceived": "", "pic": "https://sumandovoces.com.bo/wp-content/uploads/2026/05/image-43-1.jpg", "position": 33, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260527/paz-promulga-abrogacion-ley-estados-excepcion-medio-conflictos"}, {"source": "El Mundo", "url": "https://elmundo.com.bo/diputados-abroga-ley-copa-que-regulaba-estados-de-excepcion/"}], "source": "Sumando Voces", "title": "Paz promulga la abrogaci\u00f3n de la Ley de Estados de Excepci\u00f3n en medio de la crisis por bloqueos -", "url": "https://sumandovoces.com.bo/paz-promulga-la-abrogacion-de-la-ley-de-estados-de-excepcion-en-medio-de-la-crisis-por-bloqueos/"}, {"actor": [], "authors": [], "body": "La C\u00e1mara de Diputados de Bolivia aprob\u00f3 la anulaci\u00f3n de la Ley 1341, en medio de protestas sociales y bloqueos en La Paz\n\nFicha informativa La C\u00e1mara de Diputados aprob\u00f3 la anulaci\u00f3n de la Ley 1341, que limitaba la intervenci\u00f3n de las Fuerzas Armadas en conflictos internos. La decisi\u00f3n se toma en medio de protestas que exigen la renuncia del Presidente Rodrigo Paz. Toca para ver el contexto completo Contexto: La ley 1341 regulaba el uso de las Fuerzas Armadas en disturbios civiles. Carlos Alarc\u00f3n, impulsor de la anulaci\u00f3n, consider\u00f3 que dicha norma era \u2018criminal\u2019. Edwin Valda advirti\u00f3 sobre un posible aumento en la violencia tras su abrogaci\u00f3n. Bolivia enfrenta manifestaciones desde hace tres semanas. Las protestas han sido impulsadas por sindicatos campesinos y sectores afines a Evo Morales. La Paz y El Alto son los principales focos de conflicto. La Fiscal\u00eda investiga un fallecimiento relacionado con los disturbios. Por qu\u00e9 importa: La anulaci\u00f3n puede aumentar la capacidad de acci\u00f3n militar ante disturbios, pero tambi\u00e9n podr\u00eda generar mayor violencia y desprotecci\u00f3n a las reivindicaciones sociales. Los bloqueos han causado desabastecimiento y disturbios en varias regiones. Datos clave: Fecha: 26 de mayo de 2026\n\n26 de mayo de 2026 Nueva norma: Anulaci\u00f3n de la Ley 1341\n\nAnulaci\u00f3n de la Ley 1341 Ley 1341 vigente desde: octubre de 2020\n\noctubre de 2020 Duraci\u00f3n m\u00e1xima del estado de excepci\u00f3n seg\u00fan ley 1341: 60 d\u00edas\n\n60 d\u00edas N\u00famero de personas fallecidas por cortes de ruta: 4, incluido un ni\u00f1o de 12 a\u00f1os IngresarDesbloquear acceso completo\n\nC\u00e1mara de Diputados aprueba anulaci\u00f3n de la Ley 1341 de estados de excepci\u00f3n \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nC\u00e1mara de Diputados aprueba anulaci\u00f3n de la Ley 1341\n\nLa C\u00e1mara de Diputados aprob\u00f3 este martes una ley que anul\u00f3 las restricciones a la intervenci\u00f3n de las Fuerzas Armadas en conflictos internos. Esta decisi\u00f3n ocurri\u00f3 en medio de las protestas y bloqueos de carreteras por sectores que exigen la renuncia del Presidente Rodrigo Paz.\n\nDetalles sobre la nueva norma\n\nLa norma, que anul\u00f3 la ley 1341 vigente desde octubre de 2020, recibi\u00f3 previamente la aprobaci\u00f3n del Senado. Ahora, esta ley pas\u00f3 al Ejecutivo para que el mandatario la firme, aunque esto no implica que se dicte autom\u00e1ticamente el \u201cestado de excepci\u00f3n\u201d. La sesi\u00f3n, que dur\u00f3 m\u00e1s de cinco horas, se realiz\u00f3 de manera virtual debido a que varios legisladores no pudieron trasladarse a La Paz, sede del Legislativo y Ejecutivo, por las protestas que mantienen aislada a esa regi\u00f3n del resto del pa\u00eds.\n\nOpiniones sobre la anulaci\u00f3n\n\nEl impulsor de la anulaci\u00f3n, Carlos Alarc\u00f3n, de la alianza Unidad, calific\u00f3 a la ley 1341 como \u201ccriminal\u201d. Seg\u00fan Alarc\u00f3n, esta norma ten\u00eda el objetivo de \u201cdesnaturalizar\u201d los estados de excepci\u00f3n frente a situaciones que generan \u201ccaos y anarqu\u00eda\u201d durante las protestas sociales. Afirm\u00f3 que dicha norma proteg\u00eda a los \u201cgrupos violentos\u201d que se atribuyen la representaci\u00f3n del pueblo. Por lo tanto, su abrogaci\u00f3n otorga mayor capacidad de acci\u00f3n a las Fuerzas Armadas cuando la Polic\u00eda se ve rebasada.\n\nPor otro lado, el diputado Edwin Valda, perteneciente a una facci\u00f3n disidente del oficialista Partido Dem\u00f3crata Cristiano (PDC), expres\u00f3 su preocupaci\u00f3n. Consider\u00f3 que la anulaci\u00f3n generar\u00e1 \u201cmayor violencia\u201d y dejar\u00e1 las reivindicaciones sociales \u201cdesprotegidas\u201d.\n\nContexto actual en Bolivia\n\nBolivia enfrenta una ola de manifestaciones y cortes de carreteras desde hace tres semanas. Estos movimientos son impulsados por sindicatos campesinos y sectores afines al expresidente Evo Morales, quienes exigen la renuncia del Presidente Paz, quien lleva poco m\u00e1s de seis meses en el Gobierno.\n\nLa ley 1341 regulaba cuatro art\u00edculos de la Constituci\u00f3n boliviana dedicados al estado de excepci\u00f3n. Establec\u00eda que se podr\u00eda disponer de las Fuerzas Armadas para controlar disturbios civiles siempre que la Polic\u00eda \u201chubiera sido superada y no exista otro medio efectivo para restablecer el orden\u201d. Adem\u00e1s, limitaba a 60 d\u00edas la duraci\u00f3n de esta medida.\n\nReacciones del Gobierno y consecuencias\n\nLa Carta Magna vigente desde 2009 permite declarar mediante decreto el estado de excepci\u00f3n en todo o parte del pa\u00eds ante una conmoci\u00f3n interna. Este mecanismo no puede suspender las garant\u00edas ni los derechos fundamentales y su vigencia est\u00e1 sujeta a la aprobaci\u00f3n del Legislativo en un plazo de 72 horas. El Gobierno ha asegurado que recurrir\u00e1 al estado de excepci\u00f3n solo como \u201c\u00faltima opci\u00f3n\u201d si el di\u00e1logo no prospera.\n\nLas protestas se concentran en La Paz y en la ciudad vecina de El Alto. Algunas manifestaciones recientes derivaron en disturbios y saqueos de oficinas p\u00fablicas y privadas, as\u00ed como agresiones a periodistas y personas cr\u00edticas hacia las protestas. Los bloqueos se han extendido a regiones como Oruro, Cochabamba, Potos\u00ed, Santa Cruz y Chuquisaca, provocando desabastecimiento de alimentos, combustible e insumos m\u00e9dicos como ox\u00edgeno medicinal.\n\nInvestigaciones por incidentes violentos\n\nLa Fiscal\u00eda investiga el fallecimiento de un hombre por un disparo durante un operativo y disturbios registrados el s\u00e1bado para despejar una carretera troncal. Las autoridades tambi\u00e9n denunciaron que los cortes han ocasionado la muerte de cuatro personas, incluido un ni\u00f1o de 12 a\u00f1os, quienes no pudieron recibir atenci\u00f3n m\u00e9dica oportuna.\n\nCon informaci\u00f3n de EFE.", "dateTimeNews": "2026-05-27T04:04:32+00:00", "dateTimeReceived": "", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a16678bcca9d.jpg", "position": 34, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/actualidad/paz-promulga-abrogacion-ley-1341-de-estados-de-excepcion/"}], "source": "La Patria", "title": "C\u00e1mara de Diputados aprueba anulaci\u00f3n de la Ley 1341 de estados de excepci\u00f3n - La Patria 3.0", "url": "https://lapatria.bo/actualidad/camara-de-diputados-aprueba-anulacion-de-la-ley-1341-de-estados-de-excepcion/"}, {"actor": [], "authors": [], "body": "El partido de la \u00faltima fecha del grupo \u201cC\u201d de Copa Libertadores, se disputar\u00e1 este mi\u00e9rcoles desde las 20:30 en Santa Cruz\n\nFicha informativa Bol\u00edvar se enfrenta a Independiente Rivadavia este mi\u00e9rcoles a las 20:30 en Santa Cruz, buscando un triunfo que le permita clasificar a los octavos de final de la Copa Libertadores. Toca para ver el contexto completo Contexto: El entrenador Alejandro Restrepo asumi\u00f3 recientemente el mando de Bol\u00edvar y busca clasificar al equipo a los octavos de final. Bol\u00edvar necesita un triunfo para evitar quedar tercero y jugar playoffs para la Copa Sudamericana. Independiente Rivadavia debut\u00f3 con \u00e9xito en la Copa Libertadores, complicando a Bol\u00edvar y Fluminense. Independiente Rivadavia jugar\u00e1 sin su goleador, el paraguayo \u00c1lex Arce, quien se uni\u00f3 al seleccionado paraguayo para la Copa Mundial 2026. Por qu\u00e9 importa: Un triunfo permitir\u00eda a Bol\u00edvar avanzar a los octavos de final de la Copa Libertadores, mientras que una derrota podr\u00eda llevarlo a jugar playoffs para la Copa Sudamericana, afectando su desempe\u00f1o internacional. Datos clave: Fecha: Mi\u00e9rcoles 27 de mayo de 2026\n\nMi\u00e9rcoles 27 de mayo de 2026 Hora: 20:30\n\n20:30 Lugar: Estadio \u201cRam\u00f3n Aguilera Costas\u201d, Santa Cruz\n\nEstadio \u201cRam\u00f3n Aguilera Costas\u201d, Santa Cruz Grupo: C\n\nC Puntero del grupo: Independiente Rivadavia\n\nIndependiente Rivadavia Resultado anterior contra Fluminense: 1-2 en contra IngresarDesbloquear acceso completo\n\nBol\u00edvar se juega su clasificaci\u00f3n ante Independiente Rivadavia \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nBol\u00edvar se enfrenta a Independiente Rivadavia\n\nEste mi\u00e9rcoles, el entrenador Alejandro Restrepo tendr\u00e1 su primera prueba de fuego al mando de Bol\u00edvar. El equipo se medir\u00e1 ante Independiente Rivadavia, puntero e invicto en el grupo \u201cC\u201d de la Copa Libertadores. El partido se llevar\u00e1 a cabo a las 20:30 horas en el estadio \u201cRam\u00f3n Aguilera Costas\u201d de Santa Cruz.\n\nImportancia del partido\n\nUn triunfo es crucial para que Bol\u00edvar acceda a los octavos de final. Adem\u00e1s, esto evitar\u00eda la opci\u00f3n de quedar tercero y jugar los playoffs para la Copa Sudamericana. Los bolivaristas se han fijado esta meta, justo a pocos d\u00edas de la llegada de Restrepo. \u00c9l coincide en que es fundamental cumplir con este objetivo antes del descanso de medio a\u00f1o.\n\nAn\u00e1lisis del partido Bol\u00edvar vs Independiente Rivadavia\n\nRestrepo mantendr\u00e1 la base que ha venido jugando, tras recibir el informe del interino Vladimir Soria. Tambi\u00e9n analizar\u00e1 videos de las actuaciones anteriores, tomando como referencia inmediata el juego contra Fluminense, donde Bol\u00edvar perdi\u00f3 1-2.\n\nDesaf\u00edos para el equipo argentino\n\nIndependiente Rivadavia debut\u00f3 en la Copa Libertadores con una nota alta. Se clasific\u00f3 con anticipaci\u00f3n, complicando as\u00ed a Fluminense y Bol\u00edvar, que est\u00e1n en apuros en esta \u00faltima fecha del grupo. Sin embargo, el elenco argentino jugar\u00e1 sin su goleador, el paraguayo \u00c1lex Arce, quien se uni\u00f3 al seleccionado paraguayo para encarar la Copa Mundial 2026.\n\nExpectativas para el encuentro\n\nLa expectativa es alta para este partido decisivo. La afici\u00f3n espera ver un Bol\u00edvar fuerte y decidido bajo la direcci\u00f3n del entrenador Alejandro Restrepo. Este encuentro no solo representa una oportunidad para avanzar en la Copa Libertadores, sino tambi\u00e9n un momento clave para establecer el estilo de juego que Restrepo desea implementar.\n\nEl \u00e1rbitro Guillermo Guerrero (Ecuador) controlar\u00e1 las acciones, asistido por: Cristian Lescano y David Vacacela. Gabriel Gonz\u00e1les (Ecuador) ser\u00e1 el juez VAR.\n\nBOL\u00cdVAR: Carlos Lampe; Jes\u00fas Sagredo, Santiago Echeverr\u00eda, Xavier Arreaga, Jos\u00e9 Sagredo, Leonel Justiniano, Robson Tome, Carlos Melgar, Patricio Rodr\u00edguez y Mart\u00edn Cauteruccio; D.T. Alejandro Restrepo.\n\nINDEPENDIENTE RIVADAVIA: Nicol\u00e1s Bolcato; Luciano G\u00f3mez, Leonard Costa, Sheyko Studer, Juan Manuel Elordi, Tom\u00e1s Bottari, Jos\u00e9 Florent\u00edn, Gonzalo R\u00edos, Mat\u00edas Fern\u00e1ndez, Sebasti\u00e1n Villa y Fabrizio Sartori; D.T. Alfredo Berti", "dateTimeNews": "2026-05-27T03:38:17+00:00", "dateTimeReceived": "", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a166671b6470.jpg", "position": 35, "similar": [{"source": "ATB Digital", "url": "https://www.atb.com.bo/2026/05/27/en-el-debut-de-restrepo-bolivar-se-juega-la-vida-ante-independiente-rivadavia/"}], "source": "La Patria", "title": "Bol\u00edvar se juega su clasificaci\u00f3n ante Independiente Rivadavia - La Patria 3.0", "url": "https://lapatria.bo/deportes/bolivar-se-juega-su-clasificacion-ante-independiente-rivadavia/"}, {"actor": [], "authors": [], "body": "El representante de Rusia ante la ONU, Vasili Nebenzia, record\u00f3 que Rusia est\u00e1 llevando a cabo acciones de represalia tras el ataque del r\u00e9gimen ucraniano contra una residencia de estudiantes en la regi\u00f3n de Lugansk.\n\nFuente: RT\n\nEl representante permanente de Rusia ante la ONU, Vasili Nebenzia, inst\u00f3 este martes a los ciudadanos extranjeros \u2014incluido el personal diplom\u00e1tico y de organizaciones internacionales\u2014 a abandonar Kiev \u00ablo antes posible\u00bb ante los ataques de represalia de Mosc\u00fa contra objetivos militares de Ucrania. Estos ataques son la respuesta a los cr\u00edmenes del r\u00e9gimen ucraniano contra civiles rusos, en particular el bombardeo mortal de la residencia estudiantil de Starobelsk.\n\n\u00abInstamos asimismo a los residentes de Kiev a que se abstengan de acercarse a las instalaciones militares y administrativas, as\u00ed como a las infraestructuras pertenecientes al r\u00e9gimen de Zelenski\u00bb, precis\u00f3 el diplom\u00e1tico durante una conferencia de prensa.\n\nNebenzia recalc\u00f3 que los \u00abataques constantes y sistem\u00e1ticos\u00bb contra empresas de la industria de defensa ucraniana en la capital son la respuesta de las Fuerzas Armadas rusas a los m\u00faltiples delitos cometidos por el r\u00e9gimen de Kiev. Los objetivos de los ataques de represalia rusos incluyen instalaciones dedicadas al dise\u00f1o, fabricaci\u00f3n, programaci\u00f3n y preparaci\u00f3n de drones para su uso operativo, detall\u00f3.\n\n=\u003e Recibir por Whatsapp las noticias destacadas\n\n\u00abEstos ataques tendr\u00e1n como objetivo los centros de toma de decisiones y los puestos de mando, ya que las instalaciones mencionadas se encuentran dispersas por toda Kiev\u00bb, declar\u00f3.\n\nA la par de las advertencias de Nebenzia dirigida a los ciudadanos extranjeros sobre abandonar Kiev, la Canciller\u00eda rusa public\u00f3 este lunes una nota oficial con la misma recomendaci\u00f3n.\n\n\u00abAdvertimos a los ciudadanos extranjeros, incluido el personal de las misiones diplom\u00e1ticas y de las representaciones de organizaciones internacionales, de la necesidad de abandonar la ciudad lo antes posible, y a los residentes de la capital ucraniana, de no acercarse a las instalaciones de la infraestructura militar y administrativa del r\u00e9gimen de Zelenski\u00bb, indic\u00f3.\n\nAtaques de represalia rusos\n\nEl Ej\u00e9rcito del r\u00e9gimen de Kiev ataca continuamente instalaciones civiles en territorio ruso. Drones y misiles ucranianos impactan contra veh\u00edculos, viviendas, zonas de ocio, centros comerciales y otras instalaciones civiles, dejando v\u00edctimas.\n\nEste 24 de mayo, el Ministerio de Defensa de Rusia comunic\u00f3 que lanz\u00f3 un ataque contra objetivos militares de Ucrania en respuesta a los cr\u00edmenes del r\u00e9gimen de Kiev contra los civiles rusos, en particular al mort\u00edfero bombardeo de la residencia estudiantil de Starobelsk.\n\nEn el ataque masivo lanzado contra la ciudad de Kiev y su provincia fueron usados misiles bal\u00edsticos Or\u00e9shnik, aerobal\u00edsticos Iskander, aerobal\u00edsticos hipers\u00f3nicos Kinzhal y de crucero Tsirk\u00f3n. Adem\u00e1s, fueron lanzados misiles de crucero de base a\u00e9rea, mar\u00edtima y terrestre, y drones de ataque. Desde la cartera de Defensa rusa especificaron que \u00abno se planificaron ni se llevaron a cabo ataques contra instalaciones de infraestructura civil de Ucrania\u00bb.", "dateTimeNews": "2026-05-27T03:37:49+00:00", "dateTimeReceived": "", "pic": "https://eju.tv/wp-content/uploads/2026/05/6a15dd2e59bf5b62cf287ac7-e1779853025178.jpg", "position": 36, "similar": [{"source": "Asuntos Centrales", "url": "https://asuntoscentrales.com/rusia-insta-a-ciudadanos-extranjeros-y-diplomaticos-a-evacuar-kiev-antes-de-nuevos-ataques/"}], "source": "Eju.tv", "title": "Rusia insta a extranjeros y personal diplom\u00e1tico a abandonar Kiev \u00ablo antes posible\u00bb", "url": "https://eju.tv/2026/05/rusia-insta-a-extranjeros-y-personal-diplomatico-a-abandonar-kiev-lo-antes-posible/"}, {"actor": [], "authors": [], "body": "El partido de la \u00faltima fecha del grupo \u201cG\u201d de Copa Libertadores, se jug\u00f3 este martes en Ecuador\n\nFicha informativa Always Ready perdi\u00f3 3-2 ante Liga de Quito en la \u00faltima fecha del grupo \u2018G\u2019 de la Copa Libertadores, quedando eliminado del torneo. Toca para ver el contexto completo Contexto: Always Ready comenz\u00f3 el partido con un gol de Enrique Triverio a los 17 minutos. Fernando Nava anot\u00f3 el segundo gol a los 39 minutos. Deyverson empat\u00f3 y luego dio la victoria a Liga de Quito con dos goles en el segundo tiempo. El partido se jug\u00f3 el martes 26 de mayo de 2026. Always Ready tuvo una participaci\u00f3n considerada como una de sus peores en competiciones internacionales. Por qu\u00e9 importa: Always Ready finaliza en la \u00faltima posici\u00f3n del grupo, lo que genera dudas sobre la continuidad del entrenador Marcelo Straccia. Liga de Quito y Mirassol avanzan a octavos de final. Datos clave: Marcador final: Liga de Quito 3 \u2013 2 Always Ready\n\nLiga de Quito 3 \u2013 2 Always Ready Estadio: Rodrigo Paz Delgado\n\nRodrigo Paz Delgado Grupo: G\n\nG Puntos Liga de Quito: 12\n\n12 Puntos Mirassol: 12\n\n12 Puntos Lan\u00fas: Tercero, jugar\u00e1 playoff para Copa Sudamericana IngresarDesbloquear acceso completo\n\nAlways Ready se despide con derrota ante Liga de Quito \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nAlways Ready se despide con derrota ante Liga de Quito\n\nAlways Ready, a pesar de estar 2-1 arriba en el marcador, sufri\u00f3 una dolorosa derrota por 3-2 frente a Liga de Quito en el estadio \u201cRodrigo Paz Delgado\u201d. Este resultado dej\u00f3 al equipo boliviano en la \u00faltima posici\u00f3n del grupo \u201cG\u201d de la Copa Libertadores, lo que signific\u00f3 su eliminaci\u00f3n del certamen.\n\nUn primer tiempo prometedor\n\nEl campe\u00f3n boliviano comenz\u00f3 el partido con gran energ\u00eda. A los seis minutos, Yerlin Qui\u00f1\u00f3nez anot\u00f3 el primer gol para los locales, aprovechando un bal\u00f3n suelto. Sin embargo, Always Ready no se rindi\u00f3 y logr\u00f3 empatar a los 17 minutos gracias a un gol de Enrique Triverio, quien empuj\u00f3 un centro con el pie, descolocando al arquero Gonzalo Valle.\n\nLa primera mitad continu\u00f3 con emoci\u00f3n. A los 39 minutos, Fernando Nava anot\u00f3 un gol de cabeza tras un tiro libre, poniendo el marcador 2-1 a favor de Always Ready. Con este resultado, el equipo se fue al descanso con la esperanza de continuar en carrera.\n\nUn segundo tiempo desafiante\n\nNo obstante, la segunda etapa trajo consigo desaf\u00edos inesperados. La intenci\u00f3n de mantener la ventaja se desvaneci\u00f3 cuando Deyverson apareci\u00f3 en el campo. Este jugador se convirti\u00f3 en el h\u00e9roe del partido para Liga de Quito, anotando un doblete que cambi\u00f3 el rumbo del encuentro.\n\nA los 76 minutos, Deyverson igual\u00f3 el marcador 2-2 con un potente remate zurdo. Luego, a solo dos minutos del final, marc\u00f3 el gol decisivo a los 88 minutos, empujando la pelota frente al arco tras un os principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-05-27T01:03:35+00:00", "dateTimeReceived": "", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/diputados_sesion_virtual.jpg", "position": 38, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/estado-de-excepcion-lara-presenta-accion-de-amparo-constitucional-para-frenar-la-abrogacion-de-la-ley-1341/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/paz-promulga-la-abrogacion-de-la-ley-sobre-estados-de-excepcion/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/diputados-sanciona-la-norma-que-abroga-la-ley-que-regula-los-estados-de-excepcion/"}], "source": "Ox\u00edgeno", "title": "Diputados modifica el Orden del D\u00eda para tratar la abrogaci\u00f3n de la Ley que regula los Estados de Excepci\u00f3n", "url": "https://oxigeno.bo/diputados-modifica-el-orden-del-dia-para-tratar-la-abrogacion-de-la-ley-que-regula-los-estados-de-excepcion/"}];
    const riskCategories = [
      {
        status: "Bajo",
        icon: "B",
        iconColor: "text-blue-500",
        badge: "bg-blue-50 text-blue-700 ring-blue-600/20 dark:bg-blue-400/10 dark:text-blue-400 dark:ring-blue-400/20",

      },
      {

      {

    const categories = [
      {
        status: "Todos",

        badge: "bg-gray-100 text-gray-700 ring-gray-500/20 dark:bg-gray-700/30 dark:text-gray-200 dark:ring-gray-500/30",
        progressColor: "rgb(107 114 128)",

    function buildOrderFromCluster(cluster) {
      const similar = Array.isArray(cluster.similar) ? cluster.similar : [];
      const rawActors = Array.isArray(cluster.actor)
        ? cluster.actor
        : Array.isArray(cluster.actors)
          ? cluster.actors
          : (cluster.actor || cluster.actors ? [cluster.actor || cluster.actors] : []);
      const actors = rawActors
        .map((item) => String(item || "").trim())
        .filter((item) => item.length > 0);
      const rawAuthor = Array.isArray(cluster.authors)
        ? (cluster.authors.find((item) => String(item || "").trim()) || "")
        : (cluster.author || cluster.authors || "");
      const author = String(rawAuthor || "").trim();
      const actual = Math.min(similar.length + 1, 9);
      const total = Math.min(actual + 2, 10);
      const dateTimeNews = String(
        cluster.dateTimeNews
        || buildLegacyDateTime(cluster.date, cluster.time)
        || ""
      ).trim();
      const dateTimeReceived = String(
        cluster.dateTimeReceived
        || cluster.dateTimeRecieved
        || ""
      ).trim();

      return {
        item: cluster.title || "Noticia sin titulo",
        company: cluster.source || "Fuente desconocida",
        author: author,
        pic: cluster.pic || cluster.image_url || "",
        fulfillmentActual: actual,
        fulfillmentTotal: total,
        dateTimeNews: dateTimeNews,
        dateTimeReceived: dateTimeReceived,
        url: cluster.url || "#",
        body: cluster.body || "",
        actors: actors,
        similar: similar
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function safeUrl(value) {
      const url = String(value || "").trim();
      if (url.startsWith("http://") || url.startsWith("https://")) {
        return url;
      }
      return "#";
    }

    function formatHourMinute(value) {
      const raw = String(value || "").trim();
      if (!raw) {
        return "";
      }

      const match = raw.match(/(\d{1,2}):(\d{2})(?::\d{2})?/);
      if (!match) {
        return "";
      }

      const hours = match[1].padStart(2, "0");
      const minutes = match[2];
      return `${hours}:${minutes}`;
    }

    function buildLegacyDateTime(dateValue, timeValue) {
      const dateText = String(dateValue || "").trim();
      if (!dateText) {
        return "";
      }

      const hourText = formatHourMinute(timeValue);
      if (!hourText) {
        return `${dateText}T00:00:00`;
      }

      return `${dateText}T${hourText}:00`;
    }

    function parseDateTimeParts(value) {
      const raw = String(value || "").trim();
      if (!raw) {
        return { date: "", time: "" };
      }

      const dateMatch = raw.match(/(\d{4})-(\d{2})-(\d{2})/);
      const timeText = formatHourMinute(raw);
      if (!dateMatch) {
        return { date: "", time: timeText };
      }

      const year = dateMatch[1].slice(2);
      const month = dateMatch[2];
      const day = dateMatch[3];
      return {
        date: `${day}/${month}/${year}`,
        time: timeText
      };
    }

    function buildDateTimeDisplayLines(dateTimeNews, dateTimeReceived) {
      const published = parseDateTimeParts(dateTimeNews);
      const received = parseDateTimeParts(dateTimeReceived);
      const lines = [];

      const sameDate = published.date && received.date && published.date === received.date;
      const sameTime = published.time && received.time && published.time === received.time;

      if (sameDate) {
        lines.push(`Fecha: ${published.date}`);
        if (sameTime) {
          lines.push(`Hora: ${published.time}`);
          return lines;
        }

        if (published.time) {
          lines.push(`Hora Publicado: ${published.time}`);
        }
        if (received.time) {
          lines.push(`Hora Recibido: ${received.time}`);
        }
        return lines;
      }

      if (published.date || published.time) {
        const publishedParts = [published.date, published.time].filter((part) => part);
        lines.push(`Publicado: ${publishedParts.join(" ")}`);
      }

      if (received.date || received.time) {
        const receivedParts = [received.date, received.time].filter((part) => part);
        lines.push(`Recibido: ${receivedParts.join(" ")}`);
      }

      if (lines.length === 0) {
        lines.push("Fecha:");
      }

      return lines;
    }

    rawClusters.forEach((cluster, index) => {
      const order = buildOrderFromCluster(cluster);
      const lane = riskCategories[index % riskCategories.length];

      order.riskStatus = lane.status;
      order.riskBadge = lane.badge;
      order.riskColor = lane.progressColor;

      categories[0].orders.push(order);

    let activeTab = 0;

    function tabButton(category, index) {
      const selected = index === activeTab;
      return `
        <button
          type="button"
          data-index="${index}"
          class="inline-flex items-center gap-2 rounded-md border px-3 py-2 text-sm font-medium transition ${selected ? "border-gray-300 bg-white text-gray-900 dark:border-gray-600 dark:bg-gray-950 dark:text-gray-100" : "border-transparent text-gray-600 hover:border-gray-300 dark:text-gray-400 dark:hover:border-gray-700"}"
        >

          <span>${category.status}</span>
          <span class="rounded bg-gray-100 px-2 py-0.5 text-xs font-semibold tabular-nums ring-1 ring-inset ring-gray-200 dark:bg-gray-800 dark:ring-gray-700">${category.orders.length}</span>
        </button>
      `;
    }

    function renderActorsList(actors) {
      if (!Array.isArray(actors) || actors.length === 0) {
        return "";
      }

      const actorTags = actors
        .filter((item) => String(item || "").trim())
        .map((item) => `
          <span class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 dark:border-gray-700 dark:text-gray-300">${escapeHtml(item)}</span>
        `)
        .join("");

      if (!actorTags) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Actores</p>
          ${actorTags}

      `;
    }

    function renderSimilarCoverage(similar) {
      if (!Array.isArray(similar) || similar.length === 0) {
        return "";
      }

      const links = similar
        .filter((item) => item && item.source && item.url)
        .map((item) => `
          <a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer" class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 hover:border-blue-400 hover:text-blue-700 dark:border-gray-700 dark:text-gray-300 dark:hover:border-blue-500 dark:hover:text-blue-400">${escapeHtml(item.source)}</a>
        `)
        .join("");

      if (!links) {

      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">

      `;
    }

    function orderCard(order, statusClass, statusText, progressColor) {
      const progress = Math.round((order.fulfillmentActual / order.fulfillmentTotal) * 100);
      const safeBodyText = order.body ? `${order.body.slice(0, 220)}${order.body.length > 220 ? "..." : ""}` : "No hay resumen disponible.";
      const safeTitle = escapeHtml(order.item);
      const safeSource = escapeHtml(order.company);
      const safeAuthor = escapeHtml(order.author || "");
      const subtitle = safeAuthor ? `${safeSource} | ${safeAuthor}` : safeSource;
      const safeBody = escapeHtml(safeBodyText);
      const articleUrl = safeUrl(order.url);
      const pictureUrl = safeUrl(order.pic);
      const dateTimeLines = buildDateTimeDisplayLines(order.dateTimeNews, order.dateTimeReceived)
        .map((line) => `<p class="text-sm text-gray-600 dark:text-gray-400">${escapeHtml(line)}</p>`)
        .join("");
      const imageBlock = pictureUrl === "#"
        ? ""
        : `<a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="block h-20 w-28 shrink-0 overflow-hidden rounded-md border border-gray-200 bg-gray-100 dark:border-gray-700 dark:bg-gray-800"><img src="${pictureUrl}" alt="Imagen de noticia" class="h-full w-full object-cover" loading="lazy"></a>`;

      return `
        <article class="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900 sm:p-5">
          <div class="flex items-start gap-3">
            ${imageBlock}

            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <h4 class="min-w-0 flex-1 truncate text-sm font-medium text-gray-900 dark:text-gray-100">
                  <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-700 dark:hover:text-blue-400">${safeTitle}</a>
                </h4>
                <span class="inline-flex items-center whitespace-nowrap rounded px-1.5 py-0.5 text-xs font-medium ring-1 ring-inset ${statusClass}">${statusText}</span>
              </div>

              <div class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                <p>${subtitle}</p>
              </div>

              <p class="mt-3 text-sm leading-6 text-gray-700 dark:text-gray-300">${safeBody}</p>

              ${renderActorsList(order.actors)}

              ${renderSimilarCoverage(order.similar)}
            </div>
          </div>

          <hr class="my-4 border-gray-200 dark:border-gray-700">

          <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-2">
              <span class="progress-ring" style="background: conic-gradient(${progressColor} ${progress}%, rgb(209 213 219) ${progress}% 100%); --ring-inner: rgb(255 255 255);"></span>
              <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Riesgo</p>
            </div>
            <div class="flex flex-col items-start gap-1 sm:items-end">${dateTimeLines}</div>
          </div>
        </article>
      `;
    }

    function emptyPanel() {
      return `
        <article class="rounded-lg border border-dashed border-gray-300 bg-gray-50 p-6 text-sm text-gray-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-400">
          No hay noticias disponibles en esta seccion.
        </article>
      `;
    }

    function render() {
      const list = document.getElementById("tab-list");
      const panel = document.getElementById("panel");
      const current = categories[activeTab];
      const showAll = activeTab === 0;

      list.innerHTML = categories.map(tabButton).join("");
      panel.innerHTML = current.orders.length
        ? current.orders
            .map((order) => {
              const badge = showAll ? order.riskBadge : current.badge;
              const status = showAll ? order.riskStatus : current.status;
              const color = showAll ? order.riskColor : current.progressColor;
              return orderCard(order, badge, status, color);
            })
            .join("")
        : emptyPanel();

      list.querySelectorAll("button[data-index]").forEach((button) => {
        button.addEventListener("click", () => {
          activeTab = Number(button.getAttribute("data-index"));
          render();
        });
      });
    }

    render();
  </script>
