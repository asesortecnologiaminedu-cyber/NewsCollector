  <script>
    const rawClusters = [{"actor": [], "authors": ["Fernanda Lima"], "body": "en Nacional\n\nEl ministro de Obras P\u00fablicas, Servicios y Vivienda, Mauricio Zamora se\u00f1al\u00f3 este lunes que esta semana es \u201cdecisiva\u201d para encontrar una soluci\u00f3n a los conflictos sociales y pol\u00edticos existentes en el pa\u00eds que han generado la instalaci\u00f3n de diferentes puntos de bloqueo en los departamentos.\n\n\u201cCreo que la situaci\u00f3n ya no se aguanta y por eso abogamos que las decisiones que tomen las organizaciones sean en bien de Bolivia, entonces yo pienso que esta semana es decisiva. Creo que no ir al di\u00e1logo es ya una posici\u00f3n contraria a lo que quieren los bolivianos\u201d, afirm\u00f3 Zamora.\n\nA 32 d\u00edas de las movilizaciones, el pa\u00eds registra 90 puntos de bloqueo en distintos sectores, principalmente en el occidente. Cochabamba se ha convertido en el principal foco de las medidas de presi\u00f3n, por encima de La Paz.\n\nDe acuerdo con el mapa de transitabilidad de la Administradora Boliviana de Carreteras (ABC), seis departamentos presentan cortes de ruta. Cochabamba reporta 32 bloqueos, seguida de La Paz con 19. Les siguen Potos\u00ed con 16, Oruro con 11, Chuquisaca con nueve y Santa Cruz con tres puntos de bloqueo.\n\nEl Ministerio de Obras P\u00fablicas afirm\u00f3 que existen acercamientos entre distintas entidades del Gobierno nacional con las bases sociales para llegar a un acuerdo y lograr pacificar al pa\u00eds.\n\n\u201cYo abogo a la madurez de los dirigentes y sobre todo de las bases, porque ya tenemos que hablar de ellas, de lo que quiere la poblaci\u00f3n. Esperemos que tomen buenas decisiones, vamos a esperar una manifestaci\u00f3n de estos sectores y esperamos en estos d\u00edas entrar a lo que ellos quieran, di\u00e1logo, encuentro, plan de trabajo, pero ya tenemos que solucionar\u201d, indic\u00f3.\n\nExplic\u00f3 que la desinformaci\u00f3n en redes sociales ha jugado en contra en la b\u00fasqueda de una soluci\u00f3n pac\u00edfica entre los sectores movilizados y el Gobierno. \u201cNosotros estamos haciendo un trabajo con las bases para explicarles toda esa desinformaci\u00f3n. Cuando ellos vean que muchas cosas son mentiras, van a tomar otra actitud\u201d.\n\nLa autoridad exhort\u00f3 a los medios de comunicaci\u00f3n a manejar la informaci\u00f3n de forma responsable para evitar la desinformaci\u00f3n y llegar a una soluci\u00f3n pronta a los conflictos que afectan al pa\u00eds en la actual coyuntura.", "dateTimeNews": "2026-06-01T19:26:28+00:00", "dateTimeReceived": "2026-06-01T19:51:11+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/04/WhatsApp-Image-2026-04-23-at-12.08.54.webp", "position": 1, "riesgo": 0.3, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/el-gobierno-afirma-que-es-una-semana-decisiva-para-resolver-los-conflictos-ya-no-se-aguanta/"}], "source": "La Raz\u00f3n", "title": "Ministro Zamora afirma que \u2018esta semana es decisiva\u2019 y llama al di\u00e1logo", "url": "https://larazon.bo/nacional/2026/06/01/ministro-zamora-afirma-que-esta-semana-es-decisiva-y-llama-al-dialogo/"}, {"actor": [], "authors": ["Israel Munguia"], "body": "El presidente Rodrigo Paz dijo que est\u00e1 seguro que en los pr\u00f3ximos d\u00edas se termine el \u201csufrimiento del departamento de La Paz\u201d y afirm\u00f3 que espera que organizaciones e instituciones pace\u00f1as se pronuncien en las siguientes horas o d\u00edas en favor de la pacificaci\u00f3n del pa\u00eds.\n\n\u201cEstoy seguro que en los siguientes d\u00edas, cortos d\u00edas, el sufrimiento sobre todo del departamento pace\u00f1o, ojal\u00e1 Dios mediante, se acabe\u201d, dijo el mandatario.\n\nAsimismo, Paz se\u00f1al\u00f3 que su Gobierno trabaja en la b\u00fasqueda de acuerdos para resolver los conflictos y garantizar la reactivaci\u00f3n econ\u00f3mica.\n\nEn ese sentido, indic\u00f3 que existen demandas leg\u00edtimas de distintos sectores, pero advirti\u00f3 que tambi\u00e9n hay otros que buscan politizar el conflicto.\n\nAdem\u00e1s, remarc\u00f3 que es un momento de madurez democr\u00e1tica y afirm\u00f3 que los violentos no pueden ganar. \u201cLos violentos no nos pueden ganar. Es un momento de transformaci\u00f3n del pa\u00eds, por eso en este \u00e1mbito de la construcci\u00f3n de cada regi\u00f3n, La Paz est\u00e1 buscando su construcci\u00f3n regional porque durante muchos a\u00f1os no fue atendida\u201d, asever\u00f3 Paz.\n\nEl presidente remarc\u00f3 que su prioridad es alcanzar la pacificaci\u00f3n del pa\u00eds y reiter\u00f3 que mantiene abiertos los espacios de di\u00e1logo con los sectores que plantean sus demandas de manera pac\u00edfica.\n\n\u201cCon los que est\u00e1n queriendo reclamar de forma correcta y honrada, siempre estar\u00e1 el espacio para pacificar Bolivia y generar esta reconciliaci\u00f3n\u201d, sostuvo.\n\nAsimismo, anuncio que espera que en las pr\u00f3ximas horas o d\u00edas algunas organizaciones e instituciones pace\u00f1as hagan conocer p\u00fablicamente su posici\u00f3n frente a la coyuntura.\n\n\u201cEspero que en las siguientes horas o d\u00edas hay algunas instituciones u organizaciones de La Paz que se tienen que pronunciar\u201d, indic\u00f3.\n\nFuente: Urgentebo", "dateTimeNews": "2026-06-01T18:39:44+00:00", "dateTimeReceived": "2026-06-01T19:50:52+00:00", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/06/IMG_7415.webp", "position": 2, "riesgo": 0.5, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/paz-afirma-que-el-conflicto-en-la-paz-podria-resolverse-en-los-proximos-dias/"}, {"source": "El Deber", "url": "https://eldeber.com.bo/pais/rodrigo-paz-anticipa-salida-pacifica-conflicto-asegura-proximos-dias-sufrimiento-paz-acabara_1780335027"}], "source": "El Mundo", "title": "Paz: En los pr\u00f3ximos d\u00edas acabar\u00e1 el \u201csufrimiento del departamento de La Paz\u201d", "url": "https://elmundo.com.bo/paz-en-los-proximos-dias-acabara-el-sufrimiento-del-departamento-de-la-paz/"}, {"actor": [], "authors": ["Rodolfo Aliaga"], "body": "en Econom\u00eda y Empresa\n\nEl Gobierno present\u00f3 este lunes en Cochabamba la \u201cAplicaci\u00f3n de la Ley de Alivio Tributario\u201d, una norma orientada a reducir la carga econ\u00f3mica de las familias bolivianas y facilitar la reactivaci\u00f3n de peque\u00f1os contribuyentes en el pa\u00eds.\n\nEl presidente del Estado, Rodrigo Paz, afirm\u00f3 que la medida forma parte de los compromisos asumidos durante la campa\u00f1a electoral y responde a un proceso de escucha a diversos sectores sociales en diferentes regiones del pa\u00eds.\n\n\u201cEsta norma nace del esfuerzo de m\u00e1s de 230.000 kil\u00f3metros viajando el pa\u00eds, escuchando a muchos sectores\u201d, se\u00f1al\u00f3 la autoridad, al destacar que la iniciativa busca brindar \u201cun alivio real\u201d a la poblaci\u00f3n y avanzar hacia un modelo econ\u00f3mico inclusivo.\n\nEn medio de l\u00e1grimas, representantes de los comerciantes denunciaron abusos de impuestos durante la gesti\u00f3n del exmandatario Evo Morales, y agradecieron la aprobaci\u00f3n.\n\nLea: Contribuyentes tendr\u00e1n 120 d\u00edas para regularizar deudas y nuevo esquema de facturaci\u00f3n\n\nAlivio\n\nEl mandatario explic\u00f3 que la ley est\u00e1 orientada principalmente a gremiales, cuentapropistas, transportistas y peque\u00f1os emprendedores, a quienes calific\u00f3 como sectores fundamentales de la econom\u00eda nacional.\n\n\u201cEs el alivio tributario m\u00e1s grande de la historia de Bolivia\u201d, afirm\u00f3, al se\u00f1alar que la norma beneficiar\u00e1 a m\u00e1s de 230 mil familias y permitir\u00e1 liberar cerca de un mill\u00f3n de cuentas, facilitando la regularizaci\u00f3n y reactivaci\u00f3n econ\u00f3mica.\n\nSeg\u00fan el Ejecutivo, la medida busca permitir que los peque\u00f1os contribuyentes puedan reinyectar recursos a sus negocios y evitar el cierre o la informalidad causada por cargas tributarias acumuladas.\n\nEl presidente tambi\u00e9n destac\u00f3 que el Gobierno ha impulsado un proceso de reducci\u00f3n del gasto p\u00fablico en un 30%, junto con una disminuci\u00f3n del 50% de su salario, como parte de una pol\u00edtica de austeridad y redistribuci\u00f3n de recursos.\n\nAsimismo, indic\u00f3 que se han creado m\u00e1s de 5.300 \u00edtems en sectores clave, con 2.300 destinados a salud y 3.000 a educaci\u00f3n, con el objetivo de fortalecer los servicios b\u00e1sicos sin recortes en estas \u00e1reas.\n\nNuevas medidas\n\nDurante su intervenci\u00f3n, Paz anunci\u00f3 adem\u00e1s que el Gobierno continuar\u00e1 impulsando nuevas medidas econ\u00f3micas en las pr\u00f3ximas semanas, orientadas a la formalizaci\u00f3n de la econom\u00eda y la reactivaci\u00f3n productiva.\n\nEl mandatario sostuvo que la formalidad debe ser accesible y no una carga para los emprendedores, se\u00f1alando que muchos actores econ\u00f3micos han migrado a la informalidad debido a la presi\u00f3n del sistema tributario.\n\nFinalmente, el presidente llam\u00f3 a la unidad nacional y al di\u00e1logo para consolidar la estabilidad del pa\u00eds y avanzar en la implementaci\u00f3n de reformas estructurales.\n\n\u201cEste es un momento de madurez democr\u00e1tica. No es la violencia ni el bloqueo lo que debe ganar, sino la construcci\u00f3n conjunta de Bolivia\u201d, concluy\u00f3.\n\nLa norma se basa en cinco pilares fundamentales: condonaci\u00f3n de deudas hist\u00f3ricas, regularizaci\u00f3n de adeudos, reducci\u00f3n del plazo de prescripci\u00f3n, transparencia en el IVA y promociones empresariales.", "dateTimeNews": "2026-06-01T18:21:38+00:00", "dateTimeReceived": "2026-06-01T19:51:13+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/06/WhatsApp-Image-2026-06-01-at-14.15.33.webp", "position": 3, "riesgo": 0.3, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/economia-y-empresa/2026/06/01/el-99-de-beneficiarios-del-alivio-tributario-son-pequenos-contribuyentes/"}], "source": "La Raz\u00f3n", "title": "La Ley de Alivio Tributario entra en vigencia en el pa\u00eds", "url": "https://larazon.bo/economia-y-empresa/2026/06/01/la-ley-de-alivio-tributario-entra-en-vigencia-en-el-pais/"}, {"actor": [], "authors": ["Lucas Nazrala"], "body": "La FIFA anunci\u00f3 una serie de cambios en el reglamento arbitral que ser\u00e1n aplicados durante la Copa Mundial 2026, con el objetivo de agilizar el desarrollo de los partidos, reducir las p\u00e9rdidas de tiempo y reforzar la disciplina dentro del terreno de juego.\n\nEntre las principales novedades destaca la sanci\u00f3n con tarjeta roja para aquellos futbolistas que se cubran la boca al discutir con un rival. Seg\u00fan explic\u00f3 el presidente del Comit\u00e9 de \u00c1rbitros de la FIFA, Pierluigi Collina, la medida busca evitar conductas antideportivas y solo se aplicar\u00e1 en situaciones de confrontaci\u00f3n, no en conversaciones amistosas entre jugadores.\n\nOtra modificaci\u00f3n importante ser\u00e1 la expulsi\u00f3n de cualquier futbolista o integrante del cuerpo t\u00e9cnico que abandone el campo de juego como se\u00f1al de protesta ante una decisi\u00f3n arbitral o que incentive a otros a hacerlo.\n\nEl videoarbitraje (VAR) tambi\u00e9n ampliar\u00e1 sus competencias durante el torneo. Por primera vez podr\u00e1 intervenir para corregir saques de esquina concedidos err\u00f3neamente y revisar expulsiones derivadas de una segunda tarjeta amarilla. En ambos casos, la correcci\u00f3n solo se realizar\u00e1 cuando el error sea evidente.\n\nLa FIFA tambi\u00e9n endurecer\u00e1 el control sobre las p\u00e9rdidas deliberadas de tiempo. Los \u00e1rbitros podr\u00e1n aplicar una cuenta regresiva de cinco segundos a los porteros que demoren la reanudaci\u00f3n del juego y a los jugadores encargados de realizar saques de banda. Si no cumplen con el tiempo establecido, el equipo rival ser\u00e1 beneficiado con la posesi\u00f3n o un saque de esquina, seg\u00fan corresponda.\n\nAdem\u00e1s, los jugadores sustituidos tendr\u00e1n un m\u00e1ximo de diez segundos para abandonar el campo por el punto m\u00e1s cercano. En caso de incumplimiento, el futbolista que ingrese deber\u00e1 esperar un minuto adicional y solo podr\u00e1 entrar durante una interrupci\u00f3n del juego.\n\nDurante todos los encuentros del Mundial se realizar\u00e1n dos pausas de hidrataci\u00f3n de tres minutos, una en cada tiempo, cuando se alcance la mitad de cada per\u00edodo. El tiempo empleado ser\u00e1 compensado posteriormente por los \u00e1rbitros.\n\nCollina se\u00f1al\u00f3 que todas estas medidas forman parte de una estrategia para aumentar el tiempo efectivo de juego y mejorar el espect\u00e1culo, manteniendo un mayor control sobre las conductas de los futbolistas y el ritmo de los partidos.", "dateTimeNews": "2026-06-01T18:08:04+00:00", "dateTimeReceived": "2026-06-01T18:36:25+00:00", "pic": "https://cdn.diez.bo/diez/062026/1780333770231.jpg", "position": 4, "riesgo": 0.0, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/deportes/en-el-mundial-2026-se-registraran-algunas-novedades-arbitrales/"}], "source": "El Deber", "title": "FIFA implementar\u00e1 nuevas reglas arbitrales para el Mundial 2026", "url": "https://eldeber.com.bo/deportes/marcelo-flores-pierde-mundial-2026-sufrir-grave-lesion-rodilla_1780337284"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "Tras su ampliado realizado en La Paz, la Central Obrera Boliviana (COB) determin\u00f3 mantener sus medidas de presi\u00f3n para exigir la renuncia del presidente Rodrigo Paz y, en consecuencia, descartaron cualquier posibilidad de acudir a dialogar con el Gobierno.\n\nDirigentes que participaron de la reuni\u00f3n se\u00f1alaron que las bases y sectores que mantienen los bloqueos de carreteras, que a\u00edslan y generan desabastecimiento en La Paz hace un mes, ratificaron que el \u00fanico objetivo es la renuncia del primer mandatario.\n\nEmpero, informaron que decidieron habilitar corredores humanitarios, aunque no especificaron fechas y tampoco si \u00fanicamente ser\u00e1n para el paso de ox\u00edgeno y medicamentos o tambi\u00e9n de alimentos y combustible.\n\n\u201cLos trabajadores van a continuar con la medida de presi\u00f3n (\u2026) se ha decidido mantener las medidas de presi\u00f3n. Hasta ahora no hay posibilidad, se ha descartado (el di\u00e1logo). Se ha determinado establecer corredores humanitarios\u201d, inform\u00f3 el dirigente del Magisterio, Jos\u00e9 Luis \u00c1lvarez. Advertisement:\n\nEl dirigente afirm\u00f3 que la decisi\u00f3n corresponde a que el Gobierno \u201csolo ha hecho reprimir\u201d a las movilizaciones.\n\n\u201cSe ha determinado establecer corredores humanitarios para hacer pasar cargamento de medicinas, oxigeno\u201d, agreg\u00f3 el dirigente.\n\nEn esa misma l\u00ednea, el dirigente Jaime Solares asegur\u00f3 que las organizaciones movilizadas ratificaron la continuidad de las medidas de presi\u00f3n y descartaron, por ahora, cualquier posibilidad de di\u00e1logo con el Gobierno.\n\nSeg\u00fan explic\u00f3, durante las reuniones sostenidas con sectores sociales y representantes llegados desde distintos departamentos se reafirm\u00f3 que la principal demanda sigue siendo la renuncia del presidente Rodrigo Paz.\n\n\u201cNo quieren di\u00e1logo, no quieren nada; el \u00fanico pedido que tiene el pueblo es que el presidente tiene que irse\u201d, sostuvo, al remarcar que los sectores desplazados desde regiones como Potos\u00ed, Oruro y otras zonas aseguraron contar con fuerza suficiente para sostener las movilizaciones por tiempo prolongado.\n\nNo obstante, el dirigente indic\u00f3 que se garantizar\u00e1 el paso de medicamentos, alimentos e insumos destinados a hospitales, as\u00ed como el tr\u00e1nsito de ambulancias, enfermos y personas en situaci\u00f3n de emergencia.\n\nSin embargo, reiter\u00f3 que estas medidas humanitarias no implican una flexibilizaci\u00f3n del conflicto, pues las organizaciones movilizadas mantienen la decisi\u00f3n de continuar la lucha \u201chasta las \u00faltimas consecuencias\u201d.", "dateTimeNews": "2026-06-01T17:38:07+00:00", "dateTimeReceived": "2026-06-01T18:12:18+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/cob_marcha26.2.jpg", "position": 5, "riesgo": 0.0, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260601/cob-rechaza-dialogo-gobierno-e-insiste-pedido-renuncia-rodrigo-paz"}], "source": "Ox\u00edgeno", "title": "La COB descarta ir al di\u00e1logo y exige la renuncia de Paz ; pero habilitar\u00eda corredores humanitarios", "url": "https://oxigeno.bo/la-cob-descarta-ir-al-dialogo-exige-la-renuncia-de-paz-y-elecciones-en-90-dias-pero-habilitaria-corredores-humanitarios/"}, {"actor": [], "authors": ["El Deber"], "body": "El presidente Rodrigo Paz expres\u00f3 este lunes su confianza en que la crisis provocada por m\u00e1s de un mes de bloqueos y movilizaciones llegue pronto a una soluci\u00f3n pac\u00edfica y asegur\u00f3 que el departamento de La Paz podr\u00eda comenzar a superar el escenario de conflicto en los pr\u00f3ximos d\u00edas.\n\n\u201cEstoy seguro que en los siguientes d\u00edas, cortos d\u00edas, el sufrimiento, sobre todo del departamento pace\u00f1o, ojal\u00e1 Dios mediante, se acabe\u201d, afirm\u00f3 el mandatario en Cochabamba durante un acto realizado en Cochabamba, donde tambi\u00e9n llam\u00f3 a la reconciliaci\u00f3n nacional y a la defensa de la democracia.\n\nPaz sostuvo que la salida al conflicto debe construirse sobre acuerdos amplios y entendimientos entre los distintos sectores del pa\u00eds. \u201cTiene que ser sobre acuerdos grandes, tiene que ser sobre reconciliaci\u00f3n, sobre c\u00f3mo vamos a trabajar todos los bolivianos\u201d, se\u00f1al\u00f3 luego de presentar la Ley de Alivio Tributario.\n\nEl mandatario afirm\u00f3 que mantiene una vocaci\u00f3n de di\u00e1logo y pacificaci\u00f3n, aunque reconoci\u00f3 que el proceso exige paciencia en medio de la tensi\u00f3n social y pol\u00edtica que vive el pa\u00eds. En ese contexto, diferenci\u00f3 entre quienes plantean demandas leg\u00edtimas y aquellos grupos que, seg\u00fan dijo, buscan aprovechar el conflicto para generar inestabilidad.\n\n\u201cHay que saber qui\u00e9nes realmente est\u00e1n reclamando de forma correcta y honrada y qui\u00e9nes est\u00e1n queriendo hacer da\u00f1o a la democracia\u201d, manifest\u00f3. A\u00f1adi\u00f3 que el Gobierno mantendr\u00e1 abiertos los espacios de negociaci\u00f3n con los sectores que presenten reivindicaciones leg\u00edtimas.\n\nDurante su discurso, Paz tambi\u00e9n denunci\u00f3 la existencia de campa\u00f1as que buscan profundizar la confrontaci\u00f3n en Bolivia. Se\u00f1al\u00f3 que existen mensajes difundidos a trav\u00e9s de redes sociales y otros canales que tendr\u00edan origen fuera del pa\u00eds y que estar\u00edan orientados a afectar la institucionalidad democr\u00e1tica.\n\nSin dar mayores detalles, anticip\u00f3 que en los pr\u00f3ximos d\u00edas su administraci\u00f3n presentar\u00e1 informaci\u00f3n sobre estos hechos y otros temas vinculados a la coyuntura nacional. Anunci\u00f3 que todas las leyes \"se van a debatir abiertamente\".\n\nEl Presidente rechaz\u00f3 adem\u00e1s versiones que atribuyen al Gobierno intenciones de privatizar empresas o servicios p\u00fablicos. Asegur\u00f3 que las medidas econ\u00f3micas impulsadas por su administraci\u00f3n est\u00e1n orientadas a reactivar la econom\u00eda, aliviar la situaci\u00f3n de peque\u00f1os contribuyentes y fortalecer las capacidades productivas de las regiones.\n\nLas declaraciones fueron realizadas durante la promulgaci\u00f3n de la ley de alivio tributario, una norma que, seg\u00fan el Gobierno, beneficiar\u00e1 a m\u00e1s de 230.000 familias y permitir\u00e1 regularizar cerca de un mill\u00f3n de cuentas tributarias.\n\nPaz destac\u00f3 que, pese al ajuste fiscal aplicado por su administraci\u00f3n, se preservaron los recursos destinados a salud y educaci\u00f3n y se increment\u00f3 la creaci\u00f3n de \u00edtems en ambos sectores. Tambi\u00e9n adelant\u00f3 que la pr\u00f3xima semana realizar\u00e1 nuevos anuncios de car\u00e1cter econ\u00f3mico destinados a favorecer a las mayor\u00edas.\n\nFinalmente, el mandatario convoc\u00f3 a instituciones, organizaciones y autoridades democr\u00e1ticamente elegidas a respaldar los esfuerzos de pacificaci\u00f3n y reconciliaci\u00f3n nacional. Expres\u00f3 adem\u00e1s su expectativa de que m\u00e1s sectores se pronuncien en defensa de la democracia frente a los bloqueos y las acciones que, a su juicio, buscan dividir al pa\u00eds.\n\n\u201cLos violentos no nos pueden ganar. Es un momento de transformaci\u00f3n del pa\u00eds\u201d, concluy\u00f3.", "dateTimeNews": "2026-06-01T17:30:27+00:00", "dateTimeReceived": "2026-06-01T18:36:23+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/062026/1780334538426.jpg?\u0026cw=1200\u0026ch=630", "position": 6, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/paz-afirma-que-el-conflicto-en-la-paz-podria-resolverse-en-los-proximos-dias/"}], "source": "El Deber", "title": "Rodrigo Paz anticipa una salida pac\u00edfica al conflicto y asegura que \u201cen los pr\u00f3ximos d\u00edas el sufrimiento de La Paz acabar\u00e1\u201d", "url": "https://eldeber.com.bo/pais/rodrigo-paz-anticipa-salida-pacifica-conflicto-asegura-proximos-dias-sufrimiento-paz-acabara_1780335027"}, {"actor": [], "authors": ["Marco Mendoza"], "body": "en Ciudades\n\nUna mujer dio a luz en plena v\u00eda p\u00fablica cuando se dirig\u00eda a la Caja Nacional de Salud (CNS), en Santa Cruz de la Sierra, este lunes.\n\nLa mujer estaba acompa\u00f1ada de su hija, una adolescente, cuando rompi\u00f3 fuente, lo que precipit\u00f3 el parto y el beb\u00e9 naci\u00f3 en el lugar. Vecinos y personas que pasaban por la zona auxiliaron a la madre y al reci\u00e9n nacido.\n\n\u201cLe dije a su hija que vaya, corra y pida una silla de ruedas\u201d, dijo un hombre que fue quien ayud\u00f3 a la mujer, y que trabaja como portero en la Caja Petrolera de Salud.\n\nLea. Mujer da a luz en puertas de una iglesia en Santa Cruz\n\nEn primera instancia, pens\u00f3 que la mujer ten\u00eda problemas de ves\u00edcula pues \u201ccaminaba agachada\u201d y muy pausado, pero de un momento a otro, \u201cella grit\u00f3 de dolor, sali\u00f3 el l\u00edquido y naci\u00f3 el beb\u00e9\u201d.\n\n\u201cLe ayudamos a la se\u00f1ora junto a un compa\u00f1ero. La llevamos a la Caja Nacional\u201d, agreg\u00f3 el entrevistado a la red Unitel, sobre este hecho que caus\u00f3 asombro en la poblaci\u00f3n y que fue registrado en videos que se subieron a redes sociales.\n\nEn las im\u00e1genes difundidas en redes sociales se ve que tanto la madre como su beb\u00e9 fueron trasladados de inmediato al interior de la CNS para que reciban atenci\u00f3n m\u00e9dica.", "dateTimeNews": "2026-06-01T17:20:22+00:00", "dateTimeReceived": "2026-06-01T18:12:16+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/06/a48c3c17-0588-4e20-91da-5eba9d38b05a.webp", "position": 7, "riesgo": 0.0, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/actualidad/santa-cruz-mujer-da-a-luz-inesperadamente-en-via-publica/"}], "source": "La Raz\u00f3n", "title": "Mujer da a luz en la calle a metros de la Caja Nacional", "url": "https://larazon.bo/ciudades/2026/06/01/mujer-da-a-luz-en-la-calle-a-metros-de-la-caja-nacional/"}, {"actor": [], "authors": ["Lucas Nazrala"], "body": "La FIFA anunci\u00f3 una serie de cambios en el reglamento arbitral que ser\u00e1n aplicados durante la Copa Mundial 2026, con el objetivo de agilizar el desarrollo de los partidos, reducir las p\u00e9rdidas de tiempo y reforzar la disciplina dentro del terreno de juego.\n\nEntre las principales novedades destaca la sanci\u00f3n con tarjeta roja para aquellos futbolistas que se cubran la boca al discutir con un rival. Seg\u00fan explic\u00f3 el presidente del Comit\u00e9 de \u00c1rbitros de la FIFA, Pierluigi Collina, la medida busca evitar conductas antideportivas y solo se aplicar\u00e1 en situaciones de confrontaci\u00f3n, no en conversaciones amistosas entre jugadores.\n\nOtra modificaci\u00f3n importante ser\u00e1 la expulsi\u00f3n de cualquier futbolista o integrante del cuerpo t\u00e9cnico que abandone el campo de juego como se\u00f1al de protesta ante una decisi\u00f3n arbitral o que incentive a otros a hacerlo.\n\nEl videoarbitraje (VAR) tambi\u00e9n ampliar\u00e1 sus competencias durante el torneo. Por primera vez podr\u00e1 intervenir para corregir saques de esquina concedidos err\u00f3neamente y revisar expulsiones derivadas de una segunda tarjeta amarilla. En ambos casos, la correcci\u00f3n solo se realizar\u00e1 cuando el error sea evidente.\n\nLa FIFA tambi\u00e9n endurecer\u00e1 el control sobre las p\u00e9rdidas deliberadas de tiempo. Los \u00e1rbitros podr\u00e1n aplicar una cuenta regresiva de cinco segundos a los porteros que demoren la reanudaci\u00f3n del juego y a los jugadores encargados de realizar saques de banda. Si no cumplen con el tiempo establecido, el equipo rival ser\u00e1 beneficiado con la posesi\u00f3n o un saque de esquina, seg\u00fan corresponda.\n\nAdem\u00e1s, los jugadores sustituidos tendr\u00e1n un m\u00e1ximo de diez segundos para abandonar el campo por el punto m\u00e1s cercano. En caso de incumplimiento, el futbolista que ingrese deber\u00e1 esperar un minuto adicional y solo podr\u00e1 entrar durante una interrupci\u00f3n del juego.\n\nDurante todos los encuentros del Mundial se realizar\u00e1n dos pausas de hidrataci\u00f3n de tres minutos, una en cada tiempo, cuando se alcance la mitad de cada per\u00edodo. El tiempo empleado ser\u00e1 compensado posteriormente por los \u00e1rbitros.\n\nCollina se\u00f1al\u00f3 que todas estas medidas forman parte de una estrategia para aumentar el tiempo efectivo de juego y mejorar el espect\u00e1culo, manteniendo un mayor control sobre las conductas de los futbolistas y el ritmo de los partidos.", "dateTimeNews": "2026-06-01T17:11:19+00:00", "dateTimeReceived": "2026-06-01T18:11:54+00:00", "pic": "https://cdn.diez.bo/diez/062026/1780333770231.jpg", "position": 8, "riesgo": 0.0, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/deportes/en-el-mundial-2026-se-registraran-algunas-novedades-arbitrales/"}], "source": "El Deber", "title": "FIFA to enforce new referee rules at the 2026 World Cup.", "url": "https://eldeber.com.bo/mundial-2026/fifa-implementara-nuevas-reglas-arbitrales-mundial-2026_1780333844"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nLa presidenta del Tribunal Departamental de Justicia (TDJ) de La Paz, Margoth P\u00e9rez, aclar\u00f3 este lunes que la decisi\u00f3n judicial que dej\u00f3 sin efecto la orden de aprehensi\u00f3n contra el ejecutivo de la Central Obrera Boliviana (COB), Mario Argollo, no implica la anulaci\u00f3n definitiva de esa medida.\n\nExplic\u00f3 que la determinaci\u00f3n asumida durante una audiencia de Acci\u00f3n de Libertad observ\u00f3 aspectos relacionados con la fundamentaci\u00f3n del mandamiento emitido por el Ministerio P\u00fablico, por lo que la Fiscal\u00eda a\u00fan tiene la posibilidad de reactivar el proceso.\n\n\u201cEntonces, no es una suspensi\u00f3n definitiva porque mediante Acci\u00f3n de Libertad no se ha determinado eso\u201d, afirm\u00f3 P\u00e9rez.\n\nEl fallo judicial establece que el Ministerio P\u00fablico debe justificar adecuadamente la orden de aprehensi\u00f3n. Una vez cumplido ese requisito, la medida podr\u00eda volver a ejecutarse.\n\nLea tambi\u00e9n: Campesinos advierten a ciudadanos que bloqueos esta semana ser\u00e1n \u2018peores\u2019\n\nIndic\u00f3 adem\u00e1s que la resoluci\u00f3n no cerr\u00f3 el caso ni impide que la Fiscal\u00eda contin\u00fae con las actuaciones correspondientes dentro de la investigaci\u00f3n.\n\n\u201cEn cualquier momento el Ministerio P\u00fablico puede cumplir el dictamen de la Acci\u00f3n de Libertad\u201d, a\u00f1adi\u00f3.\n\nLa orden de aprehensi\u00f3n contra Argollo qued\u00f3 sin efecto el pasado viernes tras una audiencia de Acci\u00f3n de Libertad. La decisi\u00f3n fue considerada por la dirigencia de la COB como una condici\u00f3n necesaria para abrir un escenario de di\u00e1logo con las autoridades nacionales.\n\nSin embargo, durante el fin de semana, la organizaci\u00f3n rechaz\u00f3 participar en cualquier proceso de negociaci\u00f3n y ratific\u00f3 la continuidad de las medidas de presi\u00f3n. Asimismo, instruy\u00f3 a sus organizaciones afiliadas fortalecer los bloqueos y movilizaciones que se desarrollan en distintos puntos del pa\u00eds.", "dateTimeNews": "2026-06-01T16:56:46+00:00", "dateTimeReceived": "2026-06-01T19:51:12+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/c38cde7e-05c5-4c90-b9e2-266301ddd7ca.webp", "position": 9, "riesgo": 0.0, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260601/autoridad-judicial-aclara-que-suspension-orden-aprehension-argollo-no-es-0"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/tdj-de-la-paz-afirma-que-ordenes-de-aprehension-contra-argollo-y-salazar-seguiran-vigentes-si-la-fiscalia-corrige-vulneraciones/"}, {"source": "El Deber", "url": "https://eldeber.com.bo/pais/suspension-orden-aprehension-argollo-salazar-solo-temporal_1780332325"}], "source": "La Raz\u00f3n", "title": "TDJ aclara que suspensi\u00f3n de la orden de aprehensi\u00f3n contra Argollo no es definitiva", "url": "https://larazon.bo/nacional/2026/06/01/tdj-aclara-que-suspension-de-la-orden-de-aprehension-contra-argollo-no-es-definitiva/"}, {"actor": [], "authors": ["La Patria"], "body": "La movilizaci\u00f3n en Caranavi refleja la indignaci\u00f3n de vecinos ante bloqueos de carreteras que impactan su vida diaria\n\nFicha informativa Los vecinos de Caranavi marcharon el 1 de junio exigiendo el respeto a su derecho a la libre transitabilidad ante bloqueos de carreteras. La movilizaci\u00f3n se produce tras una crisis que ha llevado a las autoridades locales a intervenir. Toca para ver el contexto completo Contexto: La movilizaci\u00f3n es respuesta a bloqueos prolongados que han afectado la vida diaria. Alcaldes de Caranavi, Guanay, Teoponte, Tipuani y Mapiri intentaron dialogar con los bloqueadores. Se realiz\u00f3 una vigilia en el puente Armas para evitar nuevos cierres. El alcalde Francisco Pinto report\u00f3 desabastecimiento y aumento de precios. A pesar del despeje en la ruta Caranavi-La Paz, la incertidumbre contin\u00faa debido a la presencia de grupos interculturales afines al Movimiento Al Socialismo en el puente Armas. Por qu\u00e9 importa: El desabastecimiento ha impactado gravemente en la econom\u00eda familiar, aumentando los precios de productos b\u00e1sicos. La tensi\u00f3n social persiste con advertencias de desbloqueo por la fuerza si contin\u00faan los bloqueos. Datos clave: Fecha : 1 de junio\n\n: 1 de junio Precio litro de gasolina : 40 bolivianos\n\n: 40 bolivianos Precio de un huevo : 5 bolivianos\n\n: 5 bolivianos Total de puntos de bloqueo en Bolivia : 91\n\n: 91 Puntos cr\u00edticos en La Paz : 20\n\n: 20 Inicio de protestas : 1 de mayo\n\n: 1 de mayo Contingente de mineros que apoy\u00f3 el despeje: aproximadamente 80 mineros IngresarDesbloquear acceso completo\n\nCaranavi moviliza a vecinos contra bloqueos de carreteras \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nProtestas en Caranavi por bloqueos de carreteras\n\nEste lunes 1 de junio, los vecinos del municipio de Caranavi tomaron las calles principales en una marcha contundente. Organizados a trav\u00e9s de los cinco distritos urbanos, exigieron el respeto a su derecho a la libre transitabilidad en la carretera que conecta La Paz con Caranavi y las rutas circundantes. Los manifestantes, indignados por el impacto prolongado de las medidas de presi\u00f3n, lanzaron una advertencia directa a los grupos movilizados, demandando la liberaci\u00f3n inmediata de los caminos y el restablecimiento del tr\u00e1nsito normal.\n\nIntervenci\u00f3n de autoridades locales\n\nEsta acci\u00f3n no constituye un hecho aislado. Es la respuesta ciudadana ante una crisis que ya ha obligado a las autoridades locales a intervenir directamente. Durante el pasado fin de semana, los alcaldes de los municipios de Caranavi, Guanay, Teoponte, Tipuani y Mapiri se desplazaron hasta la ruta La Paz\u2013Caranavi para dialogar con los bloqueadores y buscar una soluci\u00f3n pac\u00edfica. A pesar de la tensa situaci\u00f3n y la resistencia inicial, las autoridades ediles lograron el despeje de la v\u00eda con el respaldo de un contingente de aproximadamente 80 mineros.\n\nVigilia estrat\u00e9gica en el puente Armas\n\nPosteriormente, se instal\u00f3 una vigilia estrat\u00e9gica en el sector del puente Armas para evitar nuevos cierres. En una conferencia de prensa realizada en la plaza principal, los representantes municipales fueron enf\u00e1ticos: \u201cNo queremos m\u00e1s atraso ni bloqueos\u201d, sentenciaron. Reiteraron que el sector minero se mantiene en alerta, dispuesto a despejar la carretera nuevamente si las medidas de fuerza vuelven a instalarse.\n\nImpacto del desabastecimiento en Tipuani\n\nLa desesperaci\u00f3n tambi\u00e9n se ha trasladado a otras zonas como Tipuani. All\u00ed, el desabastecimiento ha disparado los precios de productos b\u00e1sicos. El alcalde Francisco Pinto report\u00f3 que el litro de gasolina se comercializa hasta en 40 bolivianos y el precio de un solo huevo alcanza los 5 bolivianos. Estas cifras golpean gravemente el bolsillo de las familias.\n\nReuni\u00f3n con dirigentes mineros\n\nAnte esta realidad, el pasado domingo 31 de mayo, la institucionalidad de la provincia Larecaja se reuni\u00f3 con dirigentes mineros. Estos advirtieron que, si persist\u00edan los bloqueos, proceder\u00edan a desbloquear por la fuerza. Durante este encuentro, las autoridades locales lamentaron la inacci\u00f3n del presidente Rodrigo Paz y expresaron su cansancio ante las constantes afectaciones econ\u00f3micas y sociales.\n\nSituaci\u00f3n cr\u00edtica en Bolivia\n\nSi bien desde el s\u00e1bado 30 de mayo el paso se mantiene expedito en el trayecto Caranavi\u2013La Paz, la incertidumbre persiste. En los alrededores del puente Armas a\u00fan se reporta la presencia de algunos grupos interculturales afines al Movimiento Al Socialismo. Estos permanecen merodeando la zona y mantienen en alerta a los pobladores.\n\nPuntos cr\u00edticos de bloqueo\n\nSeg\u00fan datos oficiales emitidos por la Administradora Boliviana de Carreteras (ABC), el panorama nacional sigue siendo cr\u00edtico. A las 06:39 horas del lunes, el pa\u00eds amaneci\u00f3 con un total de 91 puntos de bloqueo. De esta cifra alarmante, el departamento de La Paz concentra 20 puntos cr\u00edticos, consolid\u00e1ndose como la regi\u00f3n m\u00e1s golpeada por esta ola de protestas que comenz\u00f3 el 1 de mayo.", "dateTimeNews": "2026-06-01T16:46:08+00:00", "dateTimeReceived": "2026-06-01T16:50:29+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/06/6a1dac4ab787b.jpg", "position": 10, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/caranavi-levanta-bloqueos-exige-libre-transitabilidad-carreteras-pacenas_1780325537"}], "source": "La Patria", "title": "Caranavi moviliza a vecinos contra bloqueos de carreteras - La Patria 3.0", "url": "https://lapatria.bo/enfoque-nacional/caranavi-moviliza-a-vecinos-contra-bloqueos-de-carreteras/"}, {"actor": [], "authors": ["El Deber"], "body": "Las \u00f3rdenes de aprehensi\u00f3n contra el ejecutivo de la Central Obrera Boliviana (COB), Mario Argollo, y el dirigente de la Federaci\u00f3n Departamental de Trabajadores Campesinos T\u00fapac Katari de La Paz, Vicente Salazar, no fueron anuladas, sino suspendidas temporalmente por una acci\u00f3n de libertad que observ\u00f3 la falta de fundamentaci\u00f3n de la solicitud presentada por el Ministerio P\u00fablico.\n\nLa aclaraci\u00f3n fue realizada este lunes por la presidenta del Tribunal Departamental de Justicia (TDJ) de La Paz, Margot P\u00e9rez, quien explic\u00f3 que la determinaci\u00f3n judicial \u00fanicamente ordena a la Fiscal\u00eda reformular y motivar adecuadamente la medida cautelar.\n\n\u201cLos operadores de justicia que han visto esta acci\u00f3n de libertad han considerado que el Ministerio P\u00fablico debe fundamentar y motivar esa decisi\u00f3n para poder mantener medidas como el mandamiento de aprehensi\u00f3n\u201d, se\u00f1al\u00f3 P\u00e9rez.\n\nLa autoridad precis\u00f3 que la tutela concedida a los dirigentes no implica una suspensi\u00f3n definitiva de las \u00f3rdenes. \u201cLa reformulaci\u00f3n la tiene que hacer el Ministerio P\u00fablico. Entonces, no es una suspensi\u00f3n definitiva porque mediante la acci\u00f3n de libertad no se ha determinado eso. Solamente se ha repuesto el derecho vulnerado a estos dirigentes\u201d, sostuvo.\n\nSeg\u00fan explic\u00f3, una vez que la Fiscal\u00eda cumpla con las observaciones realizadas por el tribunal constitucional, podr\u00e1 volver a solicitar la ejecuci\u00f3n de las medidas. \u201cEn cualquier momento el Ministerio P\u00fablico, cuando cumpla lo que la acci\u00f3n de libertad ha determinado, puede hacerlo directamente\u201d, afirm\u00f3.\n\nLa aclaraci\u00f3n surge despu\u00e9s de que el Tribunal Segundo de Sentencia Anticorrupci\u00f3n y Violencia hacia la Mujer de La Paz concediera la tutela de la acci\u00f3n de libertad presentada por los abogados de Argollo y Salazar, dejando sin efecto de manera temporal los mandamientos de aprehensi\u00f3n que pesaban sobre ambos dirigentes.\n\nDurante los d\u00edas previos, la COB y otros sectores movilizados hab\u00edan condicionado su participaci\u00f3n en un eventual di\u00e1logo con el Gobierno al levantamiento de las \u00f3rdenes de aprehensi\u00f3n y a la otorgaci\u00f3n de garant\u00edas para sus dirigentes.\n\nSin embargo, pese a la suspensi\u00f3n temporal de las \u00f3rdenes y a las garant\u00edas ofrecidas por el Ejecutivo, Argollo decidi\u00f3 no asistir al di\u00e1logo. En un ampliado de la COB, la dirigencia rechaz\u00f3 la convocatoria gubernamental y ratific\u00f3 la continuidad de las medidas de presi\u00f3n y los bloqueos que afectan distintas rutas del pa\u00eds.\n\nLos procesos abiertos contra Argollo y otros dirigentes est\u00e1n relacionados con los hechos de violencia registrados durante las movilizaciones. Entre ellos figuran los disturbios del 18 de mayo en La Paz, jornada en la que se reportaron saqueos a comercios, robos a lustrabotas y vendedores ambulantes, adem\u00e1s de da\u00f1os a las instalaciones del Tribunal Departamental de Justicia.", "dateTimeNews": "2026-06-01T16:45:25+00:00", "dateTimeReceived": "2026-06-01T18:04:51+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/062026/1780331130875.jpg?\u0026cw=1200\u0026ch=630", "position": 11, "riesgo": 0.0, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260601/autoridad-judicial-aclara-que-suspension-orden-aprehension-argollo-no-es-0"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/tdj-de-la-paz-afirma-que-ordenes-de-aprehension-contra-argollo-y-salazar-seguiran-vigentes-si-la-fiscalia-corrige-vulneraciones/"}, {"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/tdj-aclara-que-suspension-de-la-orden-de-aprehension-contra-argollo-no-es-definitiva/"}], "source": "El Deber", "title": "La suspensi\u00f3n de la orden de aprehensi\u00f3n contra Argollo y Salazar solo es temporal", "url": "https://eldeber.com.bo/pais/suspension-orden-aprehension-argollo-salazar-solo-temporal_1780332325"}, {"actor": [], "authors": ["Rodolfo Aliaga"], "body": "en Econom\u00eda y Empresa\n\nEl presidente de la C\u00e1mara Nacional de Industrias (CNI), Gonzalo Morales, advirti\u00f3 este lunes que varias industrias del departamento de La Paz est\u00e1n considerando trasladar sus operaciones a otras regiones del pa\u00eds e incluso al exterior debido a los efectos de los bloqueos que afectan a la econom\u00eda nacional y report\u00f3 p\u00e9rdidas que llegan a $us 2.000 millones.\n\nSeg\u00fan el representante empresarial, algunas industrias analizan la posibilidad de instalarse en departamentos como Cochabamba y Santa Cruz, mientras que otras observan alternativas en pa\u00edses vecinos como Per\u00fa, Paraguay y Chile.\n\n\u201cHay muchas industrias en el departamento de La Paz que ya est\u00e1n pensando en irse a una ciudad donde sea m\u00e1s f\u00e1cil trabajar. Est\u00e1n mirando Cochabamba, Santa Cruz y, lo peor, est\u00e1n mirando Per\u00fa, Paraguay y Chile\u201d, afirm\u00f3 Morales.\n\nMorales particip\u00f3 en el acto de iza de la bandera de La Paz \u201cLos discordes en concordia\u201d, en un espacio que invit\u00f3 a reflexionar sobre la importancia de la unidad, el di\u00e1logo y el compromiso con el desarrollo.\n\nEl presidente de la CNI expres\u00f3 su preocupaci\u00f3n por el impacto que una eventual migraci\u00f3n de empresas tendr\u00eda sobre el empleo y la actividad econ\u00f3mica en el departamento.\n\nVea: CNC pide investigaci\u00f3n por da\u00f1os y vulneraci\u00f3n de derechos\n\nIndustrias\n\n\u201cCuando las industrias y el comercio se vayan de La Paz, eso se va a traducir en una menor cantidad de empleos que tanto necesita el departamento\u201d, sostuvo.\n\nMorales reiter\u00f3 que el sector industrial apuesta por el di\u00e1logo como mecanismo para resolver el conflicto y pidi\u00f3 a las autoridades y sectores movilizados alcanzar acuerdos en el menor tiempo posible.\n\n\u201cNosotros apostamos por el di\u00e1logo. Tiene que haber una soluci\u00f3n a la brevedad posible porque merecemos vivir en paz\u201d, se\u00f1al\u00f3.\n\nAsimismo, manifest\u00f3 su esperanza de que las partes involucradas logren consensos que permitan superar la crisis. \u201cPido a Dios para que se encuentre un consenso y esperemos que el Creador ilumine a las personas involucradas en las decisiones\u201d, agreg\u00f3.\n\nRespecto al impacto econ\u00f3mico de las medidas de presi\u00f3n, Morales indic\u00f3 que las p\u00e9rdidas acumuladas tras 32 d\u00edas de bloqueos ya bordean los 2.000 millones de d\u00f3lares.\n\n\u201cLas p\u00e9rdidas por los 32 d\u00edas de bloqueos ya est\u00e1n llegando a los 2.000 millones de d\u00f3lares. Es una p\u00e9rdida muy significativa para nuestro pa\u00eds\u201d, afirm\u00f3.\n\nEl sector industrial reiter\u00f3 en diversas oportunidades su preocupaci\u00f3n por las consecuencias de los bloqueos sobre la producci\u00f3n, la log\u00edstica, el abastecimiento y la generaci\u00f3n de empleo en Bolivia.", "dateTimeNews": "2026-06-01T16:11:47+00:00", "dateTimeReceived": "2026-06-01T16:50:43+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/06/cni.webp", "position": 12, "riesgo": 0.0, "similar": [{"source": "Sumando Voces", "url": "https://sumandovoces.com.bo/bloqueos-cni-alerta-que-muchas-empresas-piensan-en-irse-de-la-paz-a-donde-sea-mas-facil-trabajar/"}], "source": "La Raz\u00f3n", "title": "CNI se\u00f1ala que industrias eval\u00faan dejar La Paz y reporta p\u00e9rdidas que llegan a $us 2.000 MM", "url": "https://larazon.bo/economia-y-empresa/2026/06/01/cni-senala-que-industrias-evaluan-dejar-la-paz-y-reporta-perdidas-que-llegan-a-us-2-000-mm/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "El candidato de ultraderecha Abelardo de la Espriella, del movimiento Defensores de la Patria, y el izquierdista Iv\u00e1n Cepeda, del Pacto Hist\u00f3rico, se medir\u00e1n en una segunda vuelta la Presidencia de Colombia el pr\u00f3ximo 21 de junio. Ambos fueron los m\u00e1s votados en las elecciones celebradas este domingo.\n\nCon el 98.7% escrutado, De la Espriella sorprendi\u00f3 al obtener 43.73% (10.236.946 votos). Entretanto, Cepeda qued\u00f3 segundo con el 40.91% (9.577.812 votos).\n\nEstas cifras los hacen inalcanzables para el resto de candidatos. Sin embargo, ninguno obtuvo la mitad m\u00e1s uno de los votos v\u00e1lidos, por lo que deber\u00e1n ir a segunda vuelta.\n\nSeg\u00fan reportes de medios locales, ya se esperaba que Cepeda avanzara a la segunda vuelta como el \u00fanico candidato de izquierda, impulsado por el ferviente apoyo de la base del actual presidente, Gustavo Petro.\n\nElegido para suceder a Petro en el liderazgo del partido Pacto Hist\u00f3rico por Colombia, el candidato promete dar continuidad a las reformas a favor de los trabajadores impulsadas por el presidente, as\u00ed como proseguir con las negociaciones de paz con los grupos insurgentes armados.\n\nSin embargo, pocos predijeron que obtendr\u00eda menos votos que De la Espriella, quien adopt\u00f3 el apodo de \u201cEl Tigre\u201d y se present\u00f3 como un candidato antisistema que erradicar\u00eda la corrupci\u00f3n gubernamental.\n\nEl abogado penalista llev\u00f3 a cabo una campa\u00f1a en la que promet\u00eda \u201cley y orden\u201d, tomando como modelo al l\u00edder salvadore\u00f1o Nayib Bukele al prometer la construcci\u00f3n de \u201cmegac\u00e1rceles\u201d para encarcelar a los criminales.\n\nSe ha declarado un estrecho aliado de la Casa Blanca y ha prometido recortar el gasto p\u00fablico e invertir en la extracci\u00f3n de petr\u00f3leo mediante la t\u00e9cnica del \u201cfracking\u201d.\n\nDe la Espriella, quien nunca antes ha ocupado un cargo p\u00fablico, tambi\u00e9n promete romper las conversaciones de paz con los grupos armados y lanzar una ofensiva total contra los rebeldes.\n\nEl abogado derrot\u00f3 contundentemente a su oponente, Paloma Valencia, quien era vista como la candidata de la derecha y contaba con el respaldo del expresidente \u00c1lvaro Uribe. La actual Senadora no logr\u00f3 alcanzar el 7% de los votos.", "dateTimeNews": "2026-06-01T16:02:29+00:00", "dateTimeReceived": "2026-06-01T16:50:42+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/candiatos_segunda_vuelta_colombia.png", "position": 13, "riesgo": 0.0, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/global/colombia-de-la-espriella-e-ivan-cepeda-van-a-segunda-vuelta/"}], "source": "Ox\u00edgeno", "title": "Colombia: Abelardo de la Espriella e Iv\u00e1n Cepeda pasan a la segunda vuelta", "url": "https://oxigeno.bo/colombia-abelardo-de-la-espriella-e-ivan-cepeda-pasan-a-la-segunda-vuelta/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "El diputado de la Alianza Unidad, Carlos Alarc\u00f3n, propuso este lunes que en los pr\u00f3ximos tres meses pueda realizarse un refer\u00e9ndum revocatorio extraordinario para el presidente del Estado, Rodrigo Paz, el vicepresidente Edmand Lara y legisladores.\n\nEl fin de semana, la Central Obrera Boliviana (COB), adem\u00e1s de otros sectores como los campesinos de La Paz, descartaron cualquier posibilidad de dialogar con el Gobierno y ratificaron que su \u00fanico pedido es la renuncia del presidente Rodrigo Paz.\n\nAlarc\u00f3n, en ese sentido, afirm\u00f3 que el pa\u00eds est\u00e1 al borde de una escalada desenfrenada de violencia y por eso propuso que la Asamblea Legislativa apruebe una Ley interpretativa de la Constituci\u00f3n que permita convocar a un refer\u00e9ndum revocatorio extraordinario en un plazo de tres meses.\n\nSeg\u00fan reporte de Erbol, Alarc\u00f3n explic\u00f3 que el refer\u00e9ndum podr\u00eda realizarse en los pr\u00f3ximos 3 meses y si la mayor arte de la poblaci\u00f3n apoya el revocatorio podr\u00eda haber nuevas elecciones hasta fin de a\u00f1o, caso contrario, las actuales autoridades podr\u00e1n quedarse en sus cargos hasta el 2030.\n\nSeg\u00fan Alarc\u00f3n, la ley interpretativa tendr\u00eda car\u00e1cter excepcional y servir\u00eda para habilitar mecanismos de soluci\u00f3n en situaciones extremas que comprometan la vigencia del orden constitucional y democr\u00e1tico o que puedan desembocar en enfrentamientos entre bolivianos.\n\nAlarc\u00f3n advirti\u00f3 que no se debe permitir que la violencia \u201cdeponga y derroque gobiernos\u201d, incluso si esta se presenta bajo la figura de elecciones anticipadas, porque ello pondr\u00eda en riesgo la existencia del Estado y el orden constitucional.\n\nEn esa misma l\u00ednea, el expresidente del Senado, Andr\u00f3nico Rodr\u00edguez, tambi\u00e9n propuso adelantar el refer\u00e9ndum revocatorio para dar una \u201csalida democr\u00e1tica\u201d a la crisis que atraviesa el pa\u00eds y ante la \u201cinsensibilidad\u201d del Gobierno.\n\n\u201cFrente a la insensibilidad del gobierno, planteamos: Viendo todas las formas legales, adelantar el refer\u00e9ndum revocatorio como mecanismo legal, para una salida democr\u00e1tica. Con el fin de evitar mayor escalada de violencia y profundizar la crisis econ\u00f3mica m\u00e1s que importante, es urgente en caminar soluciones inmediatas por la v\u00eda democr\u00e1tica\u201d (sic), se\u00f1al\u00f3.\n\n// Ox\u00edgeno con informaci\u00f3n de Erbol", "dateTimeNews": "2026-06-01T16:01:49+00:00", "dateTimeReceived": "2026-06-01T19:51:04+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/paz_presidente7.jpeg", "position": 14, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/alarcon-plantea-un-referendum-revocatorio-extraordinario-como-salida-a-la-crisis/"}, {"source": "El Deber", "url": "https://eldeber.com.bo/pais/diputado-alarcon-propone-referendum-revocatorio-extraordinario-presidente-vicepresidente-asambleistas_1780328571"}, {"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/andronico-plantea-adelantar-un-referendum-revocatorio-para-frenar-la-crisis-y-evitar-violencia/"}], "source": "Ox\u00edgeno", "title": "Diputado propone refer\u00e9ndum revocatorio extraordinario para el presidente, vicepresidente y legisladores", "url": "https://oxigeno.bo/diputado-propone-referendum-revocatorio-extraordinario-para-el-presidente-vicepresidente-y-legisladores/"}, {"actor": [], "authors": ["Yenny Escalante"], "body": "La Paz. Foto: AMUN\n\nLa C\u00e1mara Nacional de Industrias (CNI) advirti\u00f3 este lunes que numerosas empresas asentadas en La Paz y El Alto eval\u00faan trasladar sus operaciones a otras regiones del pa\u00eds e incluso al exterior, debido a las dificultades generadas por los bloqueos que afectan al departamento.\n\nEl presidente de la CNI, Gonzalo Morales, expres\u00f3 su preocupaci\u00f3n por el impacto de las medidas de presi\u00f3n en la actividad productiva y se\u00f1al\u00f3 que varias industrias ya enfrentan problemas de abastecimiento de materias primas.\n\n\u201cLastimosamente hay muchas industrias en el departamento de La Paz, tanto en La Paz como en El Alto, que ya est\u00e1n pensando en irse a una ciudad donde todo sea m\u00e1s f\u00e1cil trabajar. Est\u00e1n mirando Cochabamba, est\u00e1n mirando Santa Cruz y, lo peor, est\u00e1n mirando Per\u00fa y Paraguay\u201d, afirm\u00f3.\n\nSeg\u00fan Morales, la eventual salida de empresas tendr\u00eda consecuencias directas sobre las fuentes laborales y la econom\u00eda regional. \u201cCuando las industrias, cuando el comercio se vaya de La Paz, eso se va a traducir en una menor cantidad de trabajadores o de empleos\u201d, sostuvo.\n\nEl dirigente empresarial indic\u00f3 que aproximadamente 200 empresas presentan dificultades para acceder a materias primas, situaci\u00f3n que podr\u00eda derivar en desabastecimiento de alimentos y medicamentos no solo en La Paz, sino tambi\u00e9n en el resto del pa\u00eds.\n\nMorales afirm\u00f3 que industrias medianas, peque\u00f1as y grandes ya est\u00e1n cerrando operaciones de manera temporal, especialmente aquellas vinculadas a la producci\u00f3n de alimentos y medicamentos.\n\n\u201cLa Paz necesita una pausa, tiene que haber un corredor humanitario, tienen que liberar las carreteras, tienen que entrar los camiones de transporte, el ox\u00edgeno que tanto necesita La Paz\u201d, manifest\u00f3.\n\nEl presidente de la CNI tambi\u00e9n exhort\u00f3 al Gobierno y a los sectores movilizados a instalar un di\u00e1logo que permita resolver el conflicto de forma pac\u00edfica y restablecer la normalidad.\n\nDe acuerdo con Morales, las p\u00e9rdidas econ\u00f3micas acumuladas tras 32 d\u00edas de bloqueos se aproximan a los 2.000 millones de d\u00f3lares. \u201cEs una p\u00e9rdida muy, pero muy significativa para nuestro pa\u00eds\u201d, afirm\u00f3.", "dateTimeNews": "2026-06-01T15:52:27+00:00", "dateTimeReceived": "2026-06-01T18:36:51+00:00", "pic": "https://sumandovoces.com.bo/wp-content/uploads/2026/06/AMUN-La-Paz.jpg", "position": 15, "riesgo": 0.0, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/economia/20260601/bloqueos-cni-alerta-que-muchas-empresas-piensan-irse-paz-donde-sea-mas"}], "source": "Sumando Voces", "title": "Bloqueos: CNI alerta que muchas empresas piensan en irse de La Paz a donde sea m\u00e1s f\u00e1cil trabajar -", "url": "https://sumandovoces.com.bo/bloqueos-cni-alerta-que-muchas-empresas-piensan-en-irse-de-la-paz-a-donde-sea-mas-facil-trabajar/"}, {"actor": [], "authors": ["Diego Seas"], "body": "El ministro de Desarrollo Productivo, Rural y Agua, \u00d3scar Mario Justiniano, confirm\u00f3 que este lunes se reunir\u00e1 con 38 sectores y federaciones movilizados del norte de La Paz, a fin de garantizar el abastecimiento de alimentos, combustibles y escuchar sus demandas.\n\n\u201cEsta reuni\u00f3n se inicia en minutos m\u00e1s. Estamos a la espera que ingresen todos nuestros hermanos del norte de La Paz\u201d, afirm\u00f3 Justiniano en conferencia de prensa desde Casa Grande del Pueblo.\n\nLa autoridad afirm\u00f3 que a lo largo de este tiempo se tendr\u00e1 la suficiente capacidad para generar el abastecimiento de alimentos y avanzar en la necesidad de los movilizados a fin de darles respuestas.\n\nSobre el pedido de la Iglesia Cat\u00f3lica de abrirse al di\u00e1logo, a pesar de la negativa de la Central Obrera Boliviana (COB) y la Federaci\u00f3n T\u00fapac Katari, Justiniano respondi\u00f3 que ser\u00e1 el presidente Rodrigo Paz Pereira quien se pronuncie desde Cochabamba.\n\nConfirma di\u00e1logo en San Juli\u00e1n\n\nEl ministro de Desarrollo Productivo inform\u00f3 que esta noche, a las 19:00, participar\u00e1 del di\u00e1logo con los sectores sociales del municipio de San Juli\u00e1n. La convocatoria est\u00e1 fijada en instalaciones de Emapa, en Cuatro Ca\u00f1adas, del que asegur\u00f3 tambi\u00e9n estar\u00e1 presente el gobernador de Santa Cruz, Juan Pablo Velasco.\n\nRecord\u00f3 que desde el Gobierno nacional y de la Gobernaci\u00f3n cruce\u00f1a existe la factibilidad para atender las demandas leg\u00edtimas de las autoridades y sectores sociales de San Juli\u00e1n como el pedido de una carretera que ser\u00e1 en beneficio de peque\u00f1os productores.\n\n\u201cEsta noche estaremos all\u00e1 (San Juli\u00e1n) con distintos ministros y con el gobernador de Santa Cruz quien ha sido una parte neur\u00e1lgica para levantar el bloqueo de San Juli\u00e1n lo cual habilita por carretera el abastecimiento permanente en la ciudad de La Paz, el norte de La Paz y El Alto\u201d, asever\u00f3.", "dateTimeNews": "2026-06-01T15:43:02+00:00", "dateTimeReceived": "2026-06-01T16:50:26+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/062026/1780328473386.jpg?\u0026cw=1200\u0026ch=630", "position": 16, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/economia-y-empresa/2026/06/01/el-gobierno-confirma-dialogo-con-38-organizaciones-de-san-julian/"}], "source": "El Deber", "title": "Ministro Justiniano confirma reuni\u00f3n con 38 sectores de La Paz para garantizar abastecimiento", "url": "https://eldeber.com.bo/pais/ministro-justiniano-confirma-reunion-38-sectores-paz-garantizar-abastecimiento_1780328582"}, {"actor": [], "authors": ["El Deber"], "body": "En un extenso texto de \u201creflexi\u00f3n personal\u201d publicado en redes sociales, el diputado de Unidad y abogado constitucionalista, Carlos Alarc\u00f3n, plante\u00f3 este lunes la realizaci\u00f3n de un \u201crefer\u00e9ndum revocatorio extraordinario\u201d como una salida a la crisis que enfrenta Bolivia en medio de un bloqueo indefinido de carreteras.\n\nParte de Bolivia se encuentra en el d\u00eda 32 de un conflicto liderado por la Central Obrera Boliviana y organizaciones campesinas, que pas\u00f3 de pedir atenci\u00f3n a demandas sectoriales, a exigir solo la renuncia del presidente Rodrigo Paz.\n\nEn los \u00faltimos d\u00edas hubo varios intentos para establecer una mesa de di\u00e1logo, los movilizados pusieron como una de las condiciones la eliminaci\u00f3n de los mandamientos de aprehensi\u00f3n emitidos contra los l\u00edderes de las protestas, la Justicia anul\u00f3 dichas disposiciones, pero siguen los bloqueos.\n\n\u201cDespu\u00e9s de tantos d\u00edas estamos en un callej\u00f3n sin salida por los bloqueos indefinidos (\u2026) y no parece tener fin sin que lleguemos al desastre de una violencia generalizada, que los ciudadanos v\u00edctimas de esta violencia no la buscamos ni la queremos, pero tampoco la podemos tolerar indefinidamente\u201d, dijo Alarc\u00f3n.\n\nEn ese sentido, el legislador propuso como una soluci\u00f3n \u201cque la autoridad que ha sido colocada por el voto s\u00f3lo sea removida de su cargo por voto (esencia de la democracia para no entrar en el caos y la anarqu\u00eda de la violencia)\u201d.\n\nSugiri\u00f3 que, \u201ccon una ley interpretativa de la Constituci\u00f3n, como lo permite la ley org\u00e1nica del TCP (Tribunal Constitucional Plurinacional), por dos tercios de votos, la ALP (Asamblea Legislativa Plurinacional) convoque a refer\u00e9ndum revocatorio extraordinario para que se realice en tres meses\u201d.\n\nPlante\u00f3 que esta consulta se aplique para el presidente, vicepresidente y para todos los asamble\u00edstas nacionales titulares y suplentes.\n\n\u201cComo regula la Ley del R\u00e9gimen Electoral, si gana por mayor\u00eda de votos el NO a la revocatoria, el Ejecutivo y la Asamblea concluyen su mandato el 2030; si gana el s\u00ed a la revocatoria, se convocan inmediatamente a elecciones generales, que se realizar\u00edan en los pr\u00f3ximos cinco meses, que es el tiempo que necesita el TSE (Tribunal Supremo Electoral) para la primera y segunda vuelta\u201d, afirm\u00f3.\n\nSe\u00f1al\u00f3 que \u201cla ley interpretativa habilitar\u00eda esta opci\u00f3n extraordinaria de revocatorio para casos extremos como soluci\u00f3n a conflictos, que comprometen la vigencia del orden constitucional y democr\u00e1tico del pa\u00eds, o evitar\u00eda un enfrentamiento o fratricida entre bolivianos\u201d.\n\n\u201cNo podemos permitir que la violencia deponga y derroque gobiernos, aunque se disfrace de elecciones anticipadas, porque esto comprometer\u00eda la misma existencia del Estado, y ni que se diga de la destrucci\u00f3n del orden constitucional y democr\u00e1tico del pa\u00eds (\u2026). La autoridad investida por el voto s\u00f3lo por el voto deber\u00eda ser revocada\u201d, sostuvo.", "dateTimeNews": "2026-06-01T15:42:51+00:00", "dateTimeReceived": "2026-06-01T18:04:54+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/062026/1780328527485.jpeg?\u0026cw=1200\u0026ch=630", "position": 17, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/alarcon-plantea-un-referendum-revocatorio-extraordinario-como-salida-a-la-crisis/"}, {"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260601/diputado-alarcon-propone-referendum-revocatorio-extraordinario-presidente"}], "source": "El Deber", "title": "Diputado Alarc\u00f3n propone un \u201crefer\u00e9ndum revocatorio extraordinario\u201d para presidente, vicepresidente y asamble\u00edstas", "url": "https://eldeber.com.bo/pais/diputado-alarcon-propone-referendum-revocatorio-extraordinario-presidente-vicepresidente-asambleistas_1780328571"}, {"actor": [], "authors": ["Redaccion El Mundo"], "body": "PROTESTAS. Tras un ampliado efectuado la jornada de ayer, la entidad matriz descart\u00f3 asistir a la mesa de di\u00e1logo impulsada por la Iglesia Cat\u00f3lica y otras instancias para acercar al sector con las autoridades de Gobierno. Bolivia cumple un mes de bloqueos.\n\nFinalmente, el ampliado de la Central Obrera Boliviana (COB) determin\u00f3 la jornada de ayer continuar con las medidas de presi\u00f3n en las carreteras en contra del Gobierno del presidente Rodrigo Paz.\n\nEn ese marco, la entidad matriz descart\u00f3 asistir a la mesa de di\u00e1logo impulsada por la Iglesia Cat\u00f3lica y otras instancias para acercar al sector con las autoridades de Gobierno, inform\u00f3 el dirigente del Magisterio de La Paz, Jos\u00e9 Luis \u00c1lvarez.\n\n\u201cLos trabajadores van a continuar con la medida de presi\u00f3n (\u2026) se ha decidido mantener las medidas de presi\u00f3n. Hasta ahora no hay posibilidad, se ha descartado (el di\u00e1logo). Se ha determinado establecer corredores humanitarios\u201d, dijo \u00c1lvarez tras salir del ampliado.\n\nAdem\u00e1s, el dirigente de los maestros dijo que en este encuentro tambi\u00e9n determinaron abrir corredores humanitarios; sin embargo, \u00c1lvarez no mencion\u00f3 la fecha en la cual se permitir\u00e1 el paso de camiones con productos.\n\n\u201cNo hay posibilidad de esa respuesta al di\u00e1logo ya que el gobierno solo ha hecho reprimir (\u2026) se ha determinado establecer corredores humanitarios para hacer pasar cargamento de medicinas, oxigeno\u201d, agreg\u00f3 el dirigente.\n\nPor su parte, el dirigente de la Confederaci\u00f3n Sindical \u00danica de Trabajadores Campesinos de Bolivia (Csutcb), Severo Marca, se\u00f1al\u00f3 que en el ampliado tambi\u00e9n pidieron continuar con la demanda de renuncia del presidente Rodrigo Paz.\n\n\u201cEl pedido de ellos es continuar hasta que el se\u00f1or presidente (Rodrigo Paz) se vaya. Lo \u00fanico que se habl\u00f3 es respetar a nuestros hermanos de base. Las bases determinan. El corredor humanitario va a dar v\u00eda libre a emergencias, ambulancias y cisternas que est\u00e1n trasladando ox\u00edgeno\u201d, dijo.\n\nEntre tanto, los sectores afiliados a la Federaci\u00f3n Departamental \u00danica de Trabajadores Campesinos de La Paz T\u00fapac Katari se re\u00fanen este domingo en la ciudad de El Alto, cuando se cumple un mes de las protestas contra el Gobierno de Rodrigo Paz.\n\n\u201cSON HORAS DECISIVAS\u201d\n\nDespu\u00e9s del ampliado de la COB, la Iglesia Cat\u00f3lica asegur\u00f3 que insistir\u00e1 con el di\u00e1logo ante las protestas que este fin de semana cumplieron un mes en el pa\u00eds. \u201cCreemos que estas horas son decisivas para que, de verdad, se pueda entablar este espacio de di\u00e1logo para poder pacificar el pa\u00eds\u201d, sostuvo el presidente de la Confederaci\u00f3n Episcopal de Bolivia (CEB), Giovanni Arana.\n\nPor su lado, Arana a\u00f1adi\u00f3 que para la Iglesia \u201cla \u00fanica salida es el di\u00e1logo\u201d. \u201cUn llamado nuevamente a las organizaciones sociales para que puedan recapacitar y puedan establecerse este espacio en el que seguramente se podr\u00e1n encontrar soluciones\u201d, sostuvo.\n\nPese a ello, Arana remarc\u00f3 que Iglesia no escatimar\u00e1 esfuerzos, por lo que incluso estuvo en conversaciones con varios sectores. Arana insisti\u00f3 en que no van a escatimar esfuerzos en estas horas, que -insisti\u00f3- \u201cson vitales para que se pueda entablar el di\u00e1logo\u201d.\n\nAgencias", "dateTimeNews": "2026-06-01T15:38:22+00:00", "dateTimeReceived": "2026-06-01T19:50:53+00:00", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/06/1-4-21.27.52.webp", "position": 18, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/05/31/iglesia-catolica-insistira-en-el-dialogo-pese-a-decision-de-la-cob/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/la-cob-descarta-ir-al-dialogo-exige-la-renuncia-de-paz-y-elecciones-en-90-dias-pero-habilitaria-corredores-humanitarios/"}], "source": "El Mundo", "title": "COB descarta ir a di\u00e1logo y la iglesia insiste en acudir a las mesas", "url": "https://elmundo.com.bo/cob-descarta-ir-a-dialogo-y-la-iglesia-insiste-en-acudir-a-las-mesas/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "Mediante un comunicado, la C\u00e1mara Nacional de Comercio (CNC) rechaz\u00f3 la continuidad de los bloqueos impulsados por sectores sociales, a la cabeza de la Central Obrera Boliviana (COB), y exigi\u00f3 al Gobierno nacional garantizar la libre transitabilidad en el pa\u00eds.\n\n\u201cLa C\u00e1mara Nacional de Comercio expresa su m\u00e1s en\u00e9rgico rechazo a la decisi\u00f3n de mantener los bloqueos y descartar soluciones efectivas de di\u00e1logo, profundizando una crisis que hoy afecta gravemente a millones de bolivianos\u201d, se\u00f1ala el comunicado.\n\nLa entidad considera que la interrupci\u00f3n del ingreso de alimentos, medicamentos y combustibles, as\u00ed como los hechos de violencia registrados durante las manifestaciones, representan una amenaza directa para la estabilidad econ\u00f3mica, la seguridad ciudadana y la paz social.\n\nAdem\u00e1s, lament\u00f3 que La Paz se encuentre en una situaci\u00f3n cr\u00edtica a causa de estos conflictos sociales, por lo que exigi\u00f3 a las autoridades nacionales garantizar la transitabilidad, proteger a la poblaci\u00f3n y resguardar el orden p\u00fablico.\n\nTambi\u00e9n pidi\u00f3 al Ministerio P\u00fablico y a las instancias correspondientes investigar y establecer responsabilidades legales por las acciones que ocasionaron perjuicios a la econom\u00eda nacional y vulneraron derechos fundamentales de los ciudadanos.\n\nEntretanto, este domingo se cumplen 31 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante la Central Obrera Boliviana (COB), los campesinos de La Paz, desde hace algunos d\u00edas, los seguidores de Evo Morales exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de gobierno y El Alto.", "dateTimeNews": "2026-06-01T15:33:14+00:00", "dateTimeReceived": "2026-06-01T16:50:44+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/bloqueo_lapaz_elalto.png", "position": 19, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/economia/camara-nacional-comercio-exige-restablecer-libre-transito-dice-bolivia-no-puede-seguir-paralizada_1780326354"}], "source": "Ox\u00edgeno", "title": "C\u00e1mara de Comercio rechaza la continuidad de los bloqueos y exige al Gobierno garantizar la transitabilidad", "url": "https://oxigeno.bo/camara-de-comercio-rechaza-la-continuidad-de-los-bloqueos-y-exige-al-gobierno-garantizar-la-transitabilidad/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "La presidenta del Tribunal Departamental de Justicia (TDJ) de La Paz, Margot P\u00e9rez, afirm\u00f3 este lunes que las \u00f3rdenes de aprehensi\u00f3n contra Mario Argollo, secretario ejecutivo de la Central Obrera Boliviana (COB), y Vicente Salazar, secretario general de la Federaci\u00f3n Departamental \u00danica de Trabajadores Campesinos de La Paz \u2018T\u00fapac Katari\u2019, pueden mantenerse vigentes si el Ministerio P\u00fablico corrige las \u201cvulneraciones a sus derechos\u201d que fueron identificadas en la Acci\u00f3n de Libertad que presentaron la pasada semana.\n\n\u201cPara poder mantener las medidas como es el mandamiento de aprehensi\u00f3n (\u2026) a reformulaci\u00f3n la tiene que hacer el Ministerio P\u00fablico\u201d, afirm\u00f3 P\u00e9rez, seg\u00fan un video compartido por Cadena A.\n\nLa Presidenta del TDJ especific\u00f3 que en la audiencia por la Acci\u00f3n de Libertad la autoridad jurisdiccional se\u00f1al\u00f3 que se vulneraron algunos de los derechos de los dirigentes sociales, pero la anulaci\u00f3n de las \u00f3rdenes de aprehensi\u00f3n no es definitiva y pueden volver a estar vigentes \u201ccuando el Ministerio P\u00fablico cumpla lo que la Acci\u00f3n de Libertad ha determinado\u201d.\n\nArgollo y Salazar fueron denunciados por los delitos de instigaci\u00f3n p\u00fablica a delinquir y terrorismo por el Ministerio de Gobierno. En ese sentido, la Fiscal\u00eda emiti\u00f3 las \u00f3rdenes de aprehensi\u00f3n en su contra.\n\nNo obstante, la medida fue anulada el viernes, despu\u00e9s de que la COB y los campesinos de La Paz lo pusieran como una de las condiciones para entablar el di\u00e1logo, aunque finalmente no cumplieron con ese compromiso.\n\nEntretanto, este lunes se cumplen 32 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante distintos sectores, a la cabeza de la Central Obrera Boliviana (COB), exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de Gobierno y El Alto.", "dateTimeNews": "2026-06-01T15:31:51+00:00", "dateTimeReceived": "2026-06-01T18:36:50+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/argollo_salazar.png", "position": 20, "riesgo": 0.0, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260601/autoridad-judicial-aclara-que-suspension-orden-aprehension-argollo-no-es-0"}, {"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/tdj-aclara-que-suspension-de-la-orden-de-aprehension-contra-argollo-no-es-definitiva/"}, {"source": "El Deber", "url": "https://eldeber.com.bo/pais/suspension-orden-aprehension-argollo-salazar-solo-temporal_1780332325"}], "source": "Ox\u00edgeno", "title": "TDJ de La Paz afirma que \u00f3rdenes de aprehensi\u00f3n contra Argollo y Salazar seguir\u00e1n vigentes si la Fiscal\u00eda corrige \u201cvulneraciones\u201d", "url": "https://oxigeno.bo/tdj-de-la-paz-afirma-que-ordenes-de-aprehension-contra-argollo-y-salazar-seguiran-vigentes-si-la-fiscalia-corrige-vulneraciones/"}, {"actor": [], "authors": ["Diego Seas"], "body": "El expresidente Eduardo Rodr\u00edguez Veltz\u00e9 pidi\u00f3 recuperar la convivencia democr\u00e1tica ante los bloqueos que persisten en el pa\u00eds y a la fecha suman 91 cortes de ruta en seis de los nueves departamentos.\n\n\u201cHoy es urgente recuperar la convivencia democr\u00e1tica, suspender los bloqueos, restablecer el di\u00e1logo y rechazar actitudes que solo multiplican los da\u00f1os a la poblaci\u00f3n\u201d, afirm\u00f3 Veltz\u00e9 a trav\u00e9s de sus redes sociales.\n\nEn el mismo pronunciamiento en X, el exmandatario consider\u00f3 que de continuar estas movilizaciones y los da\u00f1os en la ciudadan\u00eda se dar\u00e1 \u201cpaso a mayor violencia\u201d.\n\nDesde hace cuatro semanas, vale decir el 1 de mayo, la Central Obrera Boliviana (COB) decret\u00f3 un paro general indefinido y d\u00edas despu\u00e9s los campesinos de La Paz empezaron con un bloqueo indefinido de carreteras, que se fue extendiendo a otras regiones.\n\nLas organizaciones movilizadas en un principio ped\u00edan la atenci\u00f3n a determinadas demandas sectoriales, pero ahora solo exigen la renuncia de Paz.\n\nRodr\u00edguez Veltz\u00e9 record\u00f3 que en 2009, \u201cel 61% de los bolivianos aprob\u00f3 la Constituci\u00f3n para una Bolivia democr\u00e1tica, plural y pacifista, basada en el respeto y la igualdad, con gobiernos electos y renovados por voto libre y secreto\u201d.\n\nSeg\u00fan el mapa de transitabilidad de la Administradora Boliviana de Carreteras (ABC), actualizado hasta las 06:39 de este lunes, junio empez\u00f3 con 91 bloqueos.\n\nEstos cortes se distribuyen de la siguiente manera: La Paz presenta 20 bloqueos; Potos\u00ed, 15; Oruro, 12; Chuquisaca, 10; y Santa Cruz, 4. Mientras que Pando, Beni y Tarija siguen sin bloqueos.", "dateTimeNews": "2026-06-01T15:10:26+00:00", "dateTimeReceived": "2026-06-01T16:18:01+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/062026/1780325254320.jpg?\u0026cw=1200\u0026ch=630", "position": 21, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/rodriguez-veltze-pide-suspender-los-bloqueos-y-recuperar-el-dialogo-para-evitar-violencia/"}], "source": "El Deber", "title": "Veltz\u00e9: \u201cEs urgente recuperar la convivencia democr\u00e1tica, suspender los bloqueos y restablecer el di\u00e1logo\u201d", "url": "https://eldeber.com.bo/pais/veltze-urgente-recuperar-convivencia-democratica-suspender-bloqueos-restablecer-dialogo_1780326626"}, {"actor": [], "authors": ["Ernesto Estremadoiro Flores"], "body": "La C\u00e1mara Nacional de Comercio (CNC) expres\u00f3 este domingo su \"m\u00e1s en\u00e9rgico rechazo\" a la decisi\u00f3n de mantener los bloqueos de carreteras que afectan a distintas regiones del pa\u00eds y advirti\u00f3 que la prolongaci\u00f3n del conflicto est\u00e1 profundizando una crisis que golpea a millones de bolivianos.\n\nA trav\u00e9s de un pronunciamiento institucional, la entidad sostuvo que la interrupci\u00f3n del libre tr\u00e1nsito, las dificultades para el abastecimiento de alimentos, medicamentos y combustibles, as\u00ed como los hechos de violencia registrados en los \u00faltimos d\u00edas, representan una amenaza directa para la estabilidad econ\u00f3mica, la seguridad ciudadana y la paz social.\n\nEl pronunciamiento se produce cuando Bolivia cumple 32 d\u00edas de bloqueos impulsados por sectores sociales afines al expresidente Evo Morales, quienes exigen la renuncia del presidente Rodrigo Paz, que lleva seis meses en el poder. Las medidas de presi\u00f3n han provocado restricciones en el transporte de mercanc\u00edas, dificultades en la provisi\u00f3n de productos b\u00e1sicos y crecientes p\u00e9rdidas para diversos sectores productivos.\n\n\"La Paz se encuentra en una situaci\u00f3n cr\u00edtica\", afirm\u00f3 la CNC al referirse a los problemas de abastecimiento que enfrenta la sede de Gobierno. La organizaci\u00f3n se\u00f1al\u00f3 que el fracaso de los esfuerzos destinados a garantizar corredores de abastecimiento demuestra que la crisis ha alcanzado niveles \"inaceptables\" y requiere una respuesta inmediata de las autoridades.\n\nDurante las \u00faltimas semanas, distintos sectores empresariales han advertido sobre el impacto econ\u00f3mico de los bloqueos. Exportadores, industriales, comerciantes, transportistas y productores agropecuarios reportan millonarias p\u00e9rdidas debido a la paralizaci\u00f3n parcial de actividades, el incumplimiento de contratos y las dificultades para trasladar productos e insumos entre regiones.\n\nEn ese contexto, la C\u00e1mara Nacional de Comercio exigi\u00f3 al Estado cumplir de manera irrestricta su obligaci\u00f3n constitucional de garantizar el libre tr\u00e1nsito, proteger a la poblaci\u00f3n y restablecer el orden en todo el territorio nacional.\n\nAsimismo, la entidad pidi\u00f3 al Ministerio P\u00fablico y a las instancias competentes investigar los hechos ocurridos durante el conflicto y establecer las responsabilidades legales emergentes de acciones que, seg\u00fan se\u00f1ala, han ocasionado graves perjuicios a la econom\u00eda nacional y a los derechos fundamentales de los ciudadanos.\n\n\"Bolivia no puede continuar paralizada\", sostuvo la organizaci\u00f3n empresarial, que tambi\u00e9n remarc\u00f3 que la defensa de la institucionalidad, la legalidad y el bienestar de la poblaci\u00f3n debe estar por encima de cualquier inter\u00e9s sectorial o pol\u00edtico.\n\nEl pronunciamiento de la CNC se suma a otras voces del sector privado que en los \u00faltimos d\u00edas han expresado preocupaci\u00f3n por los efectos de la prolongada conflictividad social, en un escenario marcado por el desabastecimiento de productos esenciales, el incremento de costos log\u00edsticos y la creciente incertidumbre econ\u00f3mica que enfrenta el pa\u00eds.", "dateTimeNews": "2026-06-01T15:05:54+00:00", "dateTimeReceived": "2026-06-01T18:04:55+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/062026/1780326109883/bloqueos-renunca-1-jpg..jpg?\u0026cw=1200\u0026ch=630", "position": 22, "riesgo": 0.0, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/camara-de-comercio-rechaza-la-continuidad-de-los-bloqueos-y-exige-al-gobierno-garantizar-la-transitabilidad/"}], "source": "El Deber", "title": "C\u00e1mara Nacional de Comercio exige restablecer el libre tr\u00e1nsito y advierte que Bolivia no puede seguir paralizada.", "url": "https://eldeber.com.bo/economia/camara-nacional-comercio-exige-restablecer-libre-transito-dice-bolivia-no-puede-seguir-paralizada_1780326354"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nEl diputado de Unidad Carlos Alarc\u00f3n propuso este lunes la realizaci\u00f3n de un refer\u00e9ndum revocatorio extraordinario para el presidente, el vicepresidente y los integrantes de la Asamblea Legislativa, como una alternativa para superar la crisis pol\u00edtica y social que atraviesa el pa\u00eds.\n\nEn sus redes sociales, el legislador afirm\u00f3 que la actual confrontaci\u00f3n entre el Gobierno y los sectores movilizados mantiene a Bolivia en un \u201ccallej\u00f3n sin salida\u201d y advirti\u00f3 que la violencia no puede convertirse en un mecanismo para cambiar autoridades.\n\n\u201cNo podemos permitir que la violencia deponga y derroque gobiernos, aunque se disfrace de elecciones anticipadas\u201d, escribi\u00f3.\n\nAlarc\u00f3n se\u00f1al\u00f3 que la salida al conflicto debe respetar los mecanismos constitucionales y plante\u00f3 que la Asamblea apruebe una ley interpretativa para convocar a un refer\u00e9ndum revocatorio extraordinario en un plazo de tres meses.\n\nSeg\u00fan su propuesta, la consulta incluir\u00eda al presidente, al vicepresidente y a los asamble
