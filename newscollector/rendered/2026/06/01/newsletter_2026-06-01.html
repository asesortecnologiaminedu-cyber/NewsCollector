esta vez llam\u00f3 la atenci\u00f3n que fuera una cantidad tan grande. Muchos incluso solo ten\u00edan el carnet digital, lo cual puede ser sujeto a alteraciones.\n\nClausura del establecimiento\n\nAnte este panorama, el personal del Municipio procedi\u00f3 a la clausura del lugar. La sanci\u00f3n fue aplicada por expendio y comercializaci\u00f3n de bebidas alcoh\u00f3licas a menores de edad y durar\u00e1 10 d\u00edas.\n\nRecomendaciones para los padres\n\nColque recomend\u00f3 a los padres tener mayor control sobre sus hijos cuando salen, asegur\u00e1ndose de a d\u00f3nde van y recogi\u00e9ndolos siempre, aunque est\u00e9n pr\u00f3ximos a cumplir la mayor\u00eda de edad.\n\nAdem\u00e1s, anunci\u00f3 que se reforzar\u00e1n programas de prevenci\u00f3n en unidades educativas para recomendar a los estudiantes no acudir a lugares donde se venden y consumen bebidas alcoh\u00f3licas.", "dateTimeNews": "2026-06-01T01:54:48+00:00", "dateTimeReceived": "2026-06-01T12:50:28+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a1ce105beb1e.jpg", "position": 44, "riesgo": 0.0, "similar": [{"source": "Eju.tv", "url": "https://eju.tv/2026/06/operativo-en-una-discoteca-de-oruro-detecta-40-adolescentes/"}], "source": "La Patria", "title": "Operativo en discoteca de Oruro detecta 40 adolescentes - La Patria 3.0", "url": "https://lapatria.bo/actualidad/operativo-en-discoteca-de-oruro-detecta-40-adolescentes/"}, {"actor": [], "authors": ["Shirley Iba\u00f1ez"], "body": "en Nacional\n\nLa Iglesia Cat\u00f3lica insistir\u00e1 en el di\u00e1logo pese a la decisi\u00f3n que asumi\u00f3 el ampliado de la Central Obrera Boliviana (COB), anunci\u00f3 este domingo el secretario general de la Conferencia Episcopal de Bolivia (CEB), Giovani Arana.\n\n\u201cCreemos que estas horas son decisivas para que, de verdad, se pueda entablar este espacio de di\u00e1logo para poder pacificar el pa\u00eds\u201d, dijo.\n\nAsimismo, asegur\u00f3 que el di\u00e1logo es la \u00fanica salida a la crisis, por lo que remarc\u00f3 su confianza en poder lograr un acercamiento entre el Gobierno y los movilizados.\n\n\u201cUn llamado nuevamente a las organizaciones sociales para que puedan recapacitar y puedan establecerse este espacio en el que seguramente se podr\u00e1n encontrar soluciones\u201d, sostuvo en Unitel.\n\nLea m\u00e1s: Ampliado de COB rechaza di\u00e1logo, mantiene bloqueos y anuncia corredores humanitarios\n\nEl ampliado de la COB determin\u00f3 ayer continuar con las medidas de presi\u00f3n en las carreteras contra el gobierno de Rodrigo Paz y descart\u00f3 asistir a las mesas de di\u00e1logo convocadas por la Iglesia y la Vicepresidencia.\n\nPese a ello, Arana remarc\u00f3 que Iglesia no escatimar\u00e1 esfuerzos, por lo que incluso estuvo en conversaciones con varios sectores,\n\nLa Iglesia y la Vicepresidencia promueven desde la semana pasada el di\u00e1logo entre movilizados y el Gobierno; sin embargo, a las dos anteriores reuniones no acudieron los l\u00edderes de la COB y de los campesinos de la Federaci\u00f3n T\u00fapac Katari, quien pusieron condiciones para presentarse; empero finalmente no aceptaron.", "dateTimeNews": "2026-06-01T01:34:35+00:00", "dateTimeReceived": "2026-06-01T16:32:48+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/monsenor.webp", "position": 45, "riesgo": 0.0, "similar": [{"source": "El Mundo", "url": "https://elmundo.com.bo/cob-descarta-ir-a-dialogo-y-la-iglesia-insiste-en-acudir-a-las-mesas/"}], "source": "La Raz\u00f3n", "title": "Iglesia Cat\u00f3lica insistir\u00e1 en el di\u00e1logo pese a decisi\u00f3n de la COB", "url": "https://larazon.bo/nacional/2026/05/31/iglesia-catolica-insistira-en-el-dialogo-pese-a-decision-de-la-cob/"}, {"actor": [], "authors": ["Yolanda Mamani Cayo"], "body": "El prolongado conflicto pol\u00edtico y social que afecta principalmente al occidente del pa\u00eds no solo responde a factores econ\u00f3micos o pol\u00edticos. Para Human Rights Watch (HRW), la crisis tambi\u00e9n tiene relaci\u00f3n con el debilitamiento de la justicia y, en particular, con las limitaciones que enfrenta el Tribunal Constitucional Plurinacional (TCP), que actualmente funciona de manera incompleta.\n\n\n\nAs\u00ed lo afirm\u00f3 C\u00e9sar Mu\u00f1oz, director para Am\u00e9rica Latina de HRW, tras una visita realizada la pasada semana a Sucre, donde sostuvo reuniones con magistrados del \u00d3rgano Judicial y del TCP, adem\u00e1s del fiscal general del Estado y del defensor del Pueblo, con el prop\u00f3sito de evaluar la situaci\u00f3n institucional del sistema judicial boliviano. \u201cSi yo me opongo a una ley aprobada en la Asamblea porque creo que es inconstitucional, en este momento el Tribunal Constitucional no puede revisar la normativa porque solo tiene cuatro magistrados. Entonces, \u00bfcu\u00e1l es mi opci\u00f3n como ciudadano? La justicia no est\u00e1 funcionando como un \u00e1rbitro y salgo a las calles. Yo creo que en parte el conflicto tambi\u00e9n se debe a que no tenemos este poder fundamental que es la justicia\u201d, sostuvo C\u00e9sar Mu\u00f1oz.\n\n\n\nEl representante de HRW considera urgente que la Asamblea Legislativa complete la elecci\u00f3n de los cinco magistrados que faltan para conformar plenamente el TCP. A su juicio, la ausencia de una instancia constitucional con capacidad de responder a controversias institucionales debilita los canales democr\u00e1ticos para resolver disputas y aumenta la tensi\u00f3n.\n\n\n\nLa preocupaci\u00f3n del organismo surge en momentos en que Bolivia atraviesa una de las crisis m\u00e1s complejas de los \u00faltimos a\u00f1os. Desde principios de mayo, La Paz permanece afectada por bloqueos y movilizaciones que provocaron problemas de abastecimiento de alimentos, combustibles, medicamentos y ox\u00edgeno medicinal.\n\n\n\nPrecisamente sobre las consecuencias humanitarias de este conflicto tambi\u00e9n se pronunci\u00f3 HRW. La directora de la Divisi\u00f3n de las Am\u00e9ricas del organismo, Juanita Goebertus, lament\u00f3 la muerte de un ni\u00f1o de 12 a\u00f1os que no recibi\u00f3 atenci\u00f3n m\u00e9dica oportuna debido a los bloqueos en la ruta entre Llallagua y Potos\u00ed.\n\n\n\nAdem\u00e1s, expres\u00f3 preocupaci\u00f3n por la situaci\u00f3n de los hospitales pace\u00f1os, afectados por la escasez de ox\u00edgeno, medicamentos y alimentos, as\u00ed como por los episodios de violencia registrados durante las protestas.\n\n\n\n\u201cNos preocupa la situaci\u00f3n. Los manifestantes tienen derecho a la protesta pac\u00edfica, pero no es aceptable que algunos recurran a la violencia. Instamos a las autoridades a respetar los est\u00e1ndares internacionales y apoyamos los esfuerzos de di\u00e1logo para alcanzar una soluci\u00f3n pac\u00edfica\u201d, se\u00f1al\u00f3.\n\n\n\nLas observaciones de HRW coinciden con las expresadas por otros organismos internacionales que han seguido de cerca la evoluci\u00f3n de la crisis. Para la organizaci\u00f3n, la situaci\u00f3n demuestra que cuando la justicia pierde capacidad para resolver conflictos dentro de la institucionalidad, aumenta el riesgo de violencia.\n\nONU pide respeto a los derechos humanos de los bloqueadores, pero no dice nada cuando estos usan dinamita\n\nLa oficina de las Naciones Unidas sobre los Derechos Humanos en Am\u00e9rica del Sur, le record\u00f3 al Gobierno de Bolivia que las fuerzas del orden, en este caso la Polic\u00eda en toda actuaci\u00f3n \u201cdebe ajustarse estrictamente al derecho internacional de los derechos humanos\u201d.\n\n\n\nNo obstante, en su comunicado, la ONU no hizo referencia al uso excesivo de petardos y explosivos de dinamita y otras bombas caseras que lanzan los movilizados contra los polic\u00edas y los trabajadores de la prensa en sus marchas de protesta. Tampoco se refiri\u00f3 a las constantes agresiones que sufren los periodistas, camar\u00f3grafos y fot\u00f3grafos por parte de los bloqueadores.\n\n\n\n\u201cTodo uso de la fuerza por los agentes del orden debe ser compatible con los principios de legalidad, necesidad, proporcionalidad, precauci\u00f3n y no discriminaci\u00f3n. Se debe investigar de manera eficaz, imparcial y oportuna toda denuncia o sospecha razonable de uso il\u00edcito de la fuerza u otras violaciones de derechos humanos\u201d, se lee en el comunicado de las Naciones Unidas.", "dateTimeNews": "2026-06-01T00:54:31+00:00", "dateTimeReceived": "2026-06-01T12:56:52+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/052026/1780275216253.jpeg?\u0026cw=1200\u0026ch=630", "position": 46, "riesgo": 0.0, "similar": [{"source": "Eju.tv", "url": "https://eju.tv/2026/06/human-rights-atribuye-gran-parte-de-la-crisis-a-la-desconfianza-en-la-justicia/"}], "source": "El Deber", "title": "Human Rights atribuye gran parte de la crisis a la desconfianza en la justicia", "url": "https://eldeber.com.bo/pais/human-rights-atribuye-gran-parte-crisis-desconfianza-justicia_1780275271"}, {"actor": [], "authors": ["La Patria"], "body": "El Gobierno convoca al di\u00e1logo este 1 de junio en Cuatro Ca\u00f1adas para resolver bloqueos en San Juli\u00e1n tras 18 d\u00edas de conflicto\n\nFicha informativa El Gobierno convoca a un di\u00e1logo el 1 de junio en Cuatro Ca\u00f1adas para resolver bloqueos en San Juli\u00e1n tras 18 d\u00edas de conflicto que afectan la transitabilidad y el abastecimiento en la regi\u00f3n. Toca para ver el contexto completo Contexto: La nueva convocatoria se produce tras el fracaso del di\u00e1logo programado para el 31 de mayo, donde solo asisti\u00f3 el alcalde Johan Bergen Friesen. Comunarios de Madrecita expresaron su molestia por no ser notificados sobre la suspensi\u00f3n del encuentro. Se esperaba una comitiva de alto nivel que inclu\u00eda al Gobernador Juan Pablo Velasco y dos ministros. La carta enviada por el Gobierno solicit\u00f3 la participaci\u00f3n de autoridades municipales y sectores movilizados para asegurar el \u00e9xito del nuevo di\u00e1logo. Los representantes de la Federaci\u00f3n de Comunidades Interculturales no asistieron al encuentro fallido. Por qu\u00e9 importa: El bloqueo ha provocado severas afectaciones en la transitabilidad y abastecimiento productivo en la regi\u00f3n. El Gobierno busca reencauzar las negociaciones para evitar mayores perjuicios econ\u00f3micos por los d\u00edas de carreteras cerradas. Datos clave: Fecha de la nueva convocatoria: 1 de junio de 2026\n\n1 de junio de 2026 Hora del encuentro: 19:00 horas\n\n19:00 horas D\u00edas de bloqueo: 18 d\u00edas\n\n18 d\u00edas Lugar del encuentro: Empresa de Apoyo a la Producci\u00f3n de Alimentos (Emapa), Cuatro Ca\u00f1adas\n\nEmpresa de Apoyo a la Producci\u00f3n de Alimentos (Emapa), Cuatro Ca\u00f1adas Asistencia a la reuni\u00f3n fallida: Alcalde Johan Bergen Friesen\n\nAlcalde Johan Bergen Friesen Hora original de la reuni\u00f3n frustrada: 10:00 horas, 31 de mayo de 2026 IngresarDesbloquear acceso completo\n\nGobierno vuelve a convocar al di\u00e1logo este lunes en San Juli\u00e1n \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nConvocatoria al di\u00e1logo en San Juli\u00e1n\n\nEl Ministerio de Desarrollo Productivo, Rural y Agua emiti\u00f3 una nueva convocatoria formal dirigida a las autoridades municipales y a los sectores movilizados del municipio de San Juli\u00e1n. Este encuentro se program\u00f3 para el lunes 1 de junio a las 19:00 horas, con el objetivo de reinstalar una mesa de di\u00e1logo que busque soluciones definitivas al conflicto en San Juli\u00e1n, que mantiene bloqueada la carretera estrat\u00e9gica hacia esa regi\u00f3n.\n\nDetalles de la reuni\u00f3n\n\nDe acuerdo con la invitaci\u00f3n oficial firmada por el ministro del \u00e1rea, \u00d3scar Mario Justiniano, el encuentro se llevar\u00e1 a cabo en las instalaciones de la Empresa de Apoyo a la Producci\u00f3n de Alimentos (Emapa), ubicadas en el municipio de Cuatro Ca\u00f1adas. Con esta medida, el Gobierno nacional busca reencauzar las negociaciones en el contexto de un bloqueo que ya cumple 18 d\u00edas en la ruta que conecta a los departamentos de Santa Cruz y Beni, provocando severas afectaciones en la transitabilidad y el abastecimiento productivo de la zona.\n\nFracasos anteriores y expectativas\n\nLa nueva convocatoria surge tras el fracaso del intento de di\u00e1logo programado para la ma\u00f1ana del domingo 31 de mayo de 2026. La reuni\u00f3n, pactada originalmente para las 10:00 horas, no pudo instalarse debido a la inasistencia de las partes en conflicto. Al punto de encuentro solo asisti\u00f3 el alcalde de Cuatro Ca\u00f1adas, Johan Bergen Friesen, quien acudi\u00f3 con la intenci\u00f3n de actuar como mediador. Tras esperar por m\u00e1s de una hora sin que se presentaran los representantes del \u00d3rgano Ejecutivo ni los bloqueadores, la autoridad municipal opt\u00f3 por retirarse para dar cumplimiento a su agenda local.\n\nReacciones y cr\u00edticas\n\n\u201cSolicitamos la participaci\u00f3n de las autoridades municipales y de los sectores movilizados\u201d, se\u00f1ala un fragmento de la carta enviada por el Gobierno en las \u00faltimas horas para asegurar el \u00e9xito de la nueva cita. En el lugar tambi\u00e9n se encontraba un grupo de comunarios de la localidad de Madrecita (zona comprendida entre Los Troncos y Okinawa). Sus dirigentes manifestaron su profunda molestia y se retiraron del recinto criticando que no se les notificara con anticipaci\u00f3n sobre la suspensi\u00f3n o postergaci\u00f3n del encuentro dominical.\n\nExpectativas para el lunes\n\nPara la frustrada reuni\u00f3n del fin de semana se ten\u00eda prevista una comitiva de alto nivel que inclu\u00eda al Gobernador de Santa Cruz, Juan Pablo Velasco; la Subgobernadora, Paola Aguirre; y dos ministros de Estado. Sin embargo, los representantes de la Federaci\u00f3n de Comunidades Interculturales, sector que encabeza las medidas de presi\u00f3n y los bloqueos en San Juli\u00e1n, no se trasladaron hasta Cuatro Ca\u00f1adas. Las autoridades esperan que, ante la gravedad del perjuicio econ\u00f3mico por los 18 d\u00edas de carreteras cerradas, todos los actores involucrados asistan a la convocatoria del lunes por la noche para depone las medidas de presi\u00f3n.", "dateTimeNews": "2026-06-01T00:52:14+00:00", "dateTimeReceived": "2026-06-01T12:50:29+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a1cd0a9bc686.jpg", "position": 47, "riesgo": 0.0, "similar": [{"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260531/gobierno-convoca-al-dialogo-este-lunes-intentar-levantar-bloqueos-san"}], "source": "La Patria", "title": "Gobierno vuelve a convocar al di\u00e1logo este lunes en San Juli\u00e1n - La Patria 3.0", "url": "https://lapatria.bo/enfoque-nacional/gobierno-vuelve-a-convocar-al-dialogo-este-lunes-en-san-julian/"}, {"actor": [], "authors": ["La Patria"], "body": "En este escenario deportivo se disputar\u00e1n partidos correspondientes a los grupos \u201cA\u201d y \u201cK\u201d\n\nFicha informativa A 10 d\u00edas del inicio del Mundial 2026, el Estadio Akron en Guadalajara finaliza su transformaci\u00f3n operativa para albergar partidos de los grupos \u2018A\u2019 y \u2018K\u2019. Se han realizado adecuaciones m\u00ednimas y se han implementado nuevas tecnolog\u00edas. Toca para ver el contexto completo Contexto: Ainara Zatarain, directora de operaciones, mencion\u00f3 que trabajan con FIFA en detalles operativos. El estadio fue dise\u00f1ado para albergar partidos mundialistas, por lo que solo se requirieron adecuaciones m\u00ednimas. Se cambi\u00f3 a un c\u00e9sped h\u00edbrido de \u00faltima generaci\u00f3n. Las nuevas zonas de hospitalidad ofrecen experiencias premium y est\u00e1n construidas con materiales locales como piedra \u2018tezontle\u2019, aluminio y madera. Las \u00e1reas estar\u00e1n separadas por estructuras iluminadas para mayor intimidad. Por qu\u00e9 importa: El esquema operativo durante los partidos ser\u00e1 diferente al habitual, con parte del estacionamiento transformado en centros log\u00edsticos. Esto afectar\u00e1 la llegada y el acceso de los aficionados al recinto. Datos clave: Fechas : 11 al 26 de junio\n\n: 11 al 26 de junio Temperaturas : entre 17 y 37 grados Celsius\n\n: entre 17 y 37 grados Celsius Porcentaje de aficionados : m\u00e1s de 80 % utilizar\u00e1 transporte p\u00fablico\n\n: m\u00e1s de 80 % utilizar\u00e1 transporte p\u00fablico A\u00f1os de existencia del estadio: 16 a\u00f1os IngresarDesbloquear acceso completo\n\nEl Estadio Guadalajara listo para albergar el Mundial 2026 \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nTransformaci\u00f3n del Estadio Akron Guadalajara\n\nA solo diez d\u00edas del inicio del Mundial 2026, el Estadio Akron Guadalajara se encuentra en la fase final de su transformaci\u00f3n operativa. Este recinto, que albergar\u00e1 cuatro partidos de los grupos \u201cA\u201d y \u201cK\u201d entre el 11 y el 26 de junio, presenta adecuaciones significativas que mejoran la experiencia de los aficionados.\n\nCambios en el Estadio Akron\n\nLa directora de operaciones, Ainara Zatarain, destac\u00f3 que trabajan en conjunto con FIFA para ajustar los \u00faltimos detalles operativos. Esto incluye la cobertura de marcas comerciales no patrocinadoras de FIFA. \u201cEstamos terminando con todo el tema del \u2018clean set\u2019, tapando marcas, que eso es muy importante para FIFA\u201d, afirm\u00f3 Zatarain.\n\nEl Estadio Akron, con diecis\u00e9is a\u00f1os de existencia, fue dise\u00f1ado para albergar partidos mundialistas. Por lo tanto, solo fueron necesarias adecuaciones m\u00ednimas que tomaron cerca de un a\u00f1o. Uno de los cambios m\u00e1s importantes fue la instalaci\u00f3n de un c\u00e9sped h\u00edbrido de \u00faltima generaci\u00f3n.\n\nHospitalidad en el Estadio Akron\n\nLas nuevas zonas de hospitalidad son un atractivo adicional. Estas \u00e1reas ofrecen una experiencia \u00fanica con salas de descanso, pantallas especiales y servicios premium. Zatarain explic\u00f3 que estas zonas se construyeron con materiales locales como piedra \u2018tezontle\u2019, aluminio y madera.\n\nAdem\u00e1s, las \u00e1reas estar\u00e1n separadas del resto del estadio por estructuras iluminadas que brindan intimidad a los visitantes. La actualizaci\u00f3n tecnol\u00f3gica incluye sistemas avanzados de audio, sonido e iluminaci\u00f3n, as\u00ed como pantallas m\u00e1s grandes y un sistema de control de accesos.\n\nPreparativos para el Mundial 2026\n\nZatarain tambi\u00e9n mencion\u00f3 que el esquema operativo durante los d\u00edas de partido ser\u00e1 diferente al habitual. FIFA utilizar\u00e1 parte del \u00e1rea de estacionamiento como centros log\u00edsticos provisionales para transmisi\u00f3n televisiva internacional y telecomunicaciones.\n\nSe espera que m\u00e1s del ochenta por ciento de los aficionados lleguen en transporte p\u00fablico o mediante el sistema \u2018Park and Ride\u2019. Adem\u00e1s, se vender\u00e1n ciertos espacios en estacionamiento, lo que facilitar\u00e1 la llegada al Estadio Akron Guadalajara.\n\nCon estas adecuaciones y transformaciones, el Estadio Akron se prepara para ofrecer una experiencia inolvidable durante el Mundial 2026.", "dateTimeNews": "2026-06-01T00:41:52+00:00", "dateTimeReceived": "2026-06-01T19:50:59+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a1cd493eb5dc.jpg", "position": 48, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/mundial-2026/guadalajara-afina-ultimos-detalles-estadio-copa-mundo_1780338078"}], "source": "La Patria", "title": "El Estadio Guadalajara listo para albergar el Mundial 2026 - La Patria 3.0", "url": "https://lapatria.bo/deportes/el-estadio-guadalajara-listo-para-albergar-el-mundial-2026/"}, {"actor": [], "authors": ["La Patria"], "body": "El objetivo es que se demore el juego en algunos casos y que el VAR tome acciones en algunas cosas\n\nFicha informativa La FIFA implementar\u00e1 nuevas reglas arbitrales en el Mundial 2026, comenzando el 11 de junio, para reducir p\u00e9rdidas de tiempo y aumentar el ritmo del juego. Se castigar\u00e1 con tarjeta roja a jugadores que se tapen la boca al discutir y se ampliar\u00e1 el uso del VAR. Toca para ver el contexto completo Contexto: El presidente del Comit\u00e9 de \u00c1rbitros de la FIFA, Pierluigi Collina, explic\u00f3 que estas decisiones buscan \u2018limpiar el f\u00fatbol\u2019 y \u2018aumentar el ritmo del partido\u2019. El VAR solo pod\u00eda revisar expulsiones por tarjeta roja directa antes de estas modificaciones. Se sancionar\u00e1 con tarjeta roja a quienes discutan cubri\u00e9ndose la boca y a aquellos que abandonen el campo en se\u00f1al de protesta. El VAR revisar\u00e1 saques de esquina concedidos err\u00f3neamente y segundas amarillas, permitiendo rectificaciones r\u00e1pidas sin ralentizar el juego. Por qu\u00e9 importa: Las nuevas reglas podr\u00edan cambiar la din\u00e1mica del juego, aumentando la rapidez en las decisiones arbitrales y reduciendo las protestas. Esto podr\u00eda impactar en la conducta de los jugadores y en la gesti\u00f3n del tiempo durante los partidos. Datos clave: Fecha de inicio del Mundial: 11 de junio\n\n11 de junio Duraci\u00f3n de las pausas de hidrataci\u00f3n: tres minutos\n\ntres minutos Tiempo l\u00edmite para saques de banda y reanudaciones del portero: cinco segundos\n\ncinco segundos Tiempo l\u00edmite para salir del campo tras una sustituci\u00f3n: diez segundos IngresarDesbloquear acceso completo\n\nEn el Mundial 2026 se registrar\u00e1n algunas novedades arbitrales \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nNovedades en el arbitraje del Mundial 2026\n\nLa FIFA introducir\u00e1 una serie de cambios significativos en el arbitraje durante el pr\u00f3ximo Mundial, que comenzar\u00e1 el 11 de junio. Estas modificaciones buscan reducir las p\u00e9rdidas de tiempo y sancionar con tarjeta roja a los jugadores que se tapen la boca al discutir con un rival. Adem\u00e1s, se castigar\u00e1 a quienes abandonen el campo en protesta por decisiones arbitrales.\n\nUso ampliado del videoarbitraje en saques de esquina\n\nUna de las principales innovaciones es la ampliaci\u00f3n del uso del videoarbitraje en saques de esquina. Por primera vez, el VAR podr\u00e1 revisar errores en saques de esquina y segundas amarillas. El presidente del Comit\u00e9 de \u00c1rbitros de la FIFA, Pierluigi Collina, explic\u00f3 que estas decisiones tienen como objetivo \u201climpiar el f\u00fatbol\u201d y \u201caumentar el ritmo del partido\u201d.\n\nReglas sobre expulsiones y tiempos de juego\n\nLos jugadores no podr\u00e1n cubrirse la boca al discutir con un rival. Si lo hacen, recibir\u00e1n tarjeta roja autom\u00e1ticamente. Adem\u00e1s, se sancionar\u00e1 a cualquier jugador o miembro del cuerpo t\u00e9cnico que abandone el campo como gesto de disconformidad ante una decisi\u00f3n arbitral.\n\nExpulsiones por cubrirse la boca: Tarjeta roja inmediata.\n\nTarjeta roja inmediata. Protestas en el campo: Expulsi\u00f3n por abandonar el terreno.\n\nCambios en los tiempos de reanudaci\u00f3n\n\nLos \u00e1rbitros establecer\u00e1n un tiempo l\u00edmite para que los porteros reanuden el juego y para los saques de banda. En caso de que un portero tarde demasiado, se conceder\u00e1 un saque de esquina al equipo rival. Esta norma busca mantener el ritmo del juego y evitar interrupciones innecesarias.\n\nPausas de hidrataci\u00f3n y sustituciones r\u00e1pidas\n\nTodos los partidos contar\u00e1n con dos pausas de hidrataci\u00f3n de tres minutos cuando se cumpla el ecuador de cada tiempo. Adem\u00e1s, los futbolistas sustituidos deber\u00e1n abandonar el campo por el punto m\u00e1s cercano y tendr\u00e1n un l\u00edmite de diez segundos para salir. Esto tambi\u00e9n se aplicar\u00e1 en cambios m\u00faltiples, comenzando a contar cuando el cuarto \u00e1rbitro levante el cartel\u00f3n.\n\nEstas nuevas reglas marcar\u00e1n un cambio significativo en la forma en que se juega al f\u00fatbol. Con la implementaci\u00f3n del videoarbitraje en saques de esquina, se espera mejorar la precisi\u00f3n en las decisiones arbitrales y aumentar la fluidez del juego. La comunidad futbol\u00edstica observa con atenci\u00f3n c\u00f3mo estas modificaciones afectar\u00e1n al desarrollo del torneo.", "dateTimeNews": "2026-06-01T00:22:33+00:00", "dateTimeReceived": "2026-06-01T19:50:59+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a1ccfe750ed4.jpg", "position": 49, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/mundial-2026/fifa-implementara-nuevas-reglas-arbitrales-mundial-2026_1780333844"}, {"source": "El Deber", "url": "https://eldeber.com.bo/deportes/marcelo-flores-pierde-mundial-2026-sufrir-grave-lesion-rodilla_1780337284"}], "source": "La Patria", "title": "En el Mundial 2026 se registrar\u00e1n algunas novedades arbitrales - La Patria 3.0", "url": "https://lapatria.bo/deportes/en-el-mundial-2026-se-registraran-algunas-novedades-arbitrales/"}, {"actor": [], "authors": ["rorellana"], "body": "El Ministerio de Desarrollo Productivo, Rural y Agua convoc\u00f3 nuevamente a los sectores movilizados y autoridades del municipio de San Juli\u00e1n a una reuni\u00f3n de di\u00e1logo programada para este lunes 1 de junio a las 19:00, con el objetivo de atender las demandas y buscar soluciones al conflicto que mantiene bloqueada la ruta hacia esa regi\u00f3n.\n\nEl encuentro se realizar\u00e1 en instalaciones de la Empresa de Apoyo a la Producci\u00f3n de Alimentos (Emapa), en el municipio de Cuatro Ca\u00f1adas, seg\u00fan la convocatoria emitida por el ministro de Desarrollo Productivo, Rural y Agua, \u00d3scar Mario Justiniano.\n\nLa reuni\u00f3n busca reencauzar el di\u00e1logo en el contexto de un bloqueo que ya cumple 18 d\u00edas en la carretera que conecta Santa Cruz con Beni, afectando la transitabilidad y el abastecimiento en la zona.\n\nEl encuentro no pudo instalarse este fin de semana, debido a la inasistencia de las partes convocadas.", "dateTimeNews":       }

      return parts.join(" | ");
    }

    function getRiskCategory(riesgo) {
      if (riesgo >= 0.66) return riskCategories[2];
      if (riesgo >= 0.33) return riskCategories[1];
      return riskCategories[0];
    }

    rawClusters.forEach((cluster, index) => {
      const order = buildOrderFromCluster(cluster);
      const lane = getRiskCategory(order.riesgo);

      order.riskStatus = lane.status;
      order.riskBadge = lane.badge;
      order.riskColor = lane.progressColor;

      categories[0].orders.push(order);
      lane.orders.push(order);
    });

    let activeTab = 0;

    function tabButton(category, index) {
      const selected = index === activeTab;
      return `
        <button
          type="button"
          data-index="${index}"
          class="inline-flex items-center gap-2 rounded-md border px-3 py-2 text-sm font-medium transition ${selected ? "border-gray-300 bg-white text-gray-900 dark:border-gray-600 dark:bg-gray-950 dark:text-gray-100" : "border-transparent text-gray-600 hover:border-gray-300 dark:text-gray-400 dark:hover:border-gray-700"}"
        >
          <span class="${category.iconColor} hidden sm:inline">${category.icon}</span>
          <span>${category.status}</span>
          <span class="rounded bg-gray-100 px-2 py-0.5 text-xs font-semibold tabular-nums ring-1 ring-inset ring-gray-200 dark:bg-gray-800 dark:ring-gray-700">${category.orders.length}</span>
        </button>
      `;
    }

    function renderActorsList(actors) {
      if (!Array.isArray(actors) || actors.length === 0) {
        return "";
      }

      const actorTags = actors
        .filter((item) => String(item || "").trim())
        .map((item) => `
          <span class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 dark:border-gray-700 dark:text-gray-300">${escapeHtml(item)}</span>
        `)
        .join("");

      if (!actorTags) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Actores</p>
          ${actorTags}
        </div>
      `;
    }

    function renderSimilarCoverage(similar) {
      if (!Array.isArray(similar) || similar.length === 0) {
        return "";
      }

      const links = similar
        .filter((item) => item && item.source && item.url)
        .map((item) => `
          <a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer" class="rounded border border-gray-200 px-1.5 py-0.5 text-[10px] text-gray-700 hover:border-blue-400 hover:text-blue-700 dark:border-gray-700 dark:text-gray-300 dark:hover:border-blue-500 dark:hover:text-blue-400">${escapeHtml(item.source)}</a>
        `)
        .join("");

      if (!links) {
        return "";
      }

      return `
        <div class="mt-3 flex flex-wrap items-center gap-1.5">
          <p class="text-[10px] font-medium uppercase tracking-[0.1em] text-gray-500 dark:text-gray-400">Cobertura similar</p>
          ${links}
        </div>
      `;
    }

    function orderCard(order, statusClass, statusText, progressColor) {
      const progress = Math.round(order.riesgo * 100);
      const safeBodyText = order.body || "No hay resumen disponible.";
      const safeTitle = escapeHtml(order.item);
      const safeSource = escapeHtml(order.company);
      const safeAuthor = escapeHtml(order.author || "");
      const subtitle = safeAuthor ? `${safeSource} | ${safeAuthor}` : safeSource;
      const safeBody = escapeHtml(safeBodyText);
      const articleUrl = safeUrl(order.url);
      const pictureUrl = safeUrl(order.pic);
      const dateTimeText = buildDateTimeDisplayString(order.dateTimeNews, order.dateTimeReceived);
      const imageBlock = pictureUrl === "#"
        ? ""
        : `<a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="block h-20 w-28 shrink-0 overflow-hidden rounded-md border border-gray-200 bg-gray-100 dark:border-gray-700 dark:bg-gray-800"><img src="${pictureUrl}" alt="Imagen de noticia" class="h-full w-full object-cover" loading="lazy"></a>`;

      return `
        <article class="rounded-lg border border-gray-200 bg-white p-4 dark:border-gray-800 dark:bg-gray-900 sm:p-5">
          <div class="flex items-start gap-3">
            ${imageBlock}

            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-2">
                <h4 class="min-w-0 flex-1 truncate text-sm font-medium text-gray-900 dark:text-gray-100">
                  <a href="${articleUrl}" target="_blank" rel="noopener noreferrer" class="hover:text-blue-700 dark:hover:text-blue-400">${safeTitle}</a>
                </h4>
                <span class="inline-flex items-center whitespace-nowrap rounded px-1.5 py-0.5 text-xs font-medium ring-1 ring-inset ${statusClass}">${statusText}</span>
              </div>

              <div class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                <p>${subtitle}</p>
              </div>

              <p class="mt-3 text-sm leading-6 text-gray-700 dark:text-gray-300">${safeBody}</p>

              ${renderActorsList(order.actors)}

              ${renderSimilarCoverage(order.similar)}
            </div>
          </div>

          <hr class="my-4 border-gray-200 dark:border-gray-700">

          <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-2">
              <span class="progress-ring" style="background: conic-gradient(${progressColor} ${progress}%, rgb(209 213 219) ${progress}% 100%); --ring-inner: rgb(255 255 255);"></span>
              <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Riesgo</p>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400">${escapeHtml(dateTimeText)}</p>
          </div>
        </article>
      `;
    }

    function emptyPanel() {
      return `
        <article class="rounded-lg border border-dashed border-gray-300 bg-gray-50 p-6 text-sm text-gray-600 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-400">
          No hay noticias disponibles en esta seccion.
        </article>
      `;
    }

    function render() {
      const list = document.getElementById("tab-list");
      const panel = document.getElementById("panel");
      const current = categories[activeTab];
      const showAll = activeTab === 0;

      list.innerHTML = categories.map(tabButton).join("");
      panel.innerHTML = current.orders.length
        ? current.orders
            .map((order) => {
              const badge = showAll ? order.riskBadge : current.badge;
              const status = showAll ? order.riskStatus : current.status;
              const color = showAll ? order.riskColor : current.progressColor;
              return orderCard(order, badge, status, color);
            })
            .join("")
        : emptyPanel();

      list.querySelectorAll("button[data-index]").forEach((button) => {
        button.addEventListener("click", () => {
          activeTab = Number(button.getAttribute("data-index"));
          render();
        });
      });
    }

    render();
  </script>
</body>
</html>
