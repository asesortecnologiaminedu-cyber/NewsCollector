\u00edstas titulares y suplentes. Si la mayor\u00eda vota por mantener a las autoridades, estas concluir\u00edan su mandato en 2030. En caso de imponerse la revocatoria, se convocar\u00eda a nuevas elecciones generales.\n\n\u201cAutoridad investida por el voto solo por el voto deber\u00eda ser revocada\u201d, sentenci\u00f3.\n\nEl legislador pidi\u00f3 al presidente de la C\u00e1mara de Diputados, Roberto Castro, convocar a una sesi\u00f3n de emergencia para debatir posibles soluciones. En su criterio, el Legislativo no puede permanecer al margen mientras los ciudadanos sufren las consecuencias de los bloqueos.\n\n\u201cLa Asamblea no le puede dar la espalda a millones de bolivianos que est\u00e1n sufriendo en este momento por la violencia de grupos que quieren derrocar al gobierno y romper el orden constitucional y democr\u00e1tico del pa\u00eds\u201d, afirm\u00f3.\n\nLea tambi\u00e9n: Marcha de El Alto desciende a La Paz y comerciantes increpan a los movilizados\n\nAlarc\u00f3n consider\u00f3 que el di\u00e1logo impulsado por el Ejecutivo se encuentra estancado debido a que los sectores movilizados mantienen como principal demanda la renuncia del presidente Rodrigo Paz. De ese modo, asegur\u00f3 que una eventual salida negociada no puede implicar la ruptura del orden constitucional.\n\nAsimismo, record\u00f3 que la Asamblea abrog\u00f3 la denominada Ley Copa y afirm\u00f3 que esa decisi\u00f3n elimin\u00f3 uno de los obst\u00e1culos para la aplicaci\u00f3n de mecanismos constitucionales destinados a enfrentar situaciones de crisis, en este caso, el Estado de Excepci\u00f3n.\n\nSin soluciones ni acuerdos a la vista, el pa\u00eds enfrenta su quinta semana en un escenario de conflictividad que supera un mes de bloqueos y movilizaciones en distintas regiones del pa\u00eds.\n\nLa Central Obrera Boliviana (COB), campesinos y el evismo mantienen las medidas de presi\u00f3n y exigen la salida del presidente Paz. Por su parte, el Gobierno insiste en buscar una soluci\u00f3n mediante el di\u00e1logo, pero ninguna convocatoria tuvo resultado.", "dateTimeNews": "2026-06-01T14:56:06+00:00", "dateTimeReceived": "2026-06-01T18:36:48+00:00", "pic": "https://larazon.bo/wp-content/uploads/2024/12/carlos_alarcon-1.jpg", "position": 23, "riesgo": 0.0, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/diputado-propone-referendum-revocatorio-extraordinario-para-el-presidente-vicepresidente-y-legisladores/"}, {"source": "El Deber", "url": "https://eldeber.com.bo/pais/diputado-alarcon-propone-referendum-revocatorio-extraordinario-presidente-vicepresidente-asambleistas_1780328571"}, {"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/pais/20260601/diputado-alarcon-propone-referendum-revocatorio-extraordinario-presidente"}, {"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/andronico-plantea-adelantar-un-referendum-revocatorio-para-frenar-la-crisis-y-evitar-violencia/"}], "source": "La Raz\u00f3n", "title": "Alarc\u00f3n plantea un refer\u00e9ndum revocatorio extraordinario como salida a la crisis", "url": "https://larazon.bo/nacional/2026/06/01/alarcon-plantea-un-referendum-revocatorio-extraordinario-como-salida-a-la-crisis/"}, {"actor": [], "authors": ["Shirley Iba\u00f1ez"], "body": "en Nacional\n\nEste lunes inici\u00f3 el programa Tranca Cero que apunta a la desregulaci\u00f3n, simplificaci\u00f3n administrativa y optimizaci\u00f3n normativa en favor de la poblaci\u00f3n.\n\n\u201cHoy tiene un hito importante, desde el 1 de junio, ninguna entidad del \u00d3rgano Ejecutivo puede pedir como requisito para sus tr\u00e1mites fotocopia de c\u00e9dula de identidad ni de certificado de nacimiento, salvo para verificar filiaci\u00f3n o parentesco\u201d, explic\u00f3 el director de Modernizaci\u00f3n del Estado, Jorge Rub\u00edn de Celis, en Bolivia Tv.\n\nA trav\u00e9s del Decreto Supremo 5595, en marzo, el presidente Rodrigo Paz, inform\u00f3 que el objetivo central de la normativa es poner fin al f\u00f3lder amarillo y con ello enfrentar procesos largos, confusos y costosos.\n\nEn ese contexto, Rub\u00edn de Celis destac\u00f3 que se trata de un primer paso para la desburocratizaci\u00f3n del Estado y que este \u00faltimo continuar\u00e1 fortaleci\u00e9ndose los siguientes meses.\n\nLea m\u00e1s: Programa Tranca Cero: el Gobierno apunta a modernizar la administraci\u00f3n p\u00fablica\n\nEstado f\u00e1cil\n\n\u201cLo celebramos con mucha expectativa y convencidos de que vamos a llegar a generar un Estado f\u00e1cil, accesible al ciudadano, al administrado, para que la relaci\u00f3n sea cordial y que se limite a solicitar lo estrictamente necesario\u201d, precis\u00f3.\n\nA partir de este lunes, ninguno de los 14 ministerios del Estado ni de las 101 entidades descentralizadas pedir\u00e1n fotocopia del carnet de identidad o certificado de nacimiento.\n\nAsimismo, el director de Modernizaci\u00f3n del Estado inform\u00f3 que todas las entidades fueron comunicadas respecto a la implementaci\u00f3n desde este lunes de esta medida.\n\nAdelant\u00f3 que se trabaja para que en menos de un a\u00f1o se pueda contar con un cat\u00e1logo nacional de tr\u00e1mites donde estar\u00e1n todos los procesos que se deben realizar dentro el \u00d3rgano Ejecutivo y los que no est\u00e9n en el mismo no tendr\u00e1n validez ni vigencia, por lo que no ser\u00e1n obligatorios.\n\nReportes\n\nAdem\u00e1s, la autoridad record\u00f3 que se habilit\u00f3 el mecanismo de control del cumplimiento del decreto denominado \u201cReporta tu Tranca\u201d, cuyo objetivo es informar al Gobierno nacional si hubiera alguna entidad que est\u00e1 \u201chaciendo alguna traba burocr\u00e1tica\u201d.\n\nPara hacer el reporte debe ingresar a la p\u00e1gina web: https://trancacero.gob.bo/login y llenar el formulario con su reclamo.\n\nLa autoridad reconoci\u00f3 que desmontar d\u00e9cadas de burocracia ser\u00e1 un proceso gradual. No obstante, asegur\u00f3 que el objetivo es claro: construir un Estado facilitador que respete el tiempo de la ciudadan\u00eda y promueva un servicio p\u00fablico m\u00e1s eficiente y transparente.", "dateTimeNews": "2026-06-01T14:50:44+00:00", "dateTimeReceived": "2026-06-01T18:36:48+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/06/tranca.webp", "position": 24, "riesgo": 0.0, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/enfoque-nacional/bolivia-inicia-programa-tranca-cero-para-simplificar-tramites/"}], "source": "La Raz\u00f3n", "title": "Gobierno pone en vigencia programa Tranca Cero para terminar con la burocracia", "url": "https://larazon.bo/nacional/2026/06/01/gobierno-pone-en-vigencia-programa-tranca-cero-para-terminar-con-la-burocracia/"}, {"actor": [], "authors": ["Redaccion El Mundo"], "body": "LIGA. En un partido de bajo rendimiento por parte de ambos equipos, los celestes fueron m\u00e1s ordenados en defensa y mucho m\u00e1s \u2018vivos\u2019 en ofensiva para superar a un Oriente, que sigue sin jugar a nada y que no encuentra soluci\u00f3n ni con la llegada del DT Gustavo Florent\u00edn.\n\nBlooming se qued\u00f3 con la victoria en el cl\u00e1sico cruce\u00f1o 207 de la historia tras vencer por la m\u00ednima diferencia a Oriente Petrolero (0-1), arruinando la posible despedida del artillero Marcelo Martins del f\u00fatbol profesional.\n\nEl autogol que marc\u00f3 el paraguayo Jordan Santacruz a los 74 minutos del compromiso fue suficiente para que el equipo de Erwin \u2018Platin\u00ed\u2019 S\u00e1nchez se quede con los tres puntos ante su cl\u00e1sico rival, en el estadio Tahuichi.\n\nCon esta victoria, Blooming escala al quinto puesto en la tabla de posiciones del campeonato con 12 unidades, mientras que Oriente Petrolero cae al d\u00e9cimo lugar con 10 puntos hasta que se complemente la jornada.\n\nLAS ACCIONES\n\nEl cl\u00e1sico cruce\u00f1o volvi\u00f3 a demostrar su poder de convocatoria con un estadio Tahuichi repleto y dos hinchadas que alentaron sin descanso durante los 90 minutos.\n\nUno de los focos de atenci\u00f3n estuvo puesto en Marcelo Martins, que disput\u00f3 su primer cl\u00e1sico con la camiseta de Oriente Petrolero. El delantero gener\u00f3 las principales ocasiones de su equipo en la primera mitad, aunque sin lograr concretar frente al arco rival.\n\nBlooming tambi\u00e9n tuvo sus oportunidades y respondi\u00f3 con ataques peligrosos, pero la falta de precisi\u00f3n mantuvo el marcador en blanco durante gran parte del encuentro. En el complemento, Oriente intent\u00f3 tomar la iniciativa, aunque sin efectividad en los metros finales.\n\nLa diferencia lleg\u00f3 a los 74 minutos de manera fortuita. Tras un centro desde la derecha, Santa Cruz intent\u00f3 despejar de cabeza, pero termin\u00f3 enviando el bal\u00f3n a su propia porter\u00eda, decretando el 1-0 para Blooming. Tras el gol, Oriente trat\u00f3 de arrinconar a la Academia en su \u00e1rea, pero no logr\u00f3 la igualdad esperada.\n\nImpulsada por la ventaja, la Academia estuvo cerca de ampliar la cuenta en los minutos finales, aunque el arquero Alejandro Torres evit\u00f3 una derrota m\u00e1s abultada para los albiverdes. El cl\u00e1sico termin\u00f3 con triunfo celeste gracias a un desafortunado autogol que inclin\u00f3 la balanza en un partido parejo.\n\nAgencias", "dateTimeNews": "2026-06-01T14:40:08+00:00", "dateTimeReceived": "2026-06-01T16:32:35+00:00", "pic": "https://elmundo.com.bo/wp-content/uploads/2026/06/1-13-22.30.55.webp", "position": 25, "riesgo": 0.0, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/deportes/despedida-de-martins-de-oriente-petrolero-con-triunfo-de-blooming/"}], "source": "El Mundo", "title": "Blooming amarga el cl\u00e1sico a Oriente y la despedida de Martins", "url": "https://elmundo.com.bo/blooming-amarga-el-clasico-a-oriente-y-la-despedida-de-martins/"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nEl defensor del Pueblo, Pedro Callisaya, pidi\u00f3 este lunes al Gobierno y a los sectores movilizados restablecer un espacio de di\u00e1logo para resolver la crisis que atraviesa el pa\u00eds y advirti\u00f3 que ninguna demanda sectorial puede estar por encima de la vida de las personas.\n\n\u201cNinguna reivindicaci\u00f3n, de cualquier naturaleza, puede tener m\u00e1s valor que la vida humana\u201d, afirm\u00f3 el defensor en conferencia de prensa.\n\nEl domingo, la Central Obrera Boliviana (COB), que impulsa la salida del presidente Rodrigo Paz, rechaz\u00f3 cualquier posibilidad de negociaci\u00f3n para pacificar el pa\u00eds. La organizaci\u00f3n ratific\u00f3 las medidas de presi\u00f3n y convoc\u00f3 a sus afiliados a continuar con los puntos de bloqueo en todo el pa\u00eds, pese a que el \u00d3rgano Judicial dej\u00f3 sin efecto la orden de aprehensi\u00f3n contra su ejecutivo, Mario Argollo.\n\nLea tambi\u00e9n: Dockweiler afirma que la FAB apoyar\u00e1 traslado de pollo a La Paz para reducir precios\n\nCallisaya alert\u00f3 que la escalada de tensi\u00f3n afecta a miles de ciudadanos y genera un escenario de incertidumbre. Explic\u00f3 que la polarizaci\u00f3n, los discursos de odio y la discriminaci\u00f3n incrementan el riesgo de hechos violentos.\n\n\u201cExisten miles de personas que ven afectados sus derechos fundamentales\u201d, dijo.\n\nLa autoridad reconoci\u00f3 que la protesta constituye un derecho democr\u00e1tico, pero record\u00f3 que las medidas de presi\u00f3n no deben vulnerar los derechos de terceros ni poner en riesgo la integridad de la poblaci\u00f3n.\n\n\u201cLas medidas de presi\u00f3n no pueden poner en riesgo los derechos de terceras personas\u201d, manifest\u00f3.\n\nEl defensor tambi\u00e9n advirti\u00f3 que una mayor radicalizaci\u00f3n del conflicto puede dificultar la b\u00fasqueda de soluciones. \u201cLa radicalizaci\u00f3n puede alejar las soluciones y generar una escalada de violencia\u201d.\n\nPor ello, exhort\u00f3 a todas las partes involucradas a priorizar los acuerdos. \u201cNo hay otra opci\u00f3n. La \u00fanica opci\u00f3n es fortalecer esta l\u00f3gica de di\u00e1logo para evitar mayor violencia. Es la \u00fanica opci\u00f3n, exhortamos a todos a que puedan reflexionar y viabilizar el tema del di\u00e1logo\u201d.", "dateTimeNews": "2026-06-01T14:22:03+00:00", "dateTimeReceived": "2026-06-01T18:12:19+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/05/dcec8cd08ceadd96f2871ec656c3020a.webp", "position": 26, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/defensor-bloqueadores-radicalizacion-puede-alejar-definitivamente-soluciones-generar-escalada-mayor-violencia_1780331898"}], "source": "La Raz\u00f3n", "title": "\u2018Ninguna reivindicaci\u00f3n puede tener m\u00e1s valor que la vida\u2019: Defensor pide retomar el di\u00e1logo", "url": "https://larazon.bo/nacional/2026/06/01/ninguna-reivindicacion-puede-tener-mas-valor-que-la-vida-defensor-pide-retomar-el-dialogo/"}, {"actor": [], "authors": ["Adriana Quisbert"], "body": "\ud83d\udd0a Escuchar la nota\n\nSanta Cruz, 1 de junio (ATB Media).- Blooming derrot\u00f3 1-0 a Oriente Petrolero en una nueva edici\u00f3n del cl\u00e1sico cruce\u00f1o disputado en el estadio Ram\u00f3n Tahuichi Aguilera. Un autogol de Jordan Santacruz en la segunda mitad defini\u00f3 un partido marcado por el debut de Gustavo Florent\u00edn y Erwin S\u00e1nchez en los banquillos de sus respectivos equipos. La victoria permiti\u00f3 a la Academia recuperar terreno en la tabla y cortar una racha de cuatro encuentros sin ganar.\n\nEn el \u00fanico compromiso disputado este domingo por la d\u00e9cima fecha de la Liga de la Divisi\u00f3n Profesional, Blooming se impuso por la m\u00ednima diferencia a Oriente Petrolero en un cl\u00e1sico cruce\u00f1o que tuvo como protagonistas a dos entrenadores debutantes y a Marcelo Martins, quien enfrent\u00f3 por primera vez al conjunto celeste.\n\nLas dificultades sociales que atraviesa el pa\u00eds obligaron a la suspensi\u00f3n del resto de la jornada, pero no impidieron que el Tahuichi Aguilera luciera colmado para uno de los encuentros m\u00e1s esperados del f\u00fatbol nacional. Antes del inicio del compromiso, Martins recibi\u00f3 un reconocimiento de parte del gobernador de Santa Cruz, Juan Pablo Velasco.\n\nDesde el arranque, la atenci\u00f3n estuvo centrada en el experimentado delantero de Oriente, quien tuvo su primera aproximaci\u00f3n a los 13 minutos con un remate desviado. Blooming respondi\u00f3 poco despu\u00e9s mediante Antony V\u00e1squez, que qued\u00f3 frente al arquero Alejandro Torres, aunque no logr\u00f3 concretar la jugada. El conjunto albiverde gener\u00f3 otras oportunidades en la primera etapa. A los 30 minutos, Martins prolong\u00f3 de cabeza un bal\u00f3n para un compa\u00f1ero que no alcanz\u00f3 a conectar, mientras que seis minutos m\u00e1s tarde el atacante volvi\u00f3 a inquietar con un cabezazo que sali\u00f3 fuera del arco.\n\nEn el complemento, Oriente inici\u00f3 con una incidencia negativa luego de que su entrenador, Gustavo Florent\u00edn, fuera expulsado por el retraso de su equipo en el retorno al campo de juego. Pese a ello, el refinero volvi\u00f3 a aproximarse mediante Jorge Lovera y Luciano Ursino, aunque sin precisi\u00f3n en la definici\u00f3n. La acci\u00f3n decisiva lleg\u00f3 a los 74 minutos. Un centro enviado desde el sector derecho encontr\u00f3 a Jordan Santacruz intentando despejar el bal\u00f3n de cabeza, pero la trayectoria termin\u00f3 sorprendiendo a su propio arquero y la pelota ingres\u00f3 al fondo de las redes para el 1-0 favorable a Blooming.\n\nTras la apertura del marcador, el cuadro celeste gan\u00f3 confianza y estuvo cerca de ampliar la ventaja. Jos\u00e9 Mar\u00eda Carrasco exigi\u00f3 a Torres con un cabezazo y, m\u00e1s tarde, Bayron Garc\u00e9s prob\u00f3 con un potente remate que tambi\u00e9n fue controlado por el guardameta refinero.\n\nEn los minutos finales, Oriente Petrolero adelant\u00f3 l\u00edneas y arrincon\u00f3 a su rival en busca de la igualdad. Sin embargo, la defensa acad\u00e9mica resisti\u00f3 la presi\u00f3n y asegur\u00f3 una victoria que le permiti\u00f3 escalar hasta el quinto puesto de la clasificaci\u00f3n con 12 puntos. Por su parte, Oriente descendi\u00f3 al noveno lugar con 10 unidades.\n\nFuente: La Red Deportiva de ATB", "dateTimeNews": "2026-06-01T14:06:28+00:00", "dateTimeReceived": "2026-06-01T18:36:27+00:00", "pic": "https://www.atb.com.bo/wp-content/uploads/2026/06/711618861_1472643767995928_6148682080111278775_n.jpg", "position": 27, "riesgo": 0.0, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/deportes/despedida-de-martins-de-oriente-petrolero-con-triunfo-de-blooming/"}, {"source": "El Mundo", "url": "https://elmundo.com.bo/blooming-amarga-el-clasico-a-oriente-y-la-despedida-de-martins/"}], "source": "ATB Digital", "title": "Blooming se queda con el cl\u00e1sico cruce\u00f1o gracias a un autogol de Santacruz", "url": "https://www.atb.com.bo/2026/06/01/blooming-se-queda-con-el-clasico-cruceno-gracias-a-un-autogol-de-santacruz/"}, {"actor": [], "authors": ["La Patria"], "body": "Mientras se dirig\u00eda al hospital, una mujer dio a luz en la v\u00eda p\u00fablica de Santa Cruz. Un ciudadano ayud\u00f3 en el momento cr\u00edtico\n\nFicha informativa Una mujer dio a luz inesperadamente en la v\u00eda p\u00fablica de Santa Cruz de la Sierra la ma\u00f1ana del 1 de junio. Un ciudadano ayud\u00f3 en el momento cr\u00edtico, trasladando a la madre y al reci\u00e9n nacido al hospital. Toca para ver el contexto completo Contexto: La mujer se dirig\u00eda al hospital acompa\u00f1ada por su hija adolescente. Testigos observaron que caminaba con dificultad, lo que inicialmente hizo pensar en un malestar estomacal. Bonifacio, un portero, ayud\u00f3 a asistir a la madre durante el parto. Hasta el cierre del reporte, las autoridades de salud no hab\u00edan emitido un comunicado sobre el estado cl\u00ednico de la madre y el beb\u00e9. Por qu\u00e9 importa: El hecho se viraliz\u00f3 en redes sociales, movilizando a vecinos y transe\u00fantes para brindar primeros auxilios. Ambos, madre e hijo, fueron trasladados al hospital para recibir atenci\u00f3n m\u00e9dica especializada. Datos clave: Fecha: 1 de junio de 2026\n\n1 de junio de 2026 Hora: Cerca de las 07:00 horas\n\nCerca de las 07:00 horas Lugar: Calle Rafael Pe\u00f1a, Santa Cruz de la Sierra IngresarDesbloquear acceso completo\n\nSanta Cruz: mujer da a luz inesperadamente en v\u00eca p\u00f9blica \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nUna mujer da a luz en plena v\u00eda p\u00fablica en Santa Cruz\n\nUna mujer dio a luz inesperadamente en plena v\u00eda p\u00fablica en la ciudad de Santa Cruz de la Sierra, la ma\u00f1ana de este lunes 1 de junio. El alumbramiento ocurri\u00f3 cerca de las 07:00 horas sobre la acera de la calle Rafael Pe\u00f1a, sorprendiendo a los transe\u00fantes y vecinos del sector.\n\nEl momento del parto\n\nLa mujer se desplazaba acompa\u00f1ada \u00fanicamente por su hija adolescente, con la intenci\u00f3n de recibir atenci\u00f3n m\u00e9dica especializada. Sin embargo, antes de alcanzar la puerta del centro hospitalario, el proceso de parto se aceler\u00f3 s\u00fabitamente. Seg\u00fan los testigos, la madre caminaba con dificultad, mostrando una postura encorvada y un paso muy pausado que hizo pensar inicialmente que padec\u00eda alg\u00fan malestar estomacal o problemas de ves\u00edcula.\n\nLa intervenci\u00f3n de un ciudadano\n\nBonifacio, un ciudadano que trabaja como portero en la Caja Petrolera de Salud y que se convirti\u00f3 en una pieza clave para auxiliar a la madre, relat\u00f3 el momento exacto en que la situaci\u00f3n cambi\u00f3 dr\u00e1sticamente. \u2018Ella grit\u00f3, sali\u00f3 el l\u00edquido amni\u00f3tico y naci\u00f3 el beb\u00e9\u2019, detall\u00f3 Bonifacio al recordar c\u00f3mo reaccion\u00f3 inmediatamente para asistir a la mujer. En medio del asombro colectivo, solicit\u00f3 a la joven que acompa\u00f1aba a la madre que corriera al centro m\u00e9dico en busca de una silla de ruedas para facilitar el traslado.\n\nReacci\u00f3n comunitaria y viralizaci\u00f3n del hecho\n\nEl hecho r\u00e1pidamente se viraliz\u00f3 en las redes sociales debido a los videos grabados por personas que transitaban por la zona. Esto moviliz\u00f3 a varios vecinos y transe\u00fantes que brindaron los primeros auxilios b\u00e1sicos. Tras el nacimiento, Bonifacio, con el apoyo de un compa\u00f1ero, se encarg\u00f3 de trasladar urgentemente a la madre y al reci\u00e9n nacido al interior de la Caja Nacional de Salud para recibir asistencia m\u00e9dica especializada necesaria tras el parto fortuito.\n\nEstado cl\u00ednico no reportado\n\nAunque ambos fueron ingresados inmediatamente a la instituci\u00f3n, hasta el cierre de este reporte, las autoridades de salud no han emitido un comunicado oficial sobre el estado cl\u00ednico o los pormenores tanto de la madre como del beb\u00e9.\n\nEl beb\u00e9 naci\u00f3 en v\u00eda p\u00fablica a pasos de la Caja Nacional \u2022 Unitel", "dateTimeNews": "2026-06-01T14:03:05+00:00", "dateTimeReceived": "2026-06-01T18:36:32+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/06/6a1d8c7e7e06c.jpg", "position": 28, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/ciudades/2026/06/01/mujer-da-a-luz-en-la-calle-a-metros-de-la-caja-nacional/"}], "source": "La Patria", "title": "Santa Cruz: mujer da a luz inesperadamente en v\u00eca p\u00f9blica - La Patria 3.0", "url": "https://lapatria.bo/actualidad/santa-cruz-mujer-da-a-luz-inesperadamente-en-via-publica/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "Bolivia inicia el mes de junio con m\u00e1s de 90 puntos de bloqueo; sin embargo, a diferencia de d\u00edas pasados, esta vez Cochabamba es el departamento con m\u00e1s puntos de conflicto, seguido de La Paz.\n\nDe acuerdo al reporte de la Administradora Boliviana de Carreteras (ABC), Cochabamba reporta 32 puntos de bloqueo.\n\nEl segundo departamento m\u00e1s afectado es La Paz con 21 puntos de bloqueo, mientras que en Oruro hay 19, en Potos\u00ed 15, Chuquisaca 11 y Santa Cruz presenta cuatro cortes de rutas.\n\nEste lunes se cumplen 32 d\u00edas de bloqueo de carreteras y movilizaciones que llevan adelante distintos sectores, a la cabeza de la Central Obrera Boliviana (COB), exigiendo la renuncia del presidente Rodrigo Paz.\n\nLos bloqueos han generado un desabastecimiento de combustible, medicamentos y alimentos principalmente en el departamento de La Paz, con m\u00e1s fuerza en la Sede de Gobierno y El Alto.\n\nEl domingo, un ampliado de emergencia de la Central Obrera Boliviana (COB) determin\u00f3 no asistir al di\u00e1logo y continuar con los bloqueos que tiene a muchas regiones sufriendo por falta de abastecimiento de combustibles, alimentos y medicamentos.\n\nEl Gobierno insiste en el di\u00e1logo y a\u00fan no se ha pronunciado sobre la decisi\u00f3n de la COB.", "dateTimeNews": "2026-06-01T13:59:02+00:00", "dateTimeReceived": "2026-06-01T18:05:18+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/bloqueo_bolivia26.2.jpg", "position": 29, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/bolivia-inicia-junio-con-mas-de-90-bloqueos-cochabamba-es-ahora-centro-de-la-protesta/"}, {"source": "Los Tiempos", "url": "https://www.lostiempos.com/actualidad/cochabamba/20260601/cochabamba-pasa-ser-epicentro-bloqueos-32-vias-cortadas"}], "source": "Ox\u00edgeno", "title": "Bolivia inicia junio con m\u00e1s de 90 puntos de bloqueo; Cochabamba y La Paz son los m\u00e1s afectados", "url": "https://oxigeno.bo/bolivia-inicia-junio-con-mas-de-90-puntos-de-bloqueo-cochabamba-y-la-paz-son-los-mas-afectados/"}, {"actor": [], "authors": ["C\u00e9sar S\u00e1nchez"], "body": "A trav\u00e9s de un comunicado conjunto, la Iglesia y la Defensor\u00eda del Pueblo pidieron a los sectores movilizados reconsiderar su postura de no dialogar y, asimismo, exhortaron al mismo grupo como tambi\u00e9n al Gobierno evitar el uso de la fuerza para la resoluci\u00f3n de los conflictos.\n\nEn el texto, la Iglesia y la Defensor\u00eda reafirman su postura respecto a que \u201cel di\u00e1logo sincero, emp\u00e1tico y constructivo constituye la \u00fanica v\u00eda leg\u00edtima y eficaz para la resoluci\u00f3n de los problemas que nos aquejan\u201d.\n\n\u201cEl verdadero entendimiento democr\u00e1tico nace de escuchar las necesidades mutuas, permitiendo alcanzar acuerdos sostenibles que preserven el tejido social y garanticen la convivencia pac\u00edfica de todos\u201d, se\u00f1ala el texto.\n\nEn ese sentido, piden a los sectores movilizados reconsiderar su postura de no dialogar con el Gobierno. Ayer, tanto la Central Obrera Boliviana (COB) como la Federaci\u00f3n de Campesinos de La Paz descartaron cualquier posibilidad de reunirse con el Gobierno y ratificaron su postura de exigir la renuncia del presidente Rodrigo Paz.\n\n\u201cExhortamos firmemente a todos los sectores involucrados en el actual escenario de tensi\u00f3n a deponer posiciones duras y a reconsiderar las posturas que rechazan o dilatan el acercamiento a una mesa de di\u00e1logo. Cerrarse a la concertaci\u00f3n solo profundiza el sufrimiento de la poblaci\u00f3n, desgasta la paz social y posterga las soluciones urgentes que la ciudadan\u00eda requiere y merece con justa raz\u00f3n. La verdadera valent\u00eda radica en tener la capacidad de ceder por el bien com\u00fan\u201d, se\u00f1ala el comunicado.\n\nLa Iglesia y la Defensor\u00eda, asimismo, se\u00f1alan que \u201cel uso de la fuerza, la coacci\u00f3n o cualquier manifestaci\u00f3n de violencia \u2014venga de donde venga\u2014 jam\u00e1s ser\u00e1 un mecanismo propiciador de soluciones reales, sino un detonante de mayor rencor odio y divisi\u00f3n\u201d. \u201cLa represi\u00f3n y los enfrentamientos no construyen puentes, sino muros, y ponen en riesgo el derecho primordial a la vida y la integridad de las personas, las cuales deben ser protegidas de forma irrestricta\u201d, a\u00f1ade.\n\n\u201cLa violencia s\u00f3lo genera m\u00e1s violencia y las heridas sociales que se est\u00e1n abriendo tardar\u00e1n d\u00e9cadas en sanar. Es momento de sustituir la ofensa por la propuesta, las piedras por la palabra y los bloqueos por el entendimiento\u201d, afirma.\n\nFinalmente, ambas instituciones reafirman su \u201cplena disposici\u00f3n para facilitar y acompa\u00f1ar los espacios necesarios que permitan el reencuentro, la calma y el entendimiento entre bolivianos\u201d.\n\n\u201cEn este momento Bolivia y su pueblo demandan de sus gobernantes y sectores movilizados la madurez y la sensibilidad necesarias para deponer intereses particulares en favor del bien com\u00fan\u201d, finaliza el texto.", "dateTimeNews": "2026-06-01T13:25:10+00:00", "dateTimeReceived": "2026-06-01T18:12:20+00:00", "pic": "https://oxigeno.bo/wp-content/uploads/2026/05/marcha_violencia_lapaz.png", "position": 30, "riesgo": 0.0, "similar": [{"source": "Asuntos Centrales", "url": "https://asuntoscentrales.com/la-iglesia-catolica-y-la-defensoria-del-pueblo-convocan-al-dialogo-urgente-ante-la-conflictividad-en-el-pais/"}, {"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/iglesia-y-defensoria-piden-a-movilizados-reconsiderar-su-decision-de-no-dialogar/"}], "source": "Ox\u00edgeno", "title": "Bloqueos: La Iglesia y la Defensor\u00eda piden reconsiderar la postura de no dialogar y evitar uso de la fuerza", "url": "https://oxigeno.bo/bloqueos-la-iglesia-y-la-defensoria-piden-reconsiderar-la-postura-de-no-dialogar-y-evitar-uso-de-la-fuerza/"}, {"actor": [], "authors": ["Andrea Condori"], "body": "en Nacional\n\nEl expresidente Eduardo Rodr\u00edguez Veltz\u00e9 exhort\u00f3 este lunes a suspender los bloqueos y recuperar el di\u00e1logo como mecanismo para resolver los conflictos que afectan al pa\u00eds, que atraviesa por una crisis social y pol\u00edtica que ya supera m\u00e1s de un mes de movilizaciones y cortes de carreteras.\n\nEn su cuenta de X, record\u00f3 que la nueva Constituci\u00f3n Pol\u00edtica del Estado fue aprobada en 2009 con el respaldo mayoritario de la poblaci\u00f3n y destac\u00f3 los principios democr\u00e1ticos que inspiraron su creaci\u00f3n.\n\n\u201cEn 2009, el 61% de los bolivianos aprob\u00f3 la Constituci\u00f3n para una Bolivia democr\u00e1tica, plural y pacifista, basada en el respeto y la igualdad, con gobiernos electos y renovados por voto libre y secreto\u201d, escribi\u00f3.\n\nRodr\u00edguez Veltz\u00e9 indic\u00f3 que el escenario actual exige retomar esos principios y buscar soluciones por la v\u00eda del entendimiento. De ese modo, consider\u00f3 urgente restablecer la convivencia democr\u00e1tica en el pa\u00eds.\n\nTambi\u00e9n puede interesarle: Bolivia inicia junio con m\u00e1s de 90 bloqueos, Cochabamba es ahora centro de la protesta\n\n\u201cHoy es urgente recuperar la convivencia democr\u00e1tica, suspender los bloqueos, restablecer el di\u00e1logo y rechazar actitudes que solo multiplican los da\u00f1os a la poblaci\u00f3n y pueden dar paso a mayor violencia\u201d, afirm\u00f3.\n\nEl pa\u00eds sufre un escenario de conflictividad con bloqueos en distintas regiones del pa\u00eds, lo cual provoca el abastecimiento de combustibles y alimentos, adem\u00e1s de una creciente preocupaci\u00f3n por los efectos econ\u00f3micos y sociales de las medidas de presi\u00f3n.\n\nEl exmandatario advirti\u00f3 que la confrontaci\u00f3n no solo profundiza las dificultades que enfrenta la ciudadan\u00eda, sino que tambi\u00e9n incrementa el riesgo de episodios de violencia. Por ello, insisti\u00f3 en la necesidad de priorizar el di\u00e1logo y el respeto a las reglas democr\u00e1ticas como v\u00edas para superar la actual coyuntura.\n\nNo obstante, el domingo, la Central Obrera Boliviana (COB) rechaz\u00f3 cualquier intenci\u00f3n de di\u00e1logo y ratific\u00f3 las medidas de presi\u00f3n hasta lograr la renuncia del presidente Rodrigo Paz.", "dateTimeNews": "2026-06-01T13:10:42+00:00", "dateTimeReceived": "2026-06-01T16:50:47+00:00", "pic": "https://larazon.bo/wp-content/uploads/2024/11/RODRIGUEZ.jpeg", "position": 31, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/pais/veltze-urgente-recuperar-convivencia-democratica-suspender-bloqueos-restablecer-dialogo_1780326626"}], "source": "La Raz\u00f3n", "title": "Rodr\u00edguez Veltz\u00e9 pide suspender los bloqueos y recuperar el di\u00e1logo para evitar violencia", "url": "https://larazon.bo/nacional/2026/06/01/rodriguez-veltze-pide-suspender-los-bloqueos-y-recuperar-el-dialogo-para-evitar-violencia/"}, {"actor": [], "authors": ["kvasquez"], "body": "La Administrado Boliviana de Carreteras (ABC) revela que contin\u00faan siendo seis los departamentos que concentran los cortes de rutas, pero al iniciar esta semana Cochabamba es el m\u00e1s afectado.\n\nArranca una nueva semana y un nuevo mes, pero los conflictos en Bolivia no cesan, este lunes 1 de junio se reportan al menos 90 puntos de bloqueo distribuidos en seis departamentos del pa\u00eds, seg\u00fan Unitel\n\nSeg\u00fan los datos del mapa de Transitabilidad de la Administradora Boliviana de Carreteras (ABC), Cochabamba es ahora el departamento m\u00e1s afectado al contar con 32 v\u00edas cortadas, de acuerdo al reporte hasta antes de las 6:30.\n\nEl segundo departamento m\u00e1s afectado es La Paz con 19 puntos de bloqueo, mientras que en Potos\u00ed hay 16, Oruro tiene 11, Chuquisaca nueve y Santa Cruz tres cortes de rutas.\n\nEsta jornada de 1 de junio, se cumplen 32 d\u00edas de movilizaciones en el pa\u00eds de parte de sectores campesinos y miembros de la Central Obrera Boliviana (COB), que rechazan el di\u00e1logo con el Gobierno y solo exigen la renuncia del presidente Rodrigo Paz.\n\nDurante el d\u00eda domingo, la COB realiz\u00f3 un ampliado donde definieron continuar con las medidas de presi\u00f3n de manera indefinida, mientras que el pa\u00eds y la poblaci\u00f3n sufre las consecuencias de estas determinaciones con el desabastecimiento de alimentos, combustible, medicamentos y dem\u00e1s.\n\nSin embargo, pese a que los puntos de bloqueo se han masificado en el territorio nacional, el Gobierno muestra su postura al di\u00e1logo y afirma que esperar\u00e1n a los sectores para poder instalar reuniones y llegar a un acuerdo.", "dateTimeNews": "2026-06-01T12:51:41+00:00", "dateTimeReceived": "2026-06-01T18:36:39+00:00", "pic": "https://www.lostiempos.com/sites/default/files/media_imagen/2026/6/1/bloqueo_occidente_jor_va.jpg", "position": 32, "riesgo": 0.0, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/bolivia-inicia-junio-con-mas-de-90-puntos-de-bloqueo-cochabamba-y-la-paz-son-los-mas-afectados/"}], "source": "Los Tiempos", "title": "Cochabamba pasa a ser epicentro de los bloqueos con 32 v\u00edas cortadas", "url": "https://www.lostiempos.com/actualidad/cochabamba/20260601/cochabamba-pasa-ser-epicentro-bloqueos-32-vias-cortadas"}, {"actor": [], "authors": ["Shirley Iba\u00f1ez"], "body": "en Ciudades\n\nUn incendio en el nuevo mercado La Ramada dej\u00f3 da\u00f1os en al menos 10 casetas dedicadas a la venta de comida y moviliz\u00f3 a Bomberos que logr\u00f3 controlar el fuego y evitar mayores da\u00f1os.\n\nEl hecho ocurri\u00f3 la madrugada de este lunes, inform\u00f3 \u00c1lvaro Castillo, bombero voluntario UUBR.\n\n\u201cNos reportaron un incendio de tipo estructural, llegamos aqu\u00ed a la nueva Ramada (\u2026), se ve\u00eda dos puntos y que estaban avanzando, uno aguas arriba, que era sobre las casetas, y otro que ven\u00eda aguas abajo\u201d, explic\u00f3 Castillo en Unitel.\n\nAsimismo, explic\u00f3 que el fuego se inici\u00f3 en una caseta y se expandi\u00f3 r\u00e1pidamente hasta llegar a otros ambientes y afectar a varios negocios.\n\nLea m\u00e1s: M\u00e1s de 10 repartidores de comida aprehendidos tras enfrentamiento con la Polic\u00eda\n\n\u201cDesconocemos cu\u00e1l era el rubro de esta \u00e1rea, hay algunas casetas que est\u00e1n vac\u00edas, sin embargo, el incendio empez\u00f3 a moverse sobre el techo, afectando a las otras casetas, y quem\u00f3 varios puntos\u201d, acot\u00f3.\n\nEl bombero dijo que a\u00fan desconocen las causas del incendio y los bomberos lograron controlarlo. Sin embargo, comerciantes del mercado explicaron que es la tercera vez que se produce un incidente con incendios en ese sector y no descartan que sea provocado.\n\nSe espera conocer un reporte final de las p\u00e9rdidas en el lugar y el informe oficial de la Polic\u00eda.", "dateTimeNews": "2026-06-01T12:46:34+00:00", "dateTimeReceived": "2026-06-01T12:57:02+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/06/Incendio1.webp", "position": 33, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/santa-cruz/incendio-afecta-menos-10-puestos-comida-mercado-nuevo-ramada_1780315578"}], "source": "La Raz\u00f3n", "title": "Incendio en nuevo mercado La Ramada deja al menos 10 casetas afectadas", "url": "https://larazon.bo/ciudades/2026/06/01/incendio-en-nuevo-mercado-la-ramada-deja-al-menos-10-casetas-afectadas/"}, {"actor": [], "authors": ["rorellana"], "body": "La Central Obrera Boliviana (COB) determin\u00f3 mantener sus medidas de presi\u00f3n para exigir la renuncia del presidente Rodrigo Paz y, en consecuencia, descartaron cualquier posibilidad de acudir a dialogar con el Gobierno.\n\n\u201cSe anunci\u00f3 la radicalizaci\u00f3n de las medidas de presi\u00f3n y se exige la renuncia inmediata del presidente Rodrigo Paz Pereira. Tambi\u00e9n se demanda la convocatoria a nuevas elecciones en un plazo de 90 d\u00edas\u201d se lee en la cuenta de la COB en las redes sociales.\n\nAsimismo, la centralde sindicatos comunica que exige la renuncia de Rodrigo Paz y que el vicepresidente Edmand Lara asuma la presidencia del Estado para convocar a elecciones en 90 d\u00edas.\n\nAdem\u00e1s, exigen que ni Paz ni Lara vuelvan a postular a un cargo p\u00fablico.\n\nDirigentes que participaron de la reuni\u00f3n se\u00f1alaron que las bases y sectores que mantienen los bloqueos de carreteras, que a\u00edslan y generan desabastecimiento en La Paz hace un mes, informaron que el \u00fanico objetivo es la renuncia del primer mandatario.\n\nTambi\u00e9n indicaron que el amplaido cobista decidi\u00f3 habilitar corredores humanitarios, aunque no especificaron si ser\u00e1 solo para el paso de ox\u00edgeno y medicamentos o tambi\u00e9n de alimentos y combustible.\n\n\u201cLos trabajadores van a continuar con la medida de presi\u00f3n (...) se ha decidido mantenerlas. Hasta ahora no hay posibilidad, se ha descartado (el di\u00e1logo). Se ha determinado establecer corredores humanitarios\u201d, inform\u00f3 el dirigente del Magisterio, Jos\u00e9 Luis \u00c1lvarez.", "dateTimeNews": "2026-06-01T12:33:21+00:00", "dateTimeReceived": "2026-06-01T18:36:42+00:00", "pic": "https://www.lostiempos.com/sites/default/files/media_imagen/2026/6/1/3_pais_1_abi.jpg.jpeg", "position": 34, "riesgo": 0.0, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/la-cob-descarta-ir-al-dialogo-exige-la-renuncia-de-paz-y-elecciones-en-90-dias-pero-habilitaria-corredores-humanitarios/"}], "source": "Los Tiempos", "title": "La COB rechaza di\u00e1logo con el Gobierno e insiste en pedido de renuncia de Rodrigo Paz", "url": "https://www.lostiempos.com/actualidad/pais/20260601/cob-rechaza-dialogo-gobierno-e-insiste-pedido-renuncia-rodrigo-paz"}, {"actor": [], "authors": ["Pedro Rivero De Ugarte"], "body": "La selecci\u00f3n boliviana contin\u00faa sumando efectivos de cara a la fecha FIFA de junio. Luego de disputar el cl\u00e1sico cruce\u00f1o, los futbolistas Nabil Nacif, de Oriente Petrolero, y Guilmar Centella, de Blooming, se incorporaron a la concentraci\u00f3n de la Verde la noche del domingo.\n\nAmbos jugadores quedaron inmediatamente a disposici\u00f3n del director t\u00e9cnico \u00d3scar Villegas, quien prepara los amistosos internacionales frente a Escocia y Argelia, programados para el 6 y 10 de junio respectivamente en Estados Unidos.\n\nTanto Nacif como Centella fueron titulares en el cl\u00e1sico disputado en el estadio Ram\u00f3n Tahuichi Aguilera. Sin embargo, ambos terminaron siendo sustituidos en el segundo tiempo de un partido que finalmente qued\u00f3 en manos de Blooming por la m\u00ednima diferencia.\n\nLa academia cruce\u00f1a se impuso por 1-0 gracias a un autogol de Jordan Santacruz y, tras el compromiso, los dos futbolistas se trasladaron r\u00e1pidamente para unirse al trabajo de la selecci\u00f3n nacional.\n\nEste lunes cumplir\u00e1n su primera pr\u00e1ctica junto al resto del plantel en la sede de Blooming, donde la Verde contin\u00faa entren\u00e1ndose antes de emprender viaje rumbo a Estados Unidos.\n\nEn las \u00faltimas horas, la selecci\u00f3n tambi\u00e9n sum\u00f3 a otros convocados como Ger\u00f3nimo Govea, Marcelo Torrez, Roberto Carlos Fern\u00e1ndez y Yomar Rocha, quienes ya trabajan bajo las \u00f3rdenes del cuerpo t\u00e9cnico nacional.\n\nEn cuanto a Mois\u00e9s Villarroel, capit\u00e1n de Blooming, DIEZ pudo conocer que todav\u00eda no se incorpor\u00f3 a la concentraci\u00f3n debido a una molestia f\u00edsica que viene arrastrando hace algunas semanas. Su presencia a\u00fan es incierta.\n\nLa selecci\u00f3n boliviana tiene previsto viajar este martes a Estados Unidos, donde afrontar\u00e1 los amistosos internacionales que servir\u00e1n de preparaci\u00f3n para los pr\u00f3ximos desaf\u00edos oficiales del combinado nacional.", "dateTimeNews": "2026-06-01T12:19:29+00:00", "dateTimeReceived": "2026-06-01T12:50:25+00:00", "pic": "https://cdn.diez.bo/diez/062026/1780316229308.jpg?cw=1200\u0026ch=630", "position": 35, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/deportes/seleccion-boliviana-vivio-clasico-cruceno-tahuichi_1780315859"}], "source": "El Deber", "title": "Jugadores de Blooming y Oriente se sumaron a la selecci\u00f3n boliviana", "url": "https://eldeber.com.bo/deportes/jugadores-blooming-oriente-sumaron-seleccion-boliviana_1780316369"}, {"actor": [], "authors": ["Pedro Rivero De Ugarte"], "body": "La selecci\u00f3n boliviana contin\u00faa con su preparaci\u00f3n en Santa Cruz de la Sierra antes de emprender viaje rumbo a Estados Unidos, donde afrontar\u00e1 dos compromisos amistosos internacionales frente a Escocia y Argelia. En medio de los entrenamientos, jugadores y cuerpo t\u00e9cnico aprovecharon la jornada dominical para asistir al cl\u00e1sico cruce\u00f1o.\n\nEncabezados por el director t\u00e9cnico \u00d3scar Villegas, varios integrantes de la Verde estuvieron presentes en el estadio Ram\u00f3n Tahuichi Aguilera observando el compromiso entre Oriente Petrolero y Blooming, que concluy\u00f3 con triunfo de la academia por 1-0.\n\nLa delegaci\u00f3n nacional sigui\u00f3 las incidencias del partido desde uno de los palcos del escenario deportivo. La presencia de los seleccionados no pas\u00f3 desapercibida para los hinchas que se encontraban en el estadio.\n\nEntre los futbolistas presentes destacaron Luis Haqu\u00edn, Robson Matheus, Carlos Lampe y Guillermo Viscarra, adem\u00e1s de otros convocados que actualmente forman parte del plantel nacional para la fecha FIFA.\n\nLa Verde permanece concentrada en Santa Cruz afinando detalles t\u00e1cticos y f\u00edsicos de cara a los amistosos internacionales programados para el 6 y 10 de junio. Ambos encuentros servir\u00e1n como preparaci\u00f3n para los pr\u00f3ximos desaf\u00edos oficiales de la selecci\u00f3n.\n\nEl combinado boliviano tiene previsto viajar este martes rumbo a Estados Unidos, donde afrontar\u00e1 sus compromisos ante Escocia y Argelia, partidos en los que \u00d3scar Villegas buscar\u00e1 consolidar una base competitiva y continuar observando alternativas para el equipo nacional.", "dateTimeNews": "2026-06-01T12:10:59+00:00", "dateTimeReceived": "2026-06-01T12:56:53+00:00", "pic": "https://cdn.diez.bo/diez/062026/1780315698157.jpg?cw=1200\u0026ch=630", "position": 36, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/deportes/jugadores-blooming-oriente-sumaron-seleccion-boliviana_1780316369"}], "source": "El Deber", "title": "La selecci\u00f3n boliviana vivi\u00f3 el cl\u00e1sico cruce\u00f1o en el Tahuichi", "url": "https://eldeber.com.bo/deportes/seleccion-boliviana-vivio-clasico-cruceno-tahuichi_1780315859"}, {"actor": [], "authors": ["Jessica Vega Mu\u00f1oz"], "body": "Al menos diez puestos de comida fueron afectados por un incendio registrado en horas de la madrugada de este lunes en la zona del mercado nuevo La Ramada, ubicado en el sur de la capital cruce\u00f1a.\n\nSeg\u00fan el reporte preliminar, al menos diez casetas instaladas al frente del mercado sufrieron da\u00f1os por el fuego, siniestro registrado al promediar las 2:44 de la madrugada de este lunes, 1 de junio.\n\nLas casetas afectadas eran puestos de comida r\u00e1pida/Foto: ED24.\n\nLos comerciantes alertaron a las unidades de bomberos, quienes tras m\u00e1s de una hora de trabajo lograron sofocar las llamas.\n\nHeladeras, mesas, sillas y muebles fueron consumidos por el fuego, en cuatro de las casetas afectadas, la perdida fue en su totalidad, seg\u00fan el reporte preliminar.\n\nJes\u00fas Cahuana, dirigente de los comerciantes, se\u00f1al\u00f3 que las casetas afectadas funcionaban como puestos de comida r\u00e1pida y pide investigar c\u00f3mo se origin\u00f3 el mismo.\n\nUnos diez puestos fueron afectados por el fuego/Foto: ED24.\n\nSe\u00f1al\u00f3 que, este es el tercer incidente producto de incendios que registra el sector, por lo que creen que fue provocado; sin embargo, los bomberos de la Polic\u00eda iniciaron las investigaciones.\n\nDesde la unidad de bomberos voluntarios UUBR se inform\u00f3 que el fuego afect\u00f3 r\u00e1pidamente a la decena de puestos debido a la estructura con la que fueron construidos, casetas que son separadas por una delgada chapa met\u00e1lica.\n\nLa asociaci\u00f3n afectada es la 16 de Octubre; el incendio caus\u00f3 da\u00f1os materiales y no humanos.", "dateTimeNews": "2026-06-01T12:06:18+00:00", "dateTimeReceived": "2026-06-01T12:50:23+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/062026/1780314589157.jpg?\u0026cw=1200\u0026ch=630", "position": 37, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/ciudades/2026/06/01/incendio-en-nuevo-mercado-la-ramada-deja-al-menos-10-casetas-afectadas/"}], "source": "El Deber", "title": "Incendio afecta al menos 10 puestos de comida en zona del mercado nuevo La Ramada", "url": "https://eldeber.com.bo/santa-cruz/incendio-afecta-menos-10-puestos-comida-mercado-nuevo-ramada_1780315578"}, {"actor": [], "authors": ["Shirley Iba\u00f1ez"], "body": "en Nacional\n\nLa Iglesia Cat\u00f3lica y la Defensor\u00eda del Pueblo exhortaron a los sectores movilizados, principalmente la Central Obrera Boliviana (COB) y los campesinos de la Federaci\u00f3n T\u00fapac Katari, a reconsiderar su decisi\u00f3n de no ir al di\u00e1logo.\n\nEn un comunicado, ambas entidades reafirmaron \u201cde manera clara que el di\u00e1logo sincero, emp\u00e1tico y constructivo constituye la \u00fanica v\u00eda leg\u00edtima y eficaz para la resoluci\u00f3n de los problemas que nos aquejan\u201d.\n\nAsimismo, remarcaron que el verdadero entendimiento democr\u00e1tico nace de escuchar las necesidades mutuas que permitan alcanzar acuerdos y preserven el tejido social y garanticen la convivencia pac\u00edfica de todos.\n\n\u201cExhortamos firmemente a todos los sectores involucrados en el actual escenario de tensi\u00f3n a deponer posiciones duras y a reconsiderar las posturas que rechazan o dilatan el acercamiento a una mesa de di\u00e1logo\u201d, puntualiza el comunicado.\n\nEl llamado de la Iglesia y la Defensor\u00eda se da luego de que el domingo el ampliado de la COB determin\u00f3 no acudir al di\u00e1logo y mantener los bloqueos que se masifican en todo el pa\u00eds.\n\nLea m\u00e1s: Iglesia Cat\u00f3lica insistir\u00e1 en el di\u00e1logo pese a decisi\u00f3n de la COB\n\nSufrimiento\n\nEl documento emitido por ambas instituciones dice que cerrarse a la concertaci\u00f3n \u201csolo profundiza el sufrimiento de la poblaci\u00f3n, desgasta la paz social y posterga las soluciones urgentes que la ciudadan\u00eda requiere y merece con justa raz\u00f3n. La verdadera valent\u00eda radica en tener la capacidad de ceder por el bien com\u00fan\u201d.\n\nAdem\u00e1s, recuerda que el uso de la fuerza no debe ser la v\u00eda para solucionar conflictos. Y puntualiza que la violencia, venga de donde venga, jam\u00e1s ser\u00e1 un mecanismo propiciador de soluciones reales, sino un detonante de mayor rencor odio y divisi\u00f3n.\n\n\u201cLa represi\u00f3n y los enfrentamientos no construyen puentes, sino muros, y ponen en riesgo el derecho primordial a la vida y la integridad de las personas, las cuales deben ser protegidas de forma irrestricta\u201d.\n\nEn ese contexto, la Iglesia y la Defensor\u00eda lamentaron que producto de la violencia, las heridas sociales que se est\u00e1n abriendo tardar\u00e1n d\u00e9cadas en sanar. \u201cEs momento de sustituir la ofensa por la propuesta, las piedras por la palabra y los bloqueos por el entendimiento\u201d.\n\n\u201cEn este momento Bolivia y su pueblo demandan de sus gobernantes y sectores movilizados la madurez y la sensibilidad necesarias para deponer intereses particulares en favor del bien com\u00fan\u201d, exhorta el documento.", "dateTimeNews": "2026-06-01T12:05:21+00:00", "dateTimeReceived": "2026-06-01T16:18:20+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/06/WhatsApp-Image-2026-05-20-at-10.39.58.webp", "position": 38, "riesgo": 0.0, "similar": [{"source": "Asuntos Centrales", "url": "https://asuntoscentrales.com/la-iglesia-catolica-y-la-defensoria-del-pueblo-convocan-al-dialogo-urgente-ante-la-conflictividad-en-el-pais/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/bloqueos-la-iglesia-y-la-defensoria-piden-reconsiderar-la-postura-de-no-dialogar-y-evitar-uso-de-la-fuerza/"}], "source": "La Raz\u00f3n", "title": "Iglesia y Defensor\u00eda piden a movilizados reconsiderar su decisi\u00f3n de no dialogar", "url": "https://larazon.bo/nacional/2026/06/01/iglesia-y-defensoria-piden-a-movilizados-reconsiderar-su-decision-de-no-dialogar/"}, {"actor": [], "authors": ["Shirley Iba\u00f1ez"], "body": "en Nacional\n\nEl pa\u00eds inicia el mes de junio con m\u00e1s de 90 puntos de bloqueo en una medida de protesta que lleva m\u00e1s de un mes y castiga a varios departamentos con desabastecimiento y el freno de la actividad econ\u00f3mica.\n\nSeg\u00fan el mapa de transitabilidad de la Administradora Boliviana de Carreteras (ABC), hay seis departamentos que presentan cortes de v\u00eda y Cochabamba es ahora el epicentro de los bloqueos, por encima de La Paz que durante semanas registr\u00f3 la mayor cantidad de carreteras cerradas.\n\nHasta primeras horas de este lunes, Cochabamba reportaba 32 bloqueos; mientras que La Paz tiene 19. Les siguen Potos\u00ed con 16, Oruro con 11, Chuquisaca con nueve y Santa Cruz con tres cortes de rutas.\n\nLea m\u00e1s: Ampliado de COB rechaza di\u00e1logo, mantiene bloqueos y anuncia corredores humanitarios\n\nProtesta\n\nLos sectores sociales mantienen sus medidas de presi\u00f3n en demanda de la renuncia del presidente Rodrigo Paz.\n\nEl domingo, un ampliado de emergencia de la Central Obrera Boliviana (COB) determin\u00f3 no asistir al di\u00e1logo y continuar con los bloqueos que tiene a muchas regiones sufriendo por falta de abastecimiento de combustibles, alimentos y medicamentos.\n\nEl Gobierno insiste en el di\u00e1logo y a\u00fan no se ha pronunciado sobre la decisi\u00f3n de la COB.\n\nLa medida de presi\u00f3n tambi\u00e9n est\u00e1 provocando severos da\u00f1os en las carreteras. Seg\u00fan la ABC, se reporta un acelerado deterioro en la carretera del eje central del pa\u00eds, particularmente en el tramo Caracollo \u2013 Confital \u2013 Bombeo, en la ruta Oruro \u2013 Cochabamba.", "dateTimeNews": "2026-06-01T11:26:32+00:00", "dateTimeReceived": "2026-06-01T16:18:19+00:00", "pic": "https://larazon.bo/wp-content/uploads/2026/06/WhatsApp-Image-2026-05-20-at-10.39.58-1.webp", "position": 39, "riesgo": 0.0, "similar": [{"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/bolivia-inicia-junio-con-mas-de-90-puntos-de-bloqueo-cochabamba-y-la-paz-son-los-mas-afectados/"}], "source": "La Raz\u00f3n", "title": "Bolivia inicia junio con m\u00e1s de 90 bloqueos, Cochabamba es ahora centro de la protesta", "url": "https://larazon.bo/nacional/2026/06/01/bolivia-inicia-junio-con-mas-de-90-bloqueos-cochabamba-es-ahora-centro-de-la-protesta/"}, {"actor": [], "authors": ["Asuntos Centrales"], "body": "En un pronunciamiento conjunto emitido el 31 de mayo de 2026, la Conferencia Episcopal Boliviana y la Defensor\u00eda del Pueblo apelaron de manera urgente a las autoridades pol\u00edticas, sectores...\n\nEn un pronunciamiento conjunto emitido el 31 de mayo de 2026, la Conferencia Episcopal Boliviana y la Defensor\u00eda del Pueblo apelaron de manera urgente a las autoridades pol\u00edticas, sectores movilizados, l\u00edderes sociales y a la poblaci\u00f3n general con el objetivo de hallar soluciones pac\u00edficas ante el actual escenario de tensi\u00f3n que atraviesa el pa\u00eds. Ambos organismos reafirmaron que un di\u00e1logo sincero, emp\u00e1tico y constructivo representa la \u00fanica v\u00eda leg\u00edtima y eficaz para resolver las problem\u00e1ticas vigentes, se\u00f1alando que el entendimiento democr\u00e1tico surge a partir de escuchar las necesidades mutuas para alcanzar acuerdos sostenibles que preserven la convivencia pac\u00edfica.\n\nEl documento exhorta firmemente a todos los actores involucrados a deponer posiciones duras y a reconsiderar aquellas posturas que rechazan o dilatan el acercamiento a una mesa de concertaci\u00f3n. Seg\u00fan manifestaron las entidades, cerrarse a estas opciones profundiza el sufrimiento de los ciudadanos, desgasta la paz social y posterga las respuestas urgentes que la poblaci\u00f3n requiere, a\u00f1adiendo que \u201cla verdadera valent\u00eda radica en tener la capacidad de ceder por el bien com\u00fan\u201d.\n\nAsimismo, las instituciones recordaron que el uso de la fuerza, la coacci\u00f3n o cualquier manifestaci\u00f3n de violencia jam\u00e1s constituir\u00e1n un mecanismo propiciador de soluciones reales, sino que actuar\u00e1n como detonantes de mayor rencor, odio y divisi\u00f3n. Tras advertir que la represi\u00f3n y los enfrentamientos ponen en riesgo el derecho primordial a la vida y la integridad de las personas, el comunicado remarca que \u201ces momento de sustituir la ofensa por la propuesta, las piedras por la palabra y los bloqueos por el entendimiento\u201d.\n\nFinalmente, tanto la Conferencia Episcopal como la Defensor\u00eda del Pueblo reiteraron su plena disposici\u00f3n para facilitar y acompa\u00f1ar los espacios necesarios que permitan el reencuentro y la calma entre bolivianos, concluyendo con un llamado a los gobernantes y sectores movilizados para que demuestren la madurez y sensibilidad necesarias para deponer los intereses particulares en favor del bienestar colectivo.", "dateTimeNews": "2026-06-01T11:07:42+00:00", "dateTimeReceived": "2026-06-01T19:50:49+00:00", "pic": "https://asuntoscentrales.com/wp-content/uploads/2026/06/bbv.jpg", "position": 40, "riesgo": 0.0, "similar": [{"source": "La Raz\u00f3n", "url": "https://larazon.bo/nacional/2026/06/01/iglesia-y-defensoria-piden-a-movilizados-reconsiderar-su-decision-de-no-dialogar/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/bloqueos-la-iglesia-y-la-defensoria-piden-reconsiderar-la-postura-de-no-dialogar-y-evitar-uso-de-la-fuerza/"}], "source": "Asuntos Centrales", "title": "La Iglesia Cat\u00f3lica y la Defensor\u00eda del Pueblo convocan al di\u00e1logo urgente ante la conflictividad en el pa\u00eds", "url": "https://asuntoscentrales.com/la-iglesia-catolica-y-la-defensoria-del-pueblo-convocan-al-dialogo-urgente-ante-la-conflictividad-en-el-pais/"}, {"actor": [], "authors": ["Bbc Mundo"], "body": "Getty El futuro presidente de Colombia se elegir\u00e1 en un balotaje en junio en un escenario polarizado entre izquierda y derecha.\n\nEl candidato derechista Abelardo de la Espriella y el izquierdista Iv\u00e1n Cepeda disputar\u00e1n un balotaje presidencial en Colombia, en un escenario de m\u00e1xima polarizaci\u00f3n y desenlace a\u00fan incierto.\n\nDe la Espriella, un abogado y outsider de la pol\u00edtica que promete un giro radical en el gobierno de Colombia, dio la sorpresa en la primera vuelta del domingo al recibir 43,74% de los votos con la totalidad del preconteo finalizado y quedar primero contra lo que preve\u00edan las encuestas.\n\nEl senador Cepeda recibi\u00f3 40,90% de los sufragios como promesa de continuidad del gobierno del presidente Gustavo Petro y qued\u00f3 en segundo lugar, pese a que se anticipaba que ser\u00eda el m\u00e1s votado.\n\nEl resultado del balotaje del 21 de junio depender\u00e1 en buena medida de lo que hagan los votantes que optaron por otros candidatos como la senadora Paloma Valencia, que tuvo 6,9% de votos por la derecha que lidera el expresidente \u00c1lvaro Uribe (que ya adhiri\u00f3 a De la Espriella), o el centrista Sergio Fajardo, que recibi\u00f3 4,2% (no se ha pronunciado).\n\nSi la mayor\u00eda de los votos de Valencia van ahora para De la Espriella, el opositor -que despierta comparaciones con l\u00edderes de extrema derecha en la regi\u00f3n- estar\u00eda cerca de triunfar.\n\nPero en las tres semanas que restan de campa\u00f1a para la segunda vuelta habr\u00e1 otros factores decisivos, se\u00f1alan analistas.\n\nUno de ellos es la seguridad que De la Espriella y Cepeda transmitan como posibles presidentes sin haber ocupado nunca cargos de gobierno.\n\n\"Una de las emociones principales de este proceso electoral en Colombia es el miedo\", se\u00f1ala Felipe Botero, director del departamento de ciencia pol\u00edtica y estudios globales de la Universidad de los Andes en Bogot\u00e1.\n\n\"\u00bfQui\u00e9n produce menos miedo, un Cepeda o un De la Espriella en el poder? Eso va a ayudar a mucha gente a decidir\", dice Botero a BBC Mundo.\n\nRetos para De la Espriella\n\nCon una carrera profesional como penalista y empresario, De la Espriella obtuvo a sus 47 a\u00f1os un asombroso caudal de votos que creci\u00f3 en pocas semanas.\n\nSus promesas de aplicar una pol\u00edtica de seguridad de mano dura y construir megac\u00e1rceles parecen haberlo vuelto un candidato atractivo en un pa\u00eds donde la inseguridad preocupa a muchos y le gener\u00f3 comparaciones con el presidente salvadore\u00f1o, Nayib Bukele.\n\nAFP via Getty Images Abelardo de la Espriella dio la sorpresa en la primera vuelta electoral de Colombia al ganar el preconteo de votos pese a que las encuestas lo daban segundo.\n\nAdem\u00e1s, su perfil ajeno a la clase pol\u00edtica y sus constantes referencias a la religi\u00f3n, la familia y la libertad de empresa lo vuelven cercano a otros presidentes como el estadounidense Donald Trump o el argentino Javier Milei, a quienes dice admirar.\n\nAlgunos analistas creen que De la Espriella capt\u00f3 en los \u00faltimos d\u00edas una cantidad de votantes de la derecha m\u00e1s tradicional representada por Valencia que optaron por \u00e9l para evitar que Cepeda ganara en primera vuelta.\n\nPero De la Espriella tambi\u00e9n representa \"una candidatura de ultraderecha\" que para mucha gente supone un \"riesgo de erosi\u00f3n democr\u00e1tica o socavamiento de las instituciones\", apunta Botero.\n\nPatricia Mu\u00f1oz Yi, una docente de ciencia pol\u00edtica en la Universidad Javeriana de Bogot\u00e1 especializada en opini\u00f3n p\u00fablica y marketing pol\u00edtico, cree que es muy pronto para considerar a De la Espriella virtual ganador del balotaje.\n\nAFP via Getty Images El expresidente colombiano \u00c1lvaro Uribe y su candidata Paloma Valencia anunciaron su apoyo a De la Espriella para el balotaje de junio.\n\n\"Tiene otros retos m\u00e1s all\u00e1 de mantener esta l\u00ednea ascendente (de votos), como el reto de limar esas distancias que dejaron las tensiones y la competencia pol\u00edtica con algunos candidatos de derecha, especialmente Paloma Valencia\", dice Mu\u00f1oz Yi a BBC Mundo.\n\nSi bien Uribe y Valencia anunciaron su apoyo a De la Espriella el mismo domingo, tras conocerse el preconteo de votos, la experta advierte que eso \"no necesariamente garantiza que los seguidores\" de ellos se sumen de modo autom\u00e1tico al candidato.\n\nY se\u00f1ala que, para asegurarse el triunfo, De la Espriella deber\u00e1 adem\u00e1s mejorar su votaci\u00f3n en lugares del pa\u00eds donde gan\u00f3 Cepeda, como la capital Bogot\u00e1 o departamentos del Caribe, pese a que el derechista creci\u00f3 desde la infancia en esta regi\u00f3n.\n\nBBC\n\nDesaf\u00edos para Cepeda\n\nHijo de un l\u00edder comunista asesinado, Cepeda tiene 63 a\u00f1os, entr\u00f3 al Congreso colombiano en 2010 y se destac\u00f3 por defender a v\u00edctimas del largo conflicto armado del pa\u00eds e investigar el paramilitarismo.\n\nFue facilitador de los di\u00e1logos de paz entre el Estado y las Farc en 2016 y defiende la idea de una la \"paz total\" planteada por Petro para finalizar los conflictos con otros grupos armados, pese a ser cuestionada desde la derecha por su falta de resultados.\n\nGetty Images Iv\u00e1n Cepeda deber\u00e1 remotar los resultados de la primera vuelta para vencer en el balotaje presidencial de junio.\n\nCepeda promete adem\u00e1s dar continuidad a las reformas sociales del gobierno para disminuir la desigualdad, dar voz pol\u00edtica a sectores marginados, redistribuir tierras y bajar la deforestaci\u00f3n amaz\u00f3nica.\n\nSin embargo, es visto como alguien m\u00e1s moderado y menos carism\u00e1tico que Petro.\n\nY, si bien pudo beneficiarse electoralmente del aumento de los \u00edndices de aprobaci\u00f3n del presidente este a\u00f1o por medidas espec\u00edficas como una subida del 23% en el salario m\u00ednimo, esto parece insuficiente para que gane el balotaje.\n\nTras difundirse los resultados del preconteo de sufragios, Petro y Cepeda los pusieron en duda y dijeron que aguardar\u00e1n a que las comisiones escrutadoras \"cuenten hasta el \u00faltimo voto\".\n\nMiguel Garc\u00eda S\u00e1nchez, un polit\u00f3logo que codirige el Observatorio de la Democracia en la Universidad de Los Andes, cree que el desaf\u00edo de Cepeda es \"acercarse a sectores que tiene perdidos\", como el centro pol\u00edtico, y quiz\u00e1s movilizar votantes que evitaron participar el domingo.\n\nAnadolu via Getty Images El presidente de Colombia, Gustavo Petro, protagoniz\u00f3 la campa\u00f1a electoral hacia la primera vuelta sin ser candidato.\n\n\"La clave ser\u00eda tender puentes, hacer alg\u00fan tipo de alianzas y generarle al electorado algo m\u00e1s emocional\", dice Garc\u00eda S\u00e1nchez a BBC Mundo.\n\nRecuerda que en 2014 el entonces presidente colombiano, Juan Manuel Santos, construy\u00f3 una coalici\u00f3n amplia para el balotaje y fue reelecto pese a haber salido segundo con menos de 26% de los votos en la primera vuelta.\n\nEn 2022, Petro result\u00f3 el primer presidente de izquierda electo en Colombia luego de ganar la primera vuelta con menos votos que Cepeda pero con un porcentaje similar (40,3%) y vencer en el balotaje a Rodolfo Hern\u00e1ndez, otro outsider de derecha.\n\nPero los analistas se\u00f1alan que desde entonces Petro, con su estilo pol\u00e9mico y de confrontaci\u00f3n, ha perdido en el gobierno parte de aquellos apoyos electorales que obtuvo.\n\nAnadolu via Getty Images Los colombianos tienen tres semanas para decidir qui\u00e9n ser\u00e1 su pr\u00f3ximo presidente.\n\nAhora su idea de llamar a una asamblea constituyente para cambiar la Constituci\u00f3n colombiana y lograr reformas frenadas en el Congreso inquieta a una parte del electorado.\n\nEntonces, una pregunta abierta es si Cepeda buscar\u00e1 distanciarse del presidente en temas como la constituyente, para atraer votos sin dejar de movilizar a los simpatizantes de Petro en el balotaje.\n\nEse ser\u00eda un equilibrio delicado para el candidato oficialista.\n\n\"La izquierda la tiene m\u00e1s dif\u00edcil que hace cuatro a\u00f1os\", se\u00f1ala Garc\u00eda S\u00e1nchez.\n\nBBC\n\nHaz clic aqu\u00ed para leer m\u00e1s historias de BBC News Mundo.\n\nSuscr\u00edbete aqu\u00ed a nuestro nuevo newsletter para recibir cada viernes una selecci\u00f3n de nuestro mejor contenido de la semana.\n\nTambi\u00e9n puedes seguirnos en YouTube, Instagram, TikTok, X, Facebook y en nuestro canal de WhatsApp.\n\nY recuerda que puedes recibir notificaciones en nuestra app. Descarga la \u00faltima versi\u00f3n y act\u00edvalas.", "dateTimeNews": "2026-06-01T10:47:49+00:00", "dateTimeReceived": "2026-06-01T12:50:21+00:00", "pic": "https://pxcdn.eldeber.com.bo/eldeber/062026/1780313677394.jpg?\u0026cw=1200\u0026ch=630", "position": 41, "riesgo": 0.0, "similar": [{"source": "La Patria", "url": "https://lapatria.bo/global/colombia-de-la-espriella-e-ivan-cepeda-van-a-segunda-vuelta/"}, {"source": "El Mundo", "url": "https://elmundo.com.bo/espriella-y-cepeda-disputaran-segunda-vuelta-presidencial-en-colombia/"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/colombia-abelardo-de-la-espriella-e-ivan-cepeda-pasan-a-la-segunda-vuelta/"}], "source": "El Deber", "title": "Qu\u00e9 necesitan De la Espriella y Cepeda para ganar en segunda vuelta y convertirse en presidente de Colombia", "url": "https://eldeber.com.bo/bbc/que-necesitan-de-la-espriella-y-cepeda-para-ganar-en-segunda-vuelta-y-convertirse-en-presidente-de-colombia-20266174749"}, {"actor": [], "authors": ["La Patria"], "body": "De la Espriella e Iv\u00e1n Cepeda: dos visiones opuestas que definir\u00e1n el rumbo pol\u00edtico de Colombia tras las elecciones del 21 de junio\n\nFicha informativa Colombia se prepara para una segunda vuelta presidencial el 21 de junio tras un preconteo que dej\u00f3 a Abelardo de la Espriella y Iv\u00e1n Cepeda como los principales candidatos. El presidente Petro cuestiona los resultados, generando tensiones pol\u00edticas. Toca para ver el contexto completo Contexto: De la Espriella se presenta como un outsider y capitaliza el descontento popular. Cepeda defiende la continuidad del gobierno actual y enfrenta el desgaste por esc\u00e1ndalos en la administraci\u00f3n de Petro. La polarizaci\u00f3n geogr\u00e1fica se evidencia en el apoyo a Cepeda en Bogot\u00e1 y a De la Espriella en el interior. De la Espriella propone una pol\u00edtica de mano dura contra el crimen y promete resolver el conflicto interno en 90 d\u00edas. Cepeda prioriza gasto social y di\u00e1logo con grupos armados. La inestabilidad pol\u00edtica y social se anticipa para el pr\u00f3ximo cuatrienio. Por qu\u00e9 importa: La tensi\u00f3n pol\u00edtica aumenta con acusaciones de fraude por parte de Petro y un llamado a la fuerza p\u00fablica por De la Espriella. La coalici\u00f3n de derecha muestra fisuras ante el respaldo a De la Espriella y los votantes del centro ser\u00e1n clave en el balotaje. Datos clave: Fecha: 31 de mayo de 2026\n\n31 de mayo de 2026 Porcentaje de mesas escrutadas: 99,98%\n\n99,98% Primera vuelta: 21 de junio de 2026\n\n21 de junio de 2026 Votos De la Espriella: 10.359.902 (43,74%)\n\n10.359.902 (43,74%) Votos Cepeda: 9.687.508 (40,90%)\n\n9.687.508 (40,90%) Votos Paloma Valencia: 1.639.421 (6,92%)\n\n1.639.421 (6,92%) Votos Sergio Fajardo: 1.008.864 (4,25%)\n\n1.008.864 (4,25%) Votos Claudia L\u00f3pez: 225.480 (0,95%)\n\n225.480 (0,95%) Votos Santiago Botero: 206.128 (0,87%)\n\n206.128 (0,87%) Voto en blanco: 406.955 (1,71%) IngresarDesbloquear acceso completo\n\nColombia: De la Espriella e Iv\u00e1n Cepeda van a segunda vuelta \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nColombia se prepara para una segunda vuelta electoral\n\nColombia se encamin\u00f3 hacia una de las elecciones presidenciales m\u00e1s polarizadas y tensas de su historia reciente. Con el 99,98% de las mesas escrutadas en la jornada electoral del 31 de mayo de 2026, los resultados oficiales confirmaron que el pa\u00eds definir\u00e1 a su pr\u00f3ximo mandatario en una segunda vuelta el 21 de junio, al no haber alcanzado ning\u00fan candidato la mayor\u00eda absoluta del 50% m\u00e1s uno de los votos v\u00e1lidos.\n\nResultados de la primera vuelta\n\nEl candidato Abelardo de la Espriella, quien se autodefine como un outsider ajeno al establishment pol\u00edtico tradicional, capitaliz\u00f3 con fuerza el voto de descontento. De la Espriella se ubic\u00f3 en primer lugar con el 43,74% de los sufragios (equivalente a 10.359.902 votos), seguido por Iv\u00e1n Cepeda, abanderado del Pacto Hist\u00f3rico, quien obtuvo el 40,90% (9.687.508 votos). Otros candidatos como Paloma Valencia y Juan Daniel Oviedo quedaron mucho m\u00e1s atr\u00e1s con el 6,92% (1.639.421 votos), mientras que Sergio Fajardo y Edna Bonilla lograron el 4,25% (1.008.864 votos).\n\nTensiones tras los resultados\n\nApenas dos horas despu\u00e9s del cierre de las urnas, el panorama electoral se torn\u00f3 hostil. El presidente Gustavo Petro utiliz\u00f3 su cuenta en la red social X para anunciar que su administraci\u00f3n no aceptar\u00e1 los datos del preconteo de la firma privada de los hermanos Bautista, alegando que carecen de fuerza vinculante. Sin presentar pruebas inmediatas, Petro denunci\u00f3 presuntas alteraciones en el algoritmo del software y la inclusi\u00f3n irregular de m\u00e1s de 800.000 personas en el censo electoral.\n\nReacciones pol\u00edticas\n\nEl candidato oficialista Iv\u00e1n Cepeda respald\u00f3 la postura presidencial, asegurando que su equipo est\u00e1 verificando mesas espec\u00edficas donde se reportaron \u201cvotaciones at\u00edpicas\u201d. La respuesta de De la Espriella no se hizo esperar; arremeti\u00f3 contra las autoridades del Ejecutivo y llam\u00f3 a la fuerza p\u00fablica a actuar si Petro pretend\u00eda desconocer la voluntad del pueblo colombiano.\n\nDivisi\u00f3n geopol\u00edtica en Colombia\n\nLos resultados del 31 de mayo ratificaron una divisi\u00f3n geopol\u00edtica hist\u00f3rica en Colombia. Las regiones costeras respaldaron mayoritariamente a Cepeda, mientras que los departamentos del interior se volcaron hacia De la Espriella. Bogot\u00e1 rompi\u00f3 esta tendencia al otorgarle el triunfo a Cepeda con el 41%, frente al 37%% obtenido por De la Espriella.\n\nPropuestas y debilidades de los candidatos\n\nAbelardo de la Espriella (47 a\u00f1os) propone una estricta pol\u00edtica de \u201cmano dura\u201d contra el crimen organizado y promete solucionar el conflicto interno en 90 d\u00edas. Sin embargo, su falta de experiencia en administraci\u00f3n p\u00fablica y sus posturas radicales generan recelo en el electorado moderado.\n\nPor otro lado, Iv\u00e1n Cepeda (63 a\u00f1os) es senador con una larga trayectoria en defensa de los derechos humanos. Su plan incluye continuar con las pol\u00edticas actuales, priorizando un mayor gasto social y reformas estructurales para reducir las brechas de desigualdad.\n\nCambio en las alianzas pol\u00edticas\n\nPocos minutos despu\u00e9s del escrutinio, Paloma Valencia oficializ\u00f3 su respaldo a De la Espriella para evitar lo que denomin\u00f3 \u201cel comunismo\u201d asociado a Cepeda y Petro. El expresidente \u00c1lvaro Uribe V\u00e9lez tambi\u00e9n llam\u00f3 a votar por De la Espriella en defensa de las libertades y la econom\u00eda privada.\n\nNo obstante, surgieron fisuras en la coalici\u00f3n tradicional. Juan Daniel Oviedo tom\u00f3 distancia y anunci\u00f3 que dar\u00e1 a conocer su decisi\u00f3n el 3 de junio tras analizar el panorama en Bogot\u00e1. Mientras tanto, Sergio Fajardo evit\u00f3 respaldar expl\u00edcitamente a cualquiera de las candidaturas.\n\nPerspectivas para el balotaje\n\nLos analistas coinciden en que los cerca de tres millones de ciudadanos que optaron por alternativas minoritarias ser\u00e1n determinantes para inclinar la balanza hacia la Casa de Nari\u00f1o. Sin importar cu\u00e1l sea el veredicto en junio, Colombia enfrenta un cuatrienio marcado por inestabilidad y tensiones pol\u00edticas.", "dateTimeNews": "2026-06-01T03:54:14+00:00", "dateTimeReceived": "2026-06-01T19:50:56+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a1cfe8d103bd.jpg", "position": 42, "riesgo": 0.0, "similar": [{"source": "El Deber", "url": "https://eldeber.com.bo/bbc/que-necesitan-de-la-espriella-y-cepeda-para-ganar-en-segunda-vuelta-y-convertirse-en-presidente-de-colombia-20266174749"}, {"source": "Ox\u00edgeno", "url": "https://oxigeno.bo/colombia-abelardo-de-la-espriella-e-ivan-cepeda-pasan-a-la-segunda-vuelta/"}, {"source": "El Mundo", "url": "https://elmundo.com.bo/espriella-y-cepeda-disputaran-segunda-vuelta-presidencial-en-colombia/"}], "source": "La Patria", "title": "Colombia: De la Espriella e Iv\u00e1n Cepeda van a segunda vuelta - La Patria 3.0", "url": "https://lapatria.bo/global/colombia-de-la-espriella-e-ivan-cepeda-van-a-segunda-vuelta/"}, {"actor": [], "authors": ["La Patria"], "body": "El cl\u00e1sico cruce\u00f1o de por la d\u00e9cima fecha se disput\u00f3 este domingo en el estadio \u201cRam\u00f3n Aguilera Costas\u201d\n\nFicha informativa Blooming gan\u00f3 1-0 a Oriente Petrolero en el cl\u00e1sico cruce\u00f1o, disputado en el estadio \u2018Ram\u00f3n Aguilera Costas\u2019. Este resultado permiti\u00f3 a Blooming ascender a la quinta posici\u00f3n de la tabla, mientras que Oriente Petrolero se qued\u00f3 en la novena. Toca para ver el contexto completo Contexto: El partido se disput\u00f3 en el estadio \u2018Ram\u00f3n Aguilera Costas\u2019, con un p\u00fablico numeroso. La jugada que defini\u00f3 el encuentro fue un autogol del defensor Jord\u00e1n Santacruz. Marcelo Martins se despidi\u00f3 de la afici\u00f3n sin impacto significativo en el juego. Gustavo Floret\u00edn debut\u00f3 como entrenador de Oriente Petrolero, pero no logr\u00f3 mostrar un rendimiento destacado debido al corto tiempo de trabajo. Por qu\u00e9 importa: Con esta victoria, Blooming ascendi\u00f3 a la quinta posici\u00f3n, mientras que Oriente Petrolero se mantuvo en la novena, lo que refleja una crisis futbol\u00edstica y dirigencial en el club. Datos clave: Marcador: 1-0\n\n1-0 Minuto del gol: 74\n\n74 Puntos de Blooming: 12\n\n12 Puntos de Oriente Petrolero: 10\n\n10 Fecha del partido: 31 de mayo de 2026 IngresarDesbloquear acceso completo\n\nDespedida de Martins de Oriente Petrolero con triunfo de Blooming \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nResumen del partido Blooming Oriente Petrolero\n\nEl marcador Blooming Oriente Petrolero mostr\u00f3 un triunfo de 1-0 para Blooming, quien se coloc\u00f3 por encima de Oriente Petrolero en la tabla. Este emocionante encuentro tuvo lugar en el estadio \u201cRam\u00f3n Aguilera Costas\u201d, que se llen\u00f3 de aficionados durante la d\u00e9cima fecha del torneo todos contra todos de la Divisi\u00f3n Profesional.\n\nDesarrollo del partido\n\nEl \u00fanico gol del partido lleg\u00f3 a los 74 minutos. Fue una jugada desafortunada para el defensor Jord\u00e1n Santacruz. En su intento por despejar un centro dentro del \u00e1rea, desvi\u00f3 la pelota hacia atr\u00e1s, venciendo a su propio arquero, Alejandro Torres. A pesar de que ambos equipos generaron peligro, la punter\u00eda fall\u00f3 y las oportunidades se dispersaron.\n\nUn partido parejo y decisivo\n\nEl encuentro estuvo muy parejo y parec\u00eda que el marcador final iba a ser un empate. Sin embargo, la acci\u00f3n desafortunada de Santacruz impact\u00f3 en el honor y orgullo de la afici\u00f3n \u201cverdolaga\u201d. La presencia de Marcelo Martins en el ataque de Oriente Petrolero no tuvo el impacto esperado, contrastando con su rendimiento en partidos anteriores.\n\nLa despedida de Marcelo Martins\n\nBajo un rendimiento p\u00e1lido, Marcelo Martins se despidi\u00f3 de la afici\u00f3n y del f\u00fatbol profesional. Este compromiso tambi\u00e9n marc\u00f3 el debut de Gustavo Floret\u00edn como entrenador de Oriente Petrolero. Sin embargo, su equipo no pudo mostrar avances significativos debido a los pocos d\u00edas que tuvo para trabajar.\n\nPosiciones en la tabla\n\nCon este resultado, Blooming ascendi\u00f3 a la quinta posici\u00f3n con 12 puntos, mientras que Oriente Petrolero qued\u00f3 en novena posici\u00f3n con diez unidades. Este resultado reabri\u00f3 las heridas de la crisis futbol\u00edstica y dirigencial que enfrenta el club.\n\nConclusi\u00f3n\n\nEl marcador Blooming Oriente Petrolero refleja no solo un triunfo importante para Blooming, sino tambi\u00e9n una despedida emotiva para Martins. La afici\u00f3n espera mejores resultados en los pr\u00f3ximos encuentros mientras los equipos buscan mejorar su rendimiento en la Divisi\u00f3n Profesional.\n\nORIENTE PETROLERO (0): Alejandro Torres, Andr\u00e9s Ariza, Sebasti\u00e1n \u00c1lvarez, Jord\u00e1n Santacruz, Manuel Bonilla, Luciano Ursino, Jorge Lovera, Leonardo Vaca, Jos\u00e9 Berdecio, Nabil Nacif y Marcelo Martins; alternaron: Dico Roca, Manuel Reyes, Jos\u00e9 Flores, Gilbert \u00c1lvarez y Leandro Otormin; D.T. Gustavo Florent\u00edn; expulsados: Gustavo Florent\u00edn (entrenador), antes del inicio del segundo tiempo.\n\nBLOOMING (1): Gustavo Almada, Juan Gonzales, Jos\u00e9 Carrasco, Julio Vila, Juan Mercado, Mat\u00edas Abisab, Matheo Ocampo, Miguel Villarroel, Roberto Hinojoza, Guilmar Centella y Anthony V\u00e1squez; alternaron: C\u00e9sar Menacho, Bayr\u00f3n Garc\u00e9s, Percy Loza, Mauricio Cabral y Roberto Melgar; D.T. Erwin S\u00e1nchez; gol: Jord\u00e1n Santacruz 74\u2019 (en contra).", "dateTimeNews": "2026-06-01T02:55:21+00:00", "dateTimeReceived": "2026-06-01T19:50:57+00:00", "pic": "https://lapatria.bo/wp-content/uploads/2026/05/6a1cf2e4b0845.jpg", "position": 43, "riesgo": 0.0, "similar": [{"source": "El Mundo", "url": "https://elmundo.com.bo/blooming-amarga-el-clasico-a-oriente-y-la-despedida-de-martins/"}, {"source": "ATB Digital", "url": "https://www.atb.com.bo/2026/06/01/blooming-se-queda-con-el-clasico-cruceno-gracias-a-un-autogol-de-santacruz/"}], "source": "La Patria", "title": "Despedida de Martins de Oriente Petrolero con triunfo de Blooming - La Patria 3.0", "url": "https://lapatria.bo/deportes/despedida-de-martins-de-oriente-petrolero-con-triunfo-de-blooming/"}, {"actor": [], "authors": ["La Patria"], "body": "La clausura de la discoteca \u2018Green House\u2019 se debi\u00f3 a la detecci\u00f3n de 40 menores en discotecas, un hecho que preocupa a las autoridades\n\nFicha informativa Un operativo en la discoteca \u2018Green House\u2019 de Oruro detect\u00f3 a 40 menores de edad, lo que llev\u00f3 a su clausura por 10 d\u00edas. La acci\u00f3n fue realizada por la DIO y la Polic\u00eda tras denuncias de vecinos. Toca para ver el contexto completo Contexto: El operativo se realiz\u00f3 el 31 de mayo. Rosario Colque, directora de la DIO, mencion\u00f3 que en ocasiones anteriores no se hallaron menores o solo se encontraron j\u00f3venes de entre 19 y 20 a\u00f1os. Se entregaron actas de compromiso a las familias. El operativo fue respaldado por el Comando Departamental de la Polic\u00eda. La DIO trabaj\u00f3 en cuatro grupos para identificar a los menores y contactar a sus familias. Colque expres\u00f3 preocupaci\u00f3n por la cantidad inusual de j\u00f3venes encontrados. Por qu\u00e9 importa: La clausura afecta a la discoteca y busca prevenir el acceso de menores a lugares con venta de alcohol. Se reforzar\u00e1n programas de prevenci\u00f3n en escuelas para evitar situaciones similares. Datos clave: 40 menores encontrados\n\nmenores encontrados 14 a\u00f1os es la edad m\u00ednima de los menores detectados\n\na\u00f1os es la edad m\u00ednima de los menores detectados 70 personas sin documento de identidad\n\npersonas sin documento de identidad Clausura del establecimiento por 10 d\u00edas IngresarDesbloquear acceso completo\n\nOperativo en discoteca de Oruro detecta 40 adolescentes \u23f9 \ud83d\udd08 Cargando... 0:00 0:00\n\nAl menos 40 menores a partir de los 14 a\u00f1os fueron encontrados en un operativo realizado la madrugada de este domingo 31 de mayo en la discoteca \u201cGreen House\u201d, ubicada en el centro de la ciudad de Oruro. A consecuencia de este hecho, el establecimiento fue clausurado.\n\nDetalles del operativo\n\nEl operativo fue realizado por la Direcci\u00f3n de Igualdad de Oportunidades (DIO) y la Unidad de Defensa al Consumidor, con el respaldo del Comando Departamental de la Polic\u00eda. Esto ocurri\u00f3 en atenci\u00f3n a constantes denuncias de vecinos y padres de familia.\n\nControl y hallazgos\n\nLas autoridades realizaron el control en la discoteca \u201cGreen House\u201d, donde encontraron aproximadamente 70 personas que no contaban con su documento de identidad, por lo que fueron remitidas a dependencias policiales.\n\nRosario Colque, directora de la DIO, confirm\u00f3 a LA PATRIA que, de las 70 personas descubiertas durante el operativo, aproximadamente 40 eran menores de edad.\n\nCompromiso con las familias\n\nDebido a la excesiva cantidad de adolescentes, la DIO tuvo que trabajar en cuatro grupos distintos para su identificaci\u00f3n y contacto con sus familias. A estas familias se les entreg\u00f3 un acta de compromiso al momento de recoger a sus hijos, donde se recalca que los menores no pueden acudir a lugares donde se expenden bebidas alcoh\u00f3licas. Los progenitores se comprometieron a controlar adecuadamente a sus hijos para evitar situaciones similares.\n\nPreocupaci\u00f3n por la situaci\u00f3n\n\nColque expres\u00f3 su preocupaci\u00f3n por la cantidad de menores encontrados durante este operativo. Precis\u00f3 que en ocasiones anteriores se encontraron a personas j\u00f3venes, pero
