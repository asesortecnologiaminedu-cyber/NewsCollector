<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadcn Look in Pure HTML</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/franken-ui@1.1.0/dist/css/core.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/franken-ui@1.1.0/dist/js/core.min.js" type="module"></script>
</head>
<body class="bg-slate-950 text-slate-50 p-8">

  <div class="max-w-md mx-auto uk-card uk-card-body class-card bg-zinc-900 border border-zinc-800 rounded-xl p-6">
    <h3 class="text-lg font-semibold tracking-tight text-white">Create an account</h3>
    <p class="text-sm text-zinc-400 mt-1">Enter your email below to create your account.</p>
    
    <div class="mt-4">
      <input type="email" placeholder="name@example.com" class="uk-input w-full bg-zinc-950 border border-zinc-800 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400" />
    </div>
    
    <button class="uk-button w-full bg-white text-black font-medium text-sm py-2 rounded-md mt-4 hover:bg-zinc-200 transition">
      Deploy Setup
    </button>
  </div>

</body>
</html>
